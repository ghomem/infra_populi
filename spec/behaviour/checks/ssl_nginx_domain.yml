class: ssl_nginx_domain
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: Gives nginx a domain's TLS key and certificate bundle (through ssl_base, for the nginx service), so nginx can serve
  that domain over TLS with the certificate and its intermediate, and is restarted when either changes.
node_agent:
  after:
  - the-bundle-alone-drifts
  - the-key-alone-drifts
  why: the key and the bundle each notify nginx, which only the next agent run after a change to each can show
outcomes:
- outcome: on Ubuntu the key is deployed to /etc/ssl/private/<prefix>.key, 0600, and it is the key of the deployed certificate
  from: manifests/ssl_nginx_domain.pp:9-14; manifests/ssl_base.pp:77-92
  checks:
  - the-key-is-private-and-matches-the-certificate
- outcome: the bundle /etc/ssl/certs/<prefix>.nginx.bundle.crt is the certificate then its intermediate
  from: manifests/ssl_nginx_domain.pp:9-14; manifests/ssl_base.pp:79-81, 99-119
  checks:
  - the-bundle-is-the-leaf-then-its-issuer
- outcome: nginx serves TLS with the pair, sending the certificate and its intermediate
  from: manifests/ssl_nginx_domain.pp:1-2, 9-14
  checks:
  - nginx-serves-tls-with-the-pair
- outcome: nginx is restarted once when the key or certificate changes
  from: manifests/ssl_nginx_domain.pp:11-12; manifests/ssl_base.pp:84-107
  checks:
  - the-bundle-alone-drifts
  - the-agent-run-restores-the-bundle-and-restarts-nginx-once
  - the-key-alone-drifts
  - the-agent-run-restores-the-key-and-restarts-nginx-once
- outcome: on RedHat (ssl_base's CentOS/RHEL branch) the key goes to /etc/pki/tls/private
  from: manifests/ssl_base.pp:57-62
  checks:
  - on-redhat-the-key-is-in-pki-tls-private
- outcome: with a Let's Encrypt certificate (letsencrypt_certificate true, passed to ssl_base) the key is <prefix>-key.pem,
    0600, the bundle <prefix>.nginx.bundle.pem is the certificate then its chain, and nginx serves that pair
  from: manifests/ssl_nginx_domain.pp:5, 13; manifests/ssl_base.pp:70-75, 99-119
  checks:
  - letsencrypt-key-is-private-and-matches-the-certificate
  - letsencrypt-bundle-is-the-leaf-then-its-chain
  - letsencrypt-pair-served-by-nginx
variants:
- name: letsencrypt
  why: letsencrypt_certificate true, which production sets (19 node statements, through the nginx frontends)
  params: letsencrypt
- name: rhel
  why: the RedHat branch of ssl_base (the key under /etc/pki/tls/private), on the rhel9 node with the set's own fixture
  node: rhel9
checks:
- id: the-key-is-private-and-matches-the-certificate
  what: the key file is root:root 0600, and its public key is the bundle's first certificate's
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 77-78
    text: $key_file                 = "${ssl_private_dir}/${myprefix}.key"
  - path: manifests/ssl_base.pp
    lines: 85-92
    text: mode   => '0600',
  probe: |
    k=/etc/ssl/private/p8test.key; b=/etc/ssl/certs/p8test.nginx.bundle.crt
    stat -c '%U:%G %a' "$k"
    [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(openssl x509 -in "$b" -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  mismatch:
    varies: the certificate compared (the bundle's second one, the issuer's, instead of the first)
    probe: |
      k=/etc/ssl/private/p8test.key; b=/etc/ssl/certs/p8test.nginx.bundle.crt
      stat -c '%U:%G %a' "$k"
      second=$(awk '/BEGIN CERT/{i++} i==2' "$b")
      [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(echo "$second" | openssl x509 -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  expect:
    rc: 0
    stdout: \Aroot:root 600\nkey-matches-certificate\n\Z
- id: the-bundle-is-the-leaf-then-its-issuer
  what: the bundle is root:root 0644 and holds two certificates, the server's (CN p8test.invalid) then its issuer's (the throwaway
    CA), and the first verifies against the second
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 79-81
    text: $bundle_file              = "${ssl_certs_dir}/${myprefix}.${myservice}.bundle.crt"
  - path: manifests/ssl_base.pp
    lines: 109-119
    text: order  => '02',
  probe: |
    b=/etc/ssl/certs/p8test.nginx.bundle.crt
    cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
    stat -c '%U:%G %a' "$b"
    grep -c 'BEGIN CERTIFICATE' "$b"
    for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
    openssl verify -CAfile <(cert 2) <(cert 1) 2>&1 | sed 's/^.*: //'
  mismatch:
    varies: the trust anchor (the system CA bundle instead of the bundle's second certificate), which did not sign the server's
      certificate
    probe: |
      b=/etc/ssl/certs/p8test.nginx.bundle.crt
      cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
      stat -c '%U:%G %a' "$b"
      grep -c 'BEGIN CERTIFICATE' "$b"
      for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
      openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt <(cert 1) 2>&1 | tail -1 | sed 's/^.*: //'
  expect:
    rc: 0
    stdout: \Aroot:root 644\n2\np8test\.invalid\np8test throwaway CA\nOK\n\Z
- id: nginx-serves-tls-with-the-pair
  what: with a server block on 127.0.0.1:8443 that names the bundle and key, nginx serves a chain of two certificates (the
    server's, then its issuer's) that verifies against the second, with the server's name
  control: negative
  derived_from:
  - path: manifests/ssl_nginx_domain.pp
    lines: 9-14
    text: myservicename           => 'nginx',
  - path: manifests/ssl_base.pp
    lines: 79-81
    text: $bundle_file              = "${ssl_certs_dir}/${myprefix}.${myservice}.bundle.crt"
  mutates: adds /etc/nginx/conf.d/p8test-tls.conf (a TLS server on 127.0.0.1:8443 with the bundle and key) and reloads nginx
  probe: |
    printf 'server {\n  listen 127.0.0.1:8443 ssl;\n  server_name p8test.invalid;\n  ssl_certificate /etc/ssl/certs/p8test.nginx.bundle.crt;\n  ssl_certificate_key /etc/ssl/private/p8test.key;\n  return 204;\n}\n' > /etc/nginx/conf.d/p8test-tls.conf
    nginx -t -q && systemctl reload nginx && sleep 1
  effect: |
    chain=$(openssl s_client -connect 127.0.0.1:8443 -servername p8test.invalid -showcerts </dev/null 2>/dev/null)
    cert() { echo "$chain" | awk -v n="$1" '/BEGIN CERT/{i++} i==n && /BEGIN CERT/,/END CERT/'; }
    echo "certificates served: $(echo "$chain" | grep -c 'BEGIN CERTIFICATE')"
    cert 1 | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= /served: /p'
    openssl verify -CAfile <(cert 2) <(cert 1) 2>&1 | sed 's/^.*: /chain: /'
  expect:
    rc: 0
    stdout: '\Acertificates served: 2\nserved: p8test\.invalid\nchain: OK\n\Z'
- id: the-bundle-alone-drifts
  what: setup for the next check, the certificate bundle alone changed by hand (as a renewal that keeps the key changes it),
    with nginx's process id and journal cursor noted
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 100-107
    text: notify         => Service[$myservicename],
  mutates: notes nginx's main PID and its journal cursor in /run/p8test-ssl/before-bundle, then appends a comment line to
    /etc/ssl/certs/p8test.nginx.bundle.crt on the node
  probe: |
    install -d -m 0700 /run/p8test-ssl
    printf "pid='%s'\ncursor='%s'\n" "$(systemctl show -p MainPID --value nginx)" "$(journalctl -u nginx -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p')" > /run/p8test-ssl/before-bundle
    echo '# p8test drift' >> /etc/ssl/certs/p8test.nginx.bundle.crt
  effect: |
    grep -c '^# p8test drift$' /etc/ssl/certs/p8test.nginx.bundle.crt
    grep -q "^pid='[1-9]" /run/p8test-ssl/before-bundle && echo noted
  expect:
    rc: 0
    stdout: \A1\nnoted\n\Z
- id: the-agent-run-restores-the-bundle-and-restarts-nginx-once
  what: after the node's agent run, the bundle is restored and nginx was restarted exactly once (a new main PID; one start
    in its journal since the change)
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: '10'
    text: '# The service is restarted if the certificate changes.'
  - path: manifests/ssl_base.pp
    lines: 100-107
    text: notify         => Service[$myservicename],
  mutates: none beyond reading the bundle, nginx's state and its journal (declared mutating so it runs after the node's agent
    run)
  probe: |
    true
  effect: |
    grep -c '^# p8test drift$' /etc/ssl/certs/p8test.nginx.bundle.crt || true
    . /run/p8test-ssl/before-bundle
    now=$(systemctl show -p MainPID --value nginx)
    [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$pid" ] && echo restarted
    journalctl -u nginx --after-cursor "$cursor" --no-pager -q | grep -c 'Started nginx.service'
  expect:
    rc: 0
    stdout: \A0\nrestarted\n1\n\Z
- id: the-key-alone-drifts
  what: setup for the next check, the key alone changed by hand, with nginx's process id and journal cursor noted
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 85-92
    text: notify => Service[$myservicename],
  mutates: notes nginx's main PID and its journal cursor in /run/p8test-ssl/before-key, then appends a comment line to /etc/ssl/private/p8test.key
    on the node
  probe: |
    install -d -m 0700 /run/p8test-ssl
    printf "pid='%s'\ncursor='%s'\n" "$(systemctl show -p MainPID --value nginx)" "$(journalctl -u nginx -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p')" > /run/p8test-ssl/before-key
    echo '# p8test drift' >> /etc/ssl/private/p8test.key
  effect: |
    grep -c '^# p8test drift$' /etc/ssl/private/p8test.key
    grep -q "^pid='[1-9]" /run/p8test-ssl/before-key && echo noted
  expect:
    rc: 0
    stdout: \A1\nnoted\n\Z
- id: the-agent-run-restores-the-key-and-restarts-nginx-once
  what: after the node's agent run, the key is restored and nginx was restarted exactly once (a new main PID; one start in
    its journal since the change)
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 84-92
    text: '# Key file: always created, always notifies service'
  mutates: none beyond reading the key, nginx's state and its journal (declared mutating so it runs after the node's agent
    run)
  probe: |
    true
  effect: |
    grep -c '^# p8test drift$' /etc/ssl/private/p8test.key || true
    . /run/p8test-ssl/before-key
    now=$(systemctl show -p MainPID --value nginx)
    [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$pid" ] && echo restarted
    journalctl -u nginx --after-cursor "$cursor" --no-pager -q | grep -c 'Started nginx.service'
  expect:
    rc: 0
    stdout: \A0\nrestarted\n1\n\Z
- id: letsencrypt-key-is-private-and-matches-the-certificate
  variant: letsencrypt
  what: with letsencrypt_certificate true ssl_base installs p8test-key.pem (root:root 0600) and the bundle p8test.nginx.bundle.pem,
    and the key is the bundle's first certificate's
  control: negative
  derived_from:
  - path: manifests/ssl_nginx_domain.pp
    lines: 9-14
    text: letsencrypt_certificate => $letsencrypt_certificate,
  - path: manifests/ssl_base.pp
    lines: 70-76
    text: $key_file                 = "${ssl_private_dir}/${myprefix}-key.pem"
  probe: |
    k=/etc/ssl/private/p8test-key.pem; b=/etc/ssl/certs/p8test.nginx.bundle.pem
    stat -c '%U:%G %a' "$k"
    [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(openssl x509 -in "$b" -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  mismatch:
    varies: the certificate compared (the bundle's second one, the chain's, instead of the first)
    probe: |
      k=/etc/ssl/private/p8test-key.pem; b=/etc/ssl/certs/p8test.nginx.bundle.pem
      stat -c '%U:%G %a' "$k"
      second=$(awk '/BEGIN CERT/{i++} i==2' "$b")
      [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(echo "$second" | openssl x509 -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  expect:
    rc: 0
    stdout: \Aroot:root 600\nkey-matches-certificate\n\Z
- id: letsencrypt-bundle-is-the-leaf-then-its-chain
  variant: letsencrypt
  what: with letsencrypt_certificate true the bundle p8test.nginx.bundle.pem is root:root 0644 and holds two certificates,
    the server's (p8test.pem, CN p8test.invalid) then the chain's (p8test-chain.pem, the throwaway CA), and the first verifies
    against the second
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 70-75
    text: $intermediate_cert_source = "puppet:///extra_files/ssl/${myprefix}-chain.pem"
  - path: manifests/ssl_base.pp
    lines: 115-119
    text: order  => '02',
  probe: |
    b=/etc/ssl/certs/p8test.nginx.bundle.pem
    cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
    stat -c '%U:%G %a' "$b"
    grep -c 'BEGIN CERTIFICATE' "$b"
    for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
    openssl verify -CAfile <(cert 2) <(cert 1) 2>&1 | sed 's/^.*: //'
  mismatch:
    varies: the trust anchor (the system CA bundle instead of the bundle's second certificate), which did not sign the server's
      certificate
    probe: |
      b=/etc/ssl/certs/p8test.nginx.bundle.pem
      cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
      stat -c '%U:%G %a' "$b"
      grep -c 'BEGIN CERTIFICATE' "$b"
      for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
      openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt <(cert 1) 2>&1 | tail -1 | sed 's/^.*: //'
  expect:
    rc: 0
    stdout: \Aroot:root 644\n2\np8test\.invalid\np8test throwaway CA\nOK\n\Z
- id: letsencrypt-pair-served-by-nginx
  variant: letsencrypt
  what: with letsencrypt_certificate true and a server block on 127.0.0.1:8443 that names the .pem bundle and key, nginx serves
    a chain of two certificates (the server's, then the chain's) that verifies against the second, with the server's name
  control: negative
  derived_from:
  - path: manifests/ssl_nginx_domain.pp
    lines: 9-14
    text: myservicename           => 'nginx',
  - path: manifests/ssl_base.pp
    lines: 70-75
    text: $bundle_file              = "${ssl_certs_dir}/${myprefix}.${myservice}.bundle.pem"
  mutates: adds /etc/nginx/conf.d/p8test-tls.conf (a TLS server on 127.0.0.1:8443 with the .pem bundle and key) and reloads
    nginx
  probe: |
    printf 'server {\n  listen 127.0.0.1:8443 ssl;\n  server_name p8test.invalid;\n  ssl_certificate /etc/ssl/certs/p8test.nginx.bundle.pem;\n  ssl_certificate_key /etc/ssl/private/p8test-key.pem;\n  return 204;\n}\n' > /etc/nginx/conf.d/p8test-tls.conf
    nginx -t -q && systemctl reload nginx && sleep 1
  effect: |
    chain=$(openssl s_client -connect 127.0.0.1:8443 -servername p8test.invalid -showcerts </dev/null 2>/dev/null)
    cert() { echo "$chain" | awk -v n="$1" '/BEGIN CERT/{i++} i==n && /BEGIN CERT/,/END CERT/'; }
    echo "certificates served: $(echo "$chain" | grep -c 'BEGIN CERTIFICATE')"
    cert 1 | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= /served: /p'
    openssl verify -CAfile <(cert 2) <(cert 1) 2>&1 | sed 's/^.*: /chain: /'
  expect:
    rc: 0
    stdout: '\Acertificates served: 2\nserved: p8test\.invalid\nchain: OK\n\Z'
- id: on-redhat-the-key-is-in-pki-tls-private
  variant: rhel
  what: on RedHat the key is /etc/pki/tls/private/p8test.key, root:root 0600
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 57-62
    text: $ssl_private_dir = '/etc/pki/tls/private'
  probe: |
    stat -c '%n %U:%G %a' /etc/pki/tls/private/p8test.key
  expect:
    rc: 0
    stdout: \A/etc/pki/tls/private/p8test\.key root:root 600\n\Z
apply:
  resource_type: define
  node: ubuntu
  title: ssl_nginx_domain
  catalog:
    Debian:
    - external: apt
    - class: nginx_base
    - class: ssl_nginx_domain
    RedHat:
    - class: nginx_base
    - class: ssl_nginx_domain
  requires:
  - server
  requires_why: ssl_base takes the key and certificates from the server's file mount puppet:///extra_files
