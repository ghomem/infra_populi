class: node_base_desktop
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: 'The base profile of a desktop: the common packages without unattended upgrades, SSH hardened, the firewall with
  IPv6 input and forwarding dropped, desktop APT helpers with a nightly relevant-updates job, logs shipped to the central
  log server, the GNOME and per-user KDE screen lock policies, and the Puppet agent running as a daemon.'
outcomes:
- outcome: SSH is hardened with no password or root login, and unattended upgrades are removed
  from: manifests/node_base_desktop.pp:39-48
  checks:
  - ssh-hardened-without-password-or-root-login
  - unattended-upgrades-removed
- outcome: the IPv4 firewall is firewall_secure's (INPUT and FORWARD dropped by default, the SSH whitelist and limit)
  from: manifests/node_base_desktop.pp:54-57
  checks:
  - the-ipv4-firewall-is-firewall-secure
- outcome: the local directories are in place (filesystem_base_desktop), and syslog's file is left to rsyslog (customize_syslog_mode
    false)
  from: manifests/node_base_desktop.pp:49-52
  checks:
  - the-local-directories-are-in-place
- outcome: the APT helpers are in desktop mode (the desktop surface list, the desktop link) and the relevant-updates script
    exists
  from: manifests/node_base_desktop.pp:65-78
  checks:
  - the-apt-helpers-are-in-desktop-mode
- outcome: IPv6 input and forwarding are dropped
  from: manifests/node_base_desktop.pp:54-62
  checks:
  - ipv6-input-and-forward-dropped
- outcome: the relevant updates run nightly at 02:00 from root's crontab
  from: manifests/node_base_desktop.pp:65-78
  checks:
  - nightly-relevant-updates-cron
- outcome: logs are forwarded to the configured log target and port
  from: manifests/node_base_desktop.pp:21-24, 80-86
  checks:
  - logs-forwarded-to-the-log-target
- outcome: the GNOME screen lock policy is served (manage_gnome_screenlock)
  from: manifests/node_base_desktop.pp:95-102
  checks:
  - gnome-lock-policy-served
- outcome: the puppet service is enabled and running
  from: manifests/node_base_desktop.pp:104-108
  checks:
  - puppet-service-enabled-and-running
- outcome: the per-user KDE screen lock (screenlock_users)
  from: manifests/node_base_desktop.pp:87-93
  uncovered:
    why: a parameter variant no production node uses (user_kde_lock_screen's own set exercises the lock on kubuntu)
    accepted_gap:
    - screenlock_users
    evidence: '{SITE:fleet-usage} (2026-11-23): no production node statement sets screenlock_users, and no class of the repository
      sets it on node_base_desktop'
- outcome: the puppet agent daemon running on its interval
  from: manifests/node_base_desktop.pp:104-108
  checks:
  - the-agent-daemon-runs-the-catalog
checks:
- id: ssh-hardened-without-password-or-root-login
  what: ssh_secure runs with the profile's defaults, so sshd refuses passwords and root logins
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 17-18
    text: Boolean $password_authentication            = false,
  - path: manifests/node_base_desktop.pp
    lines: 43-46
    text: root_login              => $ssh_allow_root_login,
  probe: |
    sshd -T 2>/dev/null | grep -E '^(passwordauthentication|permitrootlogin) ' | sort
  expect:
    rc: 0
    stdout: \Apasswordauthentication no\npermitrootlogin no\n\Z
- id: unattended-upgrades-removed
  what: packages_base runs with unattended_upgrades => false, so the unattended-upgrades package is removed
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 39-41
    text: unattended_upgrades => false,
  probe: |
    dpkg-query -W -f '${Status}\n' unattended-upgrades 2>/dev/null | grep -c 'install ok installed' || true
  expect:
    rc: 0
    stdout: \A0\n\Z
- id: ipv6-input-and-forward-dropped
  what: the desktop IPv6 policy drops INPUT and FORWARD by default and accepts loopback
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: '59'
    text: include puppet_infrastructure::firewall_ipv6_drop_policy_desktop
  probe: |
    ip6tables -S | grep -E '^-P (INPUT|FORWARD) '
    ip6tables -S INPUT | grep -c -F -- '-i lo'
  expect:
    rc: 0
    stdout: \A-P INPUT DROP\n-P FORWARD DROP\n1\n\Z
- id: nightly-relevant-updates-cron
  what: root's crontab runs the relevant-updates helper at 02:00
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 71-77
    text: 'cron { ''apt_update_relevant_daily'':'
  probe: |
    crontab -l -u root 2>/dev/null | grep -F 'apt-update-relevant.sh'
  expect:
    rc: 0
    stdout: \A00 02 \* \* \* {{LOCALDIR}}/bin/apt-update-relevant\.sh\n\Z
- id: gnome-lock-policy-served
  what: with manage_gnome_screenlock, the compiled dconf system database answers the profile's 5-minute lock, enabled, no
    grace
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 96-101
    text: screenlock_timeout_minutes => $screenlock_timeout_minutes,
  - path: manifests/node_base_desktop.pp
    lines: '29'
    text: Integer $screenlock_timeout_minutes         = 5,
  probe: |
    for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
      DCONF_PROFILE=user /usr/bin/dconf read "$k"
    done
  mismatch:
    varies: 'the dconf profile: a profile name that does not exist has no system-db:local line, so the three reads must not
      return the policy''s values'
    probe: |
      for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
        DCONF_PROFILE=p8-phase3-absent-profile /usr/bin/dconf read "$k"
      done
  expect:
    rc: 0
    stdout: \Auint32 300\ntrue\nuint32 0\n\Z
- id: puppet-service-enabled-and-running
  what: the profile declares the puppet service running and enabled (desktops run puppet directly)
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 104-108
    text: 'service { ''puppet'':'
  probe: |
    systemctl is-enabled puppet; systemctl is-active puppet
  expect:
    rc: 0
    stdout: \Aenabled\nactive\n\Z
- id: the-agent-daemon-runs-the-catalog
  what: 'the puppet service is the real agent daemon (its main process runs `agent --no-daemonize`, no stand-in body), and
    restarted it makes a catalog run of its own that changes nothing besides Exec[apt_update] (the plan''s expected run-2
    event: puppetlabs-apt with update frequency ''always'' runs it on every agent run)'
  control: negative
  timeout: 420
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 104-108
    text: 'service { ''puppet'':'
  mutates: restarts puppet.service (the daemon makes a catalog run at start, applying the node's catalog from the lab master);
    the restart time goes to /run/p8test-agentd.since
  probe: |
    date +%s > /run/p8test-agentd.since; systemctl restart puppet
  effect: |
    since=$(cat /run/p8test-agentd.since)
    pid=$(systemctl show puppet -p MainPID --value)
    tr '\0' ' ' < /proc/$pid/cmdline | grep -c 'agent --no-daemonize' | sed 's/^1$/the daemon is the real agent/'
    for i in $(seq 360); do journalctl --no-pager -q -o cat -u puppet.service --since @$since | grep -q 'Applied catalog in' && break; sleep 1; done
    log=$(journalctl --no-pager -q -o cat -u puppet.service --since @$since)
    printf '%s\n' "$log" | grep -c 'Applied catalog in' | sed 's/^[1-9][0-9]*$/a daemon run applied the catalog/'
    printf '%s\n' "$log" | grep '^(/Stage\[main\]' | grep -vc 'Apt::Update/Exec\[apt_update\]' | sed 's/^/resource events besides Exec[apt_update]: /'
  expect:
    rc: 0
    stdout: '\Athe daemon is the real agent\na daemon run applied the catalog\nresource events besides Exec\[apt_update\]:
      0\n\Z'
- id: logs-forwarded-to-the-log-target
  what: rsyslog forwards every message over TCP to the profile's log target and port (6514, the default)
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 80-86
    text: target      => $log_target,
  - path: manifests/node_base_desktop.pp
    lines: 21-24
    text: Integer $log_port                           = 6514,
  probe: |
    grep -oE '^\*\.\*[[:space:]]+@@[^ ;]+' /etc/rsyslog.d/40-forward.conf | sed -E 's/[[:space:]]+/ /'
  expect:
    rc: 0
    stdout: \A\*\.\* @@{{SERVER_NAME|re}}:6514\n\Z
- id: the-ipv4-firewall-is-firewall-secure
  what: INPUT and FORWARD drop by default, the lab Hiera's one address is whitelisted for SSH, and firewall_secure's limit
    chain stands
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 54-57
    text: 'class { ''puppet_infrastructure::firewall_secure'':'
  probe: |
    iptables -S | grep -E '^-P (INPUT|FORWARD) '
    iptables -S INPUT | grep -c -- '--comment "100 SSH whitelist '
    iptables -S LIMIT_OVERALL 2>/dev/null | grep -c -- '--comment "116 SSH LIMIT_OVERALL"'
  expect:
    rc: 0
    stdout: \A-P INPUT DROP\n-P FORWARD DROP\n1\n1\n\Z
- id: the-local-directories-are-in-place
  what: filesystem_base_desktop's local, bin and etc directories exist, root-owned 0755
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 49-52
    text: 'class { ''puppet_infrastructure::filesystem_base_desktop'':'
  - path: manifests/filesystem_base_desktop.pp
    lines: 8-17
    text: $basedirs = [ $localdir, $bindir, $etcdir ]
  probe: |
    stat -c '%U %a %n' {{LOCALDIR}} {{LOCALDIR}}/bin {{LOCALDIR}}/etc
  expect:
    rc: 0
    stdout: \Aroot 755 {{LOCALDIR}}\nroot 755 {{LOCALDIR}}/bin\nroot 755 {{LOCALDIR}}/etc\n\Z
- id: the-apt-helpers-are-in-desktop-mode
  what: the surface update script holds the desktop list (firefox, not the server's nginx-core or postfix), the desktop compatibility
    link points at it, and the relevant-updates script the nightly cron runs exists, root 0755
  control: negative
  derived_from:
  - path: manifests/node_base_desktop.pp
    lines: 65-68
    text: server_mode      => false,
  - path: manifests/filesystem_apt.pp
    lines: 72-81
    text: target  => "${localdir}/bin/apt-update-surface.sh",
  probe: |
    s=$(grep '^SURFACE=' {{LOCALDIR}}/bin/apt-update-surface.sh)
    for p in nginx-core postfix firefox; do case " ${s#SURFACE=\"} " in *" $p "*|*" $p\""*) echo "$p listed";; *) echo "$p not listed";; esac; done
    readlink {{LOCALDIR}}/bin/apt-update-surface-desktop.sh
    stat -c '%U %a' {{LOCALDIR}}/bin/apt-update-relevant.sh
  expect:
    rc: 0
    stdout: \Anginx-core not listed\npostfix not listed\nfirefox listed\n{{LOCALDIR}}/bin/apt-update-surface\.sh\nroot 755\n\Z
apply:
  resource_type: class
  node: gnome
  catalog:
    Debian:
    - class: node_base_desktop
  expected_run2_events:
  - Exec[apt_update]
  requires:
  - server
  requires_why: a check restarts the agent daemon, whose own run asks the server for the node's catalog
