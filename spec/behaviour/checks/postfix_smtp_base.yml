class: postfix_smtp_base
baseline: release-0.9.10 (cf477c6)
fixture: params
peer:
  kind: ubuntu2
  why: a relayed message must leave the node for another host, so a second machine receives it with an SMTP sink
purpose: 'An SMTP submission server with TLS and layered restrictions: only listed client IPs may use it, only its own SASL
  users (dovecot''s passwd-file, not system accounts) may send, only MAIL FROM addresses in a general list are allowed, and
  each address only for the users configured for it; TLS is mandatory.'
outcomes:
- outcome: smtpd listens on the configured port, greets with the configured host name and presents the site's certificate
    over STARTTLS
  from: templates/postfix_smtp_base/master.cf.erb; templates/postfix_smtp_base/main.cf.erb:10, 23-30, 75
  checks:
  - smtpd-on-the-configured-port-with-the-hostname
  - starttls-presents-the-sslprefix-bundle
- outcome: the configured SASL users authenticate through dovecot, and the client-access map lists the allowed IPs
  from: manifests/postfix_smtp_base.pp:116-133; templates/postfix_smtp_base/sasl_users.erb; templates/postfix_smtp_base/client_access.erb
  checks:
  - sasl-user-authenticates-through-dovecot
  - client-access-map-allows-the-listed-ip
- outcome: a listed client, logged in, may send from an address in the general list that it owns (both users, each from its
    own address); refused are an address outside the general list, an address owned by another user, a client that is not
    logged in, a wrong password (535) and a client address that is not listed
  from: templates/postfix_smtp_base/main.cf.erb:94-118; templates/postfix_smtp_base/client_access.erb; templates/postfix_smtp_base/sender_access.erb;
    templates/postfix_smtp_base/controlled_envelope_senders.erb
  checks:
  - smtp-restrictions-exercised
- outcome: a message submitted by a logged-in user from its own address is queued (250 Ok queued) and, for a local recipient,
    delivered to the mailbox
  from: templates/postfix_smtp_base/main.cf.erb:76-79; templates/postfix_smtp_base/master.cf.erb:41-42, 60
  checks:
  - a-submission-is-queued-and-delivered-locally
- outcome: a logged-in user's message to a non-local domain is relayed (accepted at RCPT under smtpd_relay_restrictions) and
    delivered by postfix's SMTP client straight to the recipient's host (relayhost empty), here an address-literal recipient
    on the peer, whose sink receives it
  from: templates/postfix_smtp_base/main.cf.erb:73, 80
  checks:
  - a-mail-sink-on-the-peer
  - relayed-to-another-domain
  - the-sink-received-the-relayed-mail
- outcome: a recipient domain resolved through its MX (a DNS lookup for the domain's mail exchanger)
  from: templates/postfix_smtp_base/main.cf.erb:80
  uncovered:
    why: the relay is exercised with an address-literal recipient, which skips the MX lookup; the lab's DNS serves no MX for
      a fixture domain
    lifted_by: 'capability: a lab DNS zone with an MX record for a fixture domain pointing at a peer'
    evidence: relayed-to-another-domain sends to p8test-rcpt@[peer address]; the node's resolvers (NAT DNS) serve no fixture
      zone
- outcome: TLS is mandatory (no AUTH offered and MAIL FROM and AUTH refused before STARTTLS)
  from: templates/postfix_smtp_base/main.cf.erb:30
  checks:
  - tls-and-own-users-only
- outcome: system accounts cannot authenticate (dovecot's passdb is the passwd-file only; an OS account whose password the
    OS accepts gets 535)
  from: manifests/postfix_smtp_base.pp:109-114; files/postfix_smtp_base/10-auth.conf:122-125
  checks:
  - tls-and-own-users-only
- outcome: on outgoing delivery, a From header that matches none of do_not_warn_from_addresses_regexes is logged as a warning
    (and still delivered); one that matches is not
  from: manifests/postfix_smtp_base.pp:166-176; templates/postfix_smtp_base/smtp_header_checks.regexp.erb:2-4; templates/postfix_smtp_base/main.cf.erb:121
  checks:
  - relayed-to-another-domain
  - the-sink-received-the-relayed-mail
- outcome: the extra_sec hardening (protocols, ciphers, a generated DH group) and Let's Encrypt-shaped certificate names
  from: manifests/postfix_smtp_base.pp:54-69; templates/postfix_smtp_base/main.cf.erb:37-68
  uncovered:
    why: the fixture sets extra_sec and letsencrypt_certificate false; one set holds one params fixture
    lifted_by: 'capability: more than one params fixture per set'
    evidence: 'the params fixture: extra_sec false, letsencrypt_certificate false; {{SITE:engine-runner}} runs a set with
      one fixture'
checks:
- id: smtpd-on-the-configured-port-with-the-hostname
  what: postfix's smtpd listens on postfix_port and greets with myhostname = smtp_hostname
  control: negative
  derived_from:
  - path: templates/postfix_smtp_base/master.cf.erb
    lines: '12'
    text: <%=@postfix_port%>      inet  n       -       y       -       -       smtpd
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '75'
    text: myhostname = <%=@smtp_hostname%>
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '10'
    text: smtpd_banner = $myhostname ESMTP $mail_name (Ubuntu)
  probe: |
    python3 -c "import socket; s = socket.create_connection(('127.0.0.1', 587), 5); print(s.recv(512).decode().strip()); s.close()"
  expect:
    rc: 0
    stdout: \A220 smtp\.p8test\.example\.com ESMTP Postfix \(Ubuntu\)\n\Z
- id: starttls-presents-the-sslprefix-bundle
  what: STARTTLS on postfix_port presents the certificate at /etc/ssl/certs/<smtp_sslprefix>.postfix.bundle.crt
  control: negative
  derived_from:
  - path: manifests/postfix_smtp_base.pp
    lines: 58-59
    text: $certificate_filename = "/etc/ssl/certs/${smtp_sslprefix}.postfix.bundle.crt"
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '23'
    text: smtpd_tls_cert_file=<%=@certificate_filename%>
  probe: |
    a=$(openssl s_client -starttls smtp -connect 127.0.0.1:587 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
    b=$(openssl x509 -in /etc/ssl/certs/p8test.postfix.bundle.crt -noout -fingerprint -sha256)
    test -n "$a" && test "$a" = "$b" && echo served-cert-is-bundle
  mismatch:
    varies: 'only the certificate compared (the first certificate of the system CA bundle instead of the p8test bundle): the
      fingerprints must differ'
    probe: |
      a=$(openssl s_client -starttls smtp -connect 127.0.0.1:587 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
      b=$(openssl x509 -in /etc/ssl/certs/ca-certificates.crt -noout -fingerprint -sha256)
      test -n "$a" && test "$a" = "$b" && echo served-cert-is-bundle
  expect:
    rc: 0
    stdout: \Aserved-cert-is-bundle\n\Z
- id: sasl-user-authenticates-through-dovecot
  what: dovecot's passdb holds the smtp_users entry, so p8testuser authenticates with its password (postfix uses dovecot SASL)
  control: negative
  derived_from:
  - path: manifests/postfix_smtp_base.pp
    lines: 117-121
    text: content   => template('puppet_infrastructure/postfix_smtp_base/sasl_users.erb'),
  - path: templates/postfix_smtp_base/sasl_users.erb
    lines: '3'
    text: <%=smtp_user['name']%>:<%=smtp_user['password_hash']%>
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '92'
    text: smtpd_sasl_type = dovecot
  probe: |
    doveadm auth test p8testuser p8test-not-a-secret 2>&1 | grep -E '^passdb: '
  mismatch:
    varies: 'only the password (p8test-wrong-password): dovecot must refuse it, so the "auth succeeded" expectation must fail'
    probe: |
      doveadm auth test p8testuser p8test-wrong-password 2>&1 | grep -E '^passdb: '
  expect:
    rc: 0
    stdout: '\Apassdb: p8testuser auth succeeded\n\Z'
- id: client-access-map-allows-the-listed-ip
  what: the hashed client_access map (postmap) answers OK for each allowed_client_ips entry
  control: negative
  derived_from:
  - path: manifests/postfix_smtp_base.pp
    lines: '131'
    text: 'puppet_infrastructure::postfix_smtp_base_config_file {''/etc/postfix/client_access'':'
  - path: manifests/postfix_smtp_base_config_file.pp
    lines: '26'
    text: command     => "/usr/sbin/postmap ${name}",
  - path: templates/postfix_smtp_base/client_access.erb
    lines: 2-3
    text: <%=allowed_client_ip%> OK
  probe: |
    postmap -q 127.0.0.1 hash:/etc/postfix/client_access
  mismatch:
    varies: 'only the queried address (127.0.0.2, not in allowed_client_ips): the map has no entry, so OK must not come back'
    probe: |
      postmap -q 127.0.0.2 hash:/etc/postfix/client_access
  expect:
    rc: 0
    stdout: \AOK\n\Z
- id: smtp-restrictions-exercised
  what: 'seven SMTP sessions over STARTTLS, each up to RCPT TO root@localhost and then reset (no mail is queued): the two
    owners from their own addresses are accepted; an unlisted address (554 Access denied), another user''s address (553 not
    owned), no login (553 not logged in), a wrong password (535, then 553) and the unlisted client ::1 (554 Client host rejected)
    are refused'
  control: negative
  timeout: 300
  derived_from:
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: 101-103
    text: check_client_access hash:/etc/postfix/client_access
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: 107-109
    text: check_sender_access hash:/etc/postfix/sender_access
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '112'
    text: smtpd_sender_login_maps = hash:/etc/postfix/controlled_envelope_senders
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: 115-118
    text: reject_sender_login_mismatch
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '30'
    text: smtpd_tls_security_level = encrypt
  mutates: opens seven SMTP sessions to the node's own postfix (127.0.0.1 and ::1, port 587), logging in as p8testuser or
    p8testuser2 or not at all; each stops at RCPT and resets, so nothing is queued; postfix and dovecot log them; the replies
    go to /run/p8test-smtp/attempts.txt
  probe: |
    install -d -m 0700 /run/p8test-smtp
    python3 - > /run/p8test-smtp/attempts.txt <<'PY'
    import smtplib, ssl
    def attempt(label, host, user, password, sender):
        try:
            s = smtplib.SMTP(host, 587, timeout=30)
            s.ehlo('p8test.invalid'); s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
            auth = 'none'
            if user:
                try:
                    s.login(user, password); auth = '235'
                except smtplib.SMTPAuthenticationError as e:
                    auth = str(e.smtp_code)
            mail = s.mail(sender)[0]
            code, msg = s.rcpt('root@localhost')
            s.rset(); s.quit()
            print(f"{label}: auth {auth} mail {mail} rcpt {code} {msg.decode()}")
        except Exception as e:
            print(f"{label}: error {type(e).__name__} {e}")
    attempt('own-address', '127.0.0.1', 'p8testuser', 'p8test-not-a-secret', 'p8test@p8test.example.com')
    attempt('owner-of-the-other', '127.0.0.1', 'p8testuser2', 'p8test-user2-not-a-secret', 'p8test-other@p8test.example.com')
    attempt('not-in-general-list', '127.0.0.1', 'p8testuser', 'p8test-not-a-secret', 'p8test-unlisted@p8test.example.com')
    attempt('owned-by-another', '127.0.0.1', 'p8testuser', 'p8test-not-a-secret', 'p8test-other@p8test.example.com')
    attempt('unauthenticated', '127.0.0.1', None, None, 'p8test@p8test.example.com')
    attempt('wrong-password', '127.0.0.1', 'p8testuser', 'p8test-wrong-password', 'p8test@p8test.example.com')
    attempt('unlisted-client', '::1', 'p8testuser', 'p8test-not-a-secret', 'p8test@p8test.example.com')
    PY
  effect: |
    cat /run/p8test-smtp/attempts.txt
  expect:
    rc: 0
    stdout: '\Aown-address: auth 235 mail 250 rcpt 250 2\.1\.5 Ok\nowner-of-the-other: auth 235 mail 250 rcpt 250 2\.1\.5
      Ok\nnot-in-general-list: auth 235 mail 250 rcpt 554 5\.7\.1 <p8test-unlisted@p8test\.example\.com>: Sender address rejected:
      Access denied\nowned-by-another: auth 235 mail 250 rcpt 553 5\.7\.1 <p8test-other@p8test\.example\.com>: Sender address
      rejected: not owned by user p8testuser\nunauthenticated: auth none mail 250 rcpt 553 5\.7\.1 <p8test@p8test\.example\.com>:
      Sender address rejected: not logged in\nwrong-password: auth 535 mail 250 rcpt 553 5\.7\.1 <p8test@p8test\.example\.com>:
      Sender address rejected: not logged in\nunlisted-client: auth 235 mail 250 rcpt 554 5\.7\.1 <ip6-localhost\[::1\]>:
      Client host rejected: Access denied\n\Z'
- id: tls-and-own-users-only
  what: before STARTTLS the server offers no AUTH and answers MAIL FROM and AUTH with 530 Must issue a STARTTLS command first;
    an OS account (p8testsys) whose password the OS accepts (PAM login) is refused by dovecot's passdb and gets 535 from SMTP
    AUTH over TLS
  control: negative
  timeout: 300
  derived_from:
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '30'
    text: smtpd_tls_security_level = encrypt
  - path: files/postfix_smtp_base/10-auth.conf
    lines: '122'
    text: '#!include auth-system.conf.ext'
  - path: files/postfix_smtp_base/10-auth.conf
    lines: '125'
    text: '!include auth-passwdfile.conf.ext'
  mutates: installs pamtester if absent; creates the system account p8testsys (no home, nologin shell, password p8test-sys-not-a-secret);
    opens two SMTP sessions to 127.0.0.1:587 (one plaintext, one over TLS) and runs one PAM and one dovecot authentication
    for p8testsys (logged); the replies go to /run/p8test-smtp/tls-own.txt
  probe: |
    command -v pamtester >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install pamtester >/dev/null 2>&1
    id p8testsys >/dev/null 2>&1 || useradd -M -s /usr/sbin/nologin p8testsys
    echo 'p8testsys:p8test-sys-not-a-secret' | chpasswd
    install -d -m 0700 /run/p8test-smtp
    { printf '%s\n' 'p8test-sys-not-a-secret' | pamtester login p8testsys authenticate >/dev/null 2>&1; echo "os accepts p8testsys rc=$?"
      doveadm auth test p8testsys p8test-sys-not-a-secret 2>&1 | grep -E '^passdb: '
      python3 - <<'PY'
    import smtplib, ssl
    s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
    print('plaintext: auth offered' if s.has_extn('auth') else 'plaintext: auth not offered')
    code, msg = s.mail('p8test@p8test.example.com'); print('plaintext: mail', code, msg.decode())
    code, msg = s.docmd('AUTH', 'PLAIN AHA4dGVzdHVzZXIAcDh0ZXN0LW5vdC1hLXNlY3JldA=='); print('plaintext: auth', code, msg.decode())
    s.quit()
    s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
    s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
    try:
        s.login('p8testsys', 'p8test-sys-not-a-secret'); print('system-account: auth 235')
    except smtplib.SMTPAuthenticationError as e:
        print('system-account: auth', e.smtp_code)
    s.quit()
    PY
    } > /run/p8test-smtp/tls-own.txt
  effect: |
    cat /run/p8test-smtp/tls-own.txt
  expect:
    rc: 0
    stdout: '\Aos accepts p8testsys rc=0\npassdb: p8testsys auth failed\nplaintext: auth not offered\nplaintext: mail 530
      5\.7\.0 Must issue a STARTTLS command first\nplaintext: auth 530 5\.7\.0 Must issue a STARTTLS command first\nsystem-account:
      auth 535\n\Z'
- id: a-submission-is-queued-and-delivered-locally
  what: 'p8testuser, logged in over TLS, submits a message from its own address to root@localhost: postfix answers 250 Ok
    queued, the local agent delivers it to /var/mail/root (the subject appears there once) and the queue is empty'
  control: negative
  timeout: 180
  derived_from:
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '79'
    text: mydestination = $myhostname, localhost.localdomain, , localhost
  - path: templates/postfix_smtp_base/master.cf.erb
    lines: '60'
    text: local     unix  -       n       n       -       -       local
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: 115-118
    text: permit_sasl_authenticated
  mutates: 'submits one message (subject p8test-submission-check) as p8testuser to root@localhost: postfix queues it and delivers
    it to /var/mail/root (created root:mail 0600 if absent), and logs both; the replies go to /run/p8test-smtp/submission.txt'
  probe: |
    install -d -m 0700 /run/p8test-smtp
    python3 - > /run/p8test-smtp/submission.txt <<'PY'
    import smtplib, ssl
    s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
    s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
    s.login('p8testuser', 'p8test-not-a-secret')
    s.mail('p8test@p8test.example.com'); s.rcpt('root@localhost')
    code, msg = s.data(b"From: p8test@p8test.example.com\r\nTo: root@localhost\r\nSubject: p8test-submission-check\r\n\r\np8test body\r\n")
    print('data', code, msg.decode()); s.quit()
    PY
    for i in $(seq 1 60); do grep -q '^Subject: p8test-submission-check$' /var/mail/root 2>/dev/null && break; sleep 1; done
  effect: |
    cat /run/p8test-smtp/submission.txt
    p8_count '^Subject: p8test-submission-check$' /var/mail/root
    mailq | tail -1
  expect:
    rc: 0
    stdout: '\Adata 250 2\.0\.0 Ok: queued as [0-9A-F]+\n1\nMail queue is empty\n\Z'
- id: a-mail-sink-on-the-peer
  what: setup for the relay, an SMTP sink on the peer's port 25 that records every command and message it receives
  control: negative
  host: peer
  derived_from:
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '80'
    text: 'relayhost = '
  mutates: writes /run/p8test-sink/sink.py (a Python asyncio SMTP sink answering 250 to every command) and starts it detached
    on 0.0.0.0:25; it appends what it receives to /run/p8test-sink/received.txt
  probe: |
    install -d -m 0700 /run/p8test-sink
    cat > /run/p8test-sink/sink.py <<'PY'
    import asyncio
    OUT = '/run/p8test-sink/received.txt'
    def log(text):
        with open(OUT, 'a') as f:
            f.write(text + '\n')
    async def handle(r, w):
        def send(s):
            w.write((s + '\r\n').encode())
        send('220 p8test-sink ESMTP'); await w.drain()
        in_data, buf = False, []
        while True:
            line = await r.readline()
            if not line:
                break
            t = line.decode(errors='replace').rstrip('\r\n')
            if in_data:
                if t == '.':
                    in_data = False
                    log('\n'.join(buf) + '\n.'); buf = []
                    send('250 2.0.0 accepted by p8test-sink')
                else:
                    buf.append(t)
            else:
                log('C: ' + t)
                u = t.upper()
                if u.startswith(('EHLO', 'HELO')):
                    send('250 p8test-sink')
                elif u.startswith(('MAIL', 'RCPT', 'RSET', 'NOOP')):
                    send('250 2.1.0 ok')
                elif u == 'DATA':
                    in_data = True; send('354 end with .')
                elif u == 'QUIT':
                    send('221 bye'); await w.drain(); break
                else:
                    send('502 5.5.2 not implemented')
            await w.drain()
        w.close()
    async def main():
        srv = await asyncio.start_server(handle, '0.0.0.0', 25)
        async with srv:
            await srv.serve_forever()
    asyncio.run(main())
    PY
    setsid -f python3 /run/p8test-sink/sink.py </dev/null >/run/p8test-sink/sink.log 2>&1
    for i in $(seq 1 20); do ss -Hltn 'sport = :25' | grep -q . && break; sleep 0.5; done
  effect: |
    ss -Hltn 'sport = :25' | awk '{print $4}'
  expect:
    rc: 0
    stdout: \A0\.0\.0\.0:25\n\Z
- id: relayed-to-another-domain
  what: 'p8testuser (From p8test@p8test.example.com, which the regex list names) and p8testuser2 (From p8test-other@p8test.example.com,
    which it does not) each submit one message over TLS to p8test-rcpt@[peer]: both accepted at RCPT and queued; postfix''s
    SMTP client delivers both to the peer (status=sent), and the From-header warning is logged once, for the second'
  control: negative
  timeout: 300
  derived_from:
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '73'
    text: smtpd_relay_restrictions = permit_mynetworks permit_sasl_authenticated defer_unauth_destination
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '121'
    text: smtp_header_checks = regexp:/etc/postfix/smtp_header_checks.regexp
  - path: templates/postfix_smtp_base/smtp_header_checks.regexp.erb
    lines: '3'
    text: WARN "An email was sent with this FROM header that is not expected! (it does not match the input regular expressions)"
  mutates: submits two messages to postfix on 127.0.0.1:587 (as p8testuser and as p8testuser2), which postfix queues and delivers
    to the peer's sink on port 25, logging both and the header warning; the replies and the start time go to /run/p8test-smtp/relay.txt
    and /run/p8test-smtp/t0
  probe: |
    install -d -m 0700 /run/p8test-smtp; date +%s > /run/p8test-smtp/t0
    python3 - "$PEER_ADDR" > /run/p8test-smtp/relay.txt <<'PY'
    import smtplib, ssl, sys
    peer = sys.argv[1]
    def submit(user, password, sender, subject):
        s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
        s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
        s.login(user, password)
        s.mail(sender); code, msg = s.rcpt('p8test-rcpt@[%s]' % peer)
        dcode, dmsg = s.data(("From: %s\r\nTo: p8test-rcpt@[%s]\r\nSubject: %s\r\n\r\np8test body\r\n" % (sender, peer, subject)).encode())
        s.quit()
        print(subject, 'rcpt', code, 'data', dcode, dmsg.decode().split(' as ')[0])
    submit('p8testuser', 'p8test-not-a-secret', 'p8test@p8test.example.com', 'p8test-relay-1')
    submit('p8testuser2', 'p8test-user2-not-a-secret', 'p8test-other@p8test.example.com', 'p8test-relay-2')
    PY
    t0=$(cat /run/p8test-smtp/t0)
    for i in $(seq 1 90); do [ "$(journalctl -q -t postfix/smtp --since "@$t0" -o cat | grep -c 'to=<p8test-rcpt@\[.*status=sent')" -ge 2 ] && break; sleep 1; done
  effect: |
    cat /run/p8test-smtp/relay.txt
    t0=$(cat /run/p8test-smtp/t0)
    journalctl -q -t postfix/smtp --since "@$t0" -o cat | p8_count 'to=<p8test-rcpt@\[.*relay=.*status=sent'
    journalctl -q --since "@$t0" -o cat | grep 'An email was sent with this FROM header that is not expected' | grep -o 'header From: [^ :]*' | sort | uniq -c | sed 's/^ *//'
  expect:
    rc: 0
    stdout: '\Ap8test-relay-1 rcpt 250 data 250 2\.0\.0 Ok: queued\np8test-relay-2 rcpt 250 data 250 2\.0\.0 Ok: queued\n2\n1
      header From: p8test-other@p8test\.example\.com\n\Z'
- id: the-sink-received-the-relayed-mail
  what: the peer's sink received both messages from the node, each with its envelope sender and subject
  control: negative
  host: peer
  derived_from:
  - path: templates/postfix_smtp_base/main.cf.erb
    lines: '80'
    text: 'relayhost = '
  mutates: none beyond reading the sink's record (declared mutating so it runs after the relay)
  probe: |
    true
  effect: |
    grep -oE '^C: MAIL FROM:<[[:alnum:]@.-]+' /run/p8test-sink/received.txt | sed 's/^C: MAIL FROM:<//' | sort
    grep -E '^Subject: p8test-relay-[12]$' /run/p8test-sink/received.txt | sort
  expect:
    rc: 0
    stdout: '\Ap8test-other@p8test\.example\.com\np8test@p8test\.example\.com\nSubject: p8test-relay-1\nSubject: p8test-relay-2\n\Z'
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: postfix_smtp_base
