class: user_samba
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: 'Creates a domain user on a Zentyal (Samba AD) server: Zentyal''s create-user.pl makes the account with the first
  and last name split from myname, and set-user-samba-hash.sh sets the given Samba password hash, each only when the account
  or hash is not already there.'
outcomes:
- outcome: create-user.pl receives the user and the split name, then set-user-samba-hash.sh the names and the hash, in that
    order
  from: manifests/user_samba.pp:5-24
  checks:
  - user-created-with-split-name
  - samba-hash-set-for-the-user
- outcome: a real domain account exists afterwards and authenticates with the password behind the hash
  from: manifests/user_samba.pp:10-24
  uncovered:
    why: the scripts are Zentyal's (create-user.pl, set-user-samba-hash.sh), which the lab's plain Samba AD DC does not have;
      the node fixture samba_dc_standin records their arguments instead
    lifted_by: 'capability: a Zentyal/Samba AD domain controller node with Zentyal''s user scripts'
    evidence: 'plan node_fixture samba_dc_standin; {{SITE:node-inventory}} dc: os ''Ubuntu 24.04 server + Samba 4.19 AD DC''
      (plain Samba, no Zentyal); measured 2026-11-21 on the node: apt-cache policy zentyal-samba, zentyal-users, zentyal-core:
      no candidate (sources: Ubuntu''s archive and OpenVox only), so Zentyal needs a third-party repository'
checks:
- id: user-created-with-split-name
  what: create-user.pl received the user and the first and last parts of myname
  control: negative
  derived_from:
  - path: manifests/user_samba.pp
    lines: 6-8
    text: $separate_name = split($myname, ' ')
  - path: manifests/user_samba.pp
    lines: '11'
    text: command => "create-user.pl $username ${first_name} ${last_name} ${mysmbhash}",
  probe: cat /var/tmp/p8test_samba_standin/users
  expect:
    rc: 0
    stdout: \Ap8testuser P8 Testuser\n\Z
- id: samba-hash-set-for-the-user
  what: set-user-samba-hash.sh received the names and the given hash, which the store holds for the user
  control: negative
  derived_from:
  - path: manifests/user_samba.pp
    lines: '18'
    text: command => "set-user-samba-hash.sh ${first_name} ${last_name} ${mysmbhash}",
  probe: cat /var/tmp/p8test_samba_standin/hash.p8testuser
  expect:
    rc: 0
    stdout: \AIgBQADgAdABlAHMAdAB1AHMAZQByACEAMgAwADIANgAiAA==\n\Z
apply:
  resource_type: define
  node: ubuntu
  title: p8testuser
  catalog:
    Debian:
    - class: user_samba
  node_fixture: samba_dc_standin
