class: user_desktop_sudoer
baseline: release-0.9.10 (cf477c6)
fixture: params
session:
  user: p8testuser
  desktop: plasma
  why: user_kde_lock_screen's exec applies the lock settings only on an agent run while the user is logged in
purpose: 'Defines a desktop sudoer user: a desktop user (own group, desktop groups, password, SSH key, KDE screen lock) who
  is also in the admin groups adm and sudo, so the user can become root with the password.'
outcomes:
- outcome: the given groups (mygrouplist) are prepended to the user's own group, the desktop groups and the admin groups,
    and the first given group becomes the primary group
  from: manifests/user_desktop_sudoer.pp:7-9; manifests/user_base.pp:25-31, 63-66
  checks:
  - user-with-own-primary-group
  - desktop-and-admin-groups
- outcome: the user can become root with sudo and the password (a wrong password and a non-member are refused)
  from: manifests/user_desktop_sudoer.pp:9
  checks:
  - the-user-may-run-any-command-with-sudo
  - the-user-becomes-root-with-sudo
- outcome: the given password logs the user in (a wrong one is refused), and the given key is pushed
  from: manifests/user_desktop_sudoer.pp:10
  checks:
  - the-given-password-logs-in
  - the-given-key-is-pushed
- outcome: the KDE screen-lock settings are applied in the user's Plasma session
  from: manifests/user_desktop_sudoer.pp:12
  checks:
  - lock-screen-script-installed
  - kde-lock-settings-applied-in-the-session
- outcome: the other parameters (ignorekey, the ecryptfs values, non-default lock-screen values), passed through unchanged
  from: manifests/user_desktop_sudoer.pp:7, 10-12
  uncovered:
    why: the wrapper passes them to user_base and user_kde_lock_screen as they are; their effects are those classes' outcomes,
      tested in their own sets (user_base.yml, user_kde_lock_screen.yml), and one set holds one params fixture
    lifted_by: 'capability: more than one params fixture per set'
    evidence: manifests/user_desktop_sudoer.pp:10-12 pass the parameters through; {{SITE:engine-runner}} runs a set with one
      fixture
checks:
- id: user-with-own-primary-group
  what: the user exists, and its primary group is the first given group (mygrouplist ['users'] is prepended to the built list,
    and user_base takes the first group of the list as primary unless it is sudo or wheel)
  control: negative
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '9'
    text: $grouplist = flatten( [ $mygrouplist, [ $title, 'cdrom', 'dip', 'plugdev', 'lp', 'lpadmin', 'sambashare', 'adm',
      'sudo' ] ] )
  - path: manifests/user_base.pp
    lines: 25-31
    text: $myprimary = $mygrouplist[0]
  probe: |
    IFS=: read -r name _ uid gid gecos home shell < <(getent passwd p8testuser)
    echo "$name|$gecos|$home|$shell"
    echo "primary group: $(getent group "$gid" | cut -d: -f1)"
  expect:
    rc: 0
    stdout: '\Ap8testuser\|P8 Test User\|/home/p8testuser\|/bin/bash\nprimary group: users\n\Z'
- id: desktop-and-admin-groups
  what: the user is in exactly the given group (users), its own group, the desktop groups cdrom, dip, plugdev, lp, lpadmin,
    sambashare and the admin groups adm, sudo
  control: negative
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: 9-10
    text: $grouplist = flatten( [ $mygrouplist, [ $title, 'cdrom', 'dip', 'plugdev', 'lp', 'lpadmin', 'sambashare', 'adm',
      'sudo' ] ] )
  probe: id -nG p8testuser | tr ' ' '\n' | sort | tr '\n' ' '
  expect:
    rc: 0
    stdout: \Aadm cdrom dip lp lpadmin p8testuser plugdev sambashare sudo users \Z
- id: the-user-may-run-any-command-with-sudo
  what: 'membership of sudo gives the user the distribution''s full sudo right, (ALL : ALL) ALL'
  control: negative
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '9'
    text: '''adm'', ''sudo'' ] ] )'
  probe: |
    sudo -l -U p8testuser | grep -c -F '(ALL : ALL) ALL'
  mismatch:
    varies: the user (nobody, an existing account outside the sudo group), so sudo must deny it
    probe: |
      sudo -l -U nobody | grep -c -F '(ALL : ALL) ALL'
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: the-given-key-is-pushed
  what: the key is pushed (ignorekey defaults to false), one ssh-rsa line with comment <title>@puppet
  control: negative
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '7'
    text: $ignorekey = false
  - path: manifests/user_base.pp
    lines: 96-99
    text: 'ssh_authorized_key { "${myusername}@puppet" :'
  probe: |
    grep -v '^#' /home/p8testuser/.ssh/authorized_keys | grep -v '^$'
  expect:
    rc: 0
    stdout: \Assh-rsa AAAAB3NzaC1yc2EAAAADAQAB[A-Za-z0-9+/=]{200,} p8testuser@puppet\n\Z
- id: lock-screen-script-installed
  what: the lock-screen define brings its script into bindir (root, 0755) for the exec it runs as the user
  control: negative
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '12'
    text: 'puppet_infrastructure::user_kde_lock_screen { $title : screenlock_timeout_minutes => $screenlock_timeout_minutes,
      screenlock_grace_seconds => $screenlock_grace_seconds }'
  - path: manifests/user_kde_lock_screen_common.pp
    lines: 8-12
    text: source => 'puppet:///modules/puppet_infrastructure/user_kde_lock_screen/configure_lock_screen.sh',
  probe: stat -c '%U %a' {{LOCALDIR}}/bin/configure_lock_screen.sh
  expect:
    rc: 0
    stdout: \Aroot 755\n\Z
- id: kde-lock-settings-applied-in-the-session
  what: after an agent run with the user logged in, the wrapper's user_kde_lock_screen has set the user's kscreenlockerrc
    [Daemon] Autolock and LockOnResume on, Timeout 5 and LockGrace 0 (the wrapper's defaults)
  control: negative
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '7'
    text: $screenlock_timeout_minutes = 5, $screenlock_grace_seconds = 0
  - path: manifests/user_desktop_sudoer.pp
    lines: '12'
    text: 'puppet_infrastructure::user_kde_lock_screen { $title : screenlock_timeout_minutes => $screenlock_timeout_minutes,
      screenlock_grace_seconds => $screenlock_grace_seconds }'
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 66-95
    text: --group Daemon --key Timeout ${LOCK_TIMEOUT}
  probe: |
    f=/home/p8testuser/.config/kscreenlockerrc
    stat -c '%U' "$f"
    sed -n '/^\[Daemon\]/,/^\[/p' "$f" | grep -E '^(Autolock|LockOnResume|Timeout|LockGrace)=' | sort
  expect:
    rc: 0
    stdout: \Ap8testuser\nAutolock=true\nLockGrace=0\nLockOnResume=true\nTimeout=5\n\Z
- id: the-given-password-logs-in
  what: 'the password the wrapper passes to user_base works: su to p8testuser, run by an unprivileged account in a pty, succeeds
    with the test password and is refused with a wrong one'
  control: negative
  timeout: 90
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '10'
    text: myhash => $myhash
  mutates: two su attempts as the account nobody (one with the test password, one with a wrong one); the outcomes go to /run/p8test-user/pw.txt
  probe: |
    install -d -m 0700 /run/p8test-user; : > /run/p8test-user/pw.txt
    for pw in 'p8test-user-not-a-secret' 'p8test-wrong-password'; do
      out=$( (sleep 2; printf '%s\n' "$pw"; sleep 3) | timeout 20 runuser -u nobody -- script -qec "su p8testuser -c 'echo logged-in-as-\$(id -un)'" /dev/null 2>&1 | tr -d '\r' | grep -o -e 'logged-in-as-[a-z0-9]*' -e 'Authentication failure' | head -1)
      echo "${out:-no answer}" >> /run/p8test-user/pw.txt
    done
  effect: |
    cat /run/p8test-user/pw.txt
  expect:
    rc: 0
    stdout: \Alogged-in-as-p8testuser\nAuthentication failure\n\Z
- id: the-user-becomes-root-with-sudo
  what: as p8testuser, `sudo -S -k id -u` with the test password answers 0 (root); with a wrong password sudo refuses; the
    account nobody, given the same password, is refused
  control: negative
  timeout: 90
  derived_from:
  - path: manifests/user_desktop_sudoer.pp
    lines: '9'
    text: '''adm'', ''sudo'' ] ] )'
  mutates: three sudo attempts (p8testuser with the test password and with a wrong one, nobody with the test password); sudo
    logs them to the journal and /var/log/auth.log, and the successful one creates Ubuntu's marker /home/p8testuser/.sudo_as_admin_successful
    (-k keeps no credential timestamp); the answers go to /run/p8test-user/sudo.txt
  probe: |
    install -d -m 0700 /run/p8test-user; o=/run/p8test-user/sudo.txt; : > $o
    a=$(printf '%s\n' 'p8test-user-not-a-secret' | timeout 20 runuser -u p8testuser -- sudo -S -k -p '' id -u 2>/dev/null)
    echo "user, test password: ${a:-refused}" >> $o
    a=$(printf '%s\n' 'p8test-wrong-password' | timeout 20 runuser -u p8testuser -- sudo -S -k -p '' id -u 2>/dev/null)
    echo "user, wrong password: ${a:-refused}" >> $o
    a=$(printf '%s\n' 'p8test-user-not-a-secret' | timeout 20 runuser -u nobody -- sudo -S -k -p '' id -u 2>/dev/null)
    echo "nobody, test password: ${a:-refused}" >> $o
  effect: |
    cat /run/p8test-user/sudo.txt
  expect:
    rc: 0
    stdout: '\Auser, test password: 0\nuser, wrong password: refused\nnobody, test password: refused\n\Z'
apply:
  resource_type: define
  node: kubuntu
  title: p8testuser
  catalog:
    Debian:
    - class: filesystem_base
    - class: user_desktop_sudoer
