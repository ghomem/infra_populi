class: openvpn_set_vpn_passwd_file
baseline: release-0.9.10 (cf477c6)
fixture: params
peer:
  kind: ubuntu2
  why: VPN1 connects to an OpenVPN server after each password change, so a second machine must serve one
  files:
  - /run/p8test-vpnpw/ca.crt
  - /run/p8test-vpnpw/server.crt
  - /run/p8test-vpnpw/server.key
purpose: 'Installs a script with which a desktop user sets the password of several OpenVPN connections at once: it asks for
  the password twice (kdialog), and when both match it stores it as the secret of every listed NetworkManager connection present
  on the machine; blank or mismatched answers are asked again, and cancelling changes nothing.'
outcomes:
- outcome: the script is installed with the owner and the listed connections
  from: manifests/openvpn_set_vpn_passwd_file.pp:17-35; templates/openvpn/set_vpn_passwd.sh.erb:16
  checks:
  - script-installed-with-the-list
- outcome: with both answers matching, every listed connection present gets the password, and an unlisted one is left alone;
    the listed connection then connects with it
  from: templates/openvpn/set_vpn_passwd.sh.erb:12-25, 44-50
  checks:
  - a-test-vpn-pki-and-route
  - vpn-profiles-and-a-dialog-stub
  - the-peer-serves-openvpn-accepting-pass-a
  - matching-answers-set-the-listed-connection
- outcome: openvpn_nm_connection's own profiles (agent-owned password, the desktop user's) get the password when the user
    runs the script in their session
  from: templates/openvpn/set_vpn_passwd.sh.erb:12-25; templates/openvpn/connection_file.erb:5, 11
  uncovered:
    why: an agent-owned secret is saved only through a secret agent in the requesting user's desktop session (plasma-nm with
      its wallet); the set's runs are root over SSH, with no agent, and the profile's permitted user must exist and be logged
      in. The runner's session block logs in a p8test* account, but this define creates none and its plan gives no base or
      node fixture that would
    lifted_by: 'capability: a node fixture user for this define, logged in to Plasma by the runner, with the script run inside
      that session (its secret agent and wallet)'
    evidence: '{{SITE:engine-runner}} session_problems (session.user must be a p8test* fixture account, desktop plasma, a
      kde node); {{SITE:plan-file}}: openvpn_set_vpn_passwd_file has no required_base and no node_fixture; run 20261121T163922Z:
      as root, VPN4 (password-flags=1) showed no secret, while the audit log showed the update accepted (review 20261121T164531Z)'
- outcome: cancelling at either dialog changes nothing
  from: templates/openvpn/set_vpn_passwd.sh.erb:30-42
  checks:
  - cancelling-changes-nothing
- outcome: blank or mismatched answers are refused with a message and asked again, then a match sets the password
  from: templates/openvpn/set_vpn_passwd.sh.erb:44-55
  checks:
  - a-mismatch-is-asked-again
- outcome: running the script again changes the password of a listed connection (the next password change), and the connection
    then connects with the new one
  from: templates/openvpn/set_vpn_passwd.sh.erb:12-25
  checks:
  - the-peer-now-accepts-pass-c
  - a-second-run-changes-the-password
checks:
- id: script-installed-with-the-list
  what: the script at the fixture's path is root-owned 0755 and lists VPN1, VPN2 and VPN4
  control: negative
  derived_from:
  - path: manifests/openvpn_set_vpn_passwd_file.pp
    lines: 29-34
    text: content => template('puppet_infrastructure/openvpn/set_vpn_passwd.sh.erb'),
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: '16'
    text: VPN_LIST="<% @vpn_list.each do |vpn_name| %> <%= vpn_name %><% end %>"
  probe: |
    stat -c '%U:%G %a' /usr/local/bin/set_vpn_passwd.sh
    grep -E '^ *VPN_LIST=' /usr/local/bin/set_vpn_passwd.sh | sed 's/^ *//'
  expect:
    rc: 0
    stdout: \Aroot:root 755\nVPN_LIST=" VPN1 VPN2 VPN4"\n\Z
- id: a-test-vpn-pki-and-route
  what: setup, a throwaway CA and server certificate for the peer, the route to the peer's VPN address, and the OpenVPN plugin
  control: negative
  timeout: 600
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 18-23
    text: nmcli connection modify "${vpn_name}" vpn.secrets "password=${VPN_USER_PASSWD}"
  mutates: installs network-manager-openvpn if absent; creates /run/p8test-vpnpw (0700) with a throwaway CA (CN p8test-vpnpw-ca,
    2 days) and a server key and certificate it signs (CN p8test-vpnpw-server); adds the route 203.0.113.50/32 dev enp0s8
  probe: |
    set -e
    dpkg-query -W -f '${Status}' network-manager-openvpn 2>/dev/null | grep -q 'install ok installed' || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install network-manager-openvpn >/dev/null 2>&1
    d=/run/p8test-vpnpw; install -d -m 0700 $d; cd $d
    openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=p8test-vpnpw-ca -keyout ca.key -out ca.crt 2>/dev/null
    openssl req -newkey rsa:2048 -nodes -subj /CN=p8test-vpnpw-server -keyout server.key -out server.csr 2>/dev/null
    printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > ext.cnf
    openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -extfile ext.cnf -out server.crt 2>/dev/null
    ip route replace 203.0.113.50/32 dev enp0s8
  effect: |
    dpkg-query -W -f '${Package} ${Status}\n' network-manager-openvpn
    openssl verify -CAfile /run/p8test-vpnpw/ca.crt /run/p8test-vpnpw/server.crt
    ip route get 203.0.113.50 | grep -o 'dev enp0s8'
  expect:
    rc: 0
    stdout: '\Anetwork-manager-openvpn install ok installed\n/run/p8test-vpnpw/server\.crt: OK\ndev enp0s8\n\Z'
- id: vpn-profiles-and-a-dialog-stub
  what: setup, VPN1 (listed) and VPN3 (not listed) at openvpn_nm_connection's path with the password stored by NetworkManager,
    VPN4 (listed) exactly as openvpn_nm_connection's template writes it, and the dialog stub
  control: negative
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 15-20
    text: VPN_CON_FILE_LOCATION="/etc/NetworkManager/system-connections/"
  mutates: writes the NetworkManager profiles /etc/NetworkManager/system-connections/VPN1 and VPN3 (OpenVPN, password auth,
    password-flags=0; VPN1 to the peer's server 203.0.113.50 with the throwaway CA, VPN3 to 203.0.113.9) and VPN4 (password-flags=1,
    permissions=user:p8testuser:;) and reloads NetworkManager; writes the stub /var/tmp/p8test-kd/kdialog (replays /var/tmp/p8test-kd/answers,
    logs to /var/tmp/p8test-kd/calls)
  probe: |
    mk() { printf '%s\n' '[connection]' "id=$1" "uuid=$(cat /proc/sys/kernel/random/uuid)" 'type=vpn' '' '[vpn]' 'connection-type=password' 'password-flags=0' 'remote=203.0.113.9' 'username=p8testuser' 'service-type=org.freedesktop.NetworkManager.openvpn' '' '[ipv4]' 'method=auto' > /etc/NetworkManager/system-connections/$1; chmod 0600 /etc/NetworkManager/system-connections/$1; }
    mk VPN1; mk VPN3
    sed -i -e 's/^remote=203.0.113.9$/remote=203.0.113.50/' -e '/^\[vpn\]$/a ca=/run/p8test-vpnpw/ca.crt' /etc/NetworkManager/system-connections/VPN1
    printf '%s\n' '[connection]' 'id=VPN4' "uuid=$(cat /proc/sys/kernel/random/uuid)" 'type=vpn' 'permissions=user:p8testuser:;' '' '[vpn]' 'connection-type=password' 'password-flags=1' 'remote=203.0.113.9' 'username=p8testuser' 'service-type=org.freedesktop.NetworkManager.openvpn' '' '[ipv4]' 'method=auto' > /etc/NetworkManager/system-connections/VPN4
    chmod 0600 /etc/NetworkManager/system-connections/VPN4; nmcli connection reload
    install -d -m 0755 /var/tmp/p8test-kd
    printf '%s\n' '#!/bin/sh' 'echo "$*" >> /var/tmp/p8test-kd/calls' 'case "$*" in *--password*) l=$(head -1 /var/tmp/p8test-kd/answers); sed -i 1d /var/tmp/p8test-kd/answers; echo "${l%|*}"; exit "${l##*|}";; esac' 'exit 0' > /var/tmp/p8test-kd/kdialog
    chmod 0755 /var/tmp/p8test-kd/kdialog
  effect: |
    nmcli -g NAME connection show | grep -x -e VPN1 -e VPN3 -e VPN4 | sort
    [ -x /var/tmp/p8test-kd/kdialog ] && echo "stub ready"
  expect:
    rc: 0
    stdout: \AVPN1\nVPN3\nVPN4\nstub ready\n\Z
- id: the-peer-serves-openvpn-accepting-pass-a
  what: the peer runs an OpenVPN server on 203.0.113.50:1194 (UDP, tun, the handed-over certificate) that accepts p8testuser
    with p8test-pass-a only
  control: negative
  host: peer
  timeout: 300
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 18-23
    text: nmcli connection modify "${vpn_name}" vpn.secrets "password=${VPN_USER_PASSWD}"
  mutates: 'installs openvpn on the peer if absent; adds 203.0.113.50/32 to its enp0s8; writes /etc/p8test-vpnpw (the handed-over
    CA, server certificate and key, the accepted password p8test-pass-a, a check script comparing the user and password with
    it, server.conf: tun, UDP 1194, subnet 10.198.0.0/24, no client certificate); starts the server as a daemon logging to
    /run/p8test-vpnpw-server.log'
  probe: |
    set -e
    command -v openvpn >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install openvpn >/dev/null 2>&1
    ip addr add 203.0.113.50/32 dev enp0s8 2>/dev/null || true
    d=/etc/p8test-vpnpw; install -d -m 0700 $d
    for f in ca.crt server.crt server.key; do install -m 0600 /run/p8test-from-node/$f $d/$f; done
    printf '%s\n' p8test-pass-a > $d/accepted
    printf '#!/bin/sh\n[ "$(sed -n 1p "$1")" = p8testuser ] && [ "$(sed -n 2p "$1")" = "$(cat %s/accepted)" ]\n' $d > $d/check.sh; chmod 0755 $d/check.sh
    printf '%s\n' 'dev tun' 'proto udp' 'local 203.0.113.50' 'port 1194' 'topology subnet' 'server 10.198.0.0 255.255.255.0' "ca $d/ca.crt" "cert $d/server.crt" "key $d/server.key" 'dh none' 'verify-client-cert none' 'username-as-common-name' 'script-security 2' "auth-user-pass-verify $d/check.sh via-file" 'keepalive 10 60' 'verb 3' > $d/server.conf
    openvpn --config $d/server.conf --daemon p8test-vpnpw --log /run/p8test-vpnpw-server.log --writepid /run/p8test-vpnpw-server.pid
    sleep 2
  effect: |
    ss -Hlun 'sport = :1194' | awk '{print $4}'
    cat /etc/p8test-vpnpw/accepted
  expect:
    rc: 0
    stdout: \A203\.0\.113\.50:1194\np8test-pass-a\n\Z
- id: matching-answers-set-the-listed-connection
  what: answering p8test-pass-a twice, the script sets it on VPN1 (listed; VPN2 is listed but absent) and not on VPN3, and
    ends with its finished message; VPN1 then connects to the peer's server with it
  control: negative
  timeout: 120
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 18-23
    text: nmcli connection modify "${vpn_name}" vpn.secrets "password=${VPN_USER_PASSWD}"
  mutates: runs the script once with the stub first on PATH (answers p8test-pass-a twice); NetworkManager stores VPN1's password;
    brings VPN1 up (NetworkManager starts openvpn, creates a tun device) and down again; the outcomes go to /var/tmp/p8test-kd/run1.txt
  probe: |
    D=/var/tmp/p8test-kd; : > $D/calls; printf '%s\n' 'p8test-pass-a|0' 'p8test-pass-a|0' > $D/answers
    PATH=$D:$PATH timeout 30 /usr/local/bin/set_vpn_passwd.sh >/dev/null 2>&1; echo "rc=$?" > $D/run1.txt
    grep -c -- '--password' $D/calls | sed 's/^/password prompts: /' >> $D/run1.txt
    tail -1 $D/calls >> $D/run1.txt
    for v in VPN1 VPN3; do echo "$v: [$(nmcli -s -g vpn.secrets connection show $v)]"; done >> $D/run1.txt
    timeout 90 nmcli connection up VPN1 >/dev/null 2>&1; echo "up rc=$?" >> $D/run1.txt
    ping -c2 -W3 -q 10.198.0.1 >/dev/null 2>&1 && echo "server answers through the tunnel" >> $D/run1.txt
    nmcli connection down VPN1 >/dev/null 2>&1 || true
  effect: |
    cat /var/tmp/p8test-kd/run1.txt
  expect:
    rc: 0
    stdout: '\Arc=0\npassword prompts: 2\n--msgbox Configuration finished\.\nVPN1: \[password = p8test-pass-a\]\nVPN3: \[\]\nup
      rc=0\nserver answers through the tunnel\n\Z'
- id: cancelling-changes-nothing
  what: cancelling at the first dialog, then (another run) at the second, shows the cancel message and ends; VPN1 (listed,
    set to p8test-pass-a by the first run) keeps that password
  control: negative
  timeout: 120
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 30-42
    text: kdialog --msgbox "$CANCEL_OPERATION"
  mutates: runs the script twice with the stub (cancel at the first dialog; a password, then cancel at the second); the outcomes
    go to /var/tmp/p8test-kd/cancel.txt
  probe: |
    D=/var/tmp/p8test-kd; : > $D/cancel.txt
    for a in '|1' 'p8test-pass-z|0
    |1'; do
      : > $D/calls; printf '%s\n' "$a" > $D/answers
      PATH=$D:$PATH timeout 30 /usr/local/bin/set_vpn_passwd.sh >/dev/null 2>&1; echo "rc=$? prompts=$(grep -c -- '--password' $D/calls) last=$(tail -1 $D/calls)" >> $D/cancel.txt
    done
    echo "VPN1: [$(nmcli -s -g vpn.secrets connection show VPN1)]" >> $D/cancel.txt
  effect: |
    cat /var/tmp/p8test-kd/cancel.txt
  expect:
    rc: 0
    stdout: '\Arc=0 prompts=1 last=--msgbox You canceled this operation\.\nrc=0 prompts=2 last=--msgbox You canceled this
      operation\.\nVPN1: \[password = p8test-pass-a\]\n\Z'
- id: a-mismatch-is-asked-again
  what: with VPN2 (listed) now present, two blank answers show the blank message and ask again, two different passwords show
    the mismatch message and ask again, and the matching pair then sets VPN2's password
  control: negative
  timeout: 120
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 44-55
    text: kdialog --msgbox "$UNMATCHING_PASSWD"
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 44-45
    text: kdialog --msgbox "$BLANK_PASSWD"
  mutates: writes the profile VPN2 (as VPN1) and reloads NetworkManager; runs the script once with the stub answering two
    blanks, x, y, then p8test-pass-b twice; NetworkManager stores VPN2's password; the outcomes go to /var/tmp/p8test-kd/mismatch.txt
  probe: |
    D=/var/tmp/p8test-kd
    printf '%s\n' '[connection]' 'id=VPN2' "uuid=$(cat /proc/sys/kernel/random/uuid)" 'type=vpn' '' '[vpn]' 'connection-type=password' 'password-flags=0' 'remote=203.0.113.9' 'username=p8testuser' 'service-type=org.freedesktop.NetworkManager.openvpn' '' '[ipv4]' 'method=auto' > /etc/NetworkManager/system-connections/VPN2
    chmod 0600 /etc/NetworkManager/system-connections/VPN2; nmcli connection reload
    : > $D/calls; printf '%s\n' '|0' '|0' 'p8test-x|0' 'p8test-y|0' 'p8test-pass-b|0' 'p8test-pass-b|0' > $D/answers
    PATH=$D:$PATH timeout 30 /usr/local/bin/set_vpn_passwd.sh >/dev/null 2>&1; echo "rc=$?" > $D/mismatch.txt
    grep -c -- '--password' $D/calls | sed 's/^/password prompts: /' >> $D/mismatch.txt
    grep -- '--msgbox' $D/calls | sed 's/\\n.*//' >> $D/mismatch.txt
    echo "VPN2: [$(nmcli -s -g vpn.secrets connection show VPN2)]" >> $D/mismatch.txt
  effect: |
    cat /var/tmp/p8test-kd/mismatch.txt
  expect:
    rc: 0
    stdout: '\Arc=0\npassword prompts: 6\n--msgbox One of the passwords was blank\.[^\n]*\n--msgbox Passwords didn''t match\.[^\n]*\n--msgbox
      Configuration finished\.\nVPN2: \[password = p8test-pass-b\]\n\Z'
- id: the-peer-now-accepts-pass-c
  what: the peer's server now accepts p8test-pass-c only (the next password change), and refused nothing so far
  control: negative
  host: peer
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 18-23
    text: if [ -f "$CONN_LOCATION" ];then
  mutates: replaces the accepted password in /etc/p8test-vpnpw/accepted with p8test-pass-c (the check script reads it at each
    login)
  probe: |
    printf '%s\n' p8test-pass-c > /etc/p8test-vpnpw/accepted
  effect: |
    cat /etc/p8test-vpnpw/accepted
    p8_count "Username/Password authentication succeeded for username 'p8testuser'" /run/p8test-vpnpw-server.log | sed 's/^/accepted logins: /'
  expect:
    rc: 0
    stdout: '\Ap8test-pass-c\naccepted logins: [1-9][0-9]*\n\Z'
- id: a-second-run-changes-the-password
  what: running the script again with p8test-pass-c changes VPN1's password to it (VPN1 was set by the first run), and VPN1
    then connects to the peer's server, which accepts only the new password
  control: negative
  timeout: 120
  derived_from:
  - path: templates/openvpn/set_vpn_passwd.sh.erb
    lines: 18-23
    text: if [ -f "$CONN_LOCATION" ];then
  mutates: runs the script once more with the stub answering p8test-pass-c twice; brings VPN1 up and down again; the outcomes
    go to /var/tmp/p8test-kd/run2.txt
  probe: |
    D=/var/tmp/p8test-kd; : > $D/calls; printf '%s\n' 'p8test-pass-c|0' 'p8test-pass-c|0' > $D/answers
    PATH=$D:$PATH timeout 30 /usr/local/bin/set_vpn_passwd.sh >/dev/null 2>&1; echo "rc=$?" > $D/run2.txt
    echo "VPN1: [$(nmcli -s -g vpn.secrets connection show VPN1)]" >> $D/run2.txt
    timeout 90 nmcli connection up VPN1 >/dev/null 2>&1; echo "up rc=$?" >> $D/run2.txt
    ping -c2 -W3 -q 10.198.0.1 >/dev/null 2>&1 && echo "server answers through the tunnel" >> $D/run2.txt
    nmcli connection down VPN1 >/dev/null 2>&1 || true
  effect: |
    cat /var/tmp/p8test-kd/run2.txt
  expect:
    rc: 0
    stdout: '\Arc=0\nVPN1: \[password = p8test-pass-c\]\nup rc=0\nserver answers through the tunnel\n\Z'
apply:
  resource_type: define
  node: kubuntu
  title: /usr/local/bin/set_vpn_passwd.sh
  catalog:
    Debian:
    - class: openvpn_set_vpn_passwd_file
