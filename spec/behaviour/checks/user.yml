class: user
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: 'A normal user, in no special group: user_base''s account (own primary group, comment, home, shell) with the given
  password hash and the given SSH key, always pushed (the wrapper cannot pass ignorekey) and with no ecryptfs.'
outcomes:
- outcome: the account exists with its own primary group, comment, home (created, owned) and shell, in no other group
  from: manifests/user.pp:1-2, 6-8
  checks:
  - user-and-own-primary-group
  - no-supplementary-groups
  - home-created-and-owned
- outcome: the given password hash is set, so the password logs in and a wrong one is refused
  from: manifests/user.pp:6-8
  checks:
  - password-hash-set
  - the-password-logs-in-and-a-wrong-one-is-refused
- outcome: the given key is always pushed, as the user's only key, in a private file the user owns
  from: manifests/user.pp:6-8
  checks:
  - the-given-key-is-pushed
  - key-file-owned-and-private
- outcome: no ecryptfs passphrase is managed (the wrapper cannot pass myppsigs or myppwrapped)
  from: manifests/user.pp:6-8
  checks:
  - no-ecryptfs-passphrase-files
- outcome: a key added out of band is purged by the next agent run (user_base's purge, behind the wrapper)
  from: manifests/user.pp:8
  checks:
  - an-out-of-band-key-is-planted
  - the-agent-run-purges-the-out-of-band-key
- outcome: the empty-hash refusal behind the wrapper
  from: manifests/user.pp:8
  uncovered:
    why: a refusal at compile time (user_base's fail()), which ends a run APPLY_FAILED, never a check
    lifted_by: 'capability: a variant run whose expected outcome is a compile refusal'
    evidence: '{{SITE:engine-runner}} run_locked: a red harness is APPLY_FAILED; user_base''s set records the compile-only
      refusal (2026-11-19T17:23:25Z, COMPILE_FAILED "Can''t touch this - hash is empty!"); this wrapper passes myhash on (user.pp:8)'
- outcome: a login with the pushed key
  from: manifests/user.pp:6-8
  uncovered:
    why: a login needs the private half of the pushed key on the node; the repository keeps no private keys and no run hands
      a file from the laptop to the node
    lifted_by: 'capability: a run step that hands a private key from the laptop to the node'
    evidence: '{{SITE:engine-runner}} fetch_node_files hands files from the node to the peer only; the key''s line, owner
      and modes are checked instead'
- outcome: the parameter variants the wrapper passes on (a group list, another home, a home mode, another shell) and the locked
    or keyless placeholders
  from: manifests/user.pp:6-8
  checks:
  - the-wrapper-passes-a-locked-hash-home-shell-and-groups
  - the-wrapper-passes-an-empty-key
node_agent:
  after:
  - an-out-of-band-key-is-planted
  why: user_base purges keys it does not manage, so the agent run after a planted key is the evidence
variants:
- name: locked
  why: the parameters the wrapper passes on (a locked hash, a group list, another home, home mode and shell); production's
    users are declared in the passwd/ layer, never read, so their use is undeterminable and they are tested
  params: locked
- name: emptykey
  why: an empty key passed through the wrapper (undeterminable production use, as above); the set's fixture with mykey ''
  params: emptykey
checks:
- id: user-and-own-primary-group
  what: the wrapped user exists with its own same-named primary group, the comment, /home/<title> and /bin/bash
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: '8'
    text: 'puppet_infrastructure::user_base { $title : myname => $myname, myhash => $myhash , mykey => $mykey, mygrouplist
      => $mygrouplist, myhome => $myhome, myhomemode => $myhomemode, user_shell => $user_shell }'
  - path: manifests/user_base.pp
    lines: '26'
    text: $myprimary = $title
  probe: |
    IFS=: read -r name _ uid gid gecos home shell < <(getent passwd p8testuser)
    echo "$name|$gecos|$home|$shell"
    echo "primary group: $(getent group "$gid" | cut -d: -f1)"
  expect:
    rc: 0
    stdout: '\Ap8testuser\|P8 Test User\|/home/p8testuser\|/bin/bash\nprimary group: p8testuser\n\Z'
- id: no-supplementary-groups
  what: the wrapper's default empty group list leaves the user in its own group only
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: '6'
    text: $mygrouplist = [ ]
  - path: manifests/user_base.pp
    lines: '65'
    text: groups         => $mygrouplist ,
  probe: id -nG p8testuser
  expect:
    rc: 0
    stdout: \Ap8testuser\n\Z
- id: home-created-and-owned
  what: the home directory is created (managehome) and owned by the user
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: '69'
    text: managehome     => true,
  probe: stat -c '%U %G %F' /home/p8testuser
  expect:
    rc: 0
    stdout: \Ap8testuser p8testuser directory\n\Z
- id: password-hash-set
  what: the shadow entry carries the fixture's SHA-512 hash (asserted by algorithm and salt only)
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: '71'
    text: password       => $myhash,
  probe: |
    getent shadow p8testuser | cut -d: -f2 | cut -d'$' -f1-3
  expect:
    rc: 0
    stdout: \A\$6\$p8testsalt\n\Z
- id: the-given-key-is-pushed
  what: 'the user''s key is pushed (the wrapper cannot set ignorekey): exactly one authorized key, type ssh-rsa, comment <title>@puppet,
    carrying the fixture key (an RSA public key body) and not a placeholder (userlocked/emptykey)'
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: '58'
    text: $sshkey = $mykey
  - path: manifests/user_base.pp
    lines: '94'
    text: if ( $ignorekey == false ) {
  - path: manifests/user_base.pp
    lines: 96-99
    text: 'ssh_authorized_key { "${myusername}@puppet" :'
  - path: manifests/user_base.pp
    lines: '98'
    text: type => 'ssh-rsa',
  probe: |
    grep -v '^#' /home/p8testuser/.ssh/authorized_keys | grep -v '^$'
  expect:
    rc: 0
    stdout: \Assh-rsa AAAAB3NzaC1yc2EAAAADAQAB[A-Za-z0-9+/=]{200,} p8testuser@puppet\n\Z
- id: key-file-owned-and-private
  what: the pushed key file belongs to the user, and it and ~/.ssh are private (the ssh_authorized_key resource)
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 96-99
    text: user => $myusername,
  probe: stat -c '%U %a %n' /home/p8testuser/.ssh /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \Ap8testuser 700 /home/p8testuser/\.ssh\np8testuser 600 /home/p8testuser/\.ssh/authorized_keys\n\Z
- id: the-password-logs-in-and-a-wrong-one-is-refused
  what: su to p8testuser, run by an unprivileged account in a pty, succeeds with the test password and is refused with a wrong
    one
  control: negative
  timeout: 90
  derived_from:
  - path: manifests/user.pp
    lines: '8'
    text: myhash => $myhash ,
  - path: manifests/user_base.pp
    lines: 63-72
    text: password       => $myhash,
  mutates: two su attempts as the account nobody (one with the test password, one with a wrong one); the outcomes go to /run/p8test-user/pw.txt
  probe: |
    install -d -m 0700 /run/p8test-user; : > /run/p8test-user/pw.txt
    for pw in 'p8test-user-not-a-secret' 'p8test-wrong-password'; do
      out=$( (sleep 2; printf '%s\n' "$pw"; sleep 3) | timeout 20 runuser -u nobody -- script -qec "su p8testuser -c 'echo logged-in-as-\$(id -un)'" /dev/null 2>&1 | tr -d '\r' | grep -o -e 'logged-in-as-[a-z0-9]*' -e 'Authentication failure' | head -1)
      echo "${out:-no answer}" >> /run/p8test-user/pw.txt
    done
  effect: |
    cat /run/p8test-user/pw.txt
  expect:
    rc: 0
    stdout: \Alogged-in-as-p8testuser\nAuthentication failure\n\Z
- id: no-ecryptfs-passphrase-files
  what: the account exists and nothing was written under /home/.ecryptfs/p8testuser (user_base's wrapped-passphrase file and
    its decoding exec are declared only when both ecryptfs parameters are given, which this wrapper cannot pass)
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: '8'
    text: 'puppet_infrastructure::user_base { $title : myname => $myname, myhash => $myhash , mykey => $mykey, mygrouplist
      => $mygrouplist, myhome => $myhome, myhomemode => $myhomemode, user_shell => $user_shell }'
  - path: manifests/user_base.pp
    lines: '108'
    text: if( $ppsigs != '' ) and ( $ppwrapped != '' ) {
  probe: |
    getent passwd p8testuser >/dev/null && echo account-exists
    find /home/.ecryptfs/p8testuser -type f 2>/dev/null | wc -l
  expect:
    rc: 0
    stdout: \Aaccount-exists\n0\n\Z
- id: an-out-of-band-key-is-planted
  what: setup for the purge check, a second key appended by hand to the user's authorized_keys
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: '8'
    text: 'puppet_infrastructure::user_base { $title : myname => $myname'
  mutates: generates a throwaway ed25519 key pair, /run/p8test-oob-key and /run/p8test-oob-key.pub, and appends its public
    key (comment p8test-out-of-band) to /home/p8testuser/.ssh/authorized_keys
  probe: |
    ssh-keygen -q -t ed25519 -N '' -C p8test-out-of-band -f /run/p8test-oob-key <<< y >/dev/null 2>&1
    cat /run/p8test-oob-key.pub >> /home/p8testuser/.ssh/authorized_keys
  effect: |
    grep -c p8test-out-of-band /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: the-agent-run-purges-the-out-of-band-key
  what: after the node's agent run, the out-of-band key is gone and the pushed key is the only one
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: '8'
    text: 'puppet_infrastructure::user_base { $title : myname => $myname'
  mutates: none beyond reading the file (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    grep -c p8test-out-of-band /home/p8testuser/.ssh/authorized_keys || true
    grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \A0\n1\n\Z
- id: the-wrapper-passes-a-locked-hash-home-shell-and-groups
  variant: locked
  what: through the wrapper, a locked hash, mygrouplist [users], home /srv/p8testhome mode 0700 and shell /bin/sh reach the
    account, and the pushed key is the unusable userlocked one
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: 6-8
    text: mygrouplist => $mygrouplist, myhome => $myhome, myhomemode => $myhomemode
  probe: |
    getent passwd p8testuser | cut -d: -f6,7
    id -gn p8testuser
    stat -c '%a' /srv/p8testhome
    passwd -S p8testuser | awk '{print $2}'
    awk '!/^(#|$)/ {print substr($2, 1, 10)}' /srv/p8testhome/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \A/srv/p8testhome:/bin/sh\nusers\n700\nL\nuserlocked\n\Z
- id: the-wrapper-passes-an-empty-key
  variant: emptykey
  what: through the wrapper, an empty key (with an unlocked hash) reaches user_base, and the pushed key is the unusable emptykey
    one
  control: negative
  derived_from:
  - path: manifests/user.pp
    lines: '8'
    text: mykey => $mykey
  - path: manifests/user_base.pp
    lines: 51-55
    text: $sshkey = join ( [ 'emptykey', $random_string ] )
  probe: |
    awk '!/^(#|$)/ {print substr($2, 1, 8)}' /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \Aemptykey\n\Z
apply:
  resource_type: define
  node: ubuntu
  title: p8testuser
  catalog:
    Debian:
    - class: user
