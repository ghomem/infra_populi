class: ssl_base
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: 'Deploys a service''s TLS key and certificate: the key into the private directory (0600), and the certificate bundled
  with its intermediate in the order a service needs (leaf first) into the certificates directory, and restarts the service
  when either changes.'
node_agent:
  after: the-key-and-bundle-drift
  why: the define restarts the service when the key or bundle changes, which only its next agent run after a change can show
outcomes:
- outcome: the key is deployed to /etc/ssl/private/<prefix>.key, 0600, and it is the key of the deployed certificate
  from: manifests/ssl_base.pp:5-6, 77-92
  checks:
  - the-key-is-private-and-matches-the-certificate
- outcome: the bundle /etc/ssl/certs/<prefix>.<service>.bundle.crt is the certificate then its intermediate, 0644, and the
    certificate verifies against that intermediate
  from: manifests/ssl_base.pp:7-9, 79-81, 99-119
  checks:
  - the-bundle-is-the-leaf-then-its-issuer
- outcome: the service is restarted once when the key or certificate changes
  from: manifests/ssl_base.pp:10, 84-107
  checks:
  - the-key-and-bundle-drift
  - the-agent-run-restores-both-and-restarts-the-service-once
- outcome: Let's Encrypt material (<prefix>-key.pem into the private directory, <prefix>.pem then <prefix>-chain.pem into
    <prefix>.<service>.bundle.pem)
  from: manifests/ssl_base.pp:44, 70-76
  checks:
  - letsencrypt-key-and-bundle
- outcome: on RedHat the key goes to /etc/pki/tls/private
  from: manifests/ssl_base.pp:57-62
  checks:
  - on-redhat-the-key-is-in-pki-tls-private
- outcome: other owners and groups for the files
  from: manifests/ssl_base.pp:85-92
  checks:
  - other-owners-and-groups
- outcome: a warning notify for services other than nginx and postfix
  from: manifests/ssl_base.pp:94-97
  uncovered:
    why: the warning is a notify resource, which reports an event on every agent run, so the harness's run-2 gate refuses
      the apply of such a variant (the plan lists no expected run-2 event for this define)
    lifted_by: 'capability: an expected run-2 event per variant run (expected_run2_events is per class in the plan)'
    evidence: 'manifests/ssl_base.pp:94-97 at the baseline (notify { "WARNING: ..." }); {{SITE:harness}} RUN2_FORBIDDEN_RE
      matches "defined ''message'' as"; {{SITE:plan-file}} expected_run2_events for ssl_base is empty'
variants:
- name: letsencrypt
  why: letsencrypt_certificate true, which production sets (20 node statements, through the nginx frontends)
  params: letsencrypt
- name: owners
  why: other owners and groups, which a production node sets (1 node statement each)
  params: owners
- name: rhel
  why: the RedHat branch (the key under /etc/pki/tls/private), on the rhel9 node with the set's own params fixture
  node: rhel9
checks:
- id: the-key-is-private-and-matches-the-certificate
  what: the key file is root:root 0600, and its public key is the bundle's first certificate's
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 77-78
    text: $key_file                 = "${ssl_private_dir}/${myprefix}.key"
  - path: manifests/ssl_base.pp
    lines: 85-92
    text: mode   => '0600',
  probe: |
    k=/etc/ssl/private/p8test.key; b=/etc/ssl/certs/p8test.nginx.bundle.crt
    stat -c '%U:%G %a' "$k"
    [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(openssl x509 -in "$b" -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  mismatch:
    varies: the certificate compared (the bundle's second one, the issuer's, instead of the first)
    probe: |
      k=/etc/ssl/private/p8test.key; b=/etc/ssl/certs/p8test.nginx.bundle.crt
      stat -c '%U:%G %a' "$k"
      second=$(awk '/BEGIN CERT/{i++} i==2' "$b")
      [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(echo "$second" | openssl x509 -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  expect:
    rc: 0
    stdout: \Aroot:root 600\nkey-matches-certificate\n\Z
- id: the-bundle-is-the-leaf-then-its-issuer
  what: the bundle is root:root 0644 and holds two certificates, the server's (CN p8test.invalid) then its issuer's (the throwaway
    CA), and the first verifies against the second
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 79-81
    text: $bundle_file              = "${ssl_certs_dir}/${myprefix}.${myservice}.bundle.crt"
  - path: manifests/ssl_base.pp
    lines: 109-119
    text: order  => '02',
  probe: |
    b=/etc/ssl/certs/p8test.nginx.bundle.crt
    cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
    stat -c '%U:%G %a' "$b"
    grep -c 'BEGIN CERTIFICATE' "$b"
    for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
    openssl verify -CAfile <(cert 2) <(cert 1) 2>&1 | sed 's/^.*: //'
  mismatch:
    varies: the trust anchor (the system CA bundle instead of the bundle's second certificate), which did not sign the server's
      certificate
    probe: |
      b=/etc/ssl/certs/p8test.nginx.bundle.crt
      cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
      stat -c '%U:%G %a' "$b"
      grep -c 'BEGIN CERTIFICATE' "$b"
      for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
      openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt <(cert 1) 2>&1 | tail -1 | sed 's/^.*: //'
  expect:
    rc: 0
    stdout: \Aroot:root 644\n2\np8test\.invalid\np8test throwaway CA\nOK\n\Z
- id: the-key-and-bundle-drift
  what: setup for the next check, the key and the bundle changed by hand (as a renewal changes them), with nginx's process
    id and journal cursor noted
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 85-92
    text: notify => Service[$myservicename],
  mutates: notes nginx's main PID and its journal cursor in /run/p8test-ssl/before, then appends a comment line to /etc/ssl/private/p8test.key
    and to /etc/ssl/certs/p8test.nginx.bundle.crt on the node
  probe: |
    install -d -m 0700 /run/p8test-ssl
    printf "pid='%s'\ncursor='%s'\n" "$(systemctl show -p MainPID --value nginx)" "$(journalctl -u nginx -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p')" > /run/p8test-ssl/before
    echo '# p8test drift' >> /etc/ssl/private/p8test.key
    echo '# p8test drift' >> /etc/ssl/certs/p8test.nginx.bundle.crt
  effect: |
    grep -c '^# p8test drift$' /etc/ssl/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt | cut -d: -f2 | paste -sd' '
    grep -q "^pid='[1-9]" /run/p8test-ssl/before && echo noted
  expect:
    rc: 0
    stdout: \A1 1\nnoted\n\Z
- id: the-agent-run-restores-both-and-restarts-the-service-once
  what: after the node's agent run, neither file holds the drift line, and nginx was restarted exactly once for the two changes
    (a new main PID; one start in its journal since the change)
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: '10'
    text: '# The service is restarted if the certificate changes.'
  - path: manifests/ssl_base.pp
    lines: 100-107
    text: notify         => Service[$myservicename],
  mutates: none beyond reading the files, nginx's state and its journal (declared mutating so it runs after the node's agent
    run)
  probe: |
    true
  effect: |
    grep -c '^# p8test drift$' /etc/ssl/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt | cut -d: -f2 | paste -sd' '
    . /run/p8test-ssl/before
    now=$(systemctl show -p MainPID --value nginx)
    [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$pid" ] && echo restarted
    journalctl -u nginx --after-cursor "$cursor" --no-pager -q | grep -c 'Started nginx.service'
  expect:
    rc: 0
    stdout: \A0 0\nrestarted\n1\n\Z
- id: letsencrypt-key-and-bundle
  variant: letsencrypt
  what: with letsencrypt_certificate true the key is /etc/ssl/private/p8test-key.pem (root:root 0600), the bundle is /etc/ssl/certs/p8test.nginx.bundle.pem
    (the certificate then its chain), and the key is the first certificate's
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 70-76
    text: $key_file                 = "${ssl_private_dir}/${myprefix}-key.pem"
  - path: manifests/ssl_base.pp
    lines: 70-76
    text: $bundle_file              = "${ssl_certs_dir}/${myprefix}.${myservice}.bundle.pem"
  probe: |
    k=/etc/ssl/private/p8test-key.pem; b=/etc/ssl/certs/p8test.nginx.bundle.pem
    stat -c '%U:%G %a' "$k"
    grep -c 'BEGIN CERTIFICATE' "$b" | sed 's/^[2-9]$/two or more certificates/'
    [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(openssl x509 -in "$b" -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  mismatch:
    varies: the certificate compared (the bundle's second one, the chain's, instead of the first)
    probe: |
      k=/etc/ssl/private/p8test-key.pem; b=/etc/ssl/certs/p8test.nginx.bundle.pem
      stat -c '%U:%G %a' "$k"
      grep -c 'BEGIN CERTIFICATE' "$b" | sed 's/^[2-9]$/two or more certificates/'
      second=$(awk '/BEGIN CERT/{i++} i==2' "$b")
      [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(echo "$second" | openssl x509 -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
  expect:
    rc: 0
    stdout: \Aroot:root 600\ntwo or more certificates\nkey-matches-certificate\n\Z
- id: other-owners-and-groups
  variant: owners
  what: with owner and group www-data, the key is www-data:www-data 0600 and the bundle www-data:www-data 0644
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 85-92
    text: owner  => $owner,
  probe: |
    stat -c '%U:%G %a' /etc/ssl/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt
  expect:
    rc: 0
    stdout: \Awww-data:www-data 600\nwww-data:www-data 644\n\Z
- id: on-redhat-the-key-is-in-pki-tls-private
  variant: rhel
  what: on RedHat the key is /etc/pki/tls/private/p8test.key, root:root 0600, and the bundle is in /etc/ssl/certs
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 57-62
    text: $ssl_private_dir = '/etc/pki/tls/private'
  probe: |
    stat -c '%n %U:%G %a' /etc/pki/tls/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt
  expect:
    rc: 0
    stdout: \A/etc/pki/tls/private/p8test\.key root:root 600\n/etc/ssl/certs/p8test\.nginx\.bundle\.crt root:root 644\n\Z
apply:
  resource_type: define
  node: ubuntu
  title: ssl_base
  catalog:
    Debian:
    - external: nginx
    - class: ssl_base
    RedHat:
    - external: nginx
    - class: ssl_base
  requires:
  - server
  requires_why: ssl_base takes the key and certificates from the server's file mount puppet:///extra_files
