class: sysmon_backup
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'Backs up the monitoring server''s data directory every night: a dated gzip tar in the sysmon backup directory, keeping
  the configured number of days of archives.'
outcomes:
- outcome: the backup script carries the values of the Hiera keys sysmon::basedir and the like, and root's crontab runs it
    at 23:00 every day
  from: manifests/sysmon_backup.pp:3-13; manifests/backup.pp:14-28
  checks:
  - backup-script-installed
  - script-carries-the-sysmon-keys
  - nightly-cron
- outcome: the backup directory the script writes into is there after the apply
  from: manifests/sysmon_backup.pp:8
  checks:
  - the-backup-directory-exists
- outcome: a run writes a dated gzip tar of the data directory from which a file restores byte for byte
  from: manifests/sysmon_backup.pp:1-2; templates/backup/backup.sh.erb:14-20, 31
  checks:
  - aged-archives-are-planted
  - backup-runs-and-archives-basedir
- outcome: the run deletes the prefix's archives older than 9 full days and keeps newer ones and other prefixes' files
  from: templates/backup/backup.sh.erb:22-23, 33-37
  checks:
  - aged-archives-are-planted
  - a-run-deletes-only-its-own-old-archives
- outcome: a run that cannot write its archive fails loudly (non-zero exit, an error line on stderr and in syslog) and stops
    before retention, so no old archive is deleted
  from: templates/backup/backup.sh.erb:31-37
  checks:
  - a-failed-run-is-loud
- outcome: cron itself firing at 23:00
  from: manifests/backup.pp:21-28
  uncovered:
    why: a run would have to wait for 23:00; the crontab entry is checked and the script it names is run by hand
    lifted_by: 'capability: a clock-controlled cron trigger inside a phase3 run'
    evidence: '{{SITE:engine-runner}} runs probes and agent runs only; it has no step that advances or waits for the node''s
      cron schedule'
- outcome: compression off (sysmon::compression false)
  from: manifests/sysmon_backup.pp:10; templates/backup/backup.sh.erb:15-20
  uncovered:
    why: one set holds one Hiera fixture, which leaves sysmon::compression unset (default true)
    lifted_by: 'capability: more than one params or Hiera fixture per set'
    evidence: '{{SITE:engine-runner}} applies the class once with its single `fixture` (params or defaults) against the master''s
      one Hiera'
checks:
- id: backup-script-installed
  what: the sysmon backup script is installed in bindir as backup-sysmon.sh, root:root 0755
  control: negative
  derived_from:
  - path: manifests/sysmon_backup.pp
    lines: '13'
    text: 'puppet_infrastructure::backup { $mysystype: basedir => $mybasedir, prefix => $myprefix, backdir => $mybackdir,
      ndays => $myndays, bindir => $mybindir, compression => $compression }'
  - path: manifests/backup.pp
    lines: 15-16
    text: mode    => '0755',
  probe: stat -c '%U %G %a' {{LOCALDIR}}/bin/backup-sysmon.sh
  expect:
    rc: 0
    stdout: \Aroot root 755\n\Z
- id: script-carries-the-sysmon-keys
  what: the script backs up sysmon::basedir under the prefix sysmon::address into sysmon::backdir, keeping sysmon::backdays
    copies, compressed by default
  control: negative
  derived_from:
  - path: manifests/sysmon_backup.pp
    lines: 6-9
    text: $mybasedir = lookup("${mysystype}::basedir")
  - path: manifests/sysmon_backup.pp
    lines: '10'
    text: $compression = lookup( { 'name' => "${mysystype}::compression", 'default_value' => true } )
  - path: templates/backup/backup.sh.erb
    lines: 4-7
    text: FILETARGETDIRS=<%= @basedir %>
  - path: templates/backup/backup.sh.erb
    lines: '15'
    text: COMPRESSION=<%= @compression %>
  probe: grep -E '^(FILETARGETDIRS|FILEPREFIX|BACKDIR|NC|COMPRESSION)=' {{LOCALDIR}}/bin/backup-sysmon.sh
  expect:
    rc: 0
    stdout: \AFILETARGETDIRS=/var/tmp/p8test-sysmon/\nFILEPREFIX=sysmon\.p8test\.invalid\nBACKDIR={{LOCALDIR}}/backup/sysmon\nNC=10\nCOMPRESSION=true\n\Z
- id: nightly-cron
  what: root's crontab runs the script at 23:00 every day (backup's defaults), named cron_sysmon_backup
  control: negative
  derived_from:
  - path: manifests/backup.pp
    lines: 5-8
    text: $hour = '23',
  - path: manifests/backup.pp
    lines: 22-23
    text: command   => "${bindir}/backup-${title}.sh",
  probe: |
    crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: cron_sysmon_backup'
  expect:
    rc: 0
    stdout: '\A# Puppet Name: cron_sysmon_backup\n0 23 \* \* \* {{LOCALDIR}}/bin/backup-sysmon\.sh\n\Z'
- id: the-backup-directory-exists
  what: the directory the script writes into, {{LOCALDIR}}/backup/sysmon, exists after the apply, root-owned 0755
  control: negative
  derived_from:
  - path: manifests/sysmon_backup.pp
    lines: '8'
    text: $mybackdir = lookup("${mysystype}::backdir")
  - path: templates/backup/backup.sh.erb
    lines: '31'
    text: tar $EXCLUDELINE -cv${COMPRESSION_FLAG}f $BACKDIR/$FILEPREFIX-`date +%Y-%b-%d-%Hh%Mm`.tar.gz $FILETARGETDIRS
  probe: |
    stat -c '%U %G %a' {{LOCALDIR}}/backup/sysmon
  expect:
    rc: 0
    stdout: \Aroot root 755\n\Z
- id: aged-archives-are-planted
  what: setup for the run, the source data and three files of known ages in the backup directory (which is not created here)
  control: negative
  derived_from:
  - path: templates/backup/backup.sh.erb
    lines: 35-37
    text: for i in `find $BACKDIR -maxdepth 1 -mtime +$DAYS -type f -name "$FILEPREFIX*" `; do
  mutates: 'creates the fixture source /var/tmp/p8test-sysmon/ (the monitoring server''s data) with one file p8test.txt; creates
    in {{LOCALDIR}}/backup/sysmon: sysmon.p8test.invalid-old.tar.gz dated 12 days ago, sysmon.p8test.invalid-recent.tar.gz
    dated 5 days ago, and p8test-other-old.tar.gz (another prefix) dated 30 days ago'
  probe: |
    install -d /var/tmp/p8test-sysmon
    echo p8test-sysmon-content > /var/tmp/p8test-sysmon/p8test.txt
    d={{LOCALDIR}}/backup/sysmon
    for f in sysmon.p8test.invalid-old:12 sysmon.p8test.invalid-recent:5 p8test-other-old:30; do
      printf 'p8test planted\n' > "$d/${f%%:*}.tar.gz"; touch -d "${f##*:} days ago" "$d/${f%%:*}.tar.gz"
    done
  effect: |
    cd {{LOCALDIR}}/backup/sysmon && find . -maxdepth 1 -type f -mtime +9 | LC_ALL=C sort | tr '\n' ' '; echo
  expect:
    rc: 0
    stdout: \A\./p8test-other-old\.tar\.gz \./sysmon\.p8test\.invalid-old\.tar\.gz \n\Z
- id: backup-runs-and-archives-basedir
  what: the script, run once by hand as cron would, exits 0 and writes one new archive sysmon.p8test.invalid-<date>.tar.gz,
    gzip-compressed, from which var/tmp/p8test-sysmon/p8test.txt restores byte for byte
  control: negative
  timeout: 120
  derived_from:
  - path: manifests/sysmon_backup.pp
    lines: '2'
    text: '# This class provides sysmon backups'
  - path: templates/backup/backup.sh.erb
    lines: '31'
    text: tar $EXCLUDELINE -cv${COMPRESSION_FLAG}f $BACKDIR/$FILEPREFIX-`date +%Y-%b-%d-%Hh%Mm`.tar.gz $FILETARGETDIRS
  mutates: runs backup-sysmon.sh once as root (a new archive in the backup directory; the planted 12-day-old file of its prefix
    is deleted); writes its exit code and the archive's name to /run/p8test-sysmon (rc, archive) and restores var/tmp/p8test-sysmon/p8test.txt
    from the archive there
  probe: |
    install -d -m 0700 /run/p8test-sysmon
    {{LOCALDIR}}/bin/backup-sysmon.sh >/dev/null 2>&1; echo $? > /run/p8test-sysmon/rc
    a=$(ls -1t {{LOCALDIR}}/backup/sysmon/sysmon.p8test.invalid-2*.tar.gz 2>/dev/null | head -1)
    echo "$a" > /run/p8test-sysmon/archive
    [ -n "$a" ] && tar -xzf "$a" -C /run/p8test-sysmon var/tmp/p8test-sysmon/p8test.txt
  effect: |
    echo "rc $(cat /run/p8test-sysmon/rc)"
    a=$(cat /run/p8test-sysmon/archive)
    basename "$a" | sed -E 's/-[0-9]{4}-[A-Z][a-z]{2}-[0-9]{2}-[0-9]{2}h[0-9]{2}m\.tar\.gz$/-DATE.tar.gz/'
    gzip -t "$a" && echo gzip-ok
    cmp -s /run/p8test-sysmon/var/tmp/p8test-sysmon/p8test.txt /var/tmp/p8test-sysmon/p8test.txt && echo restores-byte-for-byte
  expect:
    rc: 0
    stdout: \Arc 0\nsysmon\.p8test\.invalid-DATE\.tar\.gz\ngzip-ok\nrestores-byte-for-byte\n\Z
- id: a-run-deletes-only-its-own-old-archives
  what: after the run, the prefix's 12-day-old archive is gone, its 5-day-old one and the other prefix's 30-day-old file remain
    (find -mtime +9 on files named sysmon.p8test.invalid*)
  control: negative
  derived_from:
  - path: templates/backup/backup.sh.erb
    lines: 22-23
    text: let DAYS=$INTERVAL*$NC-1
  - path: templates/backup/backup.sh.erb
    lines: 35-37
    text: rm -f  $i
  mutates: none beyond listing the backup directory (declared mutating so it runs after the run)
  probe: |
    true
  effect: |
    cd {{LOCALDIR}}/backup/sysmon && ls -1 | sed -E 's/-[0-9]{4}-[A-Z][a-z]{2}-[0-9]{2}-[0-9]{2}h[0-9]{2}m\.tar\.gz$/-DATE.tar.gz/' | LC_ALL=C sort | tr '\n' ' '; echo
  expect:
    rc: 0
    stdout: \Ap8test-other-old\.tar\.gz sysmon\.p8test\.invalid-DATE\.tar\.gz sysmon\.p8test\.invalid-recent\.tar\.gz \n\Z
- id: a-failed-run-is-loud
  what: 'with the backup directory full (a one-page tmpfs over it, holding only an archive of the prefix dated 12 days ago),
    the script run as cron would cannot write its archive: it exits non-zero, writes an ERROR line on stderr and to syslog,
    and stops before its retention step, so the 12-day-old archive, which retention would delete, is kept'
  control: negative
  timeout: 120
  derived_from:
  - path: templates/backup/backup.sh.erb
    lines: '31'
    text: tar $EXCLUDELINE -cv${COMPRESSION_FLAG}f $BACKDIR/$FILEPREFIX-`date +%Y-%b-%d-%Hh%Mm`.tar.gz $FILETARGETDIRS
  - path: manifests/backup.pp
    lines: 21-28
    text: command   => "${bindir}/backup-${title}.sh",
  mutates: 'mounts a 4 KiB tmpfs over {{LOCALDIR}}/backup/sysmon (left mounted: the node is reverted after the run) and writes
    sysmon.p8test.invalid-ancient.tar.gz into it, dated 12 days ago; runs backup-sysmon.sh once as root; its exit code and
    stderr go to /run/p8test-sysmon-fail (rc, stderr); the script logs its ERROR line to syslog (the journal, /var/log/syslog)'
  probe: |
    d={{LOCALDIR}}/backup/sysmon
    install -d -m 0700 /run/p8test-sysmon-fail
    mount -t tmpfs -o size=4k p8test-full "$d"
    printf 'p8test planted\n' > "$d/sysmon.p8test.invalid-ancient.tar.gz"; touch -d '12 days ago' "$d/sysmon.p8test.invalid-ancient.tar.gz"
    {{LOCALDIR}}/bin/backup-sysmon.sh >/dev/null 2>/run/p8test-sysmon-fail/stderr; echo $? > /run/p8test-sysmon-fail/rc
  effect: |
    [ "$(cat /run/p8test-sysmon-fail/rc)" -ne 0 ] && echo "exit non-zero"
    p8_count '^ERROR: backup of /var/tmp/p8test-sysmon/ into {{LOCALDIR}}/backup/sysmon failed' /run/p8test-sysmon-fail/stderr
    journalctl -t backup-sysmon.p8test.invalid -o cat --no-pager | p8_count '^ERROR: backup of /var/tmp/p8test-sysmon/ into {{LOCALDIR}}/backup/sysmon failed'
    test -e {{LOCALDIR}}/backup/sysmon/sysmon.p8test.invalid-ancient.tar.gz && echo "the 12-day-old archive is kept"
  expect:
    rc: 0
    stdout: \Aexit non-zero\n1\n1\nthe 12-day-old archive is kept\n\Z
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: filesystem_base
    - class: sysmon_backup
