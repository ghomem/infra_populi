class: linux_policies_user
baseline: release-0.9.10 (cf477c6)
fixture: params
session:
  user: p8testuser
  desktop: plasma
  why: the exec runs the policies only on an agent run while the user is logged in, and the autostart entry at a login
purpose: Composes a desktop user's Linux policy script from the given policy lines (under linux-policies/USER/<user>.sh, owned
  by the user) and runs those policies as the user on every agent run while the user is logged in, and at each desktop log-in
  through the common autostart entry.
outcomes:
- outcome: USER/<user>.sh is composed from the header and the given policies, owned by the user, 0700
  from: manifests/linux_policies_user.pp:30-69
  checks:
  - user-policy-script-composed
- outcome: with the user logged in, an agent run executes the policies as the user through the runner
  from: manifests/linux_policies_user.pp:70-76
  checks:
  - policies-run-on-an-agent-run-while-logged-in
  - no-policy-runs-before-the-session
- outcome: at the user's desktop log-in, the autostart entry runs the policies
  from: manifests/linux_policies_common.pp:27-32
  checks:
  - autostart-runs-the-policies-at-login
- outcome: without a login session the policies do not run (the agent runs before the user's first session run none)
  from: manifests/linux_policies_user.pp:70-76; templates/linux-policies/puppet_header.sh.erb:9-14
  checks:
  - no-policy-runs-before-the-session
- outcome: other users or other policy lists
  from: manifests/linux_policies_user.pp:15-20
  uncovered:
    why: one set holds one params fixture (p8testuser, two no-op lines)
    lifted_by: 'capability: more than one params fixture per set'
    evidence: '{{SITE:engine-runner}} applies the class once with its single `fixture` (params or defaults)'
checks:
- id: user-policy-script-composed
  what: USER/p8testuser.sh is owned by the user (0700) and holds the header, which sources COMMON/common, then the policy
    lines
  control: negative
  derived_from:
  - path: manifests/linux_policies_user.pp
    lines: '26'
    text: $policies_script = "${linux_policies_dir}/USER/${username}.sh"
  - path: manifests/linux_policies_user.pp
    lines: 46-51
    text: line      => $policy,
  - path: manifests/linux_policies_user.pp
    lines: 58-63
    text: source    => $policies_script_tmp,
  - path: templates/linux-policies/puppet_header.sh.erb
    lines: '4'
    text: . <%= @linux_policies_dir %>/COMMON/common
  probe: |
    f={{LOCALDIR}}/linux-policies/USER/p8testuser.sh
    stat -c '%U %G %a' "$f"; head -1 "$f"
    grep -c '^\. {{LOCALDIR}}/linux-policies/COMMON/common$' "$f"
    tail -2 "$f"
  expect:
    rc: 0
    stdout: \Ap8testuser p8testuser 700\n#!/bin/bash\n1\nlogger -t p8testpolicy "p8test policy 1 as \$\(id -un\)"\nlogger
      -t p8testpolicy p8test-policy-2\n\Z
- id: policies-run-on-an-agent-run-while-logged-in
  what: with the user logged in, an agent run runs the policies as the user through the runner (tag linuxint-policies-puppet-agent),
    and the composed script finds the user logged in and executes them
  control: negative
  derived_from:
  - path: manifests/linux_policies_user.pp
    lines: 71-74
    text: command     => "${policies_script_exec} puppet-agent",
  - path: templates/linux-policies/execute_linux_policies_user.sh.erb
    lines: 9-12
    text: logger -p local1.notice -t ${SYSLOG_TAG} "Executing ${LINUX_POLICIES_SCRIPT}"
  - path: templates/linux-policies/puppet_header.sh.erb
    lines: 9-10
    text: logger -p local1.notice -t $SYSLOG_TAG "User ${USERNAME} loged in, executing policies"
  probe: |
    journalctl -t linuxint-policies-puppet-agent -o cat --no-pager | grep -c -x 'Executing {{LOCALDIR}}/linux-policies/USER/p8testuser.sh' | sed 's/^[1-9][0-9]*$/ran-on-agent-run/'
    t1=$(journalctl -t linuxint-policies-puppet-agent -o short-unix --no-pager | awk 'NR==1 {print int($1)}')
    [ -n "$t1" ] || { echo "no agent run"; exit 1; }
    journalctl -t linuxint-policies --since "@$t1" -o cat --no-pager | grep -c -x 'User p8testuser loged in, executing policies' | sed 's/^[1-9][0-9]*$/logged-in-on-agent-run/'
    journalctl -t p8testpolicy --since "@$t1" -o cat --no-pager | p8_count '^p8test policy 1 as p8testuser$' | sed 's/^[1-9][0-9]*$/policy-ran-on-agent-run-as-p8testuser/'
  expect:
    rc: 0
    stdout: \Aran-on-agent-run\nlogged-in-on-agent-run\npolicy-ran-on-agent-run-as-p8testuser\n\Z
- id: autostart-runs-the-policies-at-login
  what: at the user's Plasma login, the XDG autostart entry (linux_policies_common) runs the runner with caller autostart,
    which executes the user's composed script
  control: negative
  derived_from:
  - path: templates/linux-policies/autostart.desktop.erb
    lines: 1-7
    text: Exec=<%= @linux_policies_dir %>/COMMON/execute_linux_policies_user.sh autostart
  - path: manifests/linux_policies_common.pp
    lines: 27-31
    text: 'file { "/etc/xdg/autostart/linux-policies-user.desktop":'
  - path: templates/linux-policies/execute_linux_policies_user.sh.erb
    lines: 9-12
    text: SYSLOG_TAG="linuxint-policies-${CALLER}"
  probe: |
    journalctl -t linuxint-policies-autostart -o cat --no-pager | grep -c -x 'Executing {{LOCALDIR}}/linux-policies/USER/p8testuser.sh' | sed 's/^[1-9][0-9]*$/ran-at-login/'
    t0=$(journalctl -u systemd-logind -o short-unix --no-pager | awk '/New session .* of user p8testuser\./ {print int($1); exit}')
    t1=$(journalctl -t linuxint-policies-puppet-agent -o short-unix --no-pager | awk 'NR==1 {print int($1)}')
    [ -n "$t0" ] && [ -n "$t1" ] || { echo "no session or no agent run"; exit 1; }
    journalctl -t p8testpolicy --since "@$t0" --until "@$t1" -o cat --no-pager | p8_count '^p8test policy 1 as p8testuser$' | sed 's/^[1-9][0-9]*$/policies-ran-at-login-as-p8testuser/'
  expect:
    rc: 0
    stdout: \Aran-at-login\npolicies-ran-at-login-as-p8testuser\n\Z
- id: no-policy-runs-before-the-session
  what: 'the harness''s agent runs made before p8testuser''s first login session ran no policy: the journal holds no policy
    line from before logind opened that session, and one after it'
  control: negative
  derived_from:
  - path: templates/linux-policies/puppet_header.sh.erb
    lines: 9-14
    text: logger -p local1.notice -t $SYSLOG_TAG "User ${USERNAME} not loged in, skipping policies execution"
  - path: manifests/linux_policies_user.pp
    lines: 70-76
    text: '#Execute the policies on agent run if the user is logged in'
  probe: |
    t=$(journalctl -u systemd-logind -o short-unix --no-pager | awk '/New session .* of user p8testuser\./ {print int($1); exit}')
    [ -n "$t" ] || { echo "no session"; exit 1; }
    journalctl -t p8testpolicy --until "@$t" -o cat --no-pager | p8_count 'p8test'
    journalctl -t p8testpolicy --since "@$t" -o cat --no-pager | p8_count 'p8test' | sed 's/^[1-9][0-9]*$/after the session: some/'
  expect:
    rc: 0
    stdout: '\A0\nafter the session: some\n\Z'
apply:
  resource_type: define
  node: kubuntu
  title: linux_policies_user
  catalog:
    Debian:
    - class: filesystem_base
    - class: linux_policies_common
    - class: user_base
      define: p8testuser
    - external: stdlib
    - class: linux_policies_user
  expected_run2_events:
  - File[/opt/infra-populi/linux-policies/TMP/p8testuser.sh.tmp]
  - File_line[/opt/infra-populi/linux-policies/TMP/p8testuser.sh.tmp_0]
  - File_line[/opt/infra-populi/linux-policies/TMP/p8testuser.sh.tmp_1]
  - 'Exec[Execute linux policies for: p8testuser]'
