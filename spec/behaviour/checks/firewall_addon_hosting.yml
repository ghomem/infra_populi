class: firewall_addon_hosting
baseline: release-0.9.10 (cf477c6)
fixture: defaults
node_agent:
  after: an-agent-run-is-due
  why: that the agent still reaches its master through the OUTPUT drop policy shows only in an agent run made after the class
    is in place
purpose: 'Locks down a hosting server''s outbound IPv4 traffic: the OUTPUT chain drops everything except replies, DNS, NTP
  and the agent''s connection to its Puppet master, and any OUTPUT rule Puppet does not manage is removed, so a compromised
  service cannot open new IPv4 connections out.'
outcomes:
- outcome: the OUTPUT policy is DROP with accept rules for replies, DNS, NTP and the master on 8140
  from: manifests/firewall_addon_hosting.pp:13-20
  checks:
  - output-policy-drop
  - related-established-dns-ntp-accepted
  - master-rule-follows-the-nodes-resolution
- outcome: a new outbound TCP connection outside the accepted set is dropped, on loopback and towards the internet
  from: manifests/firewall_addon_hosting.pp:13-14
  checks:
  - new-outbound-tcp-dropped
  - new-outbound-tcp-to-the-internet-dropped
- outcome: DNS and NTP keep working through the firewall
  from: manifests/firewall_addon_hosting.pp:17-19
  checks:
  - dns-still-resolves
  - ntp-still-answers
- outcome: an OUTPUT rule that Puppet does not manage is removed on the next agent run (purge)
  from: manifests/firewall_addon_hosting.pp:13-14
  checks:
  - an-agent-run-is-due
  - the-agent-run-through-the-firewall-succeeded
- outcome: the agent still reaches its master and completes a run
  from: manifests/firewall_addon_hosting.pp:20
  checks:
  - an-agent-run-is-due
  - the-agent-run-through-the-firewall-succeeded
checks:
- id: output-policy-drop
  what: the OUTPUT chain's policy is DROP (the class overrides the firewall class's default)
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: 13-14
    text: 'firewallchain { ''OUTPUT:filter:IPv4'':  ensure => present, purge => true, policy => drop }'
  probe: iptables -S OUTPUT | head -1
  expect:
    rc: 0
    stdout: \A-P OUTPUT DROP\n\Z
- id: related-established-dns-ntp-accepted
  what: OUTPUT accepts RELATED/ESTABLISHED, DNS (udp/53) and NTP (udp/123)
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: '15'
    text: 'firewall { ''149 OUTPUT ACCEPT RELATED ESTABLISHED'': chain => ''OUTPUT'', state => [ ''RELATED'', ''ESTABLISHED'']
      , action => ''accept'' }'
  - path: manifests/firewall_addon_hosting.pp
    lines: 18-19
    text: 'firewall { ''150 OUTPUT DNS'': chain => ''OUTPUT'', proto => ''udp'', dport => ''53'' ,  action => ''accept'' }'
  probe: |
    iptables -S OUTPUT | grep -E -- '--comment "(149|150|151) ' | sed -E 's/ -m comment --comment "[^"]*"//'
  expect:
    rc: 0
    stdout: \A-A OUTPUT -p tcp -m state --state RELATED,ESTABLISHED -j ACCEPT\n-A OUTPUT -p udp -m udp --dport 53 -j ACCEPT\n-A
      OUTPUT -p udp -m udp --dport 123 -j ACCEPT\n\Z
- id: master-rule-follows-the-nodes-resolution
  what: the ruled rule 152 accepts tcp/8140 to exactly the address the node resolves for the server it is configured to use
    (servername resolved on the agent, not the master's serverip)
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: 13-14
    text: '# override the default OUTPUT from the firewall class - can''t touch this!'
  probe: |
    s=$(awk -F' *= *' '$1 == "server" {print $2; exit}' /etc/puppetlabs/puppet/puppet.conf)
    ip=$(getent ahostsv4 "$s" | awk 'NR==1 {print $1}')
    iptables -S OUTPUT | grep -- '--comment "152 OUTPUT PUPPET MASTER"' | grep -q -- "-d $ip/32 -p tcp -m tcp --dport 8140" && echo "152 accepts tcp/8140 to the server's address ($ip)"
  expect:
    rc: 0
    stdout: \A152 accepts tcp/8140 to the server's address \(\d+\.\d+\.\d+\.\d+\)\n\Z
- id: new-outbound-tcp-dropped
  what: a new outbound TCP connection outside the accepted set is dropped; loopback traffic crosses OUTPUT, so a connect to
    the node's own sshd on 127.0.0.1:22 shows it without leaving the node
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: 13-14
    text: 'firewallchain { ''OUTPUT:filter:IPv4'':  ensure => present, purge => true, policy => drop }'
  probe: |
    python3 -c 'import socket; socket.create_connection(("127.0.0.1", 22), 4)' 2>/dev/null && echo open || echo blocked
  expect:
    rc: 0
    stdout: \Ablocked\n\Z
- id: new-outbound-tcp-to-the-internet-dropped
  what: a new outbound TCP connection to a public web server (archive.ubuntu.com:80) is dropped
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: 13-14
    text: 'firewallchain { ''OUTPUT:filter:IPv4'':  ensure => present, purge => true, policy => drop }'
  probe: |
    python3 -c 'import socket; socket.create_connection((socket.gethostbyname("archive.ubuntu.com"), 80), 5)' 2>/dev/null && echo open || echo blocked
  expect:
    rc: 0
    stdout: \Ablocked\n\Z
- id: dns-still-resolves
  what: the node still resolves a public name through DNS (udp/53 accepted)
  control: invariant
  why_invariant: the clean node resolves public names through the NAT's DNS; the class must keep that working
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: '18'
    text: 'firewall { ''150 OUTPUT DNS'': chain => ''OUTPUT'', proto => ''udp'', dport => ''53'' ,  action => ''accept'' }'
  probe: |
    getent ahostsv4 archive.ubuntu.com | awk 'NR==1 {print "resolves"}'
  expect:
    rc: 0
    stdout: \Aresolves\n\Z
- id: ntp-still-answers
  what: an NTP request to a public server (ntp.ubuntu.com, udp/123) still gets an answer
  control: invariant
  why_invariant: the clean node reaches public NTP servers through the NAT; the class must keep that working
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: '19'
    text: 'firewall { ''151 OUTPUT NTP'': chain => ''OUTPUT'', proto => ''udp'', dport => ''123'' , action => ''accept'' }'
  probe: |
    python3 - <<'PY'
    import socket
    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(5)
    s.sendto(b"\x1b" + 47 * b"\0", (socket.gethostbyname("ntp.ubuntu.com"), 123))
    try:
        data, _ = s.recvfrom(1024); print("answers" if 47 < len(data) else "short answer")
    except OSError:
        print("no answer")
    PY
  expect:
    rc: 0
    stdout: \Aanswers\n\Z
- id: an-agent-run-is-due
  what: 'setup for the node''s agent run: a marker of the time before it, and an OUTPUT rule Puppet does not manage (an ACCEPT
    for tcp/9 with the comment p8test-unmanaged), present before the run'
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: 13-14
    text: '# override the default OUTPUT from the firewall class - can''t touch this!'
  mutates: writes the time to /run/p8test-fah/before and inserts one rule at the top of the IPv4 OUTPUT chain (iptables -I
    OUTPUT -p tcp --dport 9 -m comment --comment p8test-unmanaged -j ACCEPT); the runner then makes the node's agent run
  probe: |
    install -d -m 0700 /run/p8test-fah; date +%s > /run/p8test-fah/before
    iptables -I OUTPUT -p tcp --dport 9 -m comment --comment p8test-unmanaged -j ACCEPT
  effect: |
    test -s /run/p8test-fah/before && echo marked
    iptables -S OUTPUT | p8_count 'p8test-unmanaged'
  expect:
    rc: 0
    stdout: \Amarked\n1\n\Z
- id: the-agent-run-through-the-firewall-succeeded
  what: 'the agent run made after the marker (with OUTPUT dropping new connections) fetched its catalog from the master and
    applied it: the last run summary is newer than the marker and reports no failed resources, and the unmanaged OUTPUT rule
    inserted before it is gone (purge)'
  control: negative
  derived_from:
  - path: manifests/firewall_addon_hosting.pp
    lines: 13-14
    text: '# override the default OUTPUT from the firewall class - can''t touch this!'
  mutates: none beyond reading the agent's last run summary (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    f=/opt/puppetlabs/puppet/public/last_run_summary.yaml
    [ "$(sed -n 's/^ *last_run: *//p' $f)" -ge "$(cat /run/p8test-fah/before)" ] && echo "a run after the marker"
    sed -n '/^resources:/,/^[a-z]/p' $f | grep -E '^ +failed: ' | sed 's/^ *//'
    iptables -S OUTPUT | p8_count 'p8test-unmanaged'
  expect:
    rc: 0
    stdout: '\Aa run after the marker\nfailed: 0\n0\n\Z'
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - external: firewall
    - class: firewall_addon_hosting
