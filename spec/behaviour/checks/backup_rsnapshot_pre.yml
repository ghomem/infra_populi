class: backup_rsnapshot_pre
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'Prerequisites for rsnapshot backups (backup_rsnapshot): rsnapshot installed, the /etc/rsnapshot.d configuration
  directory, and rdiff.sh, a helper that reports what changed between consecutive snapshots.'
outcomes:
- outcome: rsnapshot is installed and runs
  from: manifests/backup_rsnapshot_pre.pp:7
  checks:
  - rsnapshot-installed-and-runs
- outcome: /etc/rsnapshot.d exists, root:root, traversable (0644 as declared, 0755 in effect for a directory)
  from: manifests/backup_rsnapshot_pre.pp:9-14
  checks:
  - config-directory
- outcome: rdiff.sh is installed root:root 0755 and reports, for each pair of consecutive snapshots, the files that differ
    and the files only in one
  from: manifests/backup_rsnapshot_pre.pp:16-21; files/backups/rdiff.sh:34-42, 60-115
  checks:
  - rdiff-installed
  - two-snapshots-are-planted
  - rdiff-reports-what-changed-between-snapshots
- outcome: rsnapshot driven from /etc/rsnapshot.d by backup_rsnapshot
  from: manifests/backup_rsnapshot_pre.pp:1-2
  checks:
  - a-config-in-the-directory-drives-rsnapshot
- outcome: in interactive mode (a second argument) rdiff.sh waits for ENTER after each pair's report and ends with Done!
  from: files/backups/rdiff.sh:55-58, 92-94, 111-118
  checks:
  - two-snapshots-are-planted
  - rdiff-pages-the-pairs-in-interactive-mode
checks:
- id: rsnapshot-installed-and-runs
  what: the rsnapshot package is installed and its command answers with its version
  control: negative
  derived_from:
  - path: manifests/backup_rsnapshot_pre.pp
    lines: '7'
    text: 'package { [ ''rsnapshot'' ]: ensure => present, }'
  probe: |
    dpkg-query -W -f '${Package} ${Status}\n' rsnapshot
    rsnapshot -V 2>&1 | grep -c '^rsnapshot '
  expect:
    rc: 0
    stdout: \Arsnapshot install ok installed\n1\n\Z
- id: config-directory
  what: /etc/rsnapshot.d is a directory, root:root, mode 755 in effect (declared 0644; Puppet sets search where read is set)
  control: negative
  derived_from:
  - path: manifests/backup_rsnapshot_pre.pp
    lines: 9-14
    text: 'file { ''/etc/rsnapshot.d'':'
  - path: manifests/backup_rsnapshot_pre.pp
    lines: '11'
    text: mode   => '0644',
  probe: stat -c '%F %U %G %a' /etc/rsnapshot.d
  expect:
    rc: 0
    stdout: \Adirectory root root 755\n\Z
- id: rdiff-installed
  what: rdiff.sh is in bindir, root:root 0755, byte-identical to the module's file
  control: negative
  derived_from:
  - path: manifests/backup_rsnapshot_pre.pp
    lines: 16-21
    text: source => 'puppet:///modules/puppet_infrastructure/backups/rdiff.sh',
  - path: files/backups/rdiff.sh
    sha256: b45b5e661456553d11699630d7b681f1081e225d345a118fb476ec731d5272d3
  probe: |
    stat -c '%U %G %a' {{LOCALDIR}}/bin/rdiff.sh
    sha256sum {{LOCALDIR}}/bin/rdiff.sh | cut -d' ' -f1
  expect:
    rc: 0
    stdout: \Aroot root 755\nb45b5e661456553d11699630d7b681f1081e225d345a118fb476ec731d5272d3\n\Z
- id: two-snapshots-are-planted
  what: setup for the reports, a snapshot root with daily.0, daily.1 and daily.2, each pair differing in changed.txt, with
    removed.txt only in daily.2 and added.txt only in daily.0
  control: negative
  derived_from:
  - path: files/backups/rdiff.sh
    lines: 60-64
    text: LIST=`find . -maxdepth 1 -mindepth 1 -type d | sort -V`
  mutates: creates /run/p8test-rdiff/snap/daily.2 (same.txt, changed.txt "oldest", removed.txt), daily.1 (same.txt, changed.txt
    "old") and daily.0 (same.txt, changed.txt "new", added.txt)
  probe: |
    r=/run/p8test-rdiff/snap; rm -rf /run/p8test-rdiff; install -d "$r/daily.0" "$r/daily.1" "$r/daily.2"
    for d in daily.0 daily.1 daily.2; do printf 'same\n' > "$r/$d/same.txt"; done
    printf 'oldest\n' > "$r/daily.2/changed.txt"; printf 'removed\n' > "$r/daily.2/removed.txt"
    printf 'old\n' > "$r/daily.1/changed.txt"; printf 'new\n' > "$r/daily.0/changed.txt"; printf 'added\n' > "$r/daily.0/added.txt"
  effect: |
    cd /run/p8test-rdiff/snap && find . -type f | LC_ALL=C sort | tr '\n' ' '; echo
  expect:
    rc: 0
    stdout: \A\./daily\.0/added\.txt \./daily\.0/changed\.txt \./daily\.0/same\.txt \./daily\.1/changed\.txt \./daily\.1/same\.txt
      \./daily\.2/changed\.txt \./daily\.2/removed\.txt \./daily\.2/same\.txt \n\Z
- id: rdiff-reports-what-changed-between-snapshots
  what: 'rdiff.sh, run on that root, reports each consecutive pair in order: daily.1 -> daily.0 (added.txt only in daily.0,
    changed.txt differs), then daily.2 -> daily.1 (changed.txt differs, removed.txt only in daily.2), and nothing about same.txt'
  control: negative
  derived_from:
  - path: files/backups/rdiff.sh
    lines: 34-42
    text: diff $DIFF_OPTS -qr $MYDIR_A $MYDIR_B | sed 's/ and .\// .\//'
  - path: files/backups/rdiff.sh
    lines: 100-108
    text: compare_dirs $DIR_B $DIR_A
  mutates: runs {{LOCALDIR}}/bin/rdiff.sh /run/p8test-rdiff/snap once (it only reads); its report goes to /run/p8test-rdiff/report.txt
  probe: |
    {{LOCALDIR}}/bin/rdiff.sh /run/p8test-rdiff/snap > /run/p8test-rdiff/report.txt 2>&1; echo $? > /run/p8test-rdiff/rc
  effect: |
    echo "rc $(cat /run/p8test-rdiff/rc)"
    grep -E '^(-+ daily|Files|Only in)' /run/p8test-rdiff/report.txt
  expect:
    rc: 0
    stdout: '\Arc 0\n-------------------- daily\.1 -> daily\.0 --------------------\nOnly in \./daily\.0: added\.txt\nFiles
      \./daily\.1/changed\.txt \./daily\.0/changed\.txt differ\n-------------------- daily\.2 -> daily\.1 --------------------\nFiles
      \./daily\.2/changed\.txt \./daily\.1/changed\.txt differ\nOnly in \./daily\.2: removed\.txt\n\Z'
- id: rdiff-pages-the-pairs-in-interactive-mode
  what: with a second argument, rdiff.sh asks for ENTER after each of the two pairs' reports, ends with Done! and exits 0
  control: negative
  derived_from:
  - path: files/backups/rdiff.sh
    lines: 55-58
    text: '# any other argument triggers interactive mode'
  - path: files/backups/rdiff.sh
    lines: 111-118
    text: echo "press ENTER for next difference"
  mutates: runs rdiff.sh /run/p8test-rdiff/snap INTERACTIVE once with three ENTERs on stdin (it only reads); its output goes
    to /run/p8test-rdiff/interactive.txt
  probe: |
    printf '\n\n\n' | {{LOCALDIR}}/bin/rdiff.sh /run/p8test-rdiff/snap INTERACTIVE > /run/p8test-rdiff/interactive.txt 2>/dev/null; echo $? > /run/p8test-rdiff/interactive.rc
  effect: |
    echo "rc $(cat /run/p8test-rdiff/interactive.rc)"
    grep -cx 'press ENTER for next difference' /run/p8test-rdiff/interactive.txt
    tail -n 1 /run/p8test-rdiff/interactive.txt
  expect:
    rc: 0
    stdout: \Arc 0\n2\nDone!\n\Z
- id: a-config-in-the-directory-drives-rsnapshot
  what: a configuration placed in /etc/rsnapshot.d as backup_rsnapshot names it (rsnapshot-<title>.conf), run as backup_rsnapshot's
    cron line runs it (/usr/bin/rsnapshot -c <file> daily), takes a snapshot with the installed rsnapshot
  control: negative
  timeout: 120
  derived_from:
  - path: manifests/backup_rsnapshot_pre.pp
    lines: 9-14
    text: 'file { ''/etc/rsnapshot.d'':'
  - path: manifests/backup_rsnapshot_pre.pp
    lines: '7'
    text: 'package { [ ''rsnapshot'' ]: ensure => present, }'
  mutates: writes /etc/rsnapshot.d/rsnapshot-p8testpre.conf (snapshot root /var/tmp/p8test-pre-snap, one backup point /etc/hostname)
    and runs rsnapshot daily with it once, which creates /var/tmp/p8test-pre-snap/daily.0
  probe: |
    printf 'config_version\t1.2\nsnapshot_root\t/var/tmp/p8test-pre-snap/\ncmd_rsync\t/usr/bin/rsync\nretain\tdaily\t2\nbackup\t/etc/hostname\tlocalhost/\n' > /etc/rsnapshot.d/rsnapshot-p8testpre.conf
    /usr/bin/rsnapshot -c /etc/rsnapshot.d/rsnapshot-p8testpre.conf daily
  effect: |
    cmp /etc/hostname /var/tmp/p8test-pre-snap/daily.0/localhost/etc/hostname && echo "the snapshot holds /etc/hostname"
  expect:
    rc: 0
    stdout: \Athe snapshot holds /etc/hostname\n\Z
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: filesystem_base
    - class: backup_rsnapshot_pre
