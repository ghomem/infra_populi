class: hashman_web
baseline: release-0.9.10 (cf477c6)
fixture: defaults
peer:
  kind: ubuntu2
  why: the user changes the password in a browser on another machine, and that machine must then accept it
  files:
  - /run/p8test-hashman/initial
node_agent:
  after: an-old-unit-binds-every-address
  why: the backend's bind is corrected on a master that runs the old unit only by the class's next agent run
peer_agent:
  after: the-record-holds-the-new-password
  certname: p8test-hashman-client
  why: the new password reaches another machine only through that machine's agent run against the master-role server
purpose: 'The Hashman web portal on the Puppet master: users log in through nginx over HTTPS and change their own password,
  which Hashman writes to the user database that the master''s catalogs give to every node; its backend listens on the local
  machine only.'
outcomes:
- outcome: the hashman web service runs and its backend listens on the local machine only
  from: manifests/hashman_web.pp:167-181; templates/hashman/hashman.service.erb:7; HQ batch-10 ruling 6
  checks:
  - hashman-service-on-8080
  - backend-serves-the-portal
- outcome: other machines reach hashman only through nginx over HTTPS, never the backend port
  from: manifests/hashman_web.pp:186-188 (nginx_frontend to 127.0.0.1:8080); HQ batch-10 ruling 6
  checks:
  - other-machines-reach-hashman-only-through-nginx
  - frontend-proxies-the-domain-over-tls
- outcome: a master still running the old unit gets the localhost bind at its next agent run
  from: manifests/hashman_web.pp:167-181 (the unit file notifies the service, local change)
  checks:
  - an-old-unit-binds-every-address
  - the-next-agent-run-rebinds-the-backend-to-localhost
- outcome: the site's logos are copied from the paths in Hiera
  from: manifests/hashman_web.pp:100-160
  checks:
  - logos-copied-from-hiera-sources
- outcome: an administrator adds a user with hashman's CLI and the role line it prints declares the user from the database
  from: templates/hashman/pp_auth.py.erb:202-215; templates/hashman/libhashman/interface.py.erb:343
  checks:
  - admin-adds-the-user-and-assigns-its-role
- outcome: the user changes the password on the web page, through nginx, in a browser
  from: templates/hashman/httpserver/httpserver.py.erb:129-182
  checks:
  - the-user-changes-the-password-in-a-browser
- outcome: hashman's database holds the new password, and only the new one verifies
  from: templates/hashman/libhashman/dbutils.py.erb:589
  checks:
  - the-record-holds-the-new-password
- outcome: another machine accepts the new password after its agent run against the master
  from: manifests/user_base.pp:71; templates/hashman/libhashman/interface.py.erb:343
  checks:
  - the-client-accepts-the-new-password-after-its-agent-run
- outcome: the password-strength API answers OK for a strong password and NOK for a weak one, through nginx
  from: templates/hashman/httpserver/httpserver.py.erb:230-239 (/checkpwd)
  checks:
  - the-password-strength-api-answers-through-nginx
- outcome: help requests and password e-mails reach the team and the user
  from: templates/hashman/httpserver/httpserver.py.erb:213-227 (reqhelp); templates/hashman/libhashman/mailutils.py.erb; templates/hashman/pp_auth.py.erb:202-215
  checks:
  - the-peer-plays-the-relay-for-hashmans-mail
  - a-help-request-and-a-password-mail-leave-through-the-relay
  - the-relay-received-the-help-request-and-the-password-mail
- outcome: users sign data and verify signatures with the portal's key
  from: templates/hashman/httpserver/httpserver.py.erb:242-282 (/sign, /verify; PRIV_KEY and PUB_KEY at lines 73-74); files/hashman/common/hashman_utils.py:60-85
  checks:
  - signing-and-verifying-through-nginx-with-a-lab-key-pair
- outcome: with server-side session expiry on, an idle session is ended after the timeout
  from: templates/hashman/httpserver/httpserver.py.erb:196-209; manifests/hashman_web.pp (hashman::active_session_expiration,
    default False)
  uncovered:
    why: off under the default, which the lab Hiera keeps; server-side session expiry is the Hiera key hashman::active_session_expiration,
      which a variant run does not vary
    lifted_by: 'capability: a Hiera variant per run ({{SITE:engine-runner}} variants vary the node kind and the class''s params
      fixture)'
    evidence: 'manifests/hashman_web.pp:36 reads it with lookup(); {{SITE:engine-runner}} variant_problems (2026-11-23): a
      variant takes node and/or params only'
checks:
- id: hashman-service-on-8080
  what: the hashman unit (gunicorn) is enabled and running, listening on 127.0.0.1:8080 only (nginx is its only client)
  control: negative
  derived_from:
  - path: manifests/hashman_web.pp
    lines: 176-179
    text: ensure   => running,
  - path: templates/hashman/hashman.service.erb
    lines: '7'
    text: ExecStart=/usr/bin/gunicorn --bind 0.0.0.0:8080 wsgi --access-logfile <%= @logdir %>/gunicorn-receiver-access.log
      --error-logfile <%= @logdir %>/gunicorneceiver-error.log
  probe: |
    systemctl is-enabled hashman; systemctl is-active hashman
    ss -ltnH 'sport = :8080' | awk '{print $4}' | sort -u
  expect:
    rc: 0
    stdout: \Aenabled\nactive\n127\.0\.0\.1:8080\n\Z
- id: other-machines-reach-hashman-only-through-nginx
  what: from the peer, the backend port 8080 of the master-role node is refused, while the page loads over HTTPS through nginx
  control: negative
  host: peer
  derived_from:
  - path: manifests/hashman_web.pp
    lines: 186-188
    text: backend_hosts_and_ports    => ['127.0.0.1:8080', ],
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 27-28
    text: TITLE = '<%= @hashmancustomname %>' + ' @ ' + COMPANY
  probe: |
    nc -z -w3 {{NODE_ADDR}} 8080 >/dev/null 2>&1 && echo 8080-open || echo 8080-refused
    curl -sSk --max-time 10 --resolve puppet.example.com:443:{{NODE_ADDR}} https://puppet.example.com/ | grep -o 'title.[^<]*' | head -1
  mismatch:
    varies: the path (/static/styles/custom.css, a stylesheet without a title), so the title must come from the index route
    probe: |
      nc -z -w3 {{NODE_ADDR}} 8080 >/dev/null 2>&1 && echo 8080-open || echo 8080-refused
      curl -sSk --max-time 10 --resolve puppet.example.com:443:{{NODE_ADDR}} https://puppet.example.com/static/styles/custom.css | grep -o 'title.[^<]*' | head -1
  expect:
    rc: 0
    stdout: \A8080-refused\ntitle>Hashman @ My Company\n\Z
- id: the-password-strength-api-answers-through-nginx
  what: from the peer, POST /checkpwd through nginx answers OK for a strong password
  control: negative
  host: peer
  derived_from:
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 230-239
    text: 'if ( checkstr_pwd( password ) and checkpw(password) ):'
  probe: |
    curl -sSk --max-time 10 --resolve puppet.example.com:443:{{NODE_ADDR}} -X POST https://puppet.example.com/checkpwd --data 'password=p8T#qv7!Kw2'; echo
  mismatch:
    varies: the password (abcdef, a dictionary-like weak one), so the strength check must answer NOK
    probe: |
      curl -sSk --max-time 10 --resolve puppet.example.com:443:{{NODE_ADDR}} -X POST https://puppet.example.com/checkpwd --data 'password=abcdef'; echo
  expect:
    rc: 0
    stdout: \AOK\n\Z
- id: backend-serves-the-portal
  what: the Flask app answers / with its index titled '<customname> @ <company>'
  control: negative
  derived_from:
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 27-28
    text: TITLE = '<%= @hashmancustomname %>' + ' @ ' + COMPANY
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 111-113
    text: return render_template('index.html', strtitle = TITLE, companywebsite = COMPANYWEBSITE, companyname = COMPANY)
  probe: |
    curl -sS --max-time 10 http://127.0.0.1:8080/ | grep -o 'title.[^<]*' | head -1
  expect:
    rc: 0
    stdout: \Atitle>Hashman @ My Company\n\Z
- id: frontend-proxies-the-domain-over-tls
  what: nginx serves the hashman address over HTTPS by proxying to the backend on 127.0.0.1:8080
  control: negative
  derived_from:
  - path: manifests/hashman_web.pp
    lines: 186-188
    text: backend_hosts_and_ports    => ['127.0.0.1:8080', ],
  probe: |
    curl -sSk --max-time 10 --resolve puppet.example.com:443:127.0.0.1 https://puppet.example.com/ | grep -o 'title.[^<]*' | head -1
  mismatch:
    varies: 'the path (/static/styles/custom.css, a stylesheet the backend serves without a title): the title must come from
      the backend''s index route, not from any page nginx might return for the name'
    probe: |
      curl -sSk --max-time 10 --resolve puppet.example.com:443:127.0.0.1 https://puppet.example.com/static/styles/custom.css | grep -o 'title.[^<]*' | head -1
  expect:
    rc: 0
    stdout: \Atitle>Hashman @ My Company\n\Z
- id: logos-copied-from-hiera-sources
  what: with non-default hashman::companylogo(mail) the class copies the configured files (else branches)
  control: negative
  derived_from:
  - path: manifests/hashman_web.pp
    lines: 117-123
    text: source  => "${hashmancompanylogo}",
  - path: manifests/hashman_web.pp
    lines: '138'
    text: '} else {'
  probe: |
    d={{LOCALDIR}}/hashman/httpserver/static/img
    cmp /path/to/logo.png "$d/logo.png" && cmp /path/to/logo-email.png "$d/logo-email.png" && echo copied
  expect:
    rc: 0
    stdout: \Acopied\n\Z
- id: admin-adds-the-user-and-assigns-its-role
  what: hashman's CLI adds p8hashuser (database entries written, the password expired and, after unlock, unlocked), and the
    role line it prints, copied into the client's node definition, declares the user from the database variables
  control: negative
  derived_from:
  - path: templates/hashman/pp_auth.py.erb
    lines: 202-215
    text: 'if ( confirm_mail == "SILENT" ):'
  - path: templates/hashman/pp_auth.py.erb
    lines: 189-199
    text: rc = unlockpw( username )
  - path: templates/hashman/libhashman/interface.py.erb
    lines: '90'
    text: def useradd( username, password, email, name, company
  - path: templates/hashman/libhashman/interface.py.erb
    lines: '343'
    text: puppet_infrastructure::user        {
  - path: manifests/hashman_base.pp
    lines: '18'
    text: $dbdir      = lookup('hashman::dbdir')
  mutates: 'on the node: `pp_auth.py useradd p8hashuser p8hashuser@example.invalid "P8test Hash User" p8test SILENT` (the
    initial password it logs goes to /run/p8test-hashman/initial, mode 0600), `pp_auth.py unlock p8hashuser`, and the role
    line `pp_auth.py printinfo` prints is written as node ''p8test-hashman-client'' into the server''s manifests/nodes/p8test-hashman-client.pp'
  probe: |
    set -e
    cd {{LOCALDIR}}/hashman/common
    install -d -m 0700 /run/p8test-hashman
    out=$(./pp_auth.py useradd p8hashuser p8hashuser@example.invalid "P8test Hash User" p8test SILENT 2>&1)
    printf '%s' "$out" | sed -n 's/.*created with initial password //p' | head -1 | tr -d '\n' > /run/p8test-hashman/initial
    chmod 0600 /run/p8test-hashman/initial
    ./pp_auth.py unlock p8hashuser "p8test end to end" > /dev/null 2>&1
    line=$(./pp_auth.py printinfo p8hashuser 2>/dev/null | grep -E '^  puppet_infrastructure::user +[{]')
    install -d -m 0755 /etc/puppetlabs/code/environments/production/manifests/nodes
    printf "node 'p8test-hashman-client' {\n%s\n}\n" "$line" > /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp
  effect: |
    db=/etc/puppetlabs/code/environments/production/manifests/01_hashman
    grep -c -E "^[$]p8hashuser_pwd_hash = '[$]!6[$]" $db/hashes.pp
    grep -c -E "^[$]p8hashuser_(cname|email|company|ssh_key|ppsigs|ppwrapped|pwd_hash_smb) = " $db/*.pp | awk -F: '{s+=$2} END {print s}'
    test -s /run/p8test-hashman/initial && echo initial-kept
    sed -n 2p /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp
  expect:
    rc: 0
    stdout: '\A1\n7\ninitial-kept\n  puppet_infrastructure::user        \{ ''p8hashuser'': myname => \$::p8hashuser_cname,
      myhash => \$::p8hashuser_pwd_hash, mykey  => \$::p8hashuser_ssh_key,  \}\n\Z'
- id: the-user-changes-the-password-in-a-browser
  what: from the peer, a headless Chromium logs p8hashuser in through nginx with the initial password (typed, as the page's
    validation expects) and changes it on the page; hashman answers with its success message
  control: negative
  host: peer
  derived_from:
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 161-182
    text: rc = subprocess.call([ PP_AUTH_CMD , 'extauth', username , password, extra_msg ])
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 129-159
    text: PP_AUTH_CMD, 'setpw', username , oldpassword, newpassword
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: '52'
    text: STR_OK_PWD_CHANGED = 'you can now close this window and proceed to your application.'
  - path: manifests/hashman_web.pp
    lines: 186-188
    text: backend_hosts_and_ports    => ['127.0.0.1:8080', ],
  mutates: 'on the peer: runs /opt/p8test-browser (baseline v2) against https://puppet.example.com/ resolved to the class
    node''s host-only address; logs in, sets the new password p8T#qv7!Kw2 on hashman''s page; writes the page transcript to
    /run/p8test-hashman/browser.txt'
  probe: |
    install -d -m 0700 /run/p8test-hashman
    /opt/p8test-browser/bin/python - > /run/p8test-hashman/browser.txt 2>&1 <<'EOF'
    from playwright.sync_api import sync_playwright
    initial = open("/run/p8test-from-node/initial").read()
    with sync_playwright() as p:
        b = p.chromium.launch(args=["--host-resolver-rules=MAP puppet.example.com {{NODE_ADDR}}"])
        pg = b.new_page(ignore_https_errors=True)
        pg.goto("https://puppet.example.com/", timeout=30000)
        print("TITLE", pg.title())
        pg.locator("input[name=username]").press_sequentially("p8hashuser")
        pg.locator("input[name=password]").press_sequentially(initial)
        pg.click("#login"); pg.wait_for_load_state()
        print("AFTER_LOGIN", pg.url.split("/", 3)[-1])
        pg.locator("#oldpassword").press_sequentially(initial)
        pg.locator("#newpassword").press_sequentially("p8T#qv7!Kw2")
        pg.locator("#newpassword2").press_sequentially("p8T#qv7!Kw2")
        pg.click("#passbutton"); pg.wait_for_load_state()
        print("RESULT", pg.inner_text("body").strip().splitlines()[0])
        b.close()
    EOF
  effect: |
    cat /run/p8test-hashman/browser.txt
  expect:
    rc: 0
    stdout: '\ATITLE Hashman @ My Company\nAFTER_LOGIN next\nRESULT Success: you can now close this window and proceed to
      your application\.\n\Z'
- id: the-record-holds-the-new-password
  what: 'hashman''s database now holds p8hashuser''s new password, unexpired and unlocked: the new password verifies against
    the record and the initial one no longer does'
  control: negative
  derived_from:
  - path: templates/hashman/libhashman/dbutils.py.erb
    lines: '589'
    text: ourentry = crypt.crypt( password , '$' + SALTTYPE + '$' + saltstr + '$')
  - path: templates/hashman/libhashman/config.py.erb
    lines: '38'
    text: SUFFIX_USER      = '_pwd_hash'
  mutates: none beyond reading the database (declared mutating so it runs after the browser session)
  probe: |
    true
  effect: |
    grep -h "^[$]p8hashuser_pwd_hash = " /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp | python3 -W ignore -c '
    import crypt, re, sys
    h = re.search(r"= .(.*).\s*$", sys.stdin.read()).group(1)
    print("record", h[:3])
    print("new password verifies", crypt.crypt("p8T#qv7!Kw2", h) == h)
    print("initial password verifies", crypt.crypt(open("/run/p8test-hashman/initial").read(), h) == h)'
  expect:
    rc: 0
    stdout: \Arecord \$6\$\nnew password verifies True\ninitial password verifies False\n\Z
- id: the-client-accepts-the-new-password-after-its-agent-run
  what: after its agent run against the master-role server, the peer has the user p8hashuser, and PAM accepts the new password
    and refuses the initial one
  control: negative
  host: peer
  derived_from:
  - path: manifests/user_base.pp
    lines: '71'
    text: password       => $myhash,
  - path: templates/hashman/libhashman/interface.py.erb
    lines: '343'
    text: puppet_infrastructure::user        {
  mutates: none beyond authenticating p8hashuser with PAM (declared mutating so it runs after the peer's agent run)
  probe: |
    true
  effect: |
    getent passwd p8hashuser | cut -d: -f1,5
    printf '%s\n' 'p8T#qv7!Kw2' | pamtester login p8hashuser authenticate 2>&1 | sed -n 's/.*pamtester: //p'
    test -s /run/p8test-from-node/initial && echo initial-handed-over
    { cat /run/p8test-from-node/initial; echo; } | pamtester login p8hashuser authenticate 2>&1 | sed -n 's/.*pamtester: //p'
  expect:
    rc: 0
    stdout: \Ap8hashuser:P8test Hash User\nsuccessfully authenticated\ninitial-handed-over\nAuthentication failure\n\Z
- id: an-old-unit-binds-every-address
  what: setup for the next check, the unit as the baseline renders it (gunicorn on 0.0.0.0:8080), restarted (a master migrated
    from the old code)
  control: negative
  derived_from:
  - path: templates/hashman/hashman.service.erb
    lines: '7'
    text: ExecStart=/usr/bin/gunicorn --bind 0.0.0.0:8080 wsgi
  mutates: rewrites --bind in /lib/systemd/system/hashman.service to 0.0.0.0:8080, reloads systemd and restarts hashman on
    the node
  probe: |
    sed -i 's/--bind [0-9.]*:8080/--bind 0.0.0.0:8080/' /lib/systemd/system/hashman.service
    systemctl daemon-reload
    systemctl restart hashman
    sleep 3
  effect: |
    ss -ltnH 'sport = :8080' | awk '{print $4}' | sort -u
  expect:
    rc: 0
    stdout: \A0\.0\.0\.0:8080\n\Z
- id: the-next-agent-run-rebinds-the-backend-to-localhost
  what: after the node's agent run, the unit binds 127.0.0.1:8080 and the running backend listens there only
  control: negative
  derived_from:
  - path: manifests/hashman_web.pp
    lines: 167-172
    text: 'file { ''/lib/systemd/system/hashman.service'':'
  - path: manifests/hashman_web.pp
    lines: 176-181
    text: 'service { ''hashman'':'
  mutates: none beyond reading the unit and the listeners (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    grep -o -- '--bind [0-9.]*:8080' /lib/systemd/system/hashman.service
    ss -ltnH 'sport = :8080' | awk '{print $4}' | sort -u
  expect:
    rc: 0
    stdout: \A--bind 127\.0\.0\.1:8080\n127\.0\.0\.1:8080\n\Z
- id: signing-and-verifying-through-nginx-with-a-lab-key-pair
  what: with a key pair at the paths hashman reads (lab-generated), /sign through nginx returns a signature for p8hashuser's
    content, /verify accepts it and refuses it for altered content, and openssl verifies the signature against the public
    key
  control: negative
  derived_from:
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 72-74
    text: PRIV_KEY = LOCALDIR + '/ssl/hashman-key.pem'
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 245-260
    text: return sign_OpenSSL( base64.b64decode(content) , PRIV_KEY ) , HTTP_OK
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 266-282
    text: return verify_OpenSSL( signature, base64.b64decode(content) , PUB_KEY ) , HTTP_OK
  - path: files/hashman/common/hashman_utils.py
    lines: 60-67
    text: hash = OpenSSL.crypto.sign(key, message, digest)
  mutates: 'on the node: generates an RSA 2048 key pair {{LOCALDIR}}/hashman/ssl/hashman-key.pem (0600) and hashman-pubkey.pem
    (the directory created if absent); posts /sign once and /verify twice through nginx as p8hashuser with the password the
    browser set; writes the answers to /run/p8test-hashman/sign.txt and the signature to /run/p8test-hashman/sig.b64 (decoded
    into sig.bin)'
  probe: |
    d={{LOCALDIR}}/hashman/ssl; r=/run/p8test-hashman
    install -d -m 0755 "$d"; install -d -m 0700 "$r"
    openssl genrsa -out "$d/hashman-key.pem" 2048 2>/dev/null && chmod 0600 "$d/hashman-key.pem"
    openssl rsa -in "$d/hashman-key.pem" -pubout -out "$d/hashman-pubkey.pem" 2>/dev/null
    url=https://puppet.example.com; res="--resolve puppet.example.com:443:127.0.0.1"
    c=$(printf 'p8test sign me' | base64); bad=$(printf 'p8test sign me!' | base64)
    code=$(curl -sk $res -o "$r/sig.b64" -w '%{http_code}' "$url/sign" -F username=p8hashuser -F 'password=p8T#qv7!Kw2' -F "content=$c")
    { echo "sign http $code"
      echo "verify $(curl -sk $res "$url/verify" -F username=p8hashuser -F 'password=p8T#qv7!Kw2' -F "content=$c" -F "signature=$(cat "$r/sig.b64")")"
      echo "altered $(curl -sk $res "$url/verify" -F username=p8hashuser -F 'password=p8T#qv7!Kw2' -F "content=$bad" -F "signature=$(cat "$r/sig.b64")")"
    } > "$r/sign.txt"
    base64 -d "$r/sig.b64" > "$r/sig.bin" 2>/dev/null || true
  effect: |
    cat /run/p8test-hashman/sign.txt
    printf 'p8test sign me' | openssl dgst -sha512 -verify {{LOCALDIR}}/hashman/ssl/hashman-pubkey.pem -signature /run/p8test-hashman/sig.bin
  expect:
    rc: 0
    stdout: \Asign http 200\nverify OK\naltered NOK\nVerified OK\n\Z
- id: the-peer-plays-the-relay-for-hashmans-mail
  what: setup for the mail checks, the peer runs a stand-in relay host as in postfix_smtp_node's set (postfix submission on
    587, STARTTLS on the snakeoil certificate, SASL from dovecot for the relay account p8test-relay), and delivers mail for
    mycompany.com (hashman's team) and example.invalid (the fixture users) to the local mailbox p8testuser
  control: negative
  host: peer
  timeout: 600
  derived_from:
  - path: templates/hashman/libhashman/config.py.erb
    lines: 6-7
    text: SUPPORT_TEAM = <%= @team %>
  - path: templates/hashman/libhashman/mailutils.py.erb
    lines: '68'
    text: s = smtplib.SMTP('127.0.0.1')
  mutates: 'on the peer: installs postfix (mydestination p8test-backend.invalid, mycompany.com and example.invalid, every
    local part delivered to p8testuser through luser_relay with local_recipient_maps empty, every other destination bounced
    by default_transport error), dovecot-core and ssl-cert; creates the accounts p8testuser and p8test-relay (the latter with
    the lab Hiera fixture''s fake relay password, marked not-a-secret); enables postfix submission (587, STARTTLS may) with
    SASL from dovecot''s auth socket (a drop-in /etc/dovecot/conf.d/99-p8test.conf with disable_plaintext_auth no) and relay
    for authenticated clients only; restarts postfix and dovecot'
  probe: |
    export DEBIAN_FRONTEND=noninteractive
    debconf-set-selections <<'EOF'
    postfix postfix/main_mailer_type select Local only
    postfix postfix/mailname string p8test-backend.invalid
    EOF
    apt-get -qq -y install postfix dovecot-core ssl-cert >/dev/null 2>&1
    for u in p8testuser p8test-relay; do id "$u" >/dev/null 2>&1 || useradd -m -s /usr/sbin/nologin "$u"; done
    echo 'p8test-relay:p8test-not-a-secret' | chpasswd
    postconf -e 'inet_interfaces = all' 'default_transport = error:p8test relay relays nothing' \
      'mydestination = p8test-backend.invalid, mycompany.com, example.invalid, localhost' \
      'luser_relay = p8testuser' 'local_recipient_maps =' \
      'smtpd_tls_cert_file = /etc/ssl/certs/ssl-cert-snakeoil.pem' 'smtpd_tls_key_file = /etc/ssl/private/ssl-cert-snakeoil.key'
    postconf -M 'submission/inet=submission inet n - y - - smtpd'
    postconf -P 'submission/inet/smtpd_tls_security_level=may' 'submission/inet/smtpd_sasl_auth_enable=yes' \
      'submission/inet/smtpd_sasl_type=dovecot' 'submission/inet/smtpd_sasl_path=private/auth' \
      'submission/inet/smtpd_recipient_restrictions=permit_sasl_authenticated,reject' \
      'submission/inet/smtpd_relay_restrictions=permit_sasl_authenticated,reject'
    cat > /etc/dovecot/conf.d/99-p8test.conf <<'EOF'
    disable_plaintext_auth = no
    service auth {
      unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
      }
    }
    EOF
    systemctl restart postfix dovecot
  effect: |
    p8_listening 587
    p8_service dovecot | cut -d' ' -f1
  expect:
    rc: 0
    stdout: \A0\.0\.0\.0:587\n(\[::\]:587\n)?active\n\Z
- id: a-help-request-and-a-password-mail-leave-through-the-relay
  what: a help request posted through nginx and the mail of a non-SILENT useradd leave the node's postfix for the relay host
    on 587 (status=sent) and the queue empties; the relay host's name is pinned to the peer and a fence rejects mail ports
    to any other address
  control: negative
  timeout: 240
  derived_from:
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 213-221
    text: reqhelp_email( MAIL_FROM, SUPPORT_TEAM, subject, text.encode('utf-8') )
  - path: templates/hashman/pp_auth.py.erb
    lines: 211-216
    text: 'elif ( is_email(confirm_mail) ):'
  - path: templates/postfix_smtp_node/main.cf
    lines: '53'
    text: relayhost = <%= @relayhost %>:<%= @relayport %>
  mutates: 'on the node: appends "$PEER_ADDR mailserver.mycompany.com" to /etc/hosts (the peer''s host-only address, from
    the runner); inserts `-I OUTPUT ! -o lo -p tcp -m multiport --dports 25,465,587 ! -d $PEER_ADDR -m comment --comment p8test-mail-fence
    -j REJECT`; saves /etc/resolv.conf to /run/p8test-mail/resolv.conf.orig and points it and postfix''s chroot copy at the
    systemd-resolved stub 127.0.0.53, which answers from /etc/hosts; waits up to 10 s for the stub to answer the pin; reloads
    postfix and flushes the queue (mail hashman sent before the pin, deferred); notes the journal cursor in /run/p8test-mail/cursor;
    posts one help request (name p8test-helper) to /reqhelp through nginx; adds the hashman user p8hashmail (p8hashmail@example.invalid,
    notified at that address) with pp_auth.py useradd; waits up to 90 s for the queue to empty'
  probe: |
    grep -q ' mailserver\.mycompany\.com$' /etc/hosts || echo "$PEER_ADDR mailserver.mycompany.com" >> /etc/hosts
    iptables -I OUTPUT ! -o lo -p tcp -m multiport --dports 25,465,587 ! -d "$PEER_ADDR" -m comment --comment p8test-mail-fence -j REJECT
    install -d -m 0700 /run/p8test-mail
    cp /etc/resolv.conf /run/p8test-mail/resolv.conf.orig
    echo 'nameserver 127.0.0.53' > /etc/resolv.conf
    echo 'nameserver 127.0.0.53' > /var/spool/postfix/etc/resolv.conf
    for i in $(seq 10); do [ "$(dig +short @127.0.0.53 mailserver.mycompany.com A)" = "$PEER_ADDR" ] && break; sleep 1; done
    postfix reload 2>/dev/null
    sleep 2
    postqueue -f
    journalctl -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p' > /run/p8test-mail/cursor
    curl -sk -o /dev/null --resolve puppet.example.com:443:127.0.0.1 https://puppet.example.com/reqhelp \
      -F name=p8test-helper -F email=p8test-helper@example.invalid -F current_url=/ -F msg='p8test help request'
    cd {{LOCALDIR}}/hashman/common
    ./pp_auth.py useradd p8hashmail p8hashmail@example.invalid "P8test Mail User" p8test p8hashmail@example.invalid > /dev/null 2>&1
    for i in $(seq 90); do postqueue -p | grep -q '^Mail queue is empty' && break; sleep 1; done
  effect: |
    postqueue -p | head -1
    n=$(journalctl --after-cursor "$(cat /run/p8test-mail/cursor)" --no-pager -q -t postfix/smtp | p8_count 'relay=mailserver\.mycompany\.com\[[0-9.]+\]:587, .*status=sent')
    [ "$n" -ge 2 ] && echo "sent to the relay host: 2 or more"
  expect:
    rc: 0
    stdout: '\AMail queue is empty\nsent to the relay host: 2 or more\n\Z'
- id: the-relay-received-the-help-request-and-the-password-mail
  what: on the peer, the mailbox holds the help request (Subject 'Help request from p8test-helper', sent to hashman's team)
    and the mail addressed to the new user p8hashmail, and the submission service logged the node's login as p8test-relay
  control: negative
  host: peer
  derived_from:
  - path: templates/hashman/httpserver/httpserver.py.erb
    lines: 66-67
    text: STR_SUBJECT_BASE = 'Help request from '
  - path: templates/hashman/libhashman/mailutils.py.erb
    lines: 70-80
    text: rcpts = [ email ] + SUPPORT_TEAM
  mutates: none beyond reading the mailbox and the journal (declared mutating so it runs after the node's mail)
  probe: |
    true
  effect: |
    [ "$(grep -c '^Subject: Help request from p8test-helper$' /var/mail/p8testuser)" -ge 1 ] && echo help-request-received
    [ "$(grep -c '^To: .*p8hashmail@example\.invalid' /var/mail/p8testuser)" -ge 1 ] && echo password-mail-received
    [ "$(journalctl --no-pager -q -t postfix/smtpd | grep -c 'sasl_method=PLAIN, sasl_username=p8test-relay$')" -ge 1 ] && echo authenticated-as-p8test-relay
  expect:
    rc: 0
    stdout: \Ahelp-request-received\npassword-mail-received\nauthenticated-as-p8test-relay\n\Z
apply:
  resource_type: class
  node: puppetserver
  catalog:
    Debian:
    - class: filesystem_base
    - class: postfix_smtp_node
    - class: hashman_base
    - external: apt
    - class: nginx_base
    - class: hashman_web
  node_fixture: hashman_master_standin
  expected_run2_events:
  - Notify[Generated Upstream members for *]
