class: rsyslog_base
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: 'The shared rsyslog setup of log servers and clients: rsyslog with its GnuTLS driver installed and running, and the
  node''s Puppet CA, certificate and key copied where rsyslog (which drops to the syslog user) can read them for TLS; rsyslog
  is kept running and is restarted when its TLS material changes.'
outcomes:
- outcome: rsyslog and its GnuTLS driver are installed, and rsyslog runs and starts at boot
  from: manifests/rsyslog_base.pp:10-12, 75-80
  checks:
  - rsyslog-and-its-tls-driver-are-installed-and-running
- outcome: 'with no ssldir_override, the node''s Puppet CA, certificate and key are copied for rsyslog from the agent''s own
    ssldir (an AIO agent''s /etc/puppetlabs/puppet/ssl, local change #23), byte for byte, and form a valid identity'
  from: manifests/rsyslog_base.pp:32-35 (the undef arm; local change
  checks:
  - the-tls-files-are-the-nodes-puppet-identity
  - the-catalog-copies-from-the-agents-ssldir
  - on-redhat-a-syslog-account-with-ids-0-exists
- outcome: with ssldir_override, the copies come from the directory given
  from: manifests/rsyslog_base.pp:32-35 (the override arm)
  checks:
  - the-catalog-copies-from-the-override
- outcome: on an agent without the aio_agent_version fact (the pre-AIO packages), the copies come from /var/lib/puppet/ssl
  from: manifests/rsyslog_base.pp:32-35 (the undef arm, as at the baseline; local change
  uncovered:
    why: every lab agent is an AIO agent, and so is the production agent read on the laptop (puppet-agent 5.5.22); no lab
      node kind runs the pre-AIO packages
    lifted_by: 'capability: an agent without the aio_agent_version fact (the pre-AIO puppet packages)'
    evidence: facter aio_agent_version gives 8.24.2 on {{NODE:ubuntu}} and on {{NODE:rhel9}} (2026-11-24), each with puppet
      config print ssldir /etc/puppetlabs/puppet/ssl; {{SITE:node-inventory-file}} lists no pre-AIO agent; {{SITE:project-instructions}}
      records the laptop's agent as puppet-agent 5.5.22
- outcome: the user rsyslog drops to (syslog) can read the key, and other users cannot
  from: manifests/rsyslog_base.pp:41-47, 65-71
  checks:
  - rsyslog-can-read-the-key-as-the-user-it-runs-as
- outcome: a stopped rsyslog runs again after the next agent run
  from: manifests/rsyslog_base.pp:75-80 (ensure => running)
  checks:
  - rsyslog-is-stopped
  - the-next-agent-run-starts-rsyslog-again
- outcome: a change to the TLS directory restarts rsyslog at the next agent run
  from: manifests/rsyslog_base.pp:73-80 (subscribe)
  checks:
  - the-tls-directory-drifts
  - the-agent-run-restores-the-directory-and-restarts-rsyslog
- outcome: a change to a TLS file (a renewed certificate) restarts rsyslog once at the next agent run
  from: manifests/rsyslog_base.pp:73 (comment "reload it whenever the TLS files change"); HQ batch-10 ruling 5
  checks:
  - a-tls-file-changes
  - the-agent-run-restores-the-file-and-restarts-rsyslog-once
- outcome: on RedHat, a syslog user and group (uid/gid 0) exist for the copied files' ownership
  from: manifests/rsyslog_base.pp:14-28
  checks:
  - on-redhat-a-syslog-account-with-ids-0-exists
variants:
- name: rhel
  why: the RedHat branch (the syslog user and group with uid/gid 0), on the rhel9 node with the set's own params fixture
  node: rhel9
- name: override
  why: the override arm, with an ssldir_override whose text differs from the default so the catalog shows the arm taken
  params: override
node_agent:
  after:
  - rsyslog-is-stopped
  - the-tls-directory-drifts
  - a-tls-file-changes
  why: the class keeps rsyslog running and restarts it when the TLS directory resource changes, which only its next agent
    run after each change can show
checks:
- id: rsyslog-and-its-tls-driver-are-installed-and-running
  what: rsyslog and rsyslog-gnutls are installed, the gtls network stream driver is present, rsyslog runs and is enabled
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 10-12
    text: 'package { [''rsyslog'', ''rsyslog-gnutls'']:'
  - path: manifests/rsyslog_base.pp
    lines: 75-80
    text: 'service { ''rsyslog'':'
  probe: |
    dpkg-query -W -f '${Package} ${Status}\n' rsyslog rsyslog-gnutls
    ls /usr/lib/*/rsyslog/lmnsd_gtls.so | wc -l
    systemctl is-active rsyslog; systemctl is-enabled rsyslog
  expect:
    rc: 0
    stdout: \Arsyslog install ok installed\nrsyslog-gnutls install ok installed\n1\nactive\nenabled\n\Z
- id: the-tls-files-are-the-nodes-puppet-identity
  what: /etc/rsyslog.d/tls holds the node's Puppet CA, certificate and key byte for byte, owned by syslog with the key 0600,
    and the certificate verifies against that CA
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 32-35
    text: $ssldir = $ssldir_override ? {
  - path: manifests/rsyslog_base.pp
    lines: 49-71
    text: source  => "${ssldir}/private_keys/${certname}.pem",
  probe: |
    s=/etc/puppetlabs/puppet/ssl; c=$(hostname); t=/etc/rsyslog.d/tls
    cmp -s $s/certs/ca.pem $t/ca.pem && cmp -s $s/certs/$c.pem $t/$c.pem && cmp -s $s/private_keys/$c.pem $t/$c.key && echo same-as-puppet
    stat -c '%U:%G %a' $t $t/ca.pem $t/$c.pem $t/$c.key
    openssl verify -CAfile $t/ca.pem $t/$c.pem | sed 's/^.*: //'
  mismatch:
    varies: the CA (the system bundle instead of the copied Puppet CA), which did not sign the node's certificate
    probe: |
      s=/etc/puppetlabs/puppet/ssl; c=$(hostname); t=/etc/rsyslog.d/tls
      cmp -s $s/certs/ca.pem $t/ca.pem && cmp -s $s/certs/$c.pem $t/$c.pem && cmp -s $s/private_keys/$c.pem $t/$c.key && echo same-as-puppet
      stat -c '%U:%G %a' $t $t/ca.pem $t/$c.pem $t/$c.key
      openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt $t/$c.pem 2>&1 | tail -1 | sed 's/^.*: //'
  expect:
    rc: 0
    stdout: \Asame-as-puppet\nsyslog:syslog 755\nsyslog:syslog 644\nsyslog:syslog 644\nsyslog:syslog 600\nOK\n\Z
- id: the-catalog-copies-from-the-agents-ssldir
  what: with no ssldir_override, the agent's catalog takes the three TLS files from /etc/puppetlabs/puppet/ssl, the AIO agent's
    ssldir
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 32-35
    text: undef   => '/var/lib/puppet/ssl',
  - path: manifests/rsyslog_base.pp
    lines: 49-71
    text: source  => "${ssldir}/certs/${certname}.pem",
  probe: |
    c=$(hostname)
    python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); [print(r["title"], r["parameters"].get("source")) for r in d["resources"] if r["type"] == "File" and r["title"].startswith("/etc/rsyslog.d/tls/")]' /opt/puppetlabs/puppet/cache/client_data/catalog/$c.json | sed "s/$c/NODE/g" | sort
  expect:
    rc: 0
    stdout: \A/etc/rsyslog\.d/tls/NODE\.key /etc/puppetlabs/puppet/ssl/private_keys/NODE\.pem\n/etc/rsyslog\.d/tls/NODE\.pem
      /etc/puppetlabs/puppet/ssl/certs/NODE\.pem\n/etc/rsyslog\.d/tls/ca\.pem /etc/puppetlabs/puppet/ssl/certs/ca\.pem\n\Z
- id: the-catalog-copies-from-the-override
  what: with ssldir_override /etc/puppetlabs/puppet/./ssl, the catalog takes the three TLS files from that path as given,
    and the copies are the node's Puppet identity byte for byte
  control: negative
  variant: override
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 32-35
    text: default => $ssldir_override,
  - path: manifests/rsyslog_base.pp
    lines: 49-71
    text: source  => "${ssldir}/private_keys/${certname}.pem",
  probe: |
    c=$(hostname); s=/etc/puppetlabs/puppet/ssl; t=/etc/rsyslog.d/tls
    python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); [print(r["title"], r["parameters"].get("source")) for r in d["resources"] if r["type"] == "File" and r["title"].startswith("/etc/rsyslog.d/tls/")]' /opt/puppetlabs/puppet/cache/client_data/catalog/$c.json | sed "s/$c/NODE/g" | sort
    cmp -s $s/certs/ca.pem $t/ca.pem && cmp -s $s/certs/$c.pem $t/$c.pem && cmp -s $s/private_keys/$c.pem $t/$c.key && echo same-as-puppet
  expect:
    rc: 0
    stdout: \A/etc/rsyslog\.d/tls/NODE\.key /etc/puppetlabs/puppet/\./ssl/private_keys/NODE\.pem\n/etc/rsyslog\.d/tls/NODE\.pem
      /etc/puppetlabs/puppet/\./ssl/certs/NODE\.pem\n/etc/rsyslog\.d/tls/ca\.pem /etc/puppetlabs/puppet/\./ssl/certs/ca\.pem\nsame-as-puppet\n\Z
- id: rsyslog-can-read-the-key-as-the-user-it-runs-as
  what: rsyslog drops its privileges to the syslog user (Ubuntu's rsyslog.conf), and that user can read the key and certificate
    it needs for TLS
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 65-71
    text: 'file { "/etc/rsyslog.d/tls/${certname}.key":'
  - path: manifests/rsyslog_base.pp
    lines: 41-47
    text: owner   => 'syslog',
  probe: |
    grep -E '^\$PrivDropToUser ' /etc/rsyslog.conf
    ps -o user= -C rsyslogd | sort -u
    c=$(hostname)
    runuser -u syslog -- openssl pkey -in /etc/rsyslog.d/tls/$c.key -noout 2>/dev/null && echo key-readable-by-syslog
  mismatch:
    varies: the user (nobody instead of syslog), whom the key's 0600 syslog ownership must keep out
    probe: |
      grep -E '^\$PrivDropToUser ' /etc/rsyslog.conf
      ps -o user= -C rsyslogd | sort -u
      c=$(hostname)
      runuser -u nobody -- openssl pkey -in /etc/rsyslog.d/tls/$c.key -noout 2>/dev/null && echo key-readable-by-syslog
  expect:
    rc: 0
    stdout: \A\$PrivDropToUser syslog\nsyslog\nkey-readable-by-syslog\n\Z
- id: rsyslog-is-stopped
  what: setup for the next check, rsyslog stopped by hand (drift)
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 75-80
    text: ensure    => running,
  mutates: stops syslog.socket and the rsyslog service on the node
  probe: |
    systemctl stop syslog.socket rsyslog
  effect: |
    systemctl is-active rsyslog
  expect:
    rc: 3
    stdout: \Ainactive\n\Z
- id: the-next-agent-run-starts-rsyslog-again
  what: after the node's agent run, rsyslog runs again (the class keeps it running), with its TLS material in place
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 75-80
    text: ensure    => running,
  mutates: none beyond reading the service state (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    systemctl is-active rsyslog
    test -s "/etc/rsyslog.d/tls/$(hostname).key" && echo tls-in-place
  expect:
    rc: 0
    stdout: \Aactive\ntls-in-place\n\Z
- id: the-tls-directory-drifts
  what: setup for the next check, the TLS directory's mode changed by hand (drift), with rsyslog's process id noted
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 41-47
    text: 'file { ''/etc/rsyslog.d/tls'':'
  mutates: notes rsyslog's main PID in /run/p8test-rsyslog/pid, then chmod 0700 /etc/rsyslog.d/tls on the node
  probe: |
    install -d -m 0700 /run/p8test-rsyslog
    systemctl show -p MainPID --value rsyslog > /run/p8test-rsyslog/pid
    chmod 0700 /etc/rsyslog.d/tls
  effect: |
    stat -c '%a' /etc/rsyslog.d/tls
    test -s /run/p8test-rsyslog/pid && echo pid-noted
  expect:
    rc: 0
    stdout: \A700\npid-noted\n\Z
- id: the-agent-run-restores-the-directory-and-restarts-rsyslog
  what: after the node's agent run, the directory is back to 0755 and rsyslog was restarted (a new main PID), running
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 73-80
    text: subscribe => File['/etc/rsyslog.d/tls'],
  - path: manifests/rsyslog_base.pp
    lines: 41-47
    text: mode    => '0755',
  mutates: none beyond reading the directory and rsyslog's state (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    stat -c '%a' /etc/rsyslog.d/tls
    now=$(systemctl show -p MainPID --value rsyslog)
    [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$(cat /run/p8test-rsyslog/pid)" ] && echo restarted
    systemctl is-active rsyslog
  expect:
    rc: 0
    stdout: \A755\nrestarted\nactive\n\Z
- id: a-tls-file-changes
  what: setup for the next check, the copied CA file changed by hand (as a renewal changes it), with rsyslog's process id
    and the time noted
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 49-55
    text: 'file { ''/etc/rsyslog.d/tls/ca.pem'':'
  mutates: notes rsyslog's main PID and its journal cursor in /run/p8test-rsyslog/before, then appends a comment line to /etc/rsyslog.d/tls/ca.pem
    on the node
  probe: |
    install -d -m 0700 /run/p8test-rsyslog
    printf "pid='%s'\ncursor='%s'\n" "$(systemctl show -p MainPID --value rsyslog)" "$(journalctl -u rsyslog -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p')" > /run/p8test-rsyslog/before
    echo '# p8test drift' >> /etc/rsyslog.d/tls/ca.pem
  effect: |
    grep -c '^# p8test drift$' /etc/rsyslog.d/tls/ca.pem
    test -s /run/p8test-rsyslog/before && echo noted
  expect:
    rc: 0
    stdout: \A1\nnoted\n\Z
- id: the-agent-run-restores-the-file-and-restarts-rsyslog-once
  what: after the node's agent run, the CA file is the Puppet CA again and rsyslog was restarted exactly once since the change
    (a new main PID; one start in its journal)
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 49-55
    text: source  => "${ssldir}/certs/ca.pem",
  - path: manifests/rsyslog_base.pp
    lines: '73'
    text: '# Keep rsyslog running and reload it whenever the TLS files change.'
  mutates: none beyond reading the file, rsyslog's state and its journal (declared mutating so it runs after the node's agent
    run)
  probe: |
    true
  effect: |
    cmp -s /etc/puppetlabs/puppet/ssl/certs/ca.pem /etc/rsyslog.d/tls/ca.pem && echo ca-restored
    . /run/p8test-rsyslog/before
    now=$(systemctl show -p MainPID --value rsyslog)
    [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$pid" ] && echo restarted
    journalctl -u rsyslog --after-cursor "$cursor" --no-pager -q | grep -c 'Started rsyslog.service'
  expect:
    rc: 0
    stdout: \Aca-restored\nrestarted\n1\n\Z
- id: on-redhat-a-syslog-account-with-ids-0-exists
  variant: rhel
  what: on RedHat the syslog group (gid 0) and the syslog user (uid 0) exist, the TLS files are the node's Puppet CA, certificate
    and key byte for byte, owned by them (ids 0) with the key 0600, rsyslog runs, as root (RHEL's rsyslog drops no privileges),
    so it can read the key
  control: negative
  derived_from:
  - path: manifests/rsyslog_base.pp
    lines: 16-28
    text: 'user { ''syslog'':'
  - path: manifests/rsyslog_base.pp
    lines: 16-28
    text: gid       => 0,
  - path: manifests/rsyslog_base.pp
    lines: 49-71
    text: source  => "${ssldir}/private_keys/${certname}.pem",
  probe: |
    getent group syslog | cut -d: -f1,3
    getent passwd syslog | cut -d: -f1,3
    s=/etc/puppetlabs/puppet/ssl; c=$(hostname); t=/etc/rsyslog.d/tls
    cmp -s $s/certs/ca.pem $t/ca.pem && cmp -s $s/certs/$c.pem $t/$c.pem && cmp -s $s/private_keys/$c.pem $t/$c.key && echo same-as-puppet
    stat -c '%u:%g %a' $t $t/ca.pem $t/$c.pem $t/$c.key
    systemctl is-active rsyslog
    ps -o user= -C rsyslogd | sort -u
  expect:
    rc: 0
    stdout: \Asyslog:0\nsyslog:0\nsame-as-puppet\n0:0 755\n0:0 644\n0:0 644\n0:0 600\nactive\nroot\n\Z
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: rsyslog_base
    RedHat:
    - class: rsyslog_base
