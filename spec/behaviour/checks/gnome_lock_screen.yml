class: gnome_lock_screen
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'Enforces a GNOME screen lock policy through the system dconf database: the session goes idle after the timeout (5
  minutes by default), the screen locks with no grace period, and users cannot change these settings.'
outcomes:
- outcome: dconf-cli is installed and the dconf profile stacks the user database over the system database local
  from: manifests/gnome_lock_screen.pp:11-45
  checks:
  - dconf-cli-installed
  - profile-uses-system-db-local
- outcome: the system database sets idle-delay 300 (5 minutes), lock-enabled true and lock-delay 0, compiled by dconf update
  from: manifests/gnome_lock_screen.pp:5-9, 47-78, 94-98
  checks:
  - keyfile-and-locks-rendered
  - compiled-db-serves-the-policy
- outcome: a user cannot override the three locked keys, while a key the class does not lock stays writable
  from: manifests/gnome_lock_screen.pp:1-3, 55-61, 80-92
  checks:
  - keyfile-and-locks-rendered
  - a-user-cannot-override-the-locked-keys
- outcome: a GNOME session that goes idle locks after the idle time and the grace period, and sees the policy as not writable
  from: manifests/gnome_lock_screen.pp:1-3, 5-9, 63-92
  checks:
  - a-gnome-session-locks-after-the-idle-time
- outcome: another timeout or grace period
  from: manifests/gnome_lock_screen.pp:5-6
  checks:
  - another-timeout-and-grace-period-are-served
variants:
- name: timing
  why: another timeout and grace period, which a production node sets ({{SITE:fleet-usage}}, 1 statement each)
  params: timing
- name: gnome
  why: the class on a GNOME desktop (node gnome, Ubuntu 24.04 desktop), where a real session locks; with a 1-minute timeout
    and a 10 s grace, so the lock cannot be stock GNOME's own (idle-delay 300, lock-delay 0, the class's defaults)
  node: gnome
  params: gnome
checks:
- id: dconf-cli-installed
  what: the dconf-cli package is installed
  control: negative
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: 11-13
    text: 'package { ''dconf-cli'':'
  probe: dpkg-query -W -f='${Status}\n' dconf-cli 2>&1
  expect:
    rc: 0
    stdout: \Ainstall ok installed\n\Z
- id: profile-uses-system-db-local
  what: the dconf profile `user` stacks the user db over the system db `local`, 0644 root:root
  control: negative
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: 38-45
    text: content => "user-db:user\nsystem-db:local\n",
  probe: |
    stat -c '%a %U %G' /etc/dconf/profile/user
    cat /etc/dconf/profile/user
  expect:
    rc: 0
    stdout: \A644 root root\nuser-db:user\nsystem-db:local\n\Z
- id: keyfile-and-locks-rendered
  what: the keyfile sets idle-delay 300, lock-enabled true, lock-delay 0, and the locks file locks exactly those three keys
  control: negative
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: 5-9
    text: $screenlock_timeout_seconds = $screenlock_timeout_minutes * 60
  - path: manifests/gnome_lock_screen.pp
    lines: 63-75
    text: idle-delay=uint32 ${screenlock_timeout_seconds}
  - path: manifests/gnome_lock_screen.pp
    lines: 80-89
    text: /org/gnome/desktop/screensaver/lock-delay
  probe: |
    cat /etc/dconf/db/local.d/00-screenlock
    echo ---
    cat /etc/dconf/db/local.d/locks/00-screenlock
  expect:
    rc: 0
    stdout: \A\[org/gnome/desktop/session\]\nidle-delay=uint32 300\n\n\[org/gnome/desktop/screensaver\]\nlock-enabled=true\nlock-delay=uint32
      0\n---\n/org/gnome/desktop/session/idle-delay\n/org/gnome/desktop/screensaver/lock-enabled\n/org/gnome/desktop/screensaver/lock-delay\n\Z
- id: compiled-db-serves-the-policy
  what: the compiled system database answers the three keys with the class's values (dconf update ran)
  control: negative
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: 94-98
    text: command     => '/usr/bin/dconf update',
  - path: manifests/gnome_lock_screen.pp
    lines: 63-78
    text: notify  => Exec['dconf_update_screenlock'],
  probe: |
    for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
      DCONF_PROFILE=user /usr/bin/dconf read "$k"
    done
  mismatch:
    varies: 'the dconf profile: a profile name that does not exist has no system-db:local line, so the values cannot come
      from the compiled system database and the three reads must not return the class''s values'
    probe: |
      for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
        DCONF_PROFILE=p8-phase3-absent-profile /usr/bin/dconf read "$k"
      done
  expect:
    rc: 0
    stdout: \Auint32 300\ntrue\nuint32 0\n\Z
- id: a-user-cannot-override-the-locked-keys
  what: a desktop account, in its own D-Bus session, writes each of the three locked keys and text-scaling-factor (not locked);
    read afterwards, its own user database holds only text-scaling-factor (the locked writes never landed), and the three
    keys it is served still read the class's values
  control: negative
  timeout: 300
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: 80-92
    text: /org/gnome/desktop/session/idle-delay
  - path: manifests/gnome_lock_screen.pp
    lines: 1-3
    text: '# Enforce GNOME screen lock policy using system dconf settings.'
  mutates: installs dconf-service if absent (the dconf writer a GNOME desktop has), creates the account p8testdesk, and as
    it runs four dconf writes (the three locked keys and one unlocked key) in a dbus-run-session (its own user database under
    ~/.config/dconf); the writer's own report goes to /run/p8test-dconf/user.txt, and a profile holding only the user database
    to /run/p8test-dconf/userdb-only
  probe: |
    dpkg-query -W -f '${Status}' dconf-service 2>/dev/null | grep -q 'install ok installed' || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install dconf-service >/dev/null 2>&1
    id p8testdesk >/dev/null 2>&1 || useradd -m -s /bin/bash p8testdesk
    install -d -m 0755 /run/p8test-dconf
    cd /tmp && runuser -u p8testdesk -- dbus-run-session -- sh -c '
      for kv in "session/idle-delay uint32 9999" "screensaver/lock-enabled false" "screensaver/lock-delay uint32 600"; do
        set -- $kv; k=/org/gnome/desktop/$1; shift
        if dconf write "$k" "$*" 2>/dev/null; then echo "$k written"; else echo "$k refused"; fi
      done
      if dconf write /org/gnome/desktop/interface/text-scaling-factor 1.25 2>/dev/null; then echo "unlocked key written"; else echo "unlocked key refused"; fi
      for k in session/idle-delay screensaver/lock-enabled screensaver/lock-delay interface/text-scaling-factor; do echo "$k $(dconf read /org/gnome/desktop/$k)"; done
    ' > /run/p8test-dconf/user.txt 2>/dev/null
    printf 'user-db:user\n' > /run/p8test-dconf/userdb-only
  effect: |
    for k in session/idle-delay screensaver/lock-enabled screensaver/lock-delay interface/text-scaling-factor; do
      echo "user database $k: $(runuser -u p8testdesk -- env DCONF_PROFILE=/run/p8test-dconf/userdb-only dconf read /org/gnome/desktop/$k)"
    done
    for k in session/idle-delay screensaver/lock-enabled screensaver/lock-delay; do
      echo "served $k: $(runuser -u p8testdesk -- env DCONF_PROFILE=user dconf read /org/gnome/desktop/$k)"
    done
  expect:
    rc: 0
    stdout: '\Auser database session/idle-delay: \nuser database screensaver/lock-enabled: \nuser database screensaver/lock-delay:
      \nuser database interface/text-scaling-factor: 1\.25\nserved session/idle-delay: uint32 300\nserved screensaver/lock-enabled:
      true\nserved screensaver/lock-delay: uint32 0\n\Z'
- id: another-timeout-and-grace-period-are-served
  variant: timing
  what: with a 10-minute timeout and a 30-second grace period the compiled system database answers idle-delay 600, lock-enabled
    true and lock-delay 30
  control: negative
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: 1-9
    text: $screenlock_timeout_seconds = $screenlock_timeout_minutes * 60
  - path: manifests/gnome_lock_screen.pp
    lines: 94-98
    text: command     => '/usr/bin/dconf update',
  probe: |
    for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
      DCONF_PROFILE=user /usr/bin/dconf read "$k"
    done
  mismatch:
    varies: 'the dconf profile: a profile name that does not exist has no system-db:local line, so the values cannot come
      from the compiled system database and the three reads must not return the variant''s values'
    probe: |
      for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
        DCONF_PROFILE=p8-phase3-absent-profile /usr/bin/dconf read "$k"
      done
  expect:
    rc: 0
    stdout: \Auint32 600\ntrue\nuint32 30\n\Z
- id: a-gnome-session-locks-after-the-idle-time
  variant: gnome
  what: p8testuser, logged in to GNOME through GDM's automatic login (as the test-asset fixture p8test_desktop_login does)
    and left idle, is locked by GNOME (logind's LockedHint) while the session is under 300 s old, so by the class's 1 minute
    and 10 s, not stock GNOME's 5 minutes; inside the session GSettings serves idle-delay 60, lock-enabled true and lock-delay
    10, none of them writable
  control: negative
  timeout: 600
  derived_from:
  - path: manifests/gnome_lock_screen.pp
    lines: '1'
    text: '# Enforce GNOME screen lock policy using system dconf settings.'
  - path: manifests/gnome_lock_screen.pp
    lines: '9'
    text: $screenlock_timeout_seconds = $screenlock_timeout_minutes * 60
  - path: manifests/gnome_lock_screen.pp
    lines: 70-74
    text: lock-delay=uint32 ${screenlock_grace_seconds}
  - path: manifests/gnome_lock_screen.pp
    lines: 86-88
    text: /org/gnome/desktop/screensaver/lock-enabled
  mutates: creates the account p8testuser, turns on GDM's automatic login for it in /etc/gdm3/custom.conf (the original kept
    under /run/p8test-gnome and put back once the session runs), restarts gdm3 so the session starts, and waits for the session
    to lock (up to 120 s for the session, then up to 240 s)
  probe: |
    install -d -m 0755 /run/p8test-gnome
    id p8testuser >/dev/null 2>&1 || useradd -m -s /bin/bash p8testuser
    conf=/etc/gdm3/custom.conf
    cp "$conf" /run/p8test-gnome/custom.conf.orig
    sed -i -e '/^AutomaticLogin/d' -e 's/^\[daemon\]$/[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=p8testuser/' "$conf"
    systemctl restart gdm3
    s=
    for i in $(seq 120); do
      s=$(loginctl list-sessions --no-legend | awk '$3 == "p8testuser" {print $1}' | head -1)
      [ -n "$s" ] && [ "$(loginctl show-session "$s" -p Class --value)" = user ] && break
      sleep 1
    done
    cp /run/p8test-gnome/custom.conf.orig "$conf"
    for i in $(seq 48); do [ "$(loginctl show-session "$s" -p LockedHint --value 2>/dev/null)" = yes ] && break; sleep 5; done
  effect: |
    s=$(loginctl list-sessions --no-legend | awk '$3 == "p8testuser" {print $1}' | head -1)
    echo "locked: $(loginctl show-session "$s" -p LockedHint --value 2>/dev/null)"
    start=$(loginctl show-session "$s" -p TimestampMonotonic --value 2>/dev/null)
    awk -v s="${start:-0}" '{age = $1 - s / 1000000; print "session under 300 s old: " ((0 < s && age < 300) ? "yes" : "no")}' /proc/uptime
    bus="unix:path=/run/user/$(id -u p8testuser 2>/dev/null)/bus"
    for k in "session idle-delay" "screensaver lock-enabled" "screensaver lock-delay"; do
      set -- $k
      echo "$2: $(runuser -u p8testuser -- env DBUS_SESSION_BUS_ADDRESS="$bus" gsettings get org.gnome.desktop.$1 $2 2>/dev/null), writable $(runuser -u p8testuser -- env DBUS_SESSION_BUS_ADDRESS="$bus" gsettings writable org.gnome.desktop.$1 $2 2>/dev/null)"
    done
  expect:
    rc: 0
    stdout: '\Alocked: yes\nsession under 300 s old: yes\nidle-delay: uint32 60, writable false\nlock-enabled: true, writable
      false\nlock-delay: uint32 10, writable false\n\Z'
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: gnome_lock_screen
