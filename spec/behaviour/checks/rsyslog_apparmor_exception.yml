class: rsyslog_apparmor_exception
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: Lets the AppArmor-confined rsyslogd write logs to a custom directory outside the stock profile's paths, by adding
  a local profile exception for that directory and reloading the profile and rsyslog.
outcomes:
- outcome: the local exception grants logs_dir, and the reloaded rsyslogd profile carries it
  from: manifests/rsyslog_apparmor_exception.pp:6-17
  checks:
  - local-exception-file
  - profile-compiles-with-the-exception
- outcome: rsyslogd keeps running confined after the reload chain
  from: manifests/rsyslog_apparmor_exception.pp:15-19
  checks:
  - rsyslogd-confined-and-running
- outcome: the confined rsyslogd writes a log routed into logs_dir, while a directory outside the exception stays denied
  from: manifests/rsyslog_apparmor_exception.pp:1, 11
  checks:
  - confined-rsyslogd-writes-to-logs-dir
  - a-directory-outside-the-exception-stays-denied
checks:
- id: local-exception-file
  what: the profile's local include grants rw on logs_dir and rwk below it, root:root 0644
  control: negative
  derived_from:
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: 6-10
    text: 'file { ''/etc/apparmor.d/local/usr.sbin.rsyslogd'':'
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: '11'
    text: content => "${logs_dir}/ rw,\n${logs_dir}/** rwk,\n",
  probe: |
    stat -c '%U %G %a' /etc/apparmor.d/local/usr.sbin.rsyslogd
    cat /etc/apparmor.d/local/usr.sbin.rsyslogd
  expect:
    rc: 0
    stdout: \Aroot root 644\n/srv/p8test-logs/ rw,\n/srv/p8test-logs/\*\* rwk,\n\Z
- id: profile-compiles-with-the-exception
  what: the rsyslogd profile, preprocessed with its includes, carries the exception's rules
  control: negative
  derived_from:
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: '16'
    text: command     => '/sbin/apparmor_parser -r /etc/apparmor.d/usr.sbin.rsyslogd',
  probe: |
    /sbin/apparmor_parser -p /etc/apparmor.d/usr.sbin.rsyslogd | grep -F '/srv/p8test-logs/'
  expect:
    rc: 0
    stdout: \A\s*/srv/p8test-logs/ rw,\n\s*/srv/p8test-logs/\*\* rwk,\n\Z
- id: rsyslogd-confined-and-running
  what: after the reload chain (apparmor_parser -r, then Service['rsyslog'] notified) rsyslogd runs, confined in enforce mode
  control: invariant
  why_invariant: the stock node already runs rsyslogd under its enforcing profile; the class must keep it so (a failed reload
    or restart would break it)
  derived_from:
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: 15-19
    text: notify      => Service['rsyslog'],
  probe: |
    systemctl is-active rsyslog
    cat "/proc/$(systemctl show -p MainPID --value rsyslog)/attr/current"
  expect:
    rc: 0
    stdout: \Aactive\nrsyslogd \(enforce\)\n\Z
- id: confined-rsyslogd-writes-to-logs-dir
  what: 'the exercise: a log rule pointing into logs_dir makes the confined rsyslogd write there (the custom log path the
    class exists for)'
  control: negative
  derived_from:
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: '1'
    text: '# Adds an AppArmor local exception for rsyslog to write to a custom log path.'
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: '11'
    text: content => "${logs_dir}/ rw,\n${logs_dir}/** rwk,\n",
  mutates: creates /srv/p8test-logs (owner syslog, rsyslogd's runtime user), adds /etc/rsyslog.d/99-p8test.conf routing the
    tag p8test to /srv/p8test-logs/p8test.log, restarts rsyslog, sends one message with logger -t p8test (rsyslog logs its
    restart to /var/log/syslog)
  probe: |
    install -d -o syslog -g adm -m 0750 /srv/p8test-logs
    printf ':syslogtag, isequal, "p8test:" /srv/p8test-logs/p8test.log\n& stop\n' > /etc/rsyslog.d/99-p8test.conf
    systemctl restart rsyslog && sleep 1 && logger -t p8test p8test-apparmor-marker && sleep 2
  effect: |
    grep -c 'p8test-apparmor-marker' /srv/p8test-logs/p8test.log
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: a-directory-outside-the-exception-stays-denied
  what: the same rsyslogd, routed into /srv/p8test-other (owned by syslog like logs_dir, but outside the exception), writes
    nothing there, and the kernel logs an AppArmor denial for rsyslogd on that path
  control: negative
  derived_from:
  - path: manifests/rsyslog_apparmor_exception.pp
    lines: '11'
    text: content => "${logs_dir}/ rw,\n${logs_dir}/** rwk,\n",
  mutates: creates /srv/p8test-other (owner syslog), adds /etc/rsyslog.d/98-p8test-other.conf routing the tag p8testother
    to /srv/p8test-other/p8test.log, restarts rsyslog, sends one message with logger -t p8testother (the kernel logs the AppArmor
    denial to the journal and /var/log/kern.log; rsyslog logs its restart to /var/log/syslog)
  probe: |
    install -d -o syslog -g adm -m 0750 /srv/p8test-other
    printf ':syslogtag, isequal, "p8testother:" /srv/p8test-other/p8test.log\n& stop\n' > /etc/rsyslog.d/98-p8test-other.conf
    systemctl restart rsyslog && sleep 1 && logger -t p8testother p8test-other-marker && sleep 2
  effect: |
    test -e /srv/p8test-other/p8test.log && echo "written" || echo "not written"
    journalctl -k --no-pager -o cat | grep 'apparmor="DENIED"' | grep 'profile="rsyslogd"' | p8_count 'name="/srv/p8test-other/'
  expect:
    rc: 0
    stdout: \Anot written\n[1-9]\d*\n\Z
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: rsyslog_base
    - class: rsyslog_apparmor_exception
