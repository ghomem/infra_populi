class: user_base
baseline: release-0.9.10 (cf477c6)
fixture: params
node_agent:
  after:
  - an-out-of-band-key-is-planted
  - ecryptfs-the-wrapped-passphrase-is-damaged-out-of-band
  why: purge_ssh_keys removes a key Puppet does not manage only on the next agent run after it appears
purpose: 'A base wrapper for a system user: the account with its own same-named primary group, comment, home and shell, the
  given password hash (refusing an empty one), and SSH access through exactly one pushed key (any other authorized key is
  purged; a locked or keyless user gets an unusable key; with ignorekey, for encrypted homes, no key is pushed), with optional
  home mode and ecryptfs wrapped passphrase.'
outcomes:
- outcome: the account exists with its own primary group, comment, home (created, owned by the user) and shell, and no other
    group with an empty list
  from: manifests/user_base.pp:6-15, 24-37, 63-74
  checks:
  - user-and-own-primary-group
  - no-supplementary-groups
  - home-created-and-owned
- outcome: the given password hash is set, so the password logs in and a wrong one is refused
  from: manifests/user_base.pp:63-72
  checks:
  - password-hash-set
  - the-password-logs-in-and-a-wrong-one-is-refused
- outcome: an empty password hash is refused, so no account is created without one
  from: manifests/user_base.pp:19-22
  uncovered:
    why: 'a refusal at compile time (fail()): a variant run whose apply is refused ends APPLY_FAILED, never a check; shown
      by {{SITE:harness}} --compile-only with myhash '''' on 2026-11-19T17:23:25Z: COMPILE_FAILED, "Can''t touch this - hash
      is empty! Where is the user database?"'
    lifted_by: 'capability: a variant run whose expected outcome is a compile refusal'
    evidence: '{{SITE:engine-runner}} run_locked: a red harness is APPLY_FAILED and no applied check runs; the compile-only
      run above shows the refusal'
- outcome: the given key is pushed as the user's only authorized key, and a key added out of band is purged by the next agent
    run
  from: manifests/user_base.pp:56-59, 72, 93-102
  checks:
  - the-pushed-key-is-the-only-authorized-key
  - an-out-of-band-key-is-planted
  - the-agent-run-purges-the-out-of-band-key
- outcome: a login with the pushed key
  from: manifests/user_base.pp:93-102
  checks:
  - the-pushed-key-logs-in
  - another-key-is-refused
- outcome: a locked hash or an empty key pushes an unusable key; a group list sets the primary group; another home, home mode
    or shell
  from: manifests/user_base.pp:4, 8-15, 24-31, 41-61, 81-91
  checks:
  - a-locked-hash-with-other-home-shell-and-groups
  - an-empty-key-pushes-an-unusable-key
- outcome: with ignorekey true (for encrypted homes) no key is pushed, so the account has no authorized key
  from: manifests/user_base.pp:72, 93-102
  checks:
  - with-ignorekey-no-key-is-pushed
- outcome: the ecryptfs branch (wrapped passphrase written from the .b64 file, with the HQ-ruled exec guard)
  from: manifests/user_base.pp:104-135
  checks:
  - ecryptfs-the-wrapped-passphrase-is-pushed
  - ecryptfs-the-login-password-unwraps-the-mount-passphrase
  - ecryptfs-the-pushed-passphrase-opens-the-home
  - ecryptfs-the-wrapped-passphrase-is-damaged-out-of-band
  - ecryptfs-the-agent-run-repairs-it
variants:
- name: locked
  why: a locked hash, a group list, another home, home mode and shell; production's users are declared in the passwd/ layer,
    which the engine never reads, so whether production uses them is undeterminable and they are tested
  params: locked
- name: emptykey
  why: an empty key (undeterminable production use, as above)
  params: emptykey
- name: ignorekey
  why: ignorekey true, which user_sudoer, user_desktop and user_desktop_sudoer forward (undeterminable production use, as
    above); the base fixture with only ignorekey changed
  params: ignorekey
- name: ecryptfs
  node: kubuntu
  params: ecryptfs
  node_fixture: p8test_ecryptfs_home
  why: 'company laptops use encrypted homes (HQ 2026-11-27 item 4): the user''s ecryptfs private directory, made by the node
    fixture as ecryptfs-setup-private makes it, gets the given wrapped passphrase'
checks:
- id: user-and-own-primary-group
  what: the user exists with its own same-named primary group, the comment, /home/<title> and /bin/bash
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 25-31
    text: $myprimary = $title
  - path: manifests/user_base.pp
    lines: 35-37
    text: 'group { $myusername:'
  - path: manifests/user_base.pp
    lines: 63-74
    text: gid            => $myprimary,
  - path: manifests/user_base.pp
    lines: 8-15
    text: $myhomedir = "/home/${myusername}"
  probe: |
    IFS=: read -r name _ uid gid gecos home shell < <(getent passwd p8testuser)
    echo "$name|$gecos|$home|$shell"
    echo "primary group: $(getent group "$gid" | cut -d: -f1)"
  expect:
    rc: 0
    stdout: '\Ap8testuser\|P8 Test User\|/home/p8testuser\|/bin/bash\nprimary group: p8testuser\n\Z'
- id: no-supplementary-groups
  what: with an empty group list the user is in no other group than its own
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 63-66
    text: groups         => $mygrouplist ,
  probe: id -nG p8testuser
  expect:
    rc: 0
    stdout: \Ap8testuser\n\Z
- id: home-created-and-owned
  what: the home directory is created (managehome) and owned by the user
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 63-70
    text: managehome     => true,
  probe: stat -c '%U %G %F' /home/p8testuser
  expect:
    rc: 0
    stdout: \Ap8testuser p8testuser directory\n\Z
- id: password-hash-set
  what: the shadow entry carries the fixture's SHA-512 hash (asserted by algorithm and salt only)
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 19-22
    text: fail ( 'Can\'t touch this - hash is empty! Where is the user database?' )
  - path: manifests/user_base.pp
    lines: 63-72
    text: password       => $myhash,
  probe: |
    getent shadow p8testuser | cut -d: -f2 | cut -d'$' -f1-3
  expect:
    rc: 0
    stdout: \A\$6\$p8testsalt\n\Z
- id: the-pushed-key-is-the-only-authorized-key
  what: authorized_keys holds exactly one key, the fixture's RSA key named p8testuser@puppet, in a .ssh directory and file
    owned by the user with the modes sshd's StrictModes accepts
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 93-102
    text: 'ssh_authorized_key { "${myusername}@puppet" :'
  - path: manifests/user_base.pp
    lines: 56-59
    text: $sshkey = $mykey
  - path: manifests/user_base.pp
    lines: 63-73
    text: purge_ssh_keys => true,
  probe: |
    grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
    ssh-keygen -lf /home/p8testuser/.ssh/authorized_keys
    stat -c '%U %a' /home/p8testuser/.ssh /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \A1\n3072 SHA256:ArcgTTHV5S2Nc0ebl63nMmbOpEo6pearc6WeZ68E5Vo p8testuser@puppet \(RSA\)\np8testuser 700\np8testuser
      600\n\Z
- id: the-password-logs-in-and-a-wrong-one-is-refused
  what: su to p8testuser, run by an unprivileged account in a pty, succeeds with the test password and is refused with a wrong
    one
  control: negative
  timeout: 90
  derived_from:
  - path: manifests/user_base.pp
    lines: 63-72
    text: password       => $myhash,
  mutates: two su attempts as the account nobody (one with the test password, one with a wrong one); the outcomes go to /run/p8test-user/pw.txt
  probe: |
    install -d -m 0700 /run/p8test-user; : > /run/p8test-user/pw.txt
    for pw in 'p8test-user-not-a-secret' 'p8test-wrong-password'; do
      out=$( (sleep 2; printf '%s\n' "$pw"; sleep 3) | timeout 20 runuser -u nobody -- script -qec "su p8testuser -c 'echo logged-in-as-\$(id -un)'" /dev/null 2>&1 | tr -d '\r' | grep -o -e 'logged-in-as-[a-z0-9]*' -e 'Authentication failure' | head -1)
      echo "${out:-no answer}" >> /run/p8test-user/pw.txt
    done
  effect: |
    cat /run/p8test-user/pw.txt
  expect:
    rc: 0
    stdout: \Alogged-in-as-p8testuser\nAuthentication failure\n\Z
- id: an-out-of-band-key-is-planted
  what: setup for the purge check, a second key appended to the user's authorized_keys by hand
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 63-73
    text: purge_ssh_keys => true,
  mutates: generates a throwaway ed25519 key pair under /run/p8test-user and appends its public key (comment p8test-out-of-band)
    to /home/p8testuser/.ssh/authorized_keys
  probe: |
    install -d -m 0700 /run/p8test-user
    rm -f /run/p8test-user/extra /run/p8test-user/extra.pub
    ssh-keygen -q -t ed25519 -N '' -C p8test-out-of-band -f /run/p8test-user/extra
    cat /run/p8test-user/extra.pub >> /home/p8testuser/.ssh/authorized_keys
  effect: |
    grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
    p8_count 'p8test-out-of-band$' /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \A2\n1\n\Z
- id: the-agent-run-purges-the-out-of-band-key
  what: after the node's agent run, the planted key is gone and the pushed key is the only one left
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 63-73
    text: purge_ssh_keys => true,
  mutates: none beyond reading the file (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
    p8_count 'p8test-out-of-band$' /home/p8testuser/.ssh/authorized_keys
    ssh-keygen -lf /home/p8testuser/.ssh/authorized_keys | awk '{print $2, $3}'
  expect:
    rc: 0
    stdout: \A1\n0\nSHA256:ArcgTTHV5S2Nc0ebl63nMmbOpEo6pearc6WeZ68E5Vo p8testuser@puppet\n\Z
- id: a-locked-hash-with-other-home-shell-and-groups
  variant: locked
  what: 'with a locked hash (''!''), mygrouplist [users], home /srv/p8testhome mode 0700 and shell /bin/sh: the account has
    those, its primary group is users, its password is locked, and the pushed key is the unusable userlocked one'
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 41-49
    text: $sshkey = join ( [ 'userlocked', $random_string ] )
  - path: manifests/user_base.pp
    lines: 24-31
    text: $myprimary = $mygrouplist[0]
  - path: manifests/user_base.pp
    lines: 81-91
    text: mode    => $myhomemode,
  probe: |
    getent passwd p8testuser | cut -d: -f6,7
    id -gn p8testuser
    stat -c '%a' /srv/p8testhome
    passwd -S p8testuser | awk '{print $2}'
    awk '!/^(#|$)/ {print substr($2, 1, 10)}' /srv/p8testhome/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \A/srv/p8testhome:/bin/sh\nusers\n700\nL\nuserlocked\n\Z
- id: an-empty-key-pushes-an-unusable-key
  variant: emptykey
  what: with an empty key (and an unlocked hash) the pushed key is the unusable emptykey one
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 51-55
    text: $sshkey = join ( [ 'emptykey', $random_string ] )
  probe: |
    awk '!/^(#|$)/ {print substr($2, 1, 8)}' /home/p8testuser/.ssh/authorized_keys
  expect:
    rc: 0
    stdout: \Aemptykey\n\Z
- id: with-ignorekey-no-key-is-pushed
  variant: ignorekey
  what: 'with ignorekey true the account exists but no key is pushed: authorized_keys holds no key (it does not exist on the
    fresh node, and purge_ssh_keys leaves none)'
  control: negative
  derived_from:
  - path: manifests/user_base.pp
    lines: 93-94
    text: if ( $ignorekey == false ) {
  - path: manifests/user_base.pp
    lines: 63-73
    text: purge_ssh_keys => true,
  probe: |
    id -un p8testuser
    f=/home/p8testuser/.ssh/authorized_keys
    if [ -e "$f" ]; then grep -cvE '^(#|$)' "$f" || true; else echo 0; fi
  expect:
    rc: 0
    stdout: \Ap8testuser\n0\n\Z
- id: the-pushed-key-logs-in
  control: negative
  timeout: 60
  what: the private half of the pushed key (the suite's throwaway test key) logs the user in over SSH
  mutates: writes the throwaway private key to /run/p8test-keylogin and logs in to 127.0.0.1 as p8testuser with it
  derived_from: &id001
  - path: manifests/user_base.pp
    lines: 96-100
    text: 'ssh_authorized_key { "${myusername}@puppet" :'
  - path: manifests/user_base.pp
    lines: 56-58
    text: $sshkey = $mykey
  probe: |
    install -d -m 0700 /run/p8test-keylogin
    printf '%s' '{{FIXTURE_B64:p8test-throwaway-rsa}}' | base64 -d > /run/p8test-keylogin/id
    chmod 600 /run/p8test-keylogin/id
    ssh -i /run/p8test-keylogin/id -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 p8testuser@127.0.0.1 'id -un' > /run/p8test-keylogin/out 2>/dev/null; echo $? > /run/p8test-keylogin/rc
  effect: |
    echo "rc $(cat /run/p8test-keylogin/rc)"
    cat /run/p8test-keylogin/out
  expect:
    rc: 0
    stdout: \Arc 0\np8testuser\n\Z
- id: another-key-is-refused
  control: negative
  timeout: 60
  what: a key the class did not push (made on the spot) is refused, so the login above is the pushed key's
  mutates: makes a throwaway key in /run/p8test-keylogin and tries to log in to 127.0.0.1 as p8testuser with it
  derived_from: *id001
  probe: |
    install -d -m 0700 /run/p8test-keylogin
    rm -f /run/p8test-keylogin/other /run/p8test-keylogin/other.pub
    ssh-keygen -q -t rsa -b 3072 -N '' -f /run/p8test-keylogin/other
    ssh -i /run/p8test-keylogin/other -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 p8testuser@127.0.0.1 'id -un' > /dev/null 2>&1; echo $? > /run/p8test-keylogin/other.rc
  effect: |
    echo "rc $(cat /run/p8test-keylogin/other.rc)"
  expect:
    rc: 0
    stdout: \Arc 255\n\Z
- id: ecryptfs-the-wrapped-passphrase-is-pushed
  control: negative
  what: the given wrapped passphrase is written, base64 as given, to the user's ecryptfs directory (private, the user's),
    and decoded beside it
  derived_from:
  - &id004
    path: manifests/user_base.pp
    lines: '17'
    text: $ecryptdir = "/home/.ecryptfs/${myusername}/.ecryptfs"
  - &id002
    path: manifests/user_base.pp
    lines: '108'
    text: if( $ppsigs != '' ) and ( $ppwrapped != '' ) {
  - path: manifests/user_base.pp
    lines: '119'
    text: 'file { "${ecryptdir}/wrapped-passphrase.b64":'
  - path: manifests/user_base.pp
    lines: '121'
    text: content => $ppwrapped,
  - path: manifests/user_base.pp
    lines: 122-124
    text: mode    => '0600',
  - &id003
    path: manifests/user_base.pp
    lines: '129'
    text: command => "cat ${ecryptdir}/wrapped-passphrase.b64 |base64 -d > ${ecryptdir}/wrapped-passphrase",
  probe: |
    stat -c '%U %a %n' /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase.b64 /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase
    printf '%s' '{{FIXTURE_B64:p8test-throwaway-wrapped-passphrase}}' | cmp -s - /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase.b64 && echo b64-is-the-given-value
    base64 -d < /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase.b64 | cmp -s - /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase && echo decoded-beside-it
  expect:
    rc: 0
    stdout: \Ap8testuser 600 /home/\.ecryptfs/p8testuser/\.ecryptfs/wrapped-passphrase\.b64\np8testuser [0-7]+ /home/\.ecryptfs/p8testuser/\.ecryptfs/wrapped-passphrase\nb64-is-the-given-value\ndecoded-beside-it\n\Z
  variant: ecryptfs
- id: ecryptfs-the-login-password-unwraps-the-mount-passphrase
  control: negative
  what: the pushed wrapped passphrase opens with the user's login password and yields the mount passphrase whose signature
    the private directory carries, so the user's encrypted home unlocks at login
  derived_from:
  - *id002
  - *id003
  probe: |
    set -- 'p8test-user-not-a-secret'
    printf '%s' "$1" | ecryptfs-unwrap-passphrase /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase - 2>/dev/null
    printf '%s' '{{FIXTURE_B64:p8test-throwaway-private-sig}}' | base64 -d | cmp -s - /home/.ecryptfs/p8testuser/.ecryptfs/Private.sig && echo the-directory-carries-its-signature
  expect:
    rc: 0
    stdout: \Ap8test-mount-not-a-secret\nthe-directory-carries-its-signature\n\Z
  mismatch:
    varies: 'the password: a wrong login password must not unwrap the mount passphrase'
    probe: |
      set -- 'p8test-wrong-not-a-secret'
      printf '%s' "$1" | ecryptfs-unwrap-passphrase /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase - 2>/dev/null
      printf '%s' '{{FIXTURE_B64:p8test-throwaway-private-sig}}' | base64 -d | cmp -s - /home/.ecryptfs/p8testuser/.ecryptfs/Private.sig && echo the-directory-carries-its-signature
  variant: ecryptfs
- id: ecryptfs-the-pushed-passphrase-opens-the-home
  control: negative
  what: 'the mount passphrase unwrapped from the pushed file with the login password opens the user''s encrypted home (mounted
    read-only elsewhere for the check, then unmounted): the files of the home are readable'
  mutates: adds the passphrase to a throwaway session keyring and mounts the encrypted home on /run/p8test-ecr for the check,
    then unmounts it
  derived_from:
  - *id004
  - *id002
  - *id003
  timeout: 60
  probe: |
    install -d -m 0700 /run/p8test-ecr
    printf '%s' 'p8test-user-not-a-secret' | ecryptfs-unwrap-passphrase /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase - > /run/p8test-ecr.pp 2>/dev/null
    keyctl session - sh -c 'keyctl link @u @s; ecryptfs-add-passphrase --fnek - < /run/p8test-ecr.pp >/dev/null; s=$(head -1 /home/.ecryptfs/p8testuser/.ecryptfs/Private.sig); f=$(tail -1 /home/.ecryptfs/p8testuser/.ecryptfs/Private.sig); mount -i -t ecryptfs -o ro,ecryptfs_sig=$s,ecryptfs_fnek_sig=$f,ecryptfs_cipher=aes,ecryptfs_key_bytes=16 /home/.ecryptfs/p8testuser/.Private /run/p8test-ecr && { test -s /run/p8test-ecr/.profile && echo home-readable; umount /run/p8test-ecr; }' > /run/p8test-ecr.out 2>/dev/null
    rm -f /run/p8test-ecr.pp
  effect: |
    cat /run/p8test-ecr.out 2>/dev/null
    grep -c ' /run/p8test-ecr ' /proc/mounts || true
  expect:
    rc: 0
    stdout: \Ahome-readable\n0\n\Z
  variant: ecryptfs
- id: ecryptfs-the-wrapped-passphrase-is-damaged-out-of-band
  control: negative
  what: the decoded wrapped passphrase is overwritten out of band (the .b64 file stays as pushed)
  mutates: overwrites /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase with other bytes
  derived_from:
  - *id003
  probe: |
    printf 'p8test-damaged' > /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase
  effect: |
    test -s /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase.b64 || exit 1
    base64 -d < /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase.b64 | cmp -s - /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase && echo same || echo differs
  expect:
    rc: 0
    stdout: \Adiffers\n\Z
  variant: ecryptfs
- id: ecryptfs-the-agent-run-repairs-it
  control: negative
  what: the next agent run decodes the pushed value again (the ruled guard runs the exec when the decoded file differs), so
    the user can still unlock the home
  mutates: none beyond reading the files (declared mutating so it runs after the node's agent run)
  derived_from:
  - *id003
  probe: |
    true
  effect: |
    base64 -d < /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase.b64 | cmp -s - /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase && echo same || echo differs
    set -- 'p8test-user-not-a-secret'
    printf '%s' "$1" | ecryptfs-unwrap-passphrase /home/.ecryptfs/p8testuser/.ecryptfs/wrapped-passphrase - 2>/dev/null
  expect:
    rc: 0
    stdout: \Asame\np8test-mount-not-a-secret\n\Z
  variant: ecryptfs
apply:
  resource_type: define
  node: ubuntu
  title: p8testuser
  catalog:
    Debian:
    - class: user_base
