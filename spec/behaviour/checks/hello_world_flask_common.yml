class: hello_world_flask_common
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'Provides what every hello_world_flask demo application needs: the Python Flask framework and the gunicorn WSGI server
  (so an application can be served), and the directory under the local tree the applications live in.'
outcomes:
- outcome: the applications' directory exists, root-owned
  from: manifests/hello_world_flask_common.pp:11-17
  checks:
  - the-applications-directory
- outcome: Flask and gunicorn are installed and work together (gunicorn serves a Flask application)
  from: manifests/hello_world_flask_common.pp:7-8
  checks:
  - flask-and-gunicorn-installed
  - gunicorn-serves-a-flask-app
- outcome: the same on RedHat-family nodes (packages from EPEL through extra_packages_el)
  from: manifests/hello_world_flask_common.pp:3, 7-8
  checks:
  - on-redhat-flask-and-gunicorn-installed-and-the-directory
checks:
- id: the-applications-directory
  what: '{{LOCALDIR}}/hello_world_flask is a directory owned by root:root (mode 0644 given, which Puppet makes 0755 on a directory)'
  control: negative
  derived_from:
  - path: manifests/hello_world_flask_common.pp
    lines: 12-17
    text: 'file { "${localdir}/hello_world_flask":'
  probe: |
    stat -c '%F %U:%G %a' {{LOCALDIR}}/hello_world_flask
  expect:
    rc: 0
    stdout: \Adirectory root:root 755\n\Z
- id: flask-and-gunicorn-installed
  what: the python3-flask and python3-gunicorn packages are installed, and both import in the system Python
  control: negative
  derived_from:
  - path: manifests/hello_world_flask_common.pp
    lines: '8'
    text: 'package { [ ''python3-gunicorn'', ''python3-flask'' ]: ensure => present, }'
  probe: |
    dpkg-query -W -f '${Package} ${Status}\n' python3-flask python3-gunicorn | sort
    python3 -c 'import flask, gunicorn; print("imports ok")'
  expect:
    rc: 0
    stdout: \Apython3-flask install ok installed\npython3-gunicorn install ok installed\nimports ok\n\Z
- id: gunicorn-serves-a-flask-app
  what: the installed gunicorn serves a one-route Flask application on 127.0.0.1:18080, which answers 200 with its text
  control: negative
  timeout: 120
  derived_from:
  - path: manifests/hello_world_flask_common.pp
    lines: 7-8
    text: '# Packages needed for the applications to run'
  - path: templates/hello_world_flask/hello-world-flask.service.erb
    lines: '10'
    text: ExecStart=python3 -m gunicorn --bind <%= @ip_address %>:<%= @port %> wsgi:app
  mutates: writes /run/p8test-flask/app.py (one route returning "p8test hello") and starts a transient unit p8test-gunicorn
    (python3 -m gunicorn on 127.0.0.1:18080 serving it, as hello_world_flask's Debian unit runs it) until the next revert;
    the answers go to /run/p8test-flask/out.txt
  probe: |
    install -d -m 0755 /run/p8test-flask
    printf '%s\n' 'from flask import Flask' 'app = Flask(__name__)' '@app.route("/")' 'def hello():' '    return "p8test hello"' > /run/p8test-flask/app.py
    systemd-run --unit p8test-gunicorn -q --working-directory=/run/p8test-flask python3 -m gunicorn --bind 127.0.0.1:18080 app:app
    for i in $(seq 1 20); do p8_tcp 127.0.0.1 18080 1 | grep -q open && break; sleep 0.5; done
    { p8_http http://127.0.0.1:18080/; curl -s --max-time 5 http://127.0.0.1:18080/; echo; } > /run/p8test-flask/out.txt
  effect: |
    cat /run/p8test-flask/out.txt
  expect:
    rc: 0
    stdout: \A200\np8test hello\n\Z
- id: on-redhat-flask-and-gunicorn-installed-and-the-directory
  control: negative
  what: on RedHat python3-flask and python3-gunicorn are installed and import, and the applications directory exists, root-owned,
    0755
  derived_from:
  - path: manifests/hello_world_flask_common.pp
    lines: '8'
    text: 'package { [ ''python3-gunicorn'', ''python3-flask'' ]: ensure => present, }'
  - path: manifests/hello_world_flask_common.pp
    lines: '12'
    text: 'file { "${localdir}/hello_world_flask":'
  probe: |
    rpm -q --qf '%{NAME}\n' python3-flask python3-gunicorn | sort
    python3 -c 'import flask, gunicorn; print("imports ok")'
    stat -c '%F %U:%G %a' {{LOCALDIR}}/hello_world_flask
  expect:
    rc: 0
    stdout: \Apython3-flask\npython3-gunicorn\nimports ok\ndirectory root:root 755\n\Z
  variant: rhel
variants:
- name: rhel
  node: rhel9
  why: 'the RedHat side: the same packages from the distribution and EPEL (extra_packages_el, the plan''s RedHat base), on
    the rhel9 node, with the class defaults'
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: filesystem_base
    - class: hello_world_flask_common
    RedHat:
    - class: filesystem_base
    - class: extra_packages_el
    - class: hello_world_flask_common
