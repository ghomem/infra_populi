class: rsyslog_server
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'Makes a node the central log server: an rsyslog listener that accepts logs only over TLS from clients with a CA-signed
  certificate and stores them in a per-host tree, rotates those files daily, compresses rotated files after the active period
  and deletes compressed ones after the retention period.'
outcomes:
- outcome: rsyslogd listens on the port over TLS with the node's own certificate, configured for the per-host tree and the
    session limit
  from: manifests/rsyslog_server.pp:20-39; templates/rsyslog/listener_simple.conf.epp:1-35
  checks:
  - listener-config-rendered
  - tls-listener-presents-the-node-certificate
  - self-forward-config-absent
- outcome: a message from a client with a CA-signed certificate lands in <log_root>/hosts/<hostname>/<program>.log, or unknown.log
    without a program name; a client with a self-signed certificate is refused
  from: templates/rsyslog/listener_simple.conf.epp:15-36
  checks:
  - remote-message-lands-in-the-host-tree
  - a-message-without-a-program-lands-in-unknown
  - a-self-signed-client-is-refused
- outcome: the server's own local logs are stored in its own host directory of the tree
  from: manifests/rsyslog_server.pp:1-5; templates/rsyslog/listener_simple.conf.epp:32-36
  checks:
  - the-servers-own-logs-land-in-its-host-directory
- outcome: the per-host logs rotate daily at the rotation time, date-suffixed and uncompressed, and rsyslog reopens its files
    after the rotation
  from: manifests/rsyslog_server.pp:43-87; templates/rsyslog/rsyslog-hosts.logrotate.epp:1-13; templates/rsyslog/logrotate.timer.override.epp:1-5
  checks:
  - logrotate-timer-override-active
  - host-logs-rotation-rule
  - a-rotation-reopens-the-host-log
- outcome: rotated logs older than the active period are compressed and compressed logs older than the retention period are
    deleted, from root's cron at the retention time
  from: manifests/rsyslog_server.pp:89-108; templates/rsyslog/rsyslog-hosts-retention.sh.epp:1-34
  checks:
  - retention-script-and-cron
  - the-retention-script-compresses-and-deletes
- outcome: another port, log root, active and retention periods and rotation and retention times (the parameters production
    sets)
  from: manifests/rsyslog_server.pp:5-16
  checks:
  - custom-listener-config
  - custom-tls-listener-on-the-port
  - custom-rotation-time-and-rule
  - custom-retention-values-and-cron
  - custom-remote-message-lands-under-the-root
- outcome: another session limit or connection-close notices (max_sessions, notify_on_connection_close)
  from: manifests/rsyslog_server.pp:14-15
  uncovered:
    why: parameter variants no production node uses (the fixture keeps the defaults)
    accepted_gap:
    - max_sessions
    - notify_on_connection_close
    evidence: '{{SITE:fleet-usage}} (2026-11-23): no production node statement sets max_sessions or notify_on_connection_close,
      and no class of the repository sets them on rsyslog_server'
checks:
- id: listener-config-rendered
  what: the TLS listener config names the node's own certificate files, the port, the session limit and the host-based tree
  control: negative
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: '25'
    text: 'file { ''/etc/rsyslog.d/30-listener.conf'':'
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 7-8
    text: DefaultNetstreamDriverCertFile="/etc/rsyslog.d/tls/<%= $certname %>.pem"
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 12-14
    text: port="<%= $port %>"
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: '19'
    text: constant(value="<%= $log_root %>/hosts/")
  probe: |
    grep -E 'DefaultNetstreamDriver(Cert|Key)File|^\s+(port|maxSessions|notifyOnConnectionClose)=|constant\(value="/var/log/hosts/"\)' /etc/rsyslog.d/30-listener.conf | sed 's/^\s*//'
  expect:
    rc: 0
    stdout: \ADefaultNetstreamDriverCertFile="/etc/rsyslog\.d/tls/{{NODE_NAME}}\.pem"\nDefaultNetstreamDriverKeyFile="/etc/rsyslog\.d/tls/{{NODE_NAME}}\.key"\nport="6514"\nmaxSessions="2000"\nnotifyOnConnectionClose="off"\nconstant\(value="/var/log/hosts/"\)\nconstant\(value="/var/log/hosts/"\)\n\Z
- id: tls-listener-presents-the-node-certificate
  what: rsyslogd listens on 6514 with TLS, presenting a certificate that verifies against the Puppet CA for the node's name
  control: negative
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 5-8
    text: DefaultNetstreamDriver="gtls"
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: '15'
    text: streamdriver.mode="1"
  - path: manifests/rsyslog_server.pp
    lines: '21'
    text: $certname = $trusted['certname']
  probe: |
    c=$(basename /etc/rsyslog.d/tls/*.key .key)   # the node's certname (the class names its files after it)
    echo | timeout 15 openssl s_client -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -verify_return_error -verify_hostname "$c" -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" 2>&1 | grep -oE 'Verify return code: [0-9]+ \([^)]*\)' | head -1
  mismatch:
    varies: 'the name: the same handshake verified for p8test-wrong.invalid must fail, so the pass above is the certificate''s
      name and chain, not a tool that always says ok'
    probe: |
      c=$(basename /etc/rsyslog.d/tls/*.key .key)
      echo | timeout 15 openssl s_client -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -verify_return_error -verify_hostname p8test-wrong.invalid -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" 2>&1 | grep -oE 'Verify return code: [0-9]+ \([^)]*\)' | head -1
  expect:
    rc: 0
    stdout: '\AVerify return code: 0 \(ok\)\n\Z'
- id: self-forward-config-absent
  what: the old self-forward config is absent
  control: invariant
  why_invariant: the stock node has no /etc/rsyslog.d/40-forward-self.conf; the class keeps it absent
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: 41-42
    text: ensure => absent,
  probe: test ! -e /etc/rsyslog.d/40-forward-self.conf && echo absent
  expect:
    rc: 0
    stdout: \Aabsent\n\Z
- id: logrotate-timer-override-active
  what: 'systemd runs logrotate.timer with the override (daily at rotation_hour:rotation_minute, accuracy 1 min): the daemon-reload
    and timer restart took effect (the stock timer''s accuracy is 1 h)'
  control: negative
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: '54'
    text: 'file { ''/etc/systemd/system/logrotate.timer.d/override.conf'':'
  - path: manifests/rsyslog_server.pp
    lines: '68'
    text: command     => '/bin/systemctl daemon-reload',
  - path: templates/rsyslog/logrotate.timer.override.epp
    lines: 3-5
    text: AccuracySec=1min
  probe: |
    systemctl show logrotate.timer -p DropInPaths -p AccuracyUSec -p ActiveState
    systemctl show logrotate.timer -p TimersCalendar | grep -oE 'OnCalendar=[^;]*[0-9]'
  expect:
    rc: 0
    stdout: \AAccuracyUSec=1min\nActiveState=active\nDropInPaths=/etc/systemd/system/logrotate\.timer\.d/override\.conf\nOnCalendar=\*-\*-\*
      00:00:00\n\Z
- id: host-logs-rotation-rule
  what: logrotate rotates the per-host logs daily, keeping all, uncompressed, date-suffixed
  control: negative
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: '79'
    text: 'file { ''/etc/logrotate.d/rsyslog-hosts'':'
  - path: templates/rsyslog/rsyslog-hosts.logrotate.epp
    lines: 2-7
    text: <%= $log_root %>/hosts/*/*.log <%= $log_root %>/hosts/*/.log {
  probe: |
    logrotate -d /etc/logrotate.d/rsyslog-hosts >/dev/null 2>&1 && head -6 /etc/logrotate.d/rsyslog-hosts | sed 's/^\s*//'
  expect:
    rc: 0
    stdout: \A/var/log/hosts/\*/\*\.log /var/log/hosts/\*/\.log \{\ndaily\nrotate -1\nnocompress\ndateext\ndateformat -%Y%m%d\n\Z
- id: retention-script-and-cron
  what: the retention script (root 0755, the 7/7-day defaults, valid bash) runs from root's crontab at 03:17
  control: negative
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: 91-97
    text: 'file { "${bindir}/rsyslog-hosts-retention.sh":'
  - path: templates/rsyslog/rsyslog-hosts-retention.sh.epp
    lines: 4-6
    text: ROOT_DIR="<%= $log_root %>/hosts"
  - path: manifests/rsyslog_server.pp
    lines: 103-107
    text: 'cron { ''rsyslog_hosts_retention_cleanup'':'
  - path: manifests/rsyslog_server.pp
    lines: 12-13
    text: Integer[0, 23] $retention_hour      = 3,
  probe: |
    f={{LOCALDIR}}/bin/rsyslog-hosts-retention.sh
    stat -c '%U %a' "$f"; bash -n "$f" && grep -E '^(ROOT_DIR|ACTIVE_DAYS|RETENTION_DAYS)=' "$f"
    crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: rsyslog_hosts_retention_cleanup' | tail -1
  expect:
    rc: 0
    stdout: \Aroot 755\nROOT_DIR="/var/log/hosts"\nACTIVE_DAYS=7\nRETENTION_DAYS=7\n17 3 \* \* \* {{LOCALDIR}}/bin/rsyslog-hosts-retention\.sh\n\Z
- id: remote-message-lands-in-the-host-tree
  what: 'the exercise: a syslog message sent over TLS to the listener, from a client presenting a CA-signed certificate, is
    written to <log_root>/hosts/<hostname>/<programname>.log'
  control: negative
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: '16'
    text: 'streamdriver.authMode="x509/certvalid"   # accept any cert signed by CA'
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 18-23
    text: property(name="programname" securePath="replace")
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 34-35
    text: action(type="omfile" dynaFile="remote" createDirs="on")
  mutates: sends one RFC3164 line (host p8testremote, tag p8test) to 127.0.0.1:6514 over TLS with the node's own Puppet certificate
    as the client certificate; rsyslogd creates /var/log/hosts/p8testremote/p8test.log and, through the stock /etc/rsyslog.d/50-default.conf
    (the listener's rules do not stop the message), appends the same line to /var/log/syslog
  probe: |
    c=$(basename /etc/rsyslog.d/tls/*.key .key)
    { printf '<14>Nov 16 19:00:00 p8testremote p8test: p8test-remote-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" >/dev/null 2>&1; sleep 2
  effect: |
    grep -c 'p8test-remote-marker' /var/log/hosts/p8testremote/p8test.log
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: a-self-signed-client-is-refused
  what: a client presenting a self-signed certificate (not signed by the Puppet CA) sends a message; it is not written, while
    the CA-signed client's message from the check before is there
  control: negative
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: '16'
    text: 'streamdriver.authMode="x509/certvalid"   # accept any cert signed by CA'
  mutates: creates a throwaway RSA key and self-signed certificate (CN p8test-selfsigned) in /run/p8test-rsyslog; sends one
    RFC3164 line (host p8testremote, tag p8test) to 127.0.0.1:6514 over TLS with it; rsyslogd logs the refused session to
    syslog (the journal, /var/log/syslog, and through the listener's own rules the node's /var/log/hosts/<node>/rsyslogd.log)
  probe: |
    install -d -m 0700 /run/p8test-rsyslog; d=/run/p8test-rsyslog
    openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=p8test-selfsigned -keyout $d/self.key -out $d/self.pem 2>/dev/null
    { printf '<14>Nov 16 19:01:00 p8testremote p8test: p8test-selfsigned-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert $d/self.pem -key $d/self.key >/dev/null 2>&1; sleep 2
  effect: |
    p8_count 'p8test-remote-marker' /var/log/hosts/p8testremote/p8test.log
    cat /var/log/hosts/*/*.log 2>/dev/null | p8_count 'p8test-selfsigned-marker'
    journalctl -t rsyslogd -o cat --no-pager | p8_count 'certificate invalid: signer not found'
  expect:
    rc: 0
    stdout: \A1\n0\n[1-9]\d*\n\Z
- id: a-message-without-a-program-lands-in-unknown
  what: a CA-signed client's message with an empty tag (no program name) is written to <log_root>/hosts/<hostname>/unknown.log
  control: negative
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 26-33
    text: if ($programname == '') then {
  mutates: sends one RFC3164 line with an empty tag (host p8testremote) to 127.0.0.1:6514 over TLS with the node's own certificate;
    rsyslogd creates /var/log/hosts/p8testremote/unknown.log and appends to /var/log/syslog
  probe: |
    c=$(basename /etc/rsyslog.d/tls/*.key .key)
    { printf '<14>Nov 16 19:03:00 p8testremote : p8test-unknown-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" >/dev/null 2>&1; sleep 2
  effect: |
    p8_count 'p8test-unknown-marker' /var/log/hosts/p8testremote/unknown.log
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: the-servers-own-logs-land-in-its-host-directory
  what: a message logged on the server itself (logger, tag p8testlocal) is written to <log_root>/hosts/<its hostname>/p8testlocal.log
  control: negative
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: 1-5
    text: '# Receives local and remote logs over TLS, stores them under a host-based tree,'
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 34-36
    text: action(type="omfile" dynaFile="remote" createDirs="on")
  mutates: logs one message with logger -t p8testlocal; rsyslogd creates /var/log/hosts/<hostname>/p8testlocal.log and appends
    to /var/log/syslog and the journal
  probe: |
    logger -t p8testlocal p8test-local-marker; sleep 2
  effect: |
    p8_count 'p8test-local-marker' "/var/log/hosts/$(hostname)/p8testlocal.log"
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: a-rotation-reopens-the-host-log
  what: 'a forced rotation of the per-host rule moves p8test.log to p8test.log-<today> (uncompressed, holding the earlier
    message), and a message sent after it lands in a fresh p8test.log: rsyslog reopened its file after the HUP'
  control: negative
  derived_from:
  - path: templates/rsyslog/rsyslog-hosts.logrotate.epp
    lines: 2-12
    text: /bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
  mutates: runs `logrotate -f /etc/logrotate.d/rsyslog-hosts` once (it renames the per-host logs, HUPs rsyslog and updates
    logrotate's state file /var/lib/logrotate/status); sends one more RFC3164 line over TLS with the node's own certificate;
    rsyslogd creates a new /var/log/hosts/p8testremote/p8test.log and appends to /var/log/syslog
  probe: |
    logrotate -f /etc/logrotate.d/rsyslog-hosts; sleep 1
    c=$(basename /etc/rsyslog.d/tls/*.key .key)
    { printf '<14>Nov 16 19:02:00 p8testremote p8test: p8test-after-rotation-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" >/dev/null 2>&1; sleep 2
  effect: |
    d=/var/log/hosts/p8testremote
    p8_count 'p8test-remote-marker' "$d/p8test.log-$(date +%Y%m%d)"
    p8_count 'p8test-after-rotation-marker' "$d/p8test.log"
    p8_count 'p8test-remote-marker' "$d/p8test.log"
  expect:
    rc: 0
    stdout: \A1\n1\n0\n\Z
- id: the-retention-script-compresses-and-deletes
  what: run as cron would, the retention script compresses a rotated log dated 10 days ago, leaves one dated 2 days ago, deletes
    a compressed log 10 days old and keeps one 2 days old (active and retention 7 days)
  control: negative
  derived_from:
  - path: templates/rsyslog/rsyslog-hosts-retention.sh.epp
    lines: 10-28
    text: OLDEST_ALLOWED_DATE_FOR_PLAIN_TEXT=$(date -d "$((ACTIVE_DAYS - 1)) days ago" +%Y%m%d)
  - path: templates/rsyslog/rsyslog-hosts-retention.sh.epp
    lines: 30-34
    text: '! -newermt "${RETENTION_DAYS} days ago" \'
  mutates: creates /var/log/hosts/p8testold with p8test.log-<10 days ago> and p8test.log-<2 days ago> (clear text) and older.log-20200101.gz
    (mtime 10 days ago) and newer.log-20200102.gz (mtime 2 days ago); runs the retention script once as root (it gzips, touches
    and deletes in /var/log/hosts)
  probe: |
    d=/var/log/hosts/p8testold; install -d "$d"
    old=$(date -d '10 days ago' +%Y%m%d); new=$(date -d '2 days ago' +%Y%m%d)
    echo p8test > "$d/p8test.log-$old"; echo p8test > "$d/p8test.log-$new"
    echo p8test | gzip > "$d/older.log-20200101.gz"; touch -d '10 days ago' "$d/older.log-20200101.gz"
    echo p8test | gzip > "$d/newer.log-20200102.gz"; touch -d '2 days ago' "$d/newer.log-20200102.gz"
    {{LOCALDIR}}/bin/rsyslog-hosts-retention.sh
  effect: |
    cd /var/log/hosts/p8testold && ls -1 | sed -e "s/$(date -d '10 days ago' +%Y%m%d)/OLD/" -e "s/$(date -d '2 days ago' +%Y%m%d)/NEW/" | LC_ALL=C sort | tr '\n' ' '; echo
  expect:
    rc: 0
    stdout: \Anewer\.log-20200102\.gz p8test\.log-NEW p8test\.log-OLD\.gz \n\Z
- id: custom-listener-config
  control: negative
  what: the listener is configured for the fixture's port and stores under the fixture's log root
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 12-14
    text: port="<%= $port %>"
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: '19'
    text: constant(value="<%= $log_root %>/hosts/")
  probe: |
    grep -E '^\s+port=|constant\(value="/var/log/p8test-remote/hosts/"\)' /etc/rsyslog.d/30-listener.conf | sed 's/^\s*//'
  expect:
    rc: 0
    stdout: \Aport="16514"\nconstant\(value="/var/log/p8test-remote/hosts/"\)\nconstant\(value="/var/log/p8test-remote/hosts/"\)\n\Z
  variant: custom
- id: custom-tls-listener-on-the-port
  control: negative
  what: rsyslogd answers TLS on the fixture's port with the node's certificate
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: '15'
    text: streamdriver.mode="1"
  - path: manifests/rsyslog_server.pp
    lines: '6'
    text: Integer $port                       = 6514,
  probe: |
    c=$(basename /etc/rsyslog.d/tls/*.key .key)
    echo | timeout 15 openssl s_client -connect 127.0.0.1:16514 -CAfile /etc/rsyslog.d/tls/ca.pem -verify_return_error -verify_hostname "$c" -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" 2>&1 | grep -oE 'Verify return code: [0-9]+ \([^)]*\)' | head -1
  expect:
    rc: 0
    stdout: '\AVerify return code: 0 \(ok\)\n\Z'
  variant: custom
  mismatch:
    varies: 'the name: the same handshake on the fixture''s port verified for p8test-wrong.invalid must fail, so the pass
      is the certificate''s name and chain, not a tool that always says ok'
    probe: |
      c=$(basename /etc/rsyslog.d/tls/*.key .key)
      echo | timeout 15 openssl s_client -connect 127.0.0.1:16514 -CAfile /etc/rsyslog.d/tls/ca.pem -verify_return_error -verify_hostname p8test-wrong.invalid -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" 2>&1 | grep -oE 'Verify return code: [0-9]+ \([^)]*\)' | head -1
- id: custom-rotation-time-and-rule
  control: negative
  what: the logrotate timer fires at the fixture's rotation time, and the rotation rule covers the fixture's log root
  derived_from:
  - path: manifests/rsyslog_server.pp
    lines: '54'
    text: 'file { ''/etc/systemd/system/logrotate.timer.d/override.conf'':'
  - path: templates/rsyslog/rsyslog-hosts.logrotate.epp
    lines: 2-7
    text: <%= $log_root %>/hosts/*/*.log <%= $log_root %>/hosts/*/.log {
  probe: |
    systemctl show logrotate.timer -p TimersCalendar | grep -oE 'OnCalendar=[^;]*[0-9]'
    head -1 /etc/logrotate.d/rsyslog-hosts
  expect:
    rc: 0
    stdout: \AOnCalendar=\*-\*-\* 01:15:00\n/var/log/p8test-remote/hosts/\*/\*\.log /var/log/p8test-remote/hosts/\*/\.log
      \{\n\Z
  variant: custom
- id: custom-retention-values-and-cron
  control: negative
  what: the retention script carries the fixture's root and periods and its cron entry the fixture's time
  derived_from:
  - path: templates/rsyslog/rsyslog-hosts-retention.sh.epp
    lines: 4-6
    text: ROOT_DIR="<%= $log_root %>/hosts"
  - path: manifests/rsyslog_server.pp
    lines: 103-107
    text: 'cron { ''rsyslog_hosts_retention_cleanup'':'
  probe: |
    grep -E '^(ROOT_DIR|ACTIVE_DAYS|RETENTION_DAYS)=' {{LOCALDIR}}/bin/rsyslog-hosts-retention.sh
    crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: rsyslog_hosts_retention_cleanup' | tail -1
  expect:
    rc: 0
    stdout: \AROOT_DIR="/var/log/p8test-remote/hosts"\nACTIVE_DAYS=3\nRETENTION_DAYS=30\n45 4 \* \* \* {{LOCALDIR}}/bin/rsyslog-hosts-retention\.sh\n\Z
  variant: custom
- id: custom-remote-message-lands-under-the-root
  control: negative
  what: a message sent over TLS to the fixture's port lands under the fixture's log root
  mutates: sends one syslog message over TLS to the listener on 127.0.0.1:16514
  derived_from:
  - path: templates/rsyslog/listener_simple.conf.epp
    lines: 34-35
    text: action(type="omfile" dynaFile="remote" createDirs="on")
  probe: |
    c=$(basename /etc/rsyslog.d/tls/*.key .key)
    { printf '<14>Nov 16 19:00:00 p8testremote p8test: p8test-custom-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:16514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" >/dev/null 2>&1; sleep 2
  effect: |
