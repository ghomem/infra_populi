class: ssl_nginx
baseline: release-0.9.10 (cf477c6)
fixture: params
node_agent:
  after:
  - the-bundle-is-changed-by-hand
  - the-key-is-changed-by-hand
  why: ssl_base restores a changed bundle or key and restarts the service only on an agent run after the change
purpose: 'Installs a site''s TLS key and certificate for nginx: the private key root-only and the certificate bundled with
  its intermediate in the form nginx reads, and restarts nginx whenever either changes.'
outcomes:
- outcome: the private key is installed root-only, and the bundle holds the certificate then the intermediate, the certificate
    matching the key
  from: manifests/ssl_nginx.pp:1-9; manifests/ssl_base.pp:56-118
  checks:
  - private-key-installed-root-only
  - nginx-bundle-cert-then-intermediate
  - bundle-certificate-matches-the-key
- outcome: a changed bundle is put back on the next agent run and nginx is restarted
  from: manifests/ssl_base.pp:10, 100-103
  checks:
  - the-bundle-is-changed-by-hand
  - the-agent-run-restores-the-bundle-and-restarts-nginx
- outcome: a changed private key is put back on the next agent run and nginx is restarted
  from: manifests/ssl_base.pp:10, 84-91
  checks:
  - the-key-is-changed-by-hand
  - the-agent-run-restores-the-key-and-restarts-nginx
- outcome: the RedHat paths (/etc/pki/tls/private for the key)
  from: manifests/ssl_base.pp:56-68
  checks:
  - on-redhat-the-key-is-in-pki-tls-private-and-matches-the-bundle
checks:
- id: private-key-installed-root-only
  what: the prefix's private key is installed as /etc/ssl/private/<prefix>.key, root:root 0600
  control: negative
  derived_from:
  - path: manifests/ssl_nginx.pp
    lines: 8-11
    text: myservice     => 'nginx',
  - path: manifests/ssl_base.pp
    lines: 77-78
    text: $key_file                 = "${ssl_private_dir}/${myprefix}.key"
  - path: manifests/ssl_base.pp
    lines: 85-91
    text: mode   => '0600',
  probe: stat -c '%U %G %a' /etc/ssl/private/p8test.key
  expect:
    rc: 0
    stdout: \Aroot root 600\n\Z
- id: nginx-bundle-cert-then-intermediate
  what: the nginx bundle (<prefix>.nginx.bundle.crt, 0644) holds the server certificate first, then the intermediate
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 79-81
    text: $bundle_file              = "${ssl_certs_dir}/${myprefix}.${myservice}.bundle.crt"
  - path: manifests/ssl_base.pp
    lines: 100-107
    text: 'concat { $bundle_file:'
  probe: |
    f=/etc/ssl/certs/p8test.nginx.bundle.crt
    stat -c '%U %a' "$f"
    grep -c 'BEGIN CERTIFICATE' "$f"
    openssl x509 -noout -subject -nameopt RFC2253 -in "$f"
  expect:
    rc: 0
    stdout: \Aroot 644\n2\nsubject=CN=p8test\.invalid,O=[^\n]*\n\Z
- id: bundle-certificate-matches-the-key
  what: the bundle's first certificate and the installed private key are a pair (same public key)
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 77-81
    text: $first_cert_source        = "puppet:///extra_files/ssl/${myprefix}.crt"
  probe: |
    test -s /etc/ssl/certs/p8test.nginx.bundle.crt -a -s /etc/ssl/private/p8test.key || { echo "missing files"; exit 1; }
    a=$(openssl x509 -noout -pubkey -in /etc/ssl/certs/p8test.nginx.bundle.crt | sha256sum)
    b=$(openssl pkey -pubout -in /etc/ssl/private/p8test.key | sha256sum)
    test "$a" = "$b" && echo key-matches-certificate
  mismatch:
    varies: 'the key: the node''s own Puppet agent key is a different key, so the same comparison against it must fail'
    probe: |
      test -s /etc/ssl/certs/p8test.nginx.bundle.crt || { echo "missing bundle"; exit 1; }
      a=$(openssl x509 -noout -pubkey -in /etc/ssl/certs/p8test.nginx.bundle.crt | sha256sum)
      b=$(openssl pkey -pubout -in "$(ls /etc/puppetlabs/puppet/ssl/private_keys/*.pem | head -1)" | sha256sum)
      test "$a" = "$b" && echo key-matches-certificate
  expect:
    rc: 0
    stdout: \Akey-matches-certificate\n\Z
- id: the-bundle-is-changed-by-hand
  what: setup for the agent run, a stray line appended to the nginx bundle and nginx's main PID noted
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 100-103
    text: notify         => Service[$myservicename],
  mutates: appends the line "# p8test drift" to /etc/ssl/certs/p8test.nginx.bundle.crt and writes nginx's main PID to /run/p8test-sslnginx/pid
    (/run/p8test-sslnginx created 0700)
  probe: |
    install -d -m 0700 /run/p8test-sslnginx
    systemctl show -p MainPID --value nginx > /run/p8test-sslnginx/pid
    echo '# p8test drift' >> /etc/ssl/certs/p8test.nginx.bundle.crt
  effect: |
    p8_count '^# p8test drift$' /etc/ssl/certs/p8test.nginx.bundle.crt
    [ "$(cat /run/p8test-sslnginx/pid)" -gt 0 ] && echo "pid noted"
  expect:
    rc: 0
    stdout: \A1\npid noted\n\Z
- id: the-agent-run-restores-the-bundle-and-restarts-nginx
  what: after the node's agent run, the stray line is gone and nginx runs under a new main PID (restarted by the bundle's
    notify)
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: '10'
    text: '# The service is restarted if the certificate changes.'
  - path: manifests/ssl_base.pp
    lines: 100-103
    text: notify         => Service[$myservicename],
  mutates: none beyond reading the bundle and nginx's PID (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    p8_count '^# p8test drift$' /etc/ssl/certs/p8test.nginx.bundle.crt
    now=$(systemctl show -p MainPID --value nginx)
    [ "$now" -gt 0 ] && [ "$now" != "$(cat /run/p8test-sslnginx/pid)" ] && echo "nginx restarted"
    systemctl is-active nginx
  expect:
    rc: 0
    stdout: \A0\nnginx restarted\nactive\n\Z
- id: the-key-is-changed-by-hand
  what: setup for the second agent run, a stray line appended to the private key, its digest before the change and nginx's
    main PID noted
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 84-91
    text: notify => Service[$myservicename],
  mutates: writes the key's SHA-256 and nginx's main PID to /run/p8test-sslnginx/key.sha and /run/p8test-sslnginx/pid-key,
    then appends the line "# p8test drift" to /etc/ssl/private/p8test.key
  probe: |
    install -d -m 0700 /run/p8test-sslnginx
    sha256sum /etc/ssl/private/p8test.key | cut -d' ' -f1 > /run/p8test-sslnginx/key.sha
    systemctl show -p MainPID --value nginx > /run/p8test-sslnginx/pid-key
    echo '# p8test drift' >> /etc/ssl/private/p8test.key
  effect: |
    p8_count '^# p8test drift$' /etc/ssl/private/p8test.key
    [ "$(cat /run/p8test-sslnginx/pid-key)" -gt 0 ] && echo "pid noted"
  expect:
    rc: 0
    stdout: \A1\npid noted\n\Z
- id: the-agent-run-restores-the-key-and-restarts-nginx
  what: after the second agent run the key's digest is back to the one noted before the change, and nginx runs under a new
    main PID
  control: negative
  derived_from:
  - path: manifests/ssl_base.pp
    lines: '10'
    text: '# The service is restarted if the certificate changes.'
  - path: manifests/ssl_base.pp
    lines: 84-91
    text: notify => Service[$myservicename],
  mutates: none beyond reading the key's digest and nginx's PID (declared mutating so it runs after the second agent run)
  probe: |
    true
  effect: |
    [ -s /run/p8test-sslnginx/key.sha ] && [ "$(sha256sum /etc/ssl/private/p8test.key | cut -d' ' -f1)" = "$(cat /run/p8test-sslnginx/key.sha)" ] && echo "key restored"
    now=$(systemctl show -p MainPID --value nginx)
    [ "$now" -gt 0 ] && [ "$now" != "$(cat /run/p8test-sslnginx/pid-key)" ] && echo "nginx restarted"
    systemctl is-active nginx
  expect:
    rc: 0
    stdout: \Akey restored\nnginx restarted\nactive\n\Z
- id: on-redhat-the-key-is-in-pki-tls-private-and-matches-the-bundle
  control: negative
  what: on RedHat the private key is in /etc/pki/tls/private, root-only, and the nginx bundle in /etc/ssl/certs holds the
    certificate of that key
  derived_from:
  - path: manifests/ssl_base.pp
    lines: 57-62
    text: $ssl_private_dir = '/etc/pki/tls/private'
  - path: manifests/ssl_base.pp
    lines: 57-62
    text: $ssl_certs_dir  = '/etc/ssl/certs'
  probe: |
    stat -c '%n %U:%G %a' /etc/pki/tls/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt
    a=$(openssl x509 -noout -pubkey -in /etc/ssl/certs/p8test.nginx.bundle.crt | sha256sum)
    b=$(openssl pkey -pubout -in /etc/pki/tls/private/p8test.key | sha256sum)
    test "$a" = "$b" && echo key-matches-certificate
  expect:
    rc: 0
    stdout: \A/etc/pki/tls/private/p8test\.key root:root 600\n/etc/ssl/certs/p8test\.nginx\.bundle\.crt root:root 644\nkey-matches-certificate\n\Z
  variant: rhel
variants:
- name: rhel
  node: rhel9
  why: the RedHat branch of ssl_base, which this class wraps (the private key in /etc/pki/tls/private), on the rhel9 node,
    with the set's own params fixture
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - external: apt
    - class: nginx_base
    - class: ssl_nginx
    RedHat:
    - class: nginx_base
    - class: ssl_nginx
  requires:
  - server
  requires_why: ssl_base takes the key and certificates from the server's file mount puppet:///extra_files
