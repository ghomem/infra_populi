class: nginx_static_domain
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: Sets up nginx servers (vhosts) that serve a domain's static content from a local directory, with the class's redirect
  and TLS options, so requests for the domain get that content.
outcomes:
- outcome: nginx accepts the configuration, and plain HTTP for the domain is redirected to HTTPS keeping the path and query
  from: manifests/nginx_static_domain.pp:155-177, 252-261
  checks:
  - nginx-config-valid
  - http-redirects-to-https-same-host
- outcome: HTTPS for the domain serves the www_root files byte for byte and never lists a directory
  from: manifests/nginx_static_domain.pp:43, 118-121, 298-318
  checks:
  - https-serves-www-root
  - https-no-directory-listing
- outcome: the HTTPS server presents the domain's certificate bundle, and a client trusting its CA verifies the name
  from: manifests/nginx_static_domain.pp:21-27, 114-116, 298-318
  checks:
  - served-certificate-is-the-bundle
  - https-name-verifies
- outcome: the TLS policy holds (TLS 1.2 only, the server's cipher order, the 2048-bit DH group, the prime256v1 curve)
  from: manifests/nginx_static_domain.pp:44-49, 94-99, 298-318
  checks:
  - tls12-only
  - server-cipher-order-and-dh-group
  - ecdh-curve-prime256v1
- outcome: the other combinations (redirect to www, a default server, directory listing, plain HTTP only, an IP whitelist,
    extra protocols or ciphers)
  from: manifests/nginx_static_domain.pp:20-54, 101-205
  uncovered:
    why: one set holds one params fixture (HTTPS with a redirect from HTTP, no www, no listing)
    lifted_by: 'capability: more than one params fixture per set'
    evidence: '{{SITE:engine-runner}} applies the class once with its single `fixture` (params or defaults)'
- outcome: serving with a Let's Encrypt certificate (letsencrypt_certificate true)
  from: manifests/nginx_static_domain.pp:23-24, 86-92
  uncovered:
    why: a Let's Encrypt certificate needs an ACME endpoint the lab can reach and that can validate the domain
    lifted_by: 'capability: an ACME test endpoint in the lab (as for letsencrypt_certificate''s stand-in)'
    evidence: 'the fixture''s letsencrypt_certificate is false; the lab has no ACME endpoint ({{SITE:status-tool}} --standins:
      letsencrypt_certificate)'
checks:
- id: nginx-config-valid
  what: the nginx configuration the define produces passes `nginx -t`
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: 298-318
    text: 'nginx::resource::server { "static_https_${domain}":'
  probe: nginx -t 2>&1
  expect:
    rc: 0
    stdout: test is successful
- id: http-redirects-to-https-same-host
  what: plain HTTP for the domain answers 301 to https://<domain> keeping the path and query (redirect_to_https, no www)
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: 168-177
    text: $redirect_string = "301 https://${domain}\$request_uri"
  - path: manifests/nginx_static_domain.pp
    lines: 252-261
    text: '''return'' => $redirect_string'
  probe: |
    curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: p8test.example.com' 'http://127.0.0.1/p8/phase3?q=1'
  mismatch:
    varies: 'the request path (/p8/other): the redirect must carry the requested URI, so the expectation for /p8/phase3?q=1
      must fail. The Host is not varied: the redirector is the only port-80 server, so by nginx''s default-server rule it
      answers any Host'
    probe: |
      curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: p8test.example.com' 'http://127.0.0.1/p8/other'
  expect:
    rc: 0
    stdout: \A301 https://p8test\.example\.com/p8/phase3\?q=1\n\Z
- id: https-serves-www-root
  what: the HTTPS server for the domain serves files from www_root byte for byte
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: 136-140
    text: $https_ensure = 'present'
  - path: manifests/nginx_static_domain.pp
    lines: 298-303
    text: www_root                  => $www_root,
  probe: |
    f=$(find /var/www/html -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -1)
    test -n "$f" || { echo "no file in www_root"; exit 1; }
    a=$(curl -sk --resolve p8test.example.com:443:127.0.0.1 "https://p8test.example.com/$f" | sha256sum)
    b=$(sha256sum < "/var/www/html/$f")
    test "$a" = "$b" && echo same-content
  mismatch:
    varies: 'the local file compared (/etc/hostname instead of the served file): the byte comparison must fail'
    probe: |
      f=$(find /var/www/html -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -1)
      test -n "$f" || { echo "no file in www_root"; exit 1; }
      a=$(curl -sk --resolve p8test.example.com:443:127.0.0.1 "https://p8test.example.com/$f" | sha256sum)
      b=$(sha256sum < /etc/hostname)
      test "$a" = "$b" && echo same-content
  expect:
    rc: 0
    stdout: ^same-content$
- id: https-no-directory-listing
  what: with allow_directory_listing false, the document root is never listed (autoindex off)
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: 42-43
    text: Boolean $allow_directory_listing       = false,
  - path: manifests/nginx_static_domain.pp
    lines: 118-122
    text: 'false   : { $autoindex = ''off'' }'
  - path: manifests/nginx_static_domain.pp
    lines: '303'
    text: autoindex                 => $autoindex,
  probe: |
    out=$(curl -sk --resolve p8test.example.com:443:127.0.0.1 -w '\nstatus %{http_code}' https://p8test.example.com/)
    printf '%s\n' "$out" | tail -1
    printf '%s\n' "$out" | grep -c 'Index of /'
  mismatch:
    varies: 'the path (/p8-phase3-absent/): a 404 must not satisfy the 200|403 expectation for the document root'
    probe: |
      out=$(curl -sk --resolve p8test.example.com:443:127.0.0.1 -w '\nstatus %{http_code}' https://p8test.example.com/p8-phase3-absent/)
      printf '%s\n' "$out" | tail -1
      printf '%s\n' "$out" | grep -c 'Index of /'
  expect:
    rc: 1
    stdout: \Astatus (200|403)\n0\n\Z
- id: served-certificate-is-the-bundle
  what: the HTTPS server presents the certificate at /etc/ssl/certs/<static_sslprefix>.nginx.bundle.crt
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: 86-92
    text: $ssl_cert_path = "${ssl_certs_dir}/${static_sslprefix}.nginx.bundle.crt"
  - path: manifests/nginx_static_domain.pp
    lines: 308-309
    text: ssl_cert                  => $ssl_cert_path,
  probe: |
    a=$(openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
    b=$(openssl x509 -in /etc/ssl/certs/p8test.nginx.bundle.crt -noout -fingerprint -sha256)
    test -n "$a" && test "$a" = "$b" && echo served-cert-is-bundle
  mismatch:
    varies: 'the certificate compared (the first certificate of the system CA bundle instead of the p8test bundle): the fingerprints
      must differ'
    probe: |
      a=$(openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
      b=$(openssl x509 -in /etc/ssl/certs/ca-certificates.crt -noout -fingerprint -sha256)
      test -n "$a" && test "$a" = "$b" && echo served-cert-is-bundle
  expect:
    rc: 0
    stdout: ^served-cert-is-bundle$
- id: https-name-verifies
  what: a client that trusts the bundle's CA verifies the HTTPS server as <domain> (served cert + chain + name match)
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: 74-84
    text: 'puppet_infrastructure::ssl_nginx_domain { $static_sslprefix:'
  - path: manifests/nginx_static_domain.pp
    lines: 168-172
    text: $server_name = $domain
  - path: manifests/nginx_static_domain.pp
    lines: 298-300
    text: server_name               => [$server_name, ],
  - path: manifests/ssl_base.pp
    lines: 115-118
    text: source => $intermediate_cert_source,
  probe: |
    openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -verify_hostname p8test.example.com -CAfile /etc/ssl/certs/p8test.nginx.bundle.crt -verify_return_error </dev/null 2>&1 | grep -E '^Verification( error)?:'
  mismatch:
    varies: 'the hostname verified (wrong.example.org): verification must report ''hostname mismatch'''
    probe: |
      openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -verify_hostname wrong.example.org -CAfile /etc/ssl/certs/p8test.nginx.bundle.crt -verify_return_error </dev/null 2>&1 | grep -E '^Verification( error)?:'
  expect:
    rc: 0
    stdout: '\AVerification: OK\n\Z'
- id: tls12-only
  what: TLS 1.2 is accepted and TLS 1.3 refused (ssl_protocols = base prefix ['TLSv1.2'], no additions)
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: '46'
    text: Array $base_ssl_protocols_prefix       = ['TLSv1.2', ],
  - path: manifests/nginx_static_domain.pp
    lines: 96-97
    text: $base_ssl_protocols = join($base_ssl_protocols_array, ' ')
  - path: manifests/nginx_static_domain.pp
    lines: '310'
    text: ssl_protocols             => $base_ssl_protocols,
  probe: |
    openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_2 </dev/null 2>&1 | grep -oE '^New, TLSv1\.2, Cipher is'
    if openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_3 </dev/null >/dev/null 2>&1; then echo tls13-accepted; else echo tls13-refused; fi
  mismatch:
    varies: 'the protocol asked for first (-tls1_3 instead of -tls1_2): no TLS 1.2 session line may appear'
    probe: |
      openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_3 </dev/null 2>&1 | grep -oE '^New, TLSv1\.2, Cipher is'
      if openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_3 </dev/null >/dev/null 2>&1; then echo tls13-accepted; else echo tls13-refused; fi
  expect:
    rc: 0
    stdout: \ANew, TLSv1\.2, Cipher is\ntls13-refused\n\Z
- id: server-cipher-order-and-dh-group
  what: the server's cipher order wins (prefer_server_ciphers on) — DHE-RSA-AES128-GCM-SHA256 over a client-preferred ECDHE
    suite — with the 2048-bit DH group
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: '47'
    text: 'String $base_ssl_ciphers_prefix        = ''DHE-RSA-AES128-GCM-SHA256:'
  - path: manifests/nginx_static_domain.pp
    lines: 94-95
    text: $base_ssl_prefer_server_ciphers = 'on'
  - path: manifests/nginx_static_domain.pp
    lines: 311-313
    text: ssl_dhparam               => $base_dh_params,
  - path: manifests/nginx_base.pp
    lines: '36'
    text: $dh_params_bits = 2048,
  probe: |
    openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_2 -cipher 'ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256' </dev/null 2>&1 | grep -oE '^(New, TLSv1\.2, Cipher is \S+|Server Temp Key: [^,]+, [0-9]+ bits)$'
  mismatch:
    varies: 'the offered suites (only ECDHE-RSA-AES128-GCM-SHA256): without DHE on offer neither the DHE cipher nor the DH
      temp key may appear'
    probe: |
      openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_2 -cipher 'ECDHE-RSA-AES128-GCM-SHA256' </dev/null 2>&1 | grep -oE '^(New, TLSv1\.2, Cipher is \S+|Server Temp Key: [^,]+, [0-9]+ bits)$'
  expect:
    rc: 0
    stdout: '\AServer Temp Key: DH, 2048 bits\nNew, TLSv1\.2, Cipher is DHE-RSA-AES128-GCM-SHA256\n\Z'
- id: ecdh-curve-prime256v1
  what: an ECDHE handshake uses the prime256v1 curve (ssl_ecdh_curve)
  control: negative
  derived_from:
  - path: manifests/nginx_static_domain.pp
    lines: '49'
    text: String $base_ssl_ecdh_curve            = 'prime256v1',
  - path: manifests/nginx_static_domain.pp
    lines: 314-316
    text: '''ssl_ecdh_curve'' => $base_ssl_ecdh_curve,'
  probe: |
    openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_2 -cipher 'ECDHE-RSA-AES128-GCM-SHA256' </dev/null 2>&1 | grep -oE '^Server Temp Key: .*$'
  mismatch:
    varies: 'the offered curve (only secp384r1): the server allows prime256v1 only, so no prime256v1 temp key may appear'
    probe: |
      openssl s_client -connect 127.0.0.1:443 -servername p8test.example.com -tls1_2 -cipher 'ECDHE-RSA-AES128-GCM-SHA256' -curves secp384r1 </dev/null 2>&1 | grep -oE '^Server Temp Key: .*$'
  expect:
    rc: 0
    stdout: '\AServer Temp Key: ECDH, prime256v1, 256 bits\n\Z'
apply:
  resource_type: define
  node: ubuntu
  title: nginx_static_domain
  catalog:
    Debian:
    - external: apt
    - class: nginx_base
    - class: nginx_static_domain
