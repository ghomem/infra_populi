class: dns_client
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: Points the node's resolver at the given DNS servers, and only those, and keeps it so, so that names resolve through
  them.
node_agent:
  after: a-nameserver-is-added-by-hand
  why: the class keeps the resolver on the given servers only, which its next agent run after a hand edit shows
outcomes:
- outcome: the resolver names exactly the given servers, in order
  from: manifests/dns_client.pp:2, 8-12
  checks:
  - resolv-conf-names-exactly-the-given-servers
- outcome: names resolve through the given servers
  from: manifests/dns_client.pp:2, 8-12
  checks:
  - names-resolve-through-the-given-server
- outcome: a server added by hand is removed again by the next agent run (the resolver is kept to the given list)
  from: manifests/dns_client.pp:8-12
  checks:
  - a-nameserver-is-added-by-hand
  - the-next-agent-run-keeps-only-the-given-servers
- outcome: an empty list leaves the node's resolver untouched
  from: manifests/dns_client.pp:8
  checks:
  - an-empty-list-leaves-the-resolver-alone
variants:
- name: empty
  why: the empty list, which node_base passes to this class by default on every server (node_base.pp:49, 171), so production
    uses it although no node file sets it
  params: empty
  no_resources: true
checks:
- id: resolv-conf-names-exactly-the-given-servers
  what: /etc/resolv.conf names the given nameservers, in order, and no other
  control: negative
  derived_from:
  - path: manifests/dns_client.pp
    lines: 8-12
    text: nameservers => $nameservers
  probe: |
    grep -E '^nameserver ' /etc/resolv.conf
  expect:
    rc: 0
    stdout: \Anameserver 10\.0\.2\.3\nnameserver 1\.1\.1\.1\n\Z
- id: names-resolve-through-the-given-server
  what: a lookup through the system resolver configuration (dig without a server) is answered, and the answer comes from the
    first given server
  control: negative
  derived_from:
  - path: manifests/dns_client.pp
    lines: 1-2
    text: '# This class configures the DNS servers for the client'
  - path: manifests/dns_client.pp
    lines: 8-12
    text: 'class { ''resolv_conf'':'
  probe: |
    out=$(dig +time=3 +tries=2 deb.debian.org A)
    printf '%s\n' "$out" | grep -o -E 'status: [A-Z]+'
    printf '%s\n' "$out" | grep -o -E 'SERVER: [0-9.]+'
  mismatch:
    varies: the name (p8test.invalid, a reserved name that never exists), so the server must answer NXDOMAIN
    probe: |
      out=$(dig +time=3 +tries=2 p8test.invalid A)
      printf '%s\n' "$out" | grep -o -E 'status: [A-Z]+'
      printf '%s\n' "$out" | grep -o -E 'SERVER: [0-9.]+'
  expect:
    rc: 0
    stdout: '\Astatus: NOERROR\nSERVER: 10\.0\.2\.3\n\Z'
- id: a-nameserver-is-added-by-hand
  what: setup for the next check, a second nameserver added to /etc/resolv.conf by hand (drift)
  control: negative
  derived_from:
  - path: manifests/dns_client.pp
    lines: 8-12
    text: nameservers => $nameservers
  mutates: appends `nameserver 9.9.9.9` to /etc/resolv.conf on the node
  probe: |
    echo 'nameserver 9.9.9.9' >> /etc/resolv.conf
  effect: |
    grep -E '^nameserver ' /etc/resolv.conf
  expect:
    rc: 0
    stdout: \Anameserver 10\.0\.2\.3\nnameserver 1\.1\.1\.1\nnameserver 9\.9\.9\.9\n\Z
- id: the-next-agent-run-keeps-only-the-given-servers
  what: after the node's agent run, /etc/resolv.conf names only the given servers again, in order
  control: negative
  derived_from:
  - path: manifests/dns_client.pp
    lines: 8-12
    text: 'class { ''resolv_conf'':'
  mutates: none beyond reading the file (declared mutating so it runs after the node's agent run)
  probe: |
    true
  effect: |
    grep -E '^nameserver ' /etc/resolv.conf
  expect:
    rc: 0
    stdout: \Anameserver 10\.0\.2\.3\nnameserver 1\.1\.1\.1\n\Z
- id: an-empty-list-leaves-the-resolver-alone
  variant: empty
  what: with nameservers [] the class is applied but declares no resolv_conf, so /etc/resolv.conf keeps the node's own content
    (last written before the catalog the run applied)
  control: negative
  derived_from:
  - path: manifests/dns_client.pp
    lines: 8-12
    text: if ($nameservers != []) {
  probe: |
    python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); r=c["resources"]; print("dns_client applied:", any(x["type"]=="Class" and x["title"]=="Infra_populi::Dns_client" for x in r)); print("resolv_conf resources:", sum(1 for x in r if "resolv_conf" in x["title"].lower() or "Resolv_conf" in x["type"]))' $(ls /opt/puppetlabs/puppet/cache/client_data/catalog/*.json 2>/dev/null | head -1) 2>/dev/null || echo "no catalog"
    c=$(ls /opt/puppetlabs/puppet/cache/client_data/catalog/*.json 2>/dev/null | head -1)
    [ -n "$c" ] && [ /etc/resolv.conf -ot "$c" ] && echo "resolv.conf last written before the applied catalog"
  expect:
    rc: 0
    stdout: '\Adns_client applied: True\nresolv_conf resources: 0\nresolv\.conf last written before the applied catalog\n\Z'
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: dns_client
  requires:
  - server
  requires_why: the empty variant's check reads the catalog the agent cached (client_data/catalog), which puppet apply does
    not write
