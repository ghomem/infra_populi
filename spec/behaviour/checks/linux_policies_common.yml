class: linux_policies_common
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'Provides what every desktop user''s Linux policies need: the linux-policies tree under the local directory, the
  runner script that executes a user''s composed policy script, and an XDG autostart entry that runs it at each desktop log-in.'
outcomes:
- outcome: the module's linux-policies tree is deployed under the local directory
  from: manifests/linux_policies_common.pp:13-25
  checks:
  - policies-tree-deployed
- outcome: the runner executes the calling user's USER/<user>.sh when it exists and is executable, and says so in syslog;
    without one it logs that the script was not found
  from: manifests/linux_policies_common.pp:33-38; templates/linux-policies/execute_linux_policies_user.sh.erb:1-17
  checks:
  - runner-executes-the-users-policy
  - the-runner-reports-a-missing-script
- outcome: an XDG autostart entry runs the runner at a desktop log-in
  from: manifests/linux_policies_common.pp:27-32
  checks:
  - autostart-entry-runs-the-runner
- outcome: the autostart entry actually running at a desktop log-in
  from: manifests/linux_policies_common.pp:27-32
  uncovered:
    why: the class's plan node is a server without a desktop; the login side is exercised through linux_policies_user's set
      on kubuntu, which composes this class
    lifted_by: 'capability: a desktop session on the class''s plan node'
    evidence: '{{SITE:node-inventory}}: the class''s node is ubuntu (capabilities [server]); {{SITE:engine-runner}}''s `session`
      needs the kde capability (session_problems); linux_policies_user''s autostart-runs-the-policies-at-login runs it on
      kubuntu'
checks:
- id: policies-tree-deployed
  what: the module's linux-policies tree is copied to <localdir>/linux-policies (COMMON/common byte for byte, TMP and USER)
  control: negative
  derived_from:
  - path: manifests/linux_policies_common.pp
    lines: 13-14
    text: $linux_policies_dir = "${localdir}/linux-policies"
  - path: manifests/linux_policies_common.pp
    lines: 22-23
    text: source  => "puppet:///modules/puppet_infrastructure/linux-policies/",
  - path: files/linux-policies/COMMON/common
    sha256: 96142acfd235e555756e309dfbd98e45a71024a675f6d1a47ae923d3334f147a
  probe: |
    d={{LOCALDIR}}/linux-policies
    sha256sum "$d/COMMON/common" | cut -d' ' -f1
    test -e "$d/TMP/.placeholder" && test -e "$d/USER/.placeholder" && echo tmp-and-user-present
  expect:
    rc: 0
    stdout: \A96142acfd235e555756e309dfbd98e45a71024a675f6d1a47ae923d3334f147a\ntmp-and-user-present\n\Z
- id: autostart-entry-runs-the-runner
  what: the XDG autostart entry (0644) runs the policies runner with the argument autostart
  control: negative
  derived_from:
  - path: manifests/linux_policies_common.pp
    lines: 27-31
    text: 'file { "/etc/xdg/autostart/linux-policies-user.desktop":'
  - path: templates/linux-policies/autostart.desktop.erb
    lines: '4'
    text: Exec=<%= @linux_policies_dir %>/COMMON/execute_linux_policies_user.sh autostart
  probe: |
    f=/etc/xdg/autostart/linux-policies-user.desktop
    stat -c '%U %a' "$f"; grep '^Exec=' "$f"
  expect:
    rc: 0
    stdout: \Aroot 644\nExec={{LOCALDIR}}/linux-policies/COMMON/execute_linux_policies_user\.sh autostart\n\Z
- id: runner-executes-the-users-policy
  what: 'the exercise: the runner (root 0755) executes USER/<the calling user>.sh when it exists and is executable, and logs
    "Executing <script>" under the tag linuxint-policies-<caller>'
  control: negative
  derived_from:
  - path: manifests/linux_policies_common.pp
    lines: 33-37
    text: content   => template('puppet_infrastructure/linux-policies/execute_linux_policies_user.sh.erb'),
  - path: templates/linux-policies/execute_linux_policies_user.sh.erb
    lines: 8-14
    text: LINUX_POLICIES_SCRIPT=${LINUX_POLICIES_DIR}/USER/${USERNAME}.sh
  mutates: adds USER/root.sh (0755) to the deployed tree, a fixture policy that writes /var/tmp/p8test-policy-ran, then runs
    the runner once as root with the argument p8test (it also logs one line to syslog)
  probe: |
    printf '#!/bin/sh\necho p8test-policy-ran > /var/tmp/p8test-policy-ran\n' | install -m 0755 /dev/stdin {{LOCALDIR}}/linux-policies/USER/root.sh
    {{LOCALDIR}}/linux-policies/COMMON/execute_linux_policies_user.sh p8test
  effect: |
    stat -c '%U %a' {{LOCALDIR}}/linux-policies/COMMON/execute_linux_policies_user.sh
    cat /var/tmp/p8test-policy-ran
    journalctl -t linuxint-policies-p8test -o cat --no-pager | p8_count '^Executing {{LOCALDIR}}/linux-policies/USER/root\.sh$'
  expect:
    rc: 0
    stdout: \Aroot 755\np8test-policy-ran\n1\n\Z
- id: the-runner-reports-a-missing-script
  what: run by a user without a USER/<user>.sh (the account nobody), the runner executes nothing and logs "Policies script
    <script> not found"
  control: negative
  derived_from:
  - path: templates/linux-policies/execute_linux_policies_user.sh.erb
    lines: 11-16
    text: logger -p local1.notice -t ${SYSLOG_TAG} "Policies script ${LINUX_POLICIES_SCRIPT} not found"
  mutates: runs the runner once as the account nobody with the argument p8testmissing (one syslog line)
  probe: |
    cd /tmp && runuser -u nobody -- {{LOCALDIR}}/linux-policies/COMMON/execute_linux_policies_user.sh p8testmissing
  effect: |
    journalctl -t linuxint-policies-p8testmissing -o cat --no-pager | p8_count '^Policies script {{LOCALDIR}}/linux-policies/USER/nobody\.sh not found$'
  expect:
    rc: 0
    stdout: \A1\n\Z
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: filesystem_base
    - class: linux_policies_common
