class: user_kde_lock_screen
baseline: release-0.9.10 (cf477c6)
fixture: params
session:
  user: p8testuser
  desktop: plasma
  why: the exec applies the lock settings only on an agent run while the user is logged in to a KDE session
node_agent:
  after:
  - the-user-turns-the-lock-off
  - timing-the-user-logs-in
  why: the class restores the user's lock settings, and reloads them in the live session, only on an agent run; in the timing
    variant, after the user logged in
purpose: 'Enforces a desktop user''s KDE screen lock: the session locks by itself after the configured idle timeout and on
  resume, with the configured grace period, applied to the user''s own KDE settings and reloaded in the running session on
  every agent run while the user is logged in, so a user who turns the lock off gets it back.'
outcomes:
- outcome: the shared script that applies the settings is installed root-owned and executable
  from: manifests/user_kde_lock_screen_common.pp:8-12
  checks:
  - script-installed-root-executable
- outcome: an agent run while the user is logged out changes nothing and leaves a note
  from: files/user_kde_lock_screen/configure_lock_screen.sh:14-21
  checks:
  - a-run-while-logged-out-skips
- outcome: with the user logged in, the user's kscreenlockerrc gets Autolock and LockOnResume on, the timeout and the grace,
    reloaded live
  from: manifests/user_kde_lock_screen.pp:4-17; files/user_kde_lock_screen/configure_lock_screen.sh:58-106
  checks:
  - lock-settings-in-the-users-kscreenlockerrc
  - applied-in-the-session-and-reloaded-live
- outcome: the idle session locks after the class's timeout (without the class's settings it was not locked 450 s after login)
  from: manifests/user_kde_lock_screen.pp:4-7
  checks:
  - the-idle-session-locks-after-the-timeout
- outcome: a user who turns the lock off in the live session gets it back on the next agent run, and the session locks
  from: manifests/user_kde_lock_screen.pp:13-17; files/user_kde_lock_screen/configure_lock_screen.sh:61-68, 98-106
  checks:
  - the-user-turns-the-lock-off
  - the-agent-run-turns-the-lock-back-on
- outcome: the grace period (0 seconds) takes effect, so input right after the lock does not unlock without a password
  from: manifests/user_kde_lock_screen.pp:6
  uncovered:
    why: the grace only matters when input reaches the locked session, and a run sends no keyboard or mouse input
    lifted_by: 'capability: input injection into the node''s desktop session inside a phase3 run'
    evidence: the runner's session steps are an SDDM autologin and agent runs ({{SITE:engine-runner}} SESSION_LOGIN, SESSION_AGENT);
      no input tool is installed on {{NODE:kubuntu}}
- outcome: the session locks on resume
  from: files/user_kde_lock_screen/configure_lock_screen.sh:70-78
  uncovered:
    why: needs the node to suspend and resume inside a run
    lifted_by: 'capability: a suspend and resume of the class''s node inside a phase3 run'
    evidence: '{{SITE:engine-runner}} has no suspend step: a run reverts, applies, logs in, probes, and at most runs the node''s
      agent (node_agent)'
- outcome: another timeout or grace (the default five minutes among them)
  from: manifests/user_kde_lock_screen.pp:4-5
  checks:
  - timing-the-user-logs-in
  - timing-the-settings-reach-the-users-kscreenlockerrc
checks:
- id: script-installed-root-executable
  what: the shared script is in bindir, root:root 0755
  control: negative
  derived_from:
  - path: manifests/user_kde_lock_screen_common.pp
    lines: 8-12
    text: mode   => '0755',
  probe: stat -c '%U %G %a' {{LOCALDIR}}/bin/configure_lock_screen.sh
  expect:
    rc: 0
    stdout: \Aroot root 755\n\Z
- id: a-run-while-logged-out-skips
  what: the harness apply, with p8testuser logged out, left the script's "not loged in, skipping" note for the user
  control: negative
  derived_from:
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 16-21
    text: logger -p local1.notice -t $SYSLOG_TAG "User ${USERNAME} not loged in, skipping screenlock settings update"
  probe: |
    journalctl -t linuxint-screenlocker -o cat --no-pager | p8_count '^User p8testuser not loged in, skipping screenlock settings update$' | sed 's/^[1-9][0-9]*$/skipped-while-logged-out/'
  expect:
    rc: 0
    stdout: \Askipped-while-logged-out\n\Z
- id: lock-settings-in-the-users-kscreenlockerrc
  what: after an agent run with the user logged in, the user's kscreenlockerrc [Daemon] has Autolock and LockOnResume on,
    Timeout 2 (the fixture) and LockGrace 0 (the default)
  control: negative
  derived_from:
  - path: manifests/user_kde_lock_screen.pp
    lines: 5-6
    text: Integer $screenlock_grace_seconds   = 0,
  - path: manifests/user_kde_lock_screen.pp
    lines: 14-18
    text: command => "${bindir}/configure_lock_screen.sh ${screenlock_timeout_minutes} ${screenlock_grace_seconds}",
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 66-95
    text: --group Daemon --key Timeout ${LOCK_TIMEOUT}
  probe: |
    f=/home/p8testuser/.config/kscreenlockerrc
    stat -c '%U' "$f"
    sed -n '/^\[Daemon\]/,/^\[/p' "$f" | grep -E '^(Autolock|LockOnResume|Timeout|LockGrace)=' | sort
  expect:
    rc: 0
    stdout: \Ap8testuser\nAutolock=true\nLockGrace=0\nLockOnResume=true\nTimeout=2\n\Z
- id: applied-in-the-session-and-reloaded-live
  what: the script saw the user logged in (its syslog note) and the live screenlocker reload over the session D-Bus did not
    fall back (no "DBus service unavailable" note)
  control: negative
  derived_from:
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 15-17
    text: logger -p local1.notice -t $SYSLOG_TAG "User ${USERNAME} loged in, updating screenlock settings if needed"
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 102-105
    text: qdbus org.kde.screensaver /ScreenSaver configure || {
  probe: |
    journalctl -t linuxint-screenlocker -o cat --no-pager | p8_count '^User p8testuser loged in, updating screenlock settings if needed$' | sed 's/^[1-9][0-9]*$/logged-in-run/'
    journalctl -t linuxint-screenlocker -o cat --no-pager | p8_count 'DBus service unavailable'
  expect:
    rc: 0
    stdout: \Alogged-in-run\n0\n\Z
- id: the-idle-session-locks-after-the-timeout
  what: p8testuser's session, idle since the login, is locked (logind LockedHint, the lock screen running), and the lock screen
    started between 120 s (the class's 2 minutes) and 290 s after the login
  control: negative
  timeout: 360
  derived_from:
  - path: manifests/user_kde_lock_screen.pp
    lines: 4-7
    text: Integer $screenlock_timeout_minutes = 5,
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 80-87
    text: ${KWRITECONFIG} --file ${HOME}/.config/kscreenlockerrc --group Daemon --key Timeout ${LOCK_TIMEOUT}
  mutates: none beyond waiting up to 300 s for the lock (declared mutating so the wait may outlast a read-only probe's limit)
  probe: |
    sid=$(loginctl list-sessions --no-legend | awk '$3=="p8testuser"{print $1; exit}')
    for i in $(seq 60); do [ "$(loginctl show-session "$sid" -p LockedHint --value)" = yes ] && break; sleep 5; done
  effect: |
    sid=$(loginctl list-sessions --no-legend | awk '$3=="p8testuser"{print $1; exit}')
    [ -n "$sid" ] || { echo "no session"; exit 1; }
    echo "locked $(loginctl show-session "$sid" -p LockedHint --value)"
    pid=$(pgrep -u p8testuser -f kscreenlocker_greet | head -1)
    [ -n "$pid" ] || { echo "no lock screen"; exit 1; }
    greet=$(( $(awk '{print $22}' "/proc/$pid/stat") / $(getconf CLK_TCK) ))
    login=$(( $(loginctl show-session "$sid" -p TimestampMonotonic --value) / 1000000 ))
    d=$((greet - login))
    if [ "$d" -ge 120 ] && [ "$d" -le 290 ]; then echo "locked 120-290 s after the login"; else echo "locked ${d} s after the login"; fi
  expect:
    rc: 0
    stdout: \Alocked yes\nlocked 120-290 s after the login\n\Z
- id: the-user-turns-the-lock-off
  what: 'setup for the agent run: the session is unlocked, and the user turns Autolock off in their own kscreenlockerrc and
    reloads it in the live session; 150 s later (past the 2-minute timeout) the session is still unlocked'
  control: negative
  timeout: 300
  derived_from:
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 61-68
    text: if [ "${CURRENT_AUTOLOCK_VALUE}" != 'true' ]; then
  mutates: unlocks p8testuser's session (loginctl unlock-session); as p8testuser, writes Autolock=false to its kscreenlockerrc
    (kwriteconfig5) and reloads the screenlocker over the session D-Bus (qdbus configure); then waits 150 s
  probe: |
    sid=$(loginctl list-sessions --no-legend | awk '$3=="p8testuser"{print $1; exit}')
    loginctl unlock-session "$sid"
    bus="unix:path=/run/user/$(id -u p8testuser)/bus"
    runuser -u p8testuser -- env DBUS_SESSION_BUS_ADDRESS="$bus" kwriteconfig5 --file /home/p8testuser/.config/kscreenlockerrc --group Daemon --key Autolock false
    runuser -u p8testuser -- env DBUS_SESSION_BUS_ADDRESS="$bus" qdbus org.kde.screensaver /ScreenSaver configure
    sleep 150
  effect: |
    sid=$(loginctl list-sessions --no-legend | awk '$3=="p8testuser"{print $1; exit}')
    echo "locked $(loginctl show-session "$sid" -p LockedHint --value)"
    sed -n '/^\[Daemon\]/,/^\[/p' /home/p8testuser/.config/kscreenlockerrc | grep -E '^Autolock='
  expect:
    rc: 0
    stdout: \Alocked no\nAutolock=false\n\Z
- id: the-agent-run-turns-the-lock-back-on
  what: after the node's agent run, the user's kscreenlockerrc has Autolock=true again, the script reloaded the session without
    a fallback, and the session (idle past the timeout) locks within 60 s
  control: negative
  timeout: 120
  derived_from:
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 64-68
    text: ${KWRITECONFIG} --file ${HOME}/.config/kscreenlockerrc --group Daemon --key Autolock 'true'
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 98-106
    text: qdbus org.kde.screensaver /ScreenSaver configure || {
  mutates: none beyond reading the user's file, the journal and the session (declared mutating so it runs after the node's
    agent run)
  probe: |
    true
  effect: |
    sid=$(loginctl list-sessions --no-legend | awk '$3=="p8testuser"{print $1; exit}')
    sed -n '/^\[Daemon\]/,/^\[/p' /home/p8testuser/.config/kscreenlockerrc | grep -E '^Autolock='
    journalctl -t linuxint-screenlocker -o cat --no-pager | p8_count 'DBus service unavailable'
    for i in $(seq 12); do [ "$(loginctl show-session "$sid" -p LockedHint --value)" = yes ] && break; sleep 5; done
    echo "locked $(loginctl show-session "$sid" -p LockedHint --value)"
  expect:
    rc: 0
    stdout: \AAutolock=true\n0\nlocked yes\n\Z
- id: timing-the-user-logs-in
  control: negative
  timeout: 180
  what: the fixture user is logged in to a Plasma session (the condition under which the class applies its settings)
  mutates: logs p8testuser in to Plasma through an SDDM autologin drop-in and restarts sddm (the runner's session login, done
    by an action because a variant run has no session step)
  derived_from:
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 15-17
    text: logger -p local1.notice -t $SYSLOG_TAG "User ${USERNAME} loged in, updating screenlock settings if needed"
  probe: |
    set -e
    u=p8testuser
    id "$u" >/dev/null
    install -d -m 0755 /etc/sddm.conf.d
    printf '[Autologin]\nUser=%s\nSession=plasma\nRelogin=false\n' "$u" > /etc/sddm.conf.d/zz-p8test-autologin.conf
    systemctl restart sddm
    for i in $(seq 120); do
      if who | awk '{print $1}' | grep -qx "$u" && pgrep -u "$u" -x plasmashell >/dev/null; then echo SESSION_UP; exit 0; fi
      sleep 1
    done
    echo SESSION_DOWN
  effect: |
    who | awk '{print $1}' | grep -cx p8testuser | sed 's/^[1-9][0-9]*$/logged-in/'
  expect:
    rc: 0
    stdout: \Alogged-in\n\Z
  variant: timing
- id: timing-the-settings-reach-the-users-kscreenlockerrc
  control: negative
  what: after the agent run with the user logged in, the user's kscreenlockerrc has the fixture's timeout (5) and grace (30)
  mutates: nothing (the evidence is read after the node's agent run that follows the login)
  derived_from:
  - path: manifests/user_kde_lock_screen.pp
    lines: 14-18
    text: command => "${bindir}/configure_lock_screen.sh ${screenlock_timeout_minutes} ${screenlock_grace_seconds}",
  - path: files/user_kde_lock_screen/configure_lock_screen.sh
    lines: 66-95
    text: --group Daemon --key Timeout ${LOCK_TIMEOUT}
  probe: |
    true
  effect: |
    sed -n '/^\[Daemon\]/,/^\[/p' /home/p8testuser/.config/kscreenlockerrc | grep -E '^(Timeout|LockGrace)=' | sort
  expect:
    rc: 0
    stdout: \ALockGrace=30\nTimeout=5\n\Z
  variant: timing
variants:
- name: timing
  params: timing
  why: 'another timeout and grace (5 minutes, the default, and 30 seconds), which production sets (fleet_variant_usage.md:
    screenlock_timeout_minutes and screenlock_grace_seconds on one node statement); the class applies them only on an agent
    run while the user is logged in, so the variant logs the user in (an action) and the node''s agent runs after it'
apply:
  resource_type: define
  node: kubuntu
  title: p8testuser
  catalog:
    Debian:
    - class: filesystem_base
    - class: user_base
      define: p8testuser
    - class: user_kde_lock_screen
