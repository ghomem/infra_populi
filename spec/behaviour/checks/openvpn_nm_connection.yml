class: openvpn_nm_connection
baseline: release-0.9.10 (cf477c6)
fixture: params
peer:
  kind: ubuntu2
  why: the profile connects to an OpenVPN server, so a second machine must serve one
  files:
  - /run/p8test-nmvpn/ca.crt
  - /run/p8test-nmvpn/server.crt
  - /run/p8test-nmvpn/server.key
purpose: 'Gives a desktop user a NetworkManager OpenVPN connection to the company VPN: a root-only profile with the server,
  CA, the user''s VPN login and cipher, password authentication over a tap device, usable only by that local user, with a
  stable UUID, loaded into NetworkManager.'
outcomes:
- outcome: the profile file is root-only and NetworkManager loads it as an OpenVPN connection under its name
  from: manifests/openvpn_nm_connection.pp:22-39
  checks:
  - profile-file-root-only
  - networkmanager-loads-the-vpn-profile
- outcome: the loaded profile carries the parameters (remote, CA, VPN user, cipher, password auth, tap)
  from: templates/openvpn/connection_file.erb
  checks:
  - vpn-settings-from-the-parameters
- outcome: only the local user may use the connection, and its UUID is stable (fqdn_uuid of the name)
  from: manifests/openvpn_nm_connection.pp:9-21; templates/openvpn/connection_file.erb
  checks:
  - only-the-local-user-may-use-it
  - uuid-is-the-stable-version-5-uuid-of-the-name
- outcome: the profile connects to an OpenVPN server with the user's password (a tap address, the server reachable through
    the tunnel), and a wrong password does not connect
  from: manifests/openvpn_nm_connection.pp:1-9; templates/openvpn/connection_file.erb:8-20
  checks:
  - a-test-vpn-pki-and-route
  - the-peer-serves-openvpn
  - the-profile-connects-with-the-password
  - the-server-accepted-the-user
  - a-wrong-password-does-not-connect
  - the-server-refused-the-wrong-password
- outcome: the desktop's own secret agent asking the user for the password when the profile is brought up
  from: templates/openvpn/connection_file.erb:11
  uncovered:
    why: the password is agent-owned (password-flags=1); the exercise supplies it with nmcli's passwd-file, and the runner
      starts no GNOME session whose agent would ask
    lifted_by: 'capability: a GNOME desktop session in phase3 runs'
    evidence: '{{SITE:engine-runner}} session_problems accepts only desktop plasma; {{SITE:node-inventory}}: the class''s
      node gnome (capabilities [desktop, gnome])'
checks:
- id: profile-file-root-only
  what: the connection file is /etc/NetworkManager/system-connections/<connection_name>, root:root 0600
  control: negative
  derived_from:
  - path: manifests/openvpn_nm_connection.pp
    lines: 31-34
    text: mode    => '0600',
  probe: stat -c '%U %G %a' /etc/NetworkManager/system-connections/p8test-vpn
  expect:
    rc: 0
    stdout: \Aroot root 600\n\Z
- id: networkmanager-loads-the-vpn-profile
  what: NetworkManager has loaded the profile as an OpenVPN connection under the connection name
  control: negative
  derived_from:
  - path: manifests/openvpn_nm_connection.pp
    lines: 22-25
    text: name        => '/usr/bin/nmcli con reload',
  - path: templates/openvpn/connection_file.erb
    lines: 1-4
    text: id=<%= @connection_name %>
  - path: templates/openvpn/connection_file.erb
    lines: '20'
    text: service-type=org.freedesktop.NetworkManager.openvpn
  probe: nmcli -g connection.id,connection.type,vpn.service-type connection show p8test-vpn
  mismatch:
    varies: the connection name (p8test-vpn-other), which no profile has, so nmcli must refuse it
    probe: nmcli -g connection.id,connection.type,vpn.service-type connection show p8test-vpn-other
  expect:
    rc: 0
    stdout: \Ap8test-vpn\nvpn\norg\.freedesktop\.NetworkManager\.openvpn\n\Z
- id: vpn-settings-from-the-parameters
  what: the loaded profile carries the remote, CA path, VPN username and cipher from the parameters, and the template's fixed
    transport (password auth, agent-owned password, tap, UDP, LZO, no mssfix, no remote-random) with automatic IPv4 and IPv6
  control: negative
  derived_from:
  - path: manifests/openvpn_nm_connection.pp
    lines: 12-16
    text: '$remote, # server name or IP address'
  - path: templates/openvpn/connection_file.erb
    lines: 8-23
    text: connection-type=password
  probe: |
    nmcli -g vpn.data connection show p8test-vpn | tr ',' '\n' | sed 's/^ *//' |
      grep -E '^(remote|ca|username|cipher|connection-type|dev-type|remote-random|password-flags|comp-lzo|proto-tcp|mssfix) = ' | sort
    nmcli -g ipv4.method,ipv6.method connection show p8test-vpn
  mismatch:
    varies: the connection name (p8test-vpn-other), which no profile has, so no settings can be read
    probe: |
      nmcli -g vpn.data connection show p8test-vpn-other | tr ',' '\n' | sed 's/^ *//' |
        grep -E '^(remote|ca|username|cipher|connection-type|dev-type|remote-random|password-flags|comp-lzo|proto-tcp|mssfix) = ' | sort
      nmcli -g ipv4.method,ipv6.method connection show p8test-vpn-other
  expect:
    rc: 0
    stdout: \Aca = /etc/p8test-vpn/ca\.crt\ncipher = AES-256-CBC\ncomp-lzo = yes\nconnection-type = password\ndev-type = tap\nmssfix
      = no\npassword-flags = 1\nproto-tcp = no\nremote = 203\.0\.113\.50\nremote-random = no\nusername = p8testuser\nauto\nauto\n\Z
- id: only-the-local-user-may-use-it
  what: the profile's permissions name the local user only
  control: negative
  derived_from:
  - path: templates/openvpn/connection_file.erb
    lines: '5'
    text: permissions=user:<%= @local_username %>:;
  probe: nmcli -g connection.permissions connection show p8test-vpn
  mismatch:
    varies: the connection name (p8test-vpn-other), which no profile has
    probe: nmcli -g connection.permissions connection show p8test-vpn-other
  expect:
    rc: 0
    stdout: \Auser\\:p8testuser\n\Z
- id: uuid-is-the-stable-version-5-uuid-of-the-name
  what: the profile's UUID is the same in the file and in NetworkManager, and is fqdn_uuid of the connection name (the ruled
    replacement of fqdn_rand_uuid with the same seed), so it is stable across runs and nodes
  control: negative
  derived_from:
  - path: manifests/openvpn_nm_connection.pp
    lines: '29'
    text: $uuid = fqdn_rand_uuid($connection_name)
  - path: templates/openvpn/connection_file.erb
    lines: '3'
    text: uuid=<%= @uuid %>
  probe: |
    sed -n 's/^uuid=//p' /etc/NetworkManager/system-connections/p8test-vpn
    nmcli -g connection.uuid connection show p8test-vpn
  mismatch:
    varies: the connection name (p8test-vpn-other), which no profile has, so NetworkManager reports no UUID
    probe: |
      sed -n 's/^uuid=//p' /etc/NetworkManager/system-connections/p8test-vpn
      nmcli -g connection.uuid connection show p8test-vpn-other
  expect:
    rc: 0
    stdout: \Adf2d3b4d-5aa3-564f-92d4-fd9bac9644f9\ndf2d3b4d-5aa3-564f-92d4-fd9bac9644f9\n\Z
- id: a-test-vpn-pki-and-route
  what: setup for the connection, a throwaway CA and server certificate on the node, the profile's CA file replaced with that
    CA, and 203.0.113.50 routed on-link over the host-only interface
  control: negative
  derived_from:
  - path: templates/openvpn/connection_file.erb
    lines: 12-19
    text: ca=<%= @ca_crt %>
  mutates: creates /run/p8test-nmvpn (0700) with a throwaway CA (CN p8test-vpn-ca) and a server key and certificate it signs
    (CN p8test-vpn-server); copies the CA over the fixture file /etc/p8test-vpn/ca.crt (node fixture p8test_vpn_ca); adds
    the route 203.0.113.50/32 dev enp0s8
  probe: |
    set -e
    d=/run/p8test-nmvpn; install -d -m 0700 $d; cd $d
    openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=p8test-vpn-ca -keyout ca.key -out ca.crt 2>/dev/null
    openssl req -newkey rsa:2048 -nodes -subj /CN=p8test-vpn-server -keyout server.key -out server.csr 2>/dev/null
    printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > ext.cnf
    openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -extfile ext.cnf -out server.crt 2>/dev/null
    cp ca.crt /etc/p8test-vpn/ca.crt
    ip route replace 203.0.113.50/32 dev enp0s8
  effect: |
    openssl verify -CAfile /etc/p8test-vpn/ca.crt /run/p8test-nmvpn/server.crt
    ip route get 203.0.113.50 | grep -o 'dev enp0s8'
  expect:
    rc: 0
    stdout: '\A/run/p8test-nmvpn/server\.crt: OK\ndev enp0s8\n\Z'
- id: the-peer-serves-openvpn
  what: the peer runs an OpenVPN server on 203.0.113.50:1194 (UDP, tap, password check, the handed-over certificate)
  control: negative
  host: peer
  timeout: 300
  derived_from:
  - path: templates/openvpn/connection_file.erb
    lines: 9-17
    text: dev-type=tap
  mutates: 'installs openvpn on the peer if absent; adds 203.0.113.50/32 to its enp0s8; writes /etc/p8test-nmvpn (the handed-over
    CA, server certificate and key, a password check script accepting p8testuser / p8test-vpn-not-a-secret, server.conf: tap,
    UDP 1194, pool 10.199.0.10-50, AES-256-GCM:AES-256-CBC, comp-lzo, no client certificate); starts the server as a daemon
    logging to /run/p8test-nmvpn-server.log'
  probe: |
    set -e
    command -v openvpn >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install openvpn >/dev/null 2>&1
    ip addr add 203.0.113.50/32 dev enp0s8 2>/dev/null || true
    d=/etc/p8test-nmvpn; install -d -m 0700 $d
    for f in ca.crt server.crt server.key; do install -m 0600 /run/p8test-from-node/$f $d/$f; done
    printf '#!/bin/sh\n[ "$(sed -n 1p "$1")" = p8testuser ] && [ "$(sed -n 2p "$1")" = p8test-vpn-not-a-secret ]\n' > $d/check.sh; chmod 0755 $d/check.sh
    printf '%s\n' 'dev tap0' 'proto udp' 'local 203.0.113.50' 'port 1194' 'mode server' 'tls-server' "ca $d/ca.crt" "cert $d/server.crt" "key $d/server.key" 'dh none' 'ifconfig 10.199.0.1 255.255.255.0' 'ifconfig-pool 10.199.0.10 10.199.0.50 255.255.255.0' 'verify-client-cert none' 'username-as-common-name' 'script-security 2' "auth-user-pass-verify $d/check.sh via-file" 'data-ciphers AES-256-GCM:AES-256-CBC' 'comp-lzo yes' 'allow-compression yes' 'keepalive 10 60' 'verb 3' > $d/server.conf
    openvpn --config $d/server.conf --daemon p8test-nmvpn --log /run/p8test-nmvpn-server.log --writepid /run/p8test-nmvpn-server.pid
    sleep 2
  effect: |
    ss -Hlun 'sport = :1194' | awk '{print $4}'
  expect:
    rc: 0
    stdout: \A203\.0\.113\.50:1194\n\Z
- id: the-profile-connects-with-the-password
  what: brought up with the user's VPN password (nmcli as the secret agent, passwd-file), the profile activates, tap0 gets
    an address of the server's pool, and the server answers through the tunnel
  control: negative
  timeout: 180
  derived_from:
  - path: manifests/openvpn_nm_connection.pp
    lines: 1-9
    text: define puppet_infrastructure::openvpn_nm_connection(
  - path: templates/openvpn/connection_file.erb
    lines: 8-20
    text: connection-type=password
  mutates: writes the password file /run/p8test-nmvpn/pw (0600) and brings the connection up (NetworkManager starts openvpn,
    creates tap0, logs to the journal); the answers go to /run/p8test-nmvpn/up.txt
  probe: |
    printf 'vpn.secrets.password:p8test-vpn-not-a-secret\n' > /run/p8test-nmvpn/pw; chmod 0600 /run/p8test-nmvpn/pw
    timeout 90 nmcli connection up p8test-vpn passwd-file /run/p8test-nmvpn/pw >/dev/null 2>&1; echo "up rc=$?" > /run/p8test-nmvpn/up.txt
    ping -c2 -W3 -q 10.199.0.1 >/dev/null 2>&1 && echo "server answers through the tunnel" >> /run/p8test-nmvpn/up.txt
  effect: |
    cat /run/p8test-nmvpn/up.txt
    nmcli -g GENERAL.STATE connection show p8test-vpn | head -1
    ip -4 -br addr show tap0 | grep -oE '10\.199\.0\.[0-9]+/24'
  expect:
    rc: 0
    stdout: \Aup rc=0\nserver answers through the tunnel\nactivated\n10\.199\.0\.(1[0-9]|[2-4][0-9]|50)/24\n\Z
- id: the-server-accepted-the-user
  what: the peer's server logged the password authentication of p8testuser and a client offering the profile's cipher (AES-256-CBC)
  control: negative
  host: peer
  derived_from:
  - path: templates/openvpn/connection_file.erb
    lines: '13'
    text: cipher=<%= @cipher %>
  - path: templates/openvpn/connection_file.erb
    lines: '18'
    text: username=<%= @vpn_username %>
  mutates: none beyond reading the server's log (declared mutating so it runs after the connection)
  probe: |
    true
  effect: |
    p8_count "Username/Password authentication succeeded for username 'p8testuser'" /run/p8test-nmvpn-server.log | sed 's/^[1-9][0-9]*$/authenticated/'
    p8_count 'peer info: IV_CIPHERS=AES-256-CBC$' /run/p8test-nmvpn-server.log | sed 's/^[1-9][0-9]*$/offered AES-256-CBC/'
  expect:
    rc: 0
    stdout: \Aauthenticated\noffered AES-256-CBC\n\Z
- id: a-wrong-password-does-not-connect
  what: brought down and up again with a wrong password, the profile does not activate and no tap device exists
  control: negative
  timeout: 180
  derived_from:
  - path: templates/openvpn/connection_file.erb
    lines: 10-11
    text: password-flags=1
  mutates: brings the connection down, writes /run/p8test-nmvpn/badpw (0600) with a wrong password and tries to bring it up
    once (NetworkManager logs the failure); the outcome goes to /run/p8test-nmvpn/bad.txt
  probe: |
    nmcli connection down p8test-vpn >/dev/null 2>&1
    printf 'vpn.secrets.password:p8test-wrong-password\n' > /run/p8test-nmvpn/badpw; chmod 0600 /run/p8test-nmvpn/badpw
    timeout 60 nmcli connection up p8test-vpn passwd-file /run/p8test-nmvpn/badpw >/dev/null 2>&1; echo "up rc=$?" > /run/p8test-nmvpn/bad.txt
    nmcli connection down p8test-vpn >/dev/null 2>&1 || true
  effect: |
    grep -c '^up rc=0$' /run/p8test-nmvpn/bad.txt || true
    ip -br addr show tap0 2>/dev/null | p8_count 'tap0'
  expect:
    rc: 0
    stdout: \A0\n0\n\Z
- id: the-server-refused-the-wrong-password
  what: the peer's server sent AUTH_FAILED for the wrong password
  control: negative
  host: peer
  derived_from:
  - path: templates/openvpn/connection_file.erb
    lines: 10-11
    text: connection-type=password
  mutates: none beyond reading the server's log (declared mutating so it runs after the failed attempt)
  probe: |
    true
  effect: |
    p8_count "SENT CONTROL .*'AUTH_FAILED'" /run/p8test-nmvpn-server.log | sed 's/^[1-9][0-9]*$/refused/'
  expect:
    rc: 0
    stdout: \Arefused\n\Z
apply:
  resource_type: define
  node: gnome
  title: p8test-vpn
  catalog:
    Debian:
    - class: openvpn_nm_connection
  node_fixture: p8test_vpn_ca
  requires:
  - server
  requires_why: the OpenVPN CA certificate comes from the server's file mount puppet:///extra_files
