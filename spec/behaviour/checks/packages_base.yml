class: packages_base
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: 'The minimum package set of a generic node: the tools every node needs (monitoring plugins, ACLs, ecryptfs, the firewall''s
  persistence, vim, wget, aptitude) installed and usable, package lists refreshed on every agent run, and supervisor, cloud-init
  and, by default, unattended upgrades removed.'
outcomes:
- outcome: the base tools are installed and usable (monitoring plugins, ACLs, ecryptfs, the firewall's persistence, vim, wget,
    aptitude)
  from: manifests/packages_base.pp:22-27, 42-46
  checks:
  - the-package-list-is-installed
  - the-tools-work
- outcome: supervisor and cloud-init are removed, and unattended upgrades are off by default
  from: manifests/packages_base.pp:4, 51, 59-61
  checks:
  - supervisor-cloud-init-and-unattended-upgrades-are-removed
- outcome: the package lists are refreshed on every agent run
  from: manifests/packages_base.pp:11-19
  checks:
  - package-lists-refresh-on-every-agent-run
- outcome: the exec update-package-lists refreshes the lists before the packages are installed
  from: manifests/packages_base.pp:35-49
  checks:
  - the-update-package-lists-exec-never-runs
- outcome: unattended upgrades installed when asked (unattended_upgrades true)
  from: manifests/packages_base.pp:4, 53-58
  checks:
  - unattended-upgrades-installed-when-asked
  - on-redhat-dnf-automatic-installed-when-asked
- outcome: the RedHat branch (dnf makecache every run, extra_packages_el, the RedHat package list and dnf-automatic)
  from: manifests/packages_base.pp:12-17, 28-33, 56-57, 62-63
  checks:
  - on-redhat-the-package-list-and-dnf-automatic-absent
variants:
- name: unattended
  why: unattended_upgrades true, which a production node sets ({{SITE:fleet-usage}}, 1 node statement)
  params: unattended
- name: rhel
  why: the RedHat branch (dnf, the RedHat package list, extra_packages_el, dnf-automatic), on the rhel9 node
  node: rhel9
- name: rhel-unattended
  why: unattended_upgrades true on the RedHat branch (dnf-automatic installed), on the rhel9 node
  node: rhel9
  params: unattended
checks:
- id: the-package-list-is-installed
  what: every package of the Debian list is installed
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: '27'
    text: $package_list = ['iptables-persistent', $nagios_package_name, 'ecryptfs-utils', 'vim', 'wget', 'aptitude', 'acl']
  - path: manifests/packages_base.pp
    lines: '26'
    text: $nagios_package_name = 'monitoring-plugins-standard'
  probe: |
    dpkg-query -W -f '${Package} ${Status}\n' iptables-persistent monitoring-plugins-standard ecryptfs-utils vim wget aptitude acl | sort
  expect:
    rc: 0
    stdout: \Aacl install ok installed\naptitude install ok installed\necryptfs-utils install ok installed\niptables-persistent
      install ok installed\nmonitoring-plugins-standard install ok installed\nvim install ok installed\nwget install ok installed\n\Z
- id: the-tools-work
  what: 'the installed tools run: a monitoring plugin checks the root filesystem, the ACL tools read ACLs, the ecryptfs setup
    helper and aptitude are on the path'
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: 26-27
    text: $nagios_package_name = 'monitoring-plugins-standard'
  - path: manifests/packages_base.pp
    lines: 43-46
    text: 'package { $package_list:'
  probe: |
    /usr/lib/nagios/plugins/check_disk -w 1% -c 1% -p / | cut -d' ' -f1-2
    getfacl -p /etc/hostname 2>/dev/null | head -1
    command -v ecryptfs-setup-private aptitude
  expect:
    rc: 0
    stdout: '\ADISK OK\n# file: /etc/hostname\n/usr/bin/ecryptfs-setup-private\n/usr/bin/aptitude\n\Z'
- id: supervisor-cloud-init-and-unattended-upgrades-are-removed
  what: supervisor, cloud-init and (unattended_upgrades false) unattended-upgrades are not installed
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: '51'
    text: 'package { [ ''supervisor'' , ''cloud-init'' ]: ensure => absent, }'
  - path: manifests/packages_base.pp
    lines: 59-61
    text: 'package { ''unattended-upgrades'': ensure => absent, }'
  probe: |
    for p in supervisor cloud-init unattended-upgrades; do
      s=$(dpkg-query -W -f '${Status}' "$p" 2>/dev/null)
      case "$s" in *" installed") echo "$p installed";; *) echo "$p absent";; esac
    done
  expect:
    rc: 0
    stdout: \Asupervisor absent\ncloud-init absent\nunattended-upgrades absent\n\Z
- id: package-lists-refresh-on-every-agent-run
  what: 'the last agent run (the harness''s run 2, with nothing else to change) refreshed the package lists: Exec[apt_update]
    ran, as `update => { frequency => ''always'' }` makes it do on every run'
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: 11-19
    text: 'class { ''apt'': update => { frequency => ''always'' } }'
  probe: |
    awk '/^  Exec\[apt_update\]:$/ {f=1; next} f && /^  [^ ]/ {f=0} f && /^    changed: true$/ {c++} END {print c+0}' /opt/puppetlabs/puppet/cache/state/last_run_report.yaml
  expect:
    rc: 0
    stdout: \A1\n\Z
- id: the-update-package-lists-exec-never-runs
  what: 'the exec update-package-lists is in the catalog but did not run in the last agent run: it is refreshonly and nothing
    notifies it (`Exec[''update-package-lists''] ~> Package[...]` makes the exec notify the packages, not the reverse), so
    the refresh it was written for comes from class apt instead (package-lists-refresh-on-every-agent-run). An unreachable
    resource whose protection holds elsewhere (HQ batch-12 ruling 1: recorded, approval report and Phase 5 backlog)'
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: 36-40
    text: refreshonly => true
  - path: manifests/packages_base.pp
    lines: '49'
    text: Exec['update-package-lists'] ~> Package[$package_list]
  probe: |
    p8_count '^exec\[update-package-lists\]$' /opt/puppetlabs/puppet/cache/state/resources.txt
    p8_count '^  Exec\[update-package-lists\]:$' /opt/puppetlabs/puppet/cache/state/last_run_report.yaml
  expect:
    rc: 0
    stdout: \A1\n0\n\Z
- id: unattended-upgrades-installed-when-asked
  variant: unattended
  what: with unattended_upgrades true the class is applied (iptables-persistent installed, supervisor absent) and unattended-upgrades
    is installed
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: 53-56
    text: 'package { ''unattended-upgrades'': ensure => installed, }'
  probe: |
    dpkg-query -W -f '${Package} ${Status}\n' iptables-persistent unattended-upgrades 2>/dev/null | sort
    dpkg-query -W -f '${Status}\n' supervisor 2>/dev/null | grep -c 'install ok installed' | sed 's/^/supervisor installed: /'
  expect:
    rc: 0
    stdout: '\Aiptables-persistent install ok installed\nunattended-upgrades install ok installed\nsupervisor installed: 0\n\Z'
- id: on-redhat-the-package-list-and-dnf-automatic-absent
  variant: rhel
  what: on RedHat the RedHat package list is installed (iptables-services, nagios-plugins-all, yum-utils, wget, acl, vim as
    vim-enhanced), the last agent run (the harness's run 2) ran dnf makecache as it does on every run, and with unattended_upgrades
    false dnf-automatic and cloud-init are absent
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: 28-32
    text: $package_list = ['iptables-services', $nagios_package_name, 'vim', 'wget', 'yum-utils', 'acl']
  - path: manifests/packages_base.pp
    lines: 61-64
    text: 'package { ''dnf-automatic'': ensure => absent, }'
  - path: manifests/packages_base.pp
    lines: 11-17
    text: command     => 'dnf makecache',
  probe: |
    rpm -q --qf '%{NAME}\n' iptables-services nagios-plugins-all yum-utils wget acl
    rpm -q --whatprovides vim --qf '%{NAME}\n'
    awk '/^  Exec\[dnf-makecache\]:$/ {f=1; next} f && /^  [^ ]/ {f=0} f && /^    changed: true$/ {c++} END {print "dnf-makecache ran: " c+0}' /opt/puppetlabs/puppet/cache/state/last_run_report.yaml
    for p in dnf-automatic cloud-init; do rpm -q $p >/dev/null 2>&1 && echo "$p installed" || echo "$p absent"; done
  expect:
    rc: 0
    stdout: '\Aiptables-services\nnagios-plugins-all\nyum-utils\nwget\nacl\nvim-enhanced\ndnf-makecache ran: 1\ndnf-automatic
      absent\ncloud-init absent\n\Z'
- id: on-redhat-dnf-automatic-installed-when-asked
  variant: rhel-unattended
  what: on RedHat with unattended_upgrades true, dnf-automatic is installed (and the RedHat list too)
  control: negative
  derived_from:
  - path: manifests/packages_base.pp
    lines: 53-58
    text: 'package { ''dnf-automatic'': ensure => installed, }'
  probe: |
    rpm -q --qf '%{NAME}\n' dnf-automatic iptables-services
  expect:
    rc: 0
    stdout: \Adnf-automatic\niptables-services\n\Z
apply:
  resource_type: class
  node: ubuntu
  catalog:
    Debian:
    - class: packages_base
    RedHat:
    - class: packages_base
  expected_run2_events:
  - Exec[apt_update]
  - Exec[dnf-makecache]
  requires:
  - server
  requires_why: a check reads the agent's resource list (state/resources.txt); after puppet apply it did not list the catalog's
    exec
