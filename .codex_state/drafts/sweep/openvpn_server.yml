# Phase 3 checks for puppet_infrastructure::openvpn_server (class; required_base network_dhcp; MOCK-APPLY: the plan's
# node_fixture p8test_dhcp_primary supplies p8test0, a stand-in DHCP primary interface; migrated with the ruled change
# "module owns the unit", upstream_defects.md openvpn_server). HQ 2026-11-17 ruling 1: with ubuntu2 as the client it
# connects, gets a pool address, reaches the server side, and a wrong password is rejected.
# Fixture (params, never committed): lan_static_ip 192.0.2.1/24, pool 192.0.2.100-150, lan_iface lo:0, bridge br0,
# local 203.0.113.50 (p8test0's DHCP address), local_interface p8test0; defaults: cipher AES-256-CBC, push_dns_server
# 8.8.8.8, client_isolation true, reneg_sec 3600, compression comp-lzo.
# The peer reaches 203.0.113.50 (a local address of the node) through a host route via the node's host-only address.
# The client filters the pushed redirect-gateway (it is checked as received): applied, it would send the peer's route
# to the server through NIC1's NAT gateway instead of the host-only path.
# Purpose and outcomes table added 2026-11-19 (backfill batch 4, HQ batch-10 rulings 2 and C1), with client isolation
# as behaviour: a second client, in network namespace p8vpn2 on the peer (masqueraded out through the peer's own
# address) and logged in as a second account (one account per client: username_as_common_name without duplicate-cn
# would drop the first session), reaches the server side but not the first client. The networking side (ifupdown and
# the networking service enabled, the bridge's stanza) gets a check of its own.
# The interfaces file's rendering was read on an applied node first (2026-11-19, harness apply): one auto line names
# br0 lo lo:0 p8test0 (p8test0 from network_dhcp's base), then "iface br0 inet static", "address 192.0.2.1", and
# indented options with "bridge_ports lo:0".
# Correction round 1, 2026-11-19 (review 20261119T112433Z FAIL, purpose): the set did not cover the server unit coming
# back at boot (:117-121 enable => 'true'), nor the default cipher (:19, :177) and compression (:30, :166) as behaviour.
# Added: the unit's enablement (the same probe level as networking's), a byte-counter measure of LZO compression in each
# direction of the data channel, and a client that offers only the class's cipher. Measured first on an applied node
# (2026-11-19 11:28:45Z and 11:29:11Z in the clients' logs, OpenVPN 2.6.19): the server says "--cipher set to 'AES-256-CBC' but missing in
# --data-ciphers ... OpenVPN ignores --cipher for cipher negotiations" and refuses a CBC-only client ("No common cipher",
# AUTH_FAILED after the password succeeded); it receives LZO-compressed packets (141 bytes per packet for 1228-byte
# zero-filled pings) but sends uncompressed ones (1237 bytes per packet; "Sent packets are not compressed unless
# allow-compression yes"). The expectations stay the baseline's (both directions compressed; the class's cipher
# usable); the two new behaviour checks are expected to fail as findings.
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1): another DNS server, cipher and isolation off are a check in the
# variant run `other`; force_ifupdown and compression none are an accepted gap.
class: openvpn_server
baseline: release-0.9.10 (cf477c6)
fixture: params
peer:
  kind: ubuntu2
  why: the VPN client must be a second machine on the lab network that connects to the server node over UDP
  files: [/etc/openvpn/keys/ca.crt]
purpose: >-
  An OpenVPN server that bridges its clients onto a LAN bridge: clients authenticate with a local account (PAM, no
  client certificate), get an address from the bridge's pool and the pushed routes and DNS, reach the server's LAN
  side, cannot reach each other (client isolation), and the bridge and the server are configured to come back at boot.
  The data channel uses the class's cipher (AES-256-CBC by default) and LZO compression (comp-lzo by default).
outcomes:
  - outcome: the server listens on UDP 1194 at the bound address with the bridged tap0, the pool, PAM auth and the renegotiation interval
    from: manifests/openvpn_server.pp:157-187
    checks: [server-listens-on-the-bound-address, server-config-rendered]
  - outcome: the server's unit is enabled, so the VPN server comes back at boot
    from: manifests/openvpn_server.pp:117-121
    checks: [server-unit-enabled-at-boot]
  - outcome: the data channel is LZO-compressed in both directions (comp-lzo, the default)
    from: manifests/openvpn_server.pp:30, 166
    checks: [the-data-channel-is-compressed-both-ways]
  - outcome: a client that uses the class's cipher (AES-256-CBC, the default) connects with it
    from: manifests/openvpn_server.pp:19, 177
    checks: [a-client-on-the-class-cipher-connects]
  - outcome: the bridge carries the LAN address with tap0 as a port, and is set up through ifupdown with the networking service enabled (boot)
    from: manifests/openvpn_server.pp:35-41, 73-115, 174, 202-209
    checks: [bridge-holds-the-lan-address-and-tap0, networking-brings-up-the-bridge-at-boot]
  - outcome: a client with a local account connects, gets a pool address and the pushed options, and reaches the server's LAN side
    from: manifests/openvpn_server.pp:124-154, 162-185, 196-200
    checks: [vpn-account-on-the-server, client-connects-gets-a-pool-address-and-reaches-the-server-side]
  - outcome: a wrong password is refused
    from: manifests/openvpn_server.pp:169
    checks: [wrong-password-rejected]
  - outcome: clients cannot reach each other (client isolation, the default)
    from: manifests/openvpn_server.pp:25, 43-45, 211
    checks: [client-isolation-on-the-bridge, a-second-vpn-account, a-second-client-reaches-the-server-side-but-not-the-first]
  - outcome: another DNS server pushed to clients, another cipher, and client isolation off (proxy_arp_pvlan on the bridge)
    from: manifests/openvpn_server.pp:18-25, 45, 172-177, 211
    checks: [another-dns-cipher-and-isolation-off]
  - outcome: force_ifupdown true and compression none
    from: manifests/openvpn_server.pp:26-30, 166
    uncovered:
      why: parameter variants no production node uses (the fixture keeps their defaults)
      accepted_gap: [force_ifupdown, compression]
      evidence: >-
        diagnosis/fleet_variant_usage.md (2026-11-23): no production node statement sets either, and no class of the
        repository sets them on openvpn_server (network_vpn passes cipher, client_isolation and push_dns_server)
variants:
  - name: other
    why: >-
      another DNS server (a production node sets push_dns_server), another cipher and client isolation off, both passed
      by network_vpn (a composite)
    params: other
checks:
  - id: server-listens-on-the-bound-address
    what: the OpenVPN server listens on UDP 1194 at the `local` address
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "165", text: "proto                    => 'udp',"}
      - {path: manifests/openvpn_server.pp, lines: "184", text: "local                    => $local,"}
    probe: |
      ss -ulnH 'sport = :1194' | awk '{print $4}'
    expect: {rc: 0, stdout: "\\A203\\.0\\.113\\.50:1194\\n\\Z"}

  - id: server-config-rendered
    what: the server config carries the bridged tap0, the server-bridge pool, PAM auth without client certificates and the renegotiation interval
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "157-158", text: "server_directory => '/etc/openvpn/server',"}
      - {path: manifests/openvpn_server.pp, lines: "167-169", text: "pam                      => true,"}
      - {path: manifests/openvpn_server.pp, lines: "173", text: "server_bridge            => \"${lan_static_ip} ${lan_netmask} ${vpn_pool_start} ${vpn_pool_end}\","}
      - {path: manifests/openvpn_server.pp, lines: "185", text: "custom_options           => { 'reneg-sec' => $reneg_sec, 'verify-client-cert' => 'none' },"}
    probe: |
      grep -E '^(dev|server-bridge|plugin|verify-client-cert|reneg-sec) ' /etc/openvpn/server/puppet_infrastructure.conf
    expect: {rc: 0, stdout: "\\Adev tap0\\nserver-bridge 192\\.0\\.2\\.1 255\\.255\\.255\\.0 192\\.0\\.2\\.100 192\\.0\\.2\\.150\\nplugin /usr/lib/openvpn/openvpn-plugin-auth-pam\\.so \"login\"\\nreneg-sec 3600\\nverify-client-cert none\\n\\Z"}

  - id: server-unit-enabled-at-boot
    what: the server's systemd unit is enabled (it starts at boot) and active
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "117-121", text: "service { 'openvpn-server@puppet_infrastructure':"}
      - {path: manifests/openvpn_server.pp, lines: "119", text: "enable   => 'true',"}
    probe: |
      systemctl is-enabled openvpn-server@puppet_infrastructure
      p8_service openvpn-server@puppet_infrastructure | cut -d' ' -f1
    expect: {rc: 0, stdout: "\\Aenabled\\nactive\\n\\Z"}

  - id: bridge-holds-the-lan-address-and-tap0
    what: br0 carries lan_static_ip and the server's tap0 is one of its ports (the up script)
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "174", text: "up                       => \"/etc/openvpn/openvpn-up.sh ${lan_bridge_iface} ${lan_iface} tap0\","}
      - {path: manifests/openvpn_server.pp, lines: "17", text: "$lan_bridge_iface         = 'br0',"}
    probe: |
      ip -4 -br addr show br0 | awk '{print $3}'
      ip -br link show master br0 | awk '{print $1}' | grep -x tap0
    expect: {rc: 0, stdout: "\\A192\\.0\\.2\\.1/24\\ntap0\\n\\Z"}

  - id: client-isolation-on-the-bridge
    what: client isolation is on, so proxy_arp_pvlan on br0 is 0
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "45", text: "$proxy_arp = Numeric(!$client_isolation)"}
      - {path: manifests/openvpn_server.pp, lines: "211", text: "sysctl  { 'net.ipv4.conf.br0.proxy_arp_pvlan': value => $proxy_arp  }"}
    probe: |
      sysctl -n net.ipv4.conf.br0.proxy_arp_pvlan
    expect: {rc: 0, stdout: "\\A0\\n\\Z"}

  - id: networking-brings-up-the-bridge-at-boot
    what: >-
      ifupdown is installed, the networking service (which reads /etc/network/interfaces at boot) is enabled, and the
      interfaces file declares br0 static with lan_static_ip and bridge port lan_iface
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "35-41", text: "package { [ 'ifupdown', 'bridge-utils']: ensure => present }"}
      - {path: manifests/openvpn_server.pp, lines: "100-115", text: "bridge_ports    => $lan_iface,"}
    probe: |
      dpkg-query -W -f '${Package} ${Status}\n' ifupdown
      systemctl is-enabled networking
      p8_count '^auto( .+)? br0( |$)' /etc/network/interfaces
      grep -E '^(iface br0 inet static|address 192\.0\.2\.1|\s+bridge_ports lo:0)$' /etc/network/interfaces | sed 's/^\s*//'
    expect: {rc: 0, stdout: "\\Aifupdown install ok installed\\nenabled\\n1\\niface br0 inet static\\naddress 192\\.0\\.2\\.1\\nbridge_ports lo:0\\n\\Z"}

  - id: vpn-account-on-the-server
    what: a local account exists on the server for PAM authentication (setup for the client checks)
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "169", text: "pam                      => true,"}
    mutates: creates the local account p8vpnuser on the server node with the fake password p8test-vpn-not-a-secret
    probe: |
      useradd -M -s /usr/sbin/nologin p8vpnuser && echo 'p8vpnuser:p8test-vpn-not-a-secret' | chpasswd
    effect: |
      getent passwd p8vpnuser | cut -d: -f1
    expect: {rc: 0, stdout: "\\Ap8vpnuser\\n\\Z"}

  - id: client-connects-gets-a-pool-address-and-reaches-the-server-side
    what: >-
      the peer's client authenticates with the PAM account, receives the pushed options, gets a tap address from the
      server-bridge pool and reaches lan_static_ip on the server's bridge through the tunnel
    control: negative
    host: peer
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "172", text: "push                     => ['redirect-gateway bypass-dhcp bypass-dns', \"dhcp-option DNS ${push_dns_server}\"],"}
      - {path: manifests/openvpn_server.pp, lines: "173", text: "server_bridge            => \"${lan_static_ip} ${lan_netmask} ${vpn_pool_start} ${vpn_pool_end}\","}
    mutates: >-
      on the peer: installs the openvpn package, adds the host route 203.0.113.50 via the node's host-only address,
      writes a client config and credentials under /run/p8vpn and starts an openvpn client daemon
    probe: |
      DEBIAN_FRONTEND=noninteractive apt-get -qq -y install openvpn >/dev/null
      ip route replace 203.0.113.50/32 via 192.168.56.20
      mkdir -p /run/p8vpn
      printf 'p8vpnuser\np8test-vpn-not-a-secret\n' > /run/p8vpn/auth
      printf 'client\ndev tap\nproto udp\nremote 203.0.113.50 1194\nca /run/p8test-from-node/ca.crt\nauth-user-pass /run/p8vpn/auth\ncipher AES-256-CBC\ndata-ciphers AES-256-GCM:AES-256-CBC\ncomp-lzo\nallow-compression yes\npull-filter ignore "redirect-gateway"\nverb 3\n' > /run/p8vpn/client.conf
      openvpn --config /run/p8vpn/client.conf --daemon --log /run/p8vpn/client.log --writepid /run/p8vpn/pid
      for i in $(seq 40); do grep -q 'Initialization Sequence Completed' /run/p8vpn/client.log && break; sleep 1; done
    effect: |
      grep -c 'Initialization Sequence Completed' /run/p8vpn/client.log
      grep -o 'PUSH_REPLY,[^]]*' /run/p8vpn/client.log | head -1 | grep -o -e 'redirect-gateway bypass-dhcp bypass-dns' -e 'dhcp-option DNS 8.8.8.8'
      ip -4 -br addr show "$(ip -br link | awk '$1 ~ /^tap/ {print $1; exit}')" | awk '{print $3}'
      ping -c 2 -W 2 192.0.2.1 >/dev/null && echo reaches-server-side
    expect: {rc: 0, stdout: "\\A1\\nredirect-gateway bypass-dhcp bypass-dns\\ndhcp-option DNS 8\\.8\\.8\\.8\\n192\\.0\\.2\\.(1[0-4][0-9]|150)/24\\nreaches-server-side\\n\\Z"}

  - id: wrong-password-rejected
    what: a client with a wrong password for the same account is refused (AUTH_FAILED) and gets no tunnel
    control: negative
    host: peer
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "169", text: "pam                      => true,"}
    mutates: >-
      on the peer: writes a second client config with a wrong password under /run/p8vpn-bad and starts a second openvpn
      client daemon (it stops itself on AUTH_FAILED)
    probe: |
      mkdir -p /run/p8vpn-bad
      printf 'p8vpnuser\np8test-wrong-password\n' > /run/p8vpn-bad/auth
      sed 's#/run/p8vpn/auth#/run/p8vpn-bad/auth#' /run/p8vpn/client.conf > /run/p8vpn-bad/client.conf
      openvpn --config /run/p8vpn-bad/client.conf --daemon --log /run/p8vpn-bad/client.log
      for i in $(seq 40); do grep -q -e 'AUTH_FAILED' -e 'Initialization Sequence Completed' /run/p8vpn-bad/client.log && break; sleep 1; done
    effect: |
      grep -c 'AUTH_FAILED' /run/p8vpn-bad/client.log
      grep -c 'Initialization Sequence Completed' /run/p8vpn-bad/client.log || true
    expect: {rc: 0, stdout: "\\A[1-9]\\d*\\n0\\n\\Z"}

  - id: a-second-vpn-account
    what: a second local account on the server for the second client (setup for the isolation check)
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "168", text: "username_as_common_name  => true,"}
    mutates: creates the local account p8vpnuser2 on the server node with the fake password p8test-vpn2-not-a-secret
    probe: |
      useradd -M -s /usr/sbin/nologin p8vpnuser2 && echo 'p8vpnuser2:p8test-vpn2-not-a-secret' | chpasswd
    effect: |
      getent passwd p8vpnuser2 | cut -d: -f1
    expect: {rc: 0, stdout: "\\Ap8vpnuser2\\n\\Z"}

  - id: a-second-client-reaches-the-server-side-but-not-the-first
    what: >-
      a second client, in a network namespace on the peer, connects as p8vpnuser2, gets a pool address and reaches
      lan_static_ip, but gets no answer from the first client's pool address (client isolation)
    control: negative
    host: peer
    timeout: 180
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "43-45", text: "$proxy_arp = Numeric(!$client_isolation)"}
      - {path: manifests/openvpn_server.pp, lines: "25", text: "Boolean $client_isolation = true,"}
    mutates: >-
      on the peer: creates network namespace p8vpn2 joined to the peer by veth p8vpn2a (10.253.0.1/30) / p8vpn2b
      (10.253.0.2/30, default route via 10.253.0.1), turns on IPv4 forwarding and masquerades 10.253.0.0/30 in the
      peer's nat POSTROUTING, writes a client config and the p8vpnuser2 credentials under /run/p8vpn2 and starts a
      second openvpn client daemon inside the namespace
    probe: |
      ip netns add p8vpn2
      ip link add p8vpn2a type veth peer name p8vpn2b
      ip link set p8vpn2b netns p8vpn2
      ip addr add 10.253.0.1/30 dev p8vpn2a; ip link set p8vpn2a up
      ip netns exec p8vpn2 ip addr add 10.253.0.2/30 dev p8vpn2b
      ip netns exec p8vpn2 ip link set p8vpn2b up; ip netns exec p8vpn2 ip link set lo up
      ip netns exec p8vpn2 ip route add default via 10.253.0.1
      sysctl -q -w net.ipv4.ip_forward=1
      iptables -t nat -A POSTROUTING -s 10.253.0.0/30 -m comment --comment p8test-vpn2 -j MASQUERADE
      mkdir -p /run/p8vpn2
      printf 'p8vpnuser2\np8test-vpn2-not-a-secret\n' > /run/p8vpn2/auth
      sed 's#/run/p8vpn/auth#/run/p8vpn2/auth#' /run/p8vpn/client.conf > /run/p8vpn2/client.conf
      ip netns exec p8vpn2 openvpn --config /run/p8vpn2/client.conf --daemon --log /run/p8vpn2/client.log --writepid /run/p8vpn2/pid
      for i in $(seq 40); do grep -q -e 'Initialization Sequence Completed' -e 'AUTH_FAILED' /run/p8vpn2/client.log && break; sleep 1; done
    effect: |
      grep -c 'Initialization Sequence Completed' /run/p8vpn2/client.log
      first=$(ip -4 -br addr show "$(ip -br link | awk '$1 ~ /^tap/ {print $1; exit}')" | awk '{print $3}' | cut -d/ -f1)
      second=$(ip netns exec p8vpn2 ip -4 -br addr | awk '$1 ~ /^tap/ {print $3; exit}' | cut -d/ -f1)
      [ -n "$first" ] && [ -n "$second" ] && [ "$first" != "$second" ] && echo two-pool-addresses
      ip netns exec p8vpn2 ping -c 2 -W 2 192.0.2.1 >/dev/null && echo second-reaches-server-side
      ip netns exec p8vpn2 ping -c 3 -W 2 "$first" >/dev/null && echo second-reaches-first || echo first-unreachable
    expect: {rc: 0, stdout: "\\A1\\ntwo-pool-addresses\\nsecond-reaches-server-side\\nfirst-unreachable\\n\\Z"}

  - id: the-data-channel-is-compressed-both-ways
    what: >-
      LZO compression works in both directions of the first client's data channel: zero-filled pings from the server
      side to the client (1228-byte IP packets) cross the tunnel as UDP packets well under their size, and so do the
      replies (counted on the node; under 600 bytes per packet counts as compressed)
    control: negative
    timeout: 60
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "30", text: "$compression              = 'comp-lzo' # To disable compression this value needs to be set to 'none'"}
      - {path: manifests/openvpn_server.pp, lines: "166", text: "compression              => $compression,"}
    mutates: >-
      on the node: inserts two counting rules (no target) for UDP 1194, `-I OUTPUT -p udp --sport 1194 -m comment
      --comment p8test-vpn-out` and `-I INPUT -p udp --dport 1194 -m comment --comment p8test-vpn-in`; reads the first
      client's pool address from the server's PUSH_REPLY to p8vpnuser in its journal and sends it 20 pings with a
      1200-byte zero payload; keeps the address and ping summary under /run/p8test-vpncomp
    probe: |
      install -d -m 0700 /run/p8test-vpncomp
      iptables -I OUTPUT -p udp --sport 1194 -m comment --comment p8test-vpn-out
      iptables -I INPUT -p udp --dport 1194 -m comment --comment p8test-vpn-in
      first=$(journalctl -u openvpn-server@puppet_infrastructure --no-pager -q | grep -o "SENT CONTROL \[p8vpnuser\]: 'PUSH_REPLY,.*ifconfig [0-9.]*" | tail -1 | grep -o '[0-9.]*$')
      echo "$first" > /run/p8test-vpncomp/first
      ping -c 20 -i 0.2 -s 1200 -p 00 -W 2 "$first" > /run/p8test-vpncomp/ping 2>&1
    effect: |
      p8_count ' 0% packet loss' /run/p8test-vpncomp/ping
      iptables -v -x -L OUTPUT -n | awk '/p8test-vpn-out/ {print "server sends: " (($1 && $2/$1 < 600) ? "compressed" : "uncompressed") " (" ($1 ? int($2/$1) : 0) " bytes per packet)"}'
      iptables -v -x -L INPUT -n | awk '/p8test-vpn-in/ {print "server receives: " (($1 && $2/$1 < 600) ? "compressed" : "uncompressed") " (" ($1 ? int($2/$1) : 0) " bytes per packet)"}'
    expect: {rc: 0, stdout: "\\A1\\nserver sends: compressed \\(\\d+ bytes per packet\\)\\nserver receives: compressed \\(\\d+ bytes per packet\\)\\n\\Z"}

  - id: a-client-on-the-class-cipher-connects
    what: >-
      a client that offers only the class's cipher (AES-256-CBC) connects as p8vpnuser2 and its data channel uses that
      cipher
    control: negative
    host: peer
    timeout: 120
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "19", text: "$cipher                   = 'AES-256-CBC',"}
      - {path: manifests/openvpn_server.pp, lines: "177", text: "cipher                   => $cipher,"}
    mutates: >-
      on the peer: stops the second client (its pid in /run/p8vpn2/pid), writes a client config that offers only
      AES-256-CBC (data-ciphers AES-256-CBC) with the p8vpnuser2 credentials under /run/p8vpncbc and starts it inside
      namespace p8vpn2
    probe: |
      kill "$(cat /run/p8vpn2/pid)" 2>/dev/null || true
      sleep 1
      mkdir -p /run/p8vpncbc
      sed -e 's#/run/p8vpn/auth#/run/p8vpn2/auth#' -e 's#^data-ciphers .*#data-ciphers AES-256-CBC#' /run/p8vpn/client.conf > /run/p8vpncbc/client.conf
      ip netns exec p8vpn2 openvpn --config /run/p8vpncbc/client.conf --daemon --log /run/p8vpncbc/client.log --writepid /run/p8vpncbc/pid
      for i in $(seq 40); do grep -q -e 'Initialization Sequence Completed' -e 'AUTH_FAILED' /run/p8vpncbc/client.log && break; sleep 1; done
    effect: |
      p8_count 'Initialization Sequence Completed' /run/p8vpncbc/client.log
      grep -o "Data Channel: cipher '[^']*'" /run/p8vpncbc/client.log | head -1
      grep -o 'AUTH_FAILED,.*)' /run/p8vpncbc/client.log | head -1
    expect: {rc: 0, stdout: "\\A1\\nData Channel: cipher 'AES-256-CBC'\\n\\Z"}

  - id: another-dns-cipher-and-isolation-off
    variant: other
    what: >-
      with push_dns_server 9.9.9.9, cipher AES-128-CBC and client_isolation false, the server pushes DNS 9.9.9.9, names
      that cipher, and proxy_arp_pvlan on br0 is 1
    control: negative
    derived_from:
      - {path: manifests/openvpn_server.pp, lines: "172", text: "\"dhcp-option DNS ${push_dns_server}\"]"}
      - {path: manifests/openvpn_server.pp, lines: "177", text: "cipher                   => $cipher,"}
      - {path: manifests/openvpn_server.pp, lines: "45", text: "$proxy_arp = Numeric(!$client_isolation)"}
    probe: |
      grep -E '^push "dhcp-option DNS ' /etc/openvpn/server/puppet_infrastructure.conf
      grep -E '^cipher ' /etc/openvpn/server/puppet_infrastructure.conf
      sysctl -n net.ipv4.conf.br0.proxy_arp_pvlan
    expect: {rc: 0, stdout: "\\Apush \"dhcp-option DNS 9\\.9\\.9\\.9\"\\ncipher AES-128-CBC\\n1\\n\\Z"}
