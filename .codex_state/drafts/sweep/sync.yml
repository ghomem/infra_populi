# Phase 3 checks for puppet_infrastructure::sync (define; harness title `sync`, so the tag is "sync").
# Fixture (params, never committed): localdir /var/tmp/p8test-sync, remotedir /srv/p8test, localuser root (cron needs
# an account the clean node has), remoteuser p8testuser, hour 3, minute 17, hostlist "p8test.example.invalid:22
# p8test2.example.invalid:22" (two hosts since 2026-11-19, both names pinned to the peer),
# suffix -p8test, bwlimit_mbitps 10 (the conversion branch: 10 Mbit/s = 1.19 MiB/s). bindir comes from Hiera
# filesystem::bindir = /opt/puppet-infrastructure/bin (required_base filesystem_base).
# Extended 2026-11-19 (backfill batch 5, HQ batch-10 rulings 2 and C1): the script runs as behaviour against the peer
# (ubuntu2) as the remote host. The fixture host name p8test.example.invalid is pinned to the peer in the node's
# /etc/hosts (by reference, $P8_PEER_ADDR), root's public key is handed to the peer, where p8testuser serves
# /srv/p8test. The first run must mirror it into /var/tmp/p8test-sync/p8test.example.invalid-p8test, taking at least
# 4.5 s for a 6 MiB incompressible file under the 1.19 MiB/s limit; a file removed on the peer must be removed
# locally by the next run (--delete).
# Correction round 1, 2026-11-19 (review 20261119T174521Z FAIL, purpose): the class is multi-host (sync.pp:2, the
# template's loop over $HOSTS with a target directory per host), and the fixture listed one host, my choice rather than
# a lab limit. The fixture now lists two names, both pinned to the peer: each must get its own mirror, and the run
# moves 12 MiB, so the limit means at least 9 s.
# Authoring error 2026-11-19 (run 20261119T174827Z): the listing of the two mirrors followed the node's locale, which
# sorts p8test2 before p8test. (punctuation ignored); it is sorted with LC_ALL=C now. Both mirrors and the limit passed
# in that run (12.67 s for 12 MiB).
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1): another port, no limit and another local user (undeterminable
# production use: the passwd/ layer) are a check in the variant run `other`; the 03:17 firing names what is missing.
class: sync
baseline: release-0.9.10 (cf477c6)
fixture: params
peer:
  kind: ubuntu2
  why: the script pulls a directory from remote hosts over ssh, so a second machine must play the remote host
  files: [/run/p8test-sync/root.pub]
purpose: >-
  A simple multi-host remote-to-local daily synchronisation: a per-tag script, run daily by the local user's cron,
  mirrors each listed host's remote directory into <localdir>/<host><suffix> with rsync over ssh as the remote user
  (deleting what the remote no longer has), at an optional bandwidth limit.
outcomes:
  - outcome: the per-tag script is installed root:root 0755 with the parameters, and parses
    from: manifests/sync.pp:32-37; templates/backup/sync.sh.erb:9-17
    checks: [script-installed-root-0755, script-carries-the-parameters, script-is-valid-bash]
  - outcome: the local user's crontab runs it daily at hour:minute
    from: manifests/sync.pp:39-45
    checks: [daily-cron-for-the-local-user]
  - outcome: a run mirrors each listed host's directory into its own <localdir>/<host><suffix> over ssh as the remote user
    from: manifests/sync.pp:1-2; templates/backup/sync.sh.erb:24-31
    checks: [root-key-and-the-remote-host-name, the-peer-serves-the-remote-dir, the-script-mirrors-the-remote-dir]
  - outcome: the bandwidth limit (Mbit/s converted to rsync's MiB/s) slows the transfer
    from: manifests/sync.pp:8-26; templates/backup/sync.sh.erb:17, 24
    checks: [bandwidth-limit-converted, the-script-mirrors-the-remote-dir]
  - outcome: a file removed on the remote host is removed locally by the next run (--delete)
    from: templates/backup/sync.sh.erb:21-24
    checks: [a-file-is-removed-on-the-remote, the-next-run-removes-it-locally-too]
  - outcome: cron itself firing at 03:17
    from: manifests/sync.pp:39-45
    uncovered:
      why: a run would have to wait for 03:17; the crontab entry is checked and the script it names is run by hand
      lifted_by: "capability: a wall-clock trigger in phase3.py runs (waiting for, or shifting, the node's time)"
      evidence: >-
        clock_check.py (HQ 2026-11-17 batch-8 ruling 4) requires every lab clock to agree with the laptop's, and
        phase3.py has no step that waits for a time of day
  - outcome: other ports, no limit, another local user
    from: manifests/sync.pp:3, 11-13
    checks: [no-limit-another-port-and-local-user]
variants:
  - name: other
    why: >-
      another port, no limit and another local user; production's syncs are declared in the passwd/ layer, which the
      engine never reads, so whether production uses them is undeterminable and they are tested
    params: other
checks:
  - id: script-installed-root-0755
    what: the per-tag sync script is installed in bindir, root:root, mode 0755
    control: negative
    derived_from:
      - {path: manifests/sync.pp, lines: "33-35", text: "mode    => '0755',"}
      - {path: manifests/sync.pp, lines: "34", text: "owner   => 'root',"}
    probe: stat -c '%U %G %a' /opt/puppet-infrastructure/bin/sync-sync.sh
    expect: {rc: 0, stdout: "\\Aroot root 755\\n\\Z"}

  - id: script-carries-the-parameters
    what: the template renders the host list, remote user, local and remote directories and the suffix
    control: negative
    derived_from:
      - {path: templates/backup/sync.sh.erb, lines: "9", text: "HOSTS=\"<%= @hostlist %>\""}
      - {path: templates/backup/sync.sh.erb, lines: "13-16", text: "REMOTEUSER=\"<%= @remoteuser %>\""}
      - {path: manifests/sync.pp, lines: "36", text: "content => template('puppet_infrastructure/backup/sync.sh.erb'),"}
    probe: grep -E '^(HOSTS|REMOTEUSER|LOCALDIR|REMOTEDIR|SUFFIX)=' /opt/puppet-infrastructure/bin/sync-sync.sh
    expect: {rc: 0, stdout: "\\AHOSTS=\"p8test\\.example\\.invalid:22 p8test2\\.example\\.invalid:22\"\\nREMOTEUSER=\"p8testuser\"\\nLOCALDIR=\"/var/tmp/p8test-sync\"\\nREMOTEDIR=\"/srv/p8test\"\\nSUFFIX=\"-p8test\"\\n\\Z"}

  - id: bandwidth-limit-converted
    what: a 10 Mbit/s limit becomes rsync's --bwlimit=1.19m (megabit to MiB, two decimals) in the rsync options
    control: negative
    derived_from:
      - {path: manifests/sync.pp, lines: "19", text: "$bwlimit_mbyteps_float = $bwlimit_mbitps_float*1000.0*1000.0/(8.0*1024.0*1024.0)"}
      - {path: manifests/sync.pp, lines: "21", text: "$bwlimit_mbyteps_str = sprintf('%.2f', $bwlimit_mbyteps_float)"}
      - {path: manifests/sync.pp, lines: "24", text: "$bwlimit_opt = \" --bwlimit=${bwlimit_mbyteps_str}m\""}
      - {path: templates/backup/sync.sh.erb, lines: "17", text: "BWLIMIT_OPT=\"<%= @bwlimit_opt %>\""}
      - {path: templates/backup/sync.sh.erb, lines: "24", text: "RSYNCOPTS=\"-av --partial --delete${BWLIMIT_OPT}\""}
    probe: grep -E '^(BWLIMIT_OPT|RSYNCOPTS)=' /opt/puppet-infrastructure/bin/sync-sync.sh
    expect: {rc: 0, stdout: "\\ABWLIMIT_OPT=\" --bwlimit=1\\.19m\"\\nRSYNCOPTS=\"-av --partial --delete\\$\\{BWLIMIT_OPT\\}\"\\n\\Z"}

  - id: script-is-valid-bash
    what: the rendered script parses as bash
    control: negative
    derived_from:
      - {path: manifests/sync.pp, lines: "36", text: "content => template('puppet_infrastructure/backup/sync.sh.erb'),"}
    probe: bash -n /opt/puppet-infrastructure/bin/sync-sync.sh && echo parses
    expect: {rc: 0, stdout: "\\Aparses\\n\\Z"}

  - id: daily-cron-for-the-local-user
    what: the local user's crontab runs the script daily at hour:minute, named cron_sync_<tag>
    control: negative
    derived_from:
      - {path: manifests/sync.pp, lines: "40-43", text: "command => \"${bindir}/sync-${mytag}.sh\","}
      - {path: manifests/sync.pp, lines: "41", text: "user    => $localuser,"}
      - {path: manifests/sync.pp, lines: "42-43", text: "hour    => $hour,"}
    probe: |
      crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: cron_sync_sync'
    expect: {rc: 0, stdout: "\\A# Puppet Name: cron_sync_sync\\n17 3 \\* \\* \\* /opt/puppet-infrastructure/bin/sync-sync\\.sh\\n\\Z"}

  - id: root-key-and-the-remote-host-name
    what: setup for the run, root has an ssh key whose public half is handed to the peer, and both fixture host names resolve to the peer
    control: negative
    derived_from:
      - {path: templates/backup/sync.sh.erb, lines: "3-5", text: "# between the local user that runs the script and $REMOTEUSER"}
    mutates: >-
      on the node: creates /root/.ssh/id_ed25519 if root has none, copies its public half to /run/p8test-sync/root.pub
      (handed to the peer), and appends "$P8_PEER_ADDR p8test.example.invalid p8test2.example.invalid" to /etc/hosts
    probe: |
      install -d -m 0700 /root/.ssh /run/p8test-sync
      [ -f /root/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -C p8test-sync-root -f /root/.ssh/id_ed25519
      cp /root/.ssh/id_ed25519.pub /run/p8test-sync/root.pub
      grep -q ' p8test2\.example\.invalid$' /etc/hosts || echo "$P8_PEER_ADDR p8test.example.invalid p8test2.example.invalid" >> /etc/hosts
    effect: |
      for h in p8test.example.invalid p8test2.example.invalid; do [ "$(getent hosts $h | awk '{print $1}')" = "$P8_PEER_ADDR" ] && echo "$h pinned-to-the-peer"; done
      test -s /run/p8test-sync/root.pub && echo key-ready
    expect: {rc: 0, stdout: "\\Ap8test\\.example\\.invalid pinned-to-the-peer\\np8test2\\.example\\.invalid pinned-to-the-peer\\nkey-ready\\n\\Z"}

  - id: the-peer-serves-the-remote-dir
    what: setup for the run, the peer's p8testuser trusts root's key and owns /srv/p8test with three small files and a 6 MiB one
    control: negative
    host: peer
    derived_from:
      - {path: templates/backup/sync.sh.erb, lines: "30", text: "rsync $RSYNCOPTS -e \"ssh -p $PORT -x -o 'StrictHostKeyChecking no'\" $REMOTEUSER@$HOST:$REMOTEDIR/ $TARGETDIR"}
    mutates: >-
      on the peer: creates the account p8testuser with the node root's public key as its only authorized key, and
      /srv/p8test (owned by it) with a.txt, sub/b.txt, gone.txt and big.bin (6 MiB from /dev/urandom)
    probe: |
      id p8testuser >/dev/null 2>&1 || useradd -m -s /bin/bash p8testuser
      install -d -m 0700 -o p8testuser -g p8testuser /home/p8testuser/.ssh
      install -m 0600 -o p8testuser -g p8testuser /run/p8test-from-node/root.pub /home/p8testuser/.ssh/authorized_keys
      install -d /srv/p8test/sub
      printf 'p8test sync a\n' > /srv/p8test/a.txt
      printf 'p8test sync b\n' > /srv/p8test/sub/b.txt
      printf 'p8test sync gone\n' > /srv/p8test/gone.txt
      head -c 6291456 /dev/urandom > /srv/p8test/big.bin
      chown -R p8testuser:p8testuser /srv/p8test
    effect: |
      cd /srv/p8test && find . -type f | sort | tr '\n' ' '; echo
      stat -c '%U %a' /home/p8testuser/.ssh/authorized_keys
    expect: {rc: 0, stdout: "\\A\\./a\\.txt \\./big\\.bin \\./gone\\.txt \\./sub/b\\.txt \\np8testuser 600\\n\\Z"}

  - id: the-script-mirrors-the-remote-dir
    what: >-
      the installed script, run once by hand as root, mirrors the peer's /srv/p8test once per listed host, into
      /var/tmp/p8test-sync/p8test.example.invalid-p8test and .../p8test2.example.invalid-p8test (same files, same
      content), and takes at least 9 s, as the 1.19 MiB/s limit requires for 2 x 6 MiB
    control: negative
    timeout: 120
    derived_from:
      - {path: templates/backup/sync.sh.erb, lines: "24-31", text: "TARGETDIR=$LOCALDIR/$HOST$SUFFIX"}
      - {path: manifests/sync.pp, lines: "24", text: "$bwlimit_opt = \" --bwlimit=${bwlimit_mbyteps_str}m\""}
    mutates: >-
      on the node: runs /opt/puppet-infrastructure/bin/sync-sync.sh once as root (rsync over ssh to the peer), which
      creates /var/tmp/p8test-sync/p8test.example.invalid-p8test and p8test2.example.invalid-p8test; its exit status
      and duration go to /run/p8test-sync
    probe: |
      s=$(date +%s.%N)
      /opt/puppet-infrastructure/bin/sync-sync.sh > /run/p8test-sync/run1.log 2>&1; echo $? > /run/p8test-sync/run1.rc
      echo "$(date +%s.%N) - $s" | bc > /run/p8test-sync/run1.seconds
    effect: |
      echo "rc $(cat /run/p8test-sync/run1.rc)"
      ls -1 /var/tmp/p8test-sync | LC_ALL=C sort | tr '\n' ' '; echo
      for h in p8test p8test2; do
        cd "/var/tmp/p8test-sync/$h.example.invalid-p8test" && echo "$h: $(find . -type f | sort | tr '\n' ' ')$(cat a.txt sub/b.txt | tr '\n' '|')$(stat -c %s big.bin)"
      done
      awk '{print ($1 + 0 < 9) ? "unlimited (" $1 " s)" : "limited"}' /run/p8test-sync/run1.seconds
    expect: {rc: 0, stdout: "\\Arc 0\\np8test\\.example\\.invalid-p8test p8test2\\.example\\.invalid-p8test \\np8test: \\./a\\.txt \\./big\\.bin \\./gone\\.txt \\./sub/b\\.txt p8test sync a\\|p8test sync b\\|6291456\\np8test2: \\./a\\.txt \\./big\\.bin \\./gone\\.txt \\./sub/b\\.txt p8test sync a\\|p8test sync b\\|6291456\\nlimited\\n\\Z"}

  - id: a-file-is-removed-on-the-remote
    what: setup for the delete check, gone.txt removed from the peer's /srv/p8test
    control: negative
    host: peer
    derived_from:
      - {path: templates/backup/sync.sh.erb, lines: "21-22", text: "# we use the delete options because we assume snapshots are being taken care of"}
    mutates: on the peer, removes /srv/p8test/gone.txt
    probe: |
      rm -f /srv/p8test/gone.txt
    effect: |
      cd /srv/p8test && find . -type f | sort | tr '\n' ' '; echo
    expect: {rc: 0, stdout: "\\A\\./a\\.txt \\./big\\.bin \\./sub/b\\.txt \\n\\Z"}

  - id: the-next-run-removes-it-locally-too
    what: the script's next run removes gone.txt from both hosts' local mirrors and keeps the rest (rsync --delete)
    control: negative
    timeout: 120
    derived_from:
      - {path: templates/backup/sync.sh.erb, lines: "24", text: "RSYNCOPTS=\"-av --partial --delete${BWLIMIT_OPT}\""}
    mutates: on the node, runs /opt/puppet-infrastructure/bin/sync-sync.sh a second time as root; its exit status goes to /run/p8test-sync/run2.rc
    probe: |
      /opt/puppet-infrastructure/bin/sync-sync.sh > /run/p8test-sync/run2.log 2>&1; echo $? > /run/p8test-sync/run2.rc
    effect: |
      echo "rc $(cat /run/p8test-sync/run2.rc)"
      for h in p8test p8test2; do cd "/var/tmp/p8test-sync/$h.example.invalid-p8test" && echo "$h: $(find . -type f | sort | tr '\n' ' ')"; done
    expect: {rc: 0, stdout: "\\Arc 0\\np8test: \\./a\\.txt \\./big\\.bin \\./sub/b\\.txt \\np8test2: \\./a\\.txt \\./big\\.bin \\./sub/b\\.txt \\n\\Z"}

  - id: no-limit-another-port-and-local-user
    variant: other
    what: >-
      with bwlimit_mbitps 0 the script passes no --bwlimit, with a host on port 2222 the host list carries it, and with
      localuser nobody the daily job is in nobody's crontab at 03:17
    control: negative
    derived_from:
      - {path: manifests/sync.pp, lines: "11-13", text: "$bwlimit_opt = ''"}
      - {path: templates/backup/sync.sh.erb, lines: "9", text: "HOSTS=\"<%= @hostlist %>\""}
      - {path: manifests/sync.pp, lines: "39-45", text: "user    => $localuser,"}
    probe: |
      grep -E '^(HOSTS|BWLIMIT_OPT)=' /opt/puppet-infrastructure/bin/sync-sync.sh
      crontab -l -u nobody | grep -v '^#'
    expect: {rc: 0, stdout: "\\AHOSTS=\"p8test\\.example\\.invalid:2222\"\\nBWLIMIT_OPT=\"\"\\n17 3 \\* \\* \\* /opt/puppet-infrastructure/bin/sync-sync\\.sh\\n\\Z"}
