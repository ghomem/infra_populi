# Phase 3 checks for puppet_infrastructure::filesystem_apt (class; node ubuntu; Ubuntu 24.04). Fixture: defaults
# (server_mode true, relevant_updates_method 2, relevant_updates_no_kernel false; no Hiera prio/hour/minute keys, so
# High at 00:00). The class installs update helper scripts, openscap-scanner (24.04) and a daily cron that keeps the
# list of updates of priority >= High in /var/lib/apt-check-updates/list. Probes read the node's own files; mutating
# checks run the helpers as an operator or the cron would, against the Ubuntu archive and Canonical's OVAL data.
class: filesystem_apt
baseline: release-0.9.10 (cf477c6)
fixture: defaults
authoring:
  minutes: 0.7
  notes: "11:00:27Z to 11:01:09Z 2026-11-18 (date at start and at validation; the baseline class and its scripts were read before the clock started), outside the worktree while firewall_secure's re-review ran."
purpose: >-
  Apt update tooling for Ubuntu 24.04 servers (the target release; the 20.04/22.04 openscap package branch is not in Phase 1): a wrapper that upgrades a package only if it is installed and has an update (never
  installing anything new), surface, kernel and full update scripts, and a daily job that lists the relevant (High or
  above) security updates from Canonical's OVAL data with openscap (for monitoring), and a script that installs the
  updates on that list through the wrapper; each script is run here.
# Outcomes table added 2026-11-19 (backfill batch 3, HQ batch-10 ruling 2); the set-level uncovered list moved into it.
outcomes:
  - outcome: the update scripts are installed (wrapper, surface, kernel, full, relevant updates) and openscap is available for the relevant-updates job
    from: manifests/filesystem_apt.pp:23-30, 63-70, 84-100, 113-157, 184-190
    checks: [helper-scripts-installed]
  - outcome: the wrapper updates an installed package and never installs a missing one
    from: manifests/filesystem_apt.pp:23-30
    checks: [the-wrapper-never-installs-a-missing-package, the-wrapper-upgrades-an-installed-package-with-an-update]
  - outcome: the surface script updates the server surface list (server_mode true) through the wrapper
    from: manifests/filesystem_apt.pp:32-70
    checks: [surface-list-and-daily-job, the-surface-script-updates-an-outdated-surface-package]
  - outcome: a daily job lists the relevant (High and above) security updates from Canonical's OVAL data, and the relevant-updates script installs them
    from: manifests/filesystem_apt.pp:102-190
    checks: [surface-list-and-daily-job, the-daily-job-lists-relevant-updates, the-job-s-list-is-installed-by-the-relevant-updates-script, the-relevant-updates-on-the-list-get-installed]
  - outcome: the kernel script brings the kernel metapackage up to date
    from: manifests/filesystem_apt.pp:84-91
    checks: [the-kernel-script-brings-the-kernel-metapackage-up-to-date]
  - outcome: the full update script leaves nothing to upgrade
    from: manifests/filesystem_apt.pp:93-100
    checks: [the-full-update-script-leaves-nothing-to-upgrade]
  - outcome: "the desktop variant (server_mode false): the desktop surface list and the compatibility link"
    from: manifests/filesystem_apt.pp:10, 54-58, 72-82
    uncovered: {why: "a fixture variant: the fixture is a server and one set holds one fixture; untested", lifted_by: gnome}
  - outcome: "the other parameter variants: relevant_updates_method 0 (no relevant-updates job), relevant_updates_no_kernel true, a custom apt_surface_list, and Hiera prio_threshold/checkhour/checkmin"
    from: manifests/filesystem_apt.pp:12-18, 52-61, 113-176
    uncovered: {why: "fixture variants of the same server (one set holds one fixture, the defaults); untested", lifted_by: ubuntu}
checks:
  - id: helper-scripts-installed
    what: the helper scripts are installed root-owned 0755 (the static ones byte for byte), and openscap-scanner is installed
    control: negative
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "24-30", text: "source  => 'puppet:///modules/puppet_infrastructure/apt/apt-update-pkg.sh',"}
      - {path: manifests/filesystem_apt.pp, lines: "120-128", text: "$openscap_pkg = 'openscap-scanner'"}
      - {path: files/apt/apt-update-pkg.sh, sha256: "b19393a1aa921a1480f37a91186696d8c460b7f85a07d07d9523ec1006a947e5"}
      - {path: files/apt/apt-update-kernel.sh, sha256: "8ea185cfd1e85d8d07a7eb071311cf8b8c4c2f3bbc89deee121a5fbb9cb3a1db"}
      - {path: files/apt/apt-update-dist.sh, sha256: "c240c6764a5d2009dad22da00f2b6d432dcabb86e314372a9e4904ef79ec92a3"}
      - {path: files/apt/get-relevant-updates-list, sha256: "077fa70554dde020c847d4260b4907cc2578facb81b18872c65c051c0c118bf6"}
      - {path: manifests/filesystem_apt.pp, lines: "178-191", text: "file { \"${localdir}/bin/apt-update-relevant.sh\":"}
    probe: |
      cd /opt/puppet-infrastructure/bin
      stat -c '%n %U %a' apt-update-pkg.sh apt-update-surface.sh apt-update-kernel.sh apt-update-dist.sh get-relevant-updates-list apt-check-updates.sh apt-update-relevant.sh
      stat -c '%n %a' /var/lib/apt-check-updates
      sha256sum apt-update-pkg.sh apt-update-kernel.sh apt-update-dist.sh get-relevant-updates-list | awk '{print $1}'
      dpkg-query -W -f '${Package} ${Status}\n' openscap-scanner
    expect: {rc: 0, stdout: "\\Aapt-update-pkg\\.sh root 755\\napt-update-surface\\.sh root 755\\napt-update-kernel\\.sh root 755\\napt-update-dist\\.sh root 755\\nget-relevant-updates-list root 755\\napt-check-updates\\.sh root 755\\napt-update-relevant\\.sh root 755\\n/var/lib/apt-check-updates 755\\nb19393a1aa921a1480f37a91186696d8c460b7f85a07d07d9523ec1006a947e5\\n8ea185cfd1e85d8d07a7eb071311cf8b8c4c2f3bbc89deee121a5fbb9cb3a1db\\nc240c6764a5d2009dad22da00f2b6d432dcabb86e314372a9e4904ef79ec92a3\\n077fa70554dde020c847d4260b4907cc2578facb81b18872c65c051c0c118bf6\\nopenscap-scanner install ok installed\\n\\Z"}

  - id: surface-list-and-daily-job
    what: >-
      the surface script updates the server surface list through the wrapper, and root's crontab runs the relevant
      updates job daily at 00:00 with threshold High
    control: negative
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "33-41", text: "$apt_surface_server = ['openssh-server', 'openssh-client', 'openssh-sftp-server',"}
      - {path: manifests/filesystem_apt.pp, lines: "163-176", text: "command  => \"${localdir}/bin/apt-check-updates.sh ${prio_threshold}\","}
    probe: |
      grep -E '^(UPDATE_CMD|SURFACE)=' /opt/puppet-infrastructure/bin/apt-update-surface.sh
      crontab -l -u root | grep -v '^#' | grep apt-check-updates
    expect: {rc: 0, stdout: "\\AUPDATE_CMD=/opt/puppet-infrastructure/bin/apt-update-pkg\\.sh\\nSURFACE=\"openssh-server openssh-client openssh-sftp-server openssl libssl1\\.1 libudev1 ca-certificates vim vim-runtime vim-common coreutils gzip less multitail util-linux openvpn nginx-core nginx-extras postfix dovecot-core rsyslog rsyslog-gnutls\"\\n0 0 \\* \\* \\* /opt/puppet-infrastructure/bin/apt-check-updates\\.sh High\\n\\Z"}

  - id: the-wrapper-never-installs-a-missing-package
    what: asked to update a package that is not installed (cowsay), the wrapper refuses and installs nothing
    control: negative
    derived_from:
      - {path: files/apt/apt-update-pkg.sh, sha256: "b19393a1aa921a1480f37a91186696d8c460b7f85a07d07d9523ec1006a947e5"}
      - {path: manifests/filesystem_apt.pp, lines: "23", text: "# wrapper for apt-get install the avoid undesired installs"}
    mutates: runs /opt/puppet-infrastructure/bin/apt-update-pkg.sh cowsay on the node; its output and exit code go to /run/p8test-apt/missing.txt
    probe: |
      install -d -m 0700 /run/p8test-apt
      { /opt/puppet-infrastructure/bin/apt-update-pkg.sh cowsay; echo "rc=$?"; } > /run/p8test-apt/missing.txt 2>&1
    effect: |
      cat /run/p8test-apt/missing.txt
      dpkg-query -W -f '${Status}\n' cowsay 2>/dev/null | grep -c ' installed$'
    expect: {rc: 1, stdout: "\\Apackage cowsay not installed\\nrc=1\\n0\\n\\Z"}

  - id: the-wrapper-upgrades-an-installed-package-with-an-update
    what: >-
      an installed package one version behind the archive (a small one, downgraded first) is upgraded by the wrapper
      to the archive's candidate version
    control: negative
    timeout: 300
    derived_from:
      - {path: files/apt/apt-update-pkg.sh, sha256: "b19393a1aa921a1480f37a91186696d8c460b7f85a07d07d9523ec1006a947e5"}
      - {path: manifests/filesystem_apt.pp, lines: "24-30", text: "file { \"${localdir}/bin/apt-update-pkg.sh\":"}
    mutates: >-
      picks the first of wget, less, tzdata, curl, vim-tiny whose archive has an older version than the installed
      candidate, downgrades it to that version (apt-get install --allow-downgrades), then runs apt-update-pkg.sh on it;
      the package and its versions go to /run/p8test-apt/upgrade.vars
    probe: |
      install -d -m 0700 /run/p8test-apt
      for p in wget less tzdata curl vim-tiny; do
        cand=$(apt-cache policy "$p" | awk '/Candidate:/ {print $2}')
        old=$(apt-cache madison "$p" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | grep -v -x "$cand" | head -1)
        [ -n "$old" ] && dpkg-query -W "$p" >/dev/null 2>&1 && break
        old=""
      done
      [ -n "$old" ] || { echo "no package with an older archive version" > /run/p8test-apt/upgrade.none; exit 0; }
      DEBIAN_FRONTEND=noninteractive apt-get -qq -y --allow-downgrades install "$p=$old" >/dev/null 2>&1
      before=$(dpkg-query -W -f '${Version}' "$p")
      out=$(/opt/puppet-infrastructure/bin/apt-update-pkg.sh "$p" 2>&1)
      printf '%s\n' "$out" | grep -q "^package $p updated to version $cand$" && reported=yes || reported=no
      printf 'p=%s\ncand=%s\nold=%s\nbefore=%s\nreported=%s\n' "$p" "$cand" "$old" "$before" "$reported" > /run/p8test-apt/upgrade.vars
    effect: |
      . /run/p8test-apt/upgrade.vars
      [ -n "$old" ] && [ "$before" = "$old" ] && echo "downgraded to the archive's older version"
      [ "$(dpkg-query -W -f '${Version}' "$p")" = "$cand" ] && echo "upgraded to the candidate"
      [ "$reported" = yes ] && echo "wrapper reported the update"
    expect: {rc: 0, stdout: "\\Adowngraded to the archive's older version\\nupgraded to the candidate\\nwrapper reported the update\\n\\Z"}

  # 2026-11-19 correction round 1 (review 20261119T025241Z): the list could be empty and still pass; the reverted node
  # has pending upgrades, so the job's list must now be non-empty with every listed package installed below its
  # candidate, and the next check installs the job's own list (the job, list and install chain end to end).
  - id: the-daily-job-lists-relevant-updates
    what: >-
      run as the cron runs it, the job fetches Canonical's OVAL data for the release, evaluates it with openscap and
      writes the list of updates of priority >= High: at least one package, one per line, each installed below its
      candidate (the reverted node has pending security updates)
    control: negative
    timeout: 600
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "149-155", text: "content => template('puppet_infrastructure/apt/apt-check-updates-v2.sh.erb'),"}
      - {path: manifests/filesystem_apt.pp, lines: "106-107", text: "$update_cache_dir = '/var/lib/apt-check-updates'"}
      - {path: manifests/filesystem_apt.pp, lines: "131-137", text: "source  => 'puppet:///modules/puppet_infrastructure/apt/get-relevant-updates-list',"}
    mutates: >-
      runs /opt/puppet-infrastructure/bin/apt-check-updates.sh High on the node (downloads the release's OVAL file
      from security-metadata.canonical.com into a temporary directory, writes /var/lib/apt-check-updates/list); its
      exit code goes to /run/p8test-apt/check.txt
    probe: |
      install -d -m 0700 /run/p8test-apt
      /opt/puppet-infrastructure/bin/apt-check-updates.sh High >/dev/null 2>&1; echo "rc=$?" > /run/p8test-apt/check.txt
    effect: |
      cat /run/p8test-apt/check.txt
      l=/var/lib/apt-check-updates/list
      test -f "$l" && echo list-written
      awk 'NF != 1' "$l" | wc -l
      n=$(p8_count . "$l"); [ "$n" -ge 1 ] && echo "listed: at least 1"
      for p in $(cat "$l"); do apt-cache policy "$p" | awk '/Installed:/ {i=$2} /Candidate:/ {c=$2} END {if (i == c || i == "(none)") print "not behind"}'; done | p8_count 'not behind'
    expect: {rc: 0, stdout: "\\Arc=0\\nlist-written\\n0\\nlisted: at least 1\\n0\\n\\Z"}

  - id: the-job-s-list-is-installed-by-the-relevant-updates-script
    what: >-
      apt-update-relevant.sh, run after the daily job, installs the job's own list: every package on it ends at its
      candidate
    control: negative
    timeout: 600
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "183-191", text: "content => template('puppet_infrastructure/apt/apt-update-relevant.sh.erb'),"}
      - {path: templates/apt/apt-update-relevant.sh.erb, sha256: "0953a9fc34832eb2a15c3d1aa42ea2bf14428789054d249f910b4c32b65f3eb2"}
    mutates: >-
      copies the job's list to /run/p8test-apt/job-list, then runs /opt/puppet-infrastructure/bin/apt-update-relevant.sh
      on the node (it upgrades every listed package through the wrapper)
    probe: |
      install -d -m 0700 /run/p8test-apt
      cp /var/lib/apt-check-updates/list /run/p8test-apt/job-list
      /opt/puppet-infrastructure/bin/apt-update-relevant.sh >/dev/null 2>&1
    effect: |
      n=$(p8_count . /run/p8test-apt/job-list); [ "$n" -ge 1 ] && echo "the job listed at least 1"
      for p in $(cat /run/p8test-apt/job-list); do apt-cache policy "$p" | awk '/Installed:/ {i=$2} /Candidate:/ {c=$2} END {if (i != c) print "still behind"}'; done | p8_count 'still behind'
    expect: {rc: 0, stdout: "\\Athe job listed at least 1\\n0\\n\\Z"}

  # 2026-11-18 purpose correction (review 20261118T121418Z): apt-update-relevant.sh (manifest lines 183-191), the
  # script that installs the updates on the daily list, was missing from the purpose and the checks; it is in both now.
  - id: the-relevant-updates-on-the-list-get-installed
    what: >-
      a package on the relevant-updates list (one version behind the archive) is upgraded to the archive's candidate
      by apt-update-relevant.sh, through the wrapper
    control: negative
    timeout: 300
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "183-191", text: "content => template('puppet_infrastructure/apt/apt-update-relevant.sh.erb'),"}
      - {path: templates/apt/apt-update-relevant.sh.erb, sha256: "0953a9fc34832eb2a15c3d1aa42ea2bf14428789054d249f910b4c32b65f3eb2"}
    mutates: >-
      picks the first of wget, less, tzdata, curl, vim-tiny whose archive has an older version, downgrades it, writes
      its name as the only line of /var/lib/apt-check-updates/list (as the daily job writes the list), runs
      apt-update-relevant.sh; the package's versions go to /run/p8test-apt/relevant.vars
    probe: |
      install -d -m 0700 /run/p8test-apt
      for p in wget less tzdata curl vim-tiny; do
        cand=$(apt-cache policy "$p" | awk '/Candidate:/ {print $2}')
        old=$(apt-cache madison "$p" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | grep -v -x "$cand" | head -1)
        [ -n "$old" ] && dpkg-query -W "$p" >/dev/null 2>&1 && break
        old=""
      done
      [ -n "$old" ] || { echo "no package with an older archive version" > /run/p8test-apt/relevant.none; exit 0; }
      DEBIAN_FRONTEND=noninteractive apt-get -qq -y --allow-downgrades install "$p=$old" >/dev/null 2>&1
      printf '%s\n' "$p" > /var/lib/apt-check-updates/list
      before=$(dpkg-query -W -f '${Version}' "$p")
      out=$(/opt/puppet-infrastructure/bin/apt-update-relevant.sh 2>&1)
      printf '%s\n' "$out" | grep -q "^package $p updated to version $cand$" && reported=yes || reported=no
      printf 'p=%s\ncand=%s\nold=%s\nbefore=%s\nreported=%s\n' "$p" "$cand" "$old" "$before" "$reported" > /run/p8test-apt/relevant.vars
    effect: |
      . /run/p8test-apt/relevant.vars
      [ -n "$old" ] && [ "$before" = "$old" ] && echo "on the list one version behind"
      [ "$(dpkg-query -W -f '${Version}' "$p")" = "$cand" ] && echo "upgraded to the candidate"
      [ "$reported" = yes ] && echo "reported through the wrapper"
    expect: {rc: 0, stdout: "\\Aon the list one version behind\\nupgraded to the candidate\\nreported through the wrapper\\n\\Z"}

  # 2026-11-18 derivation correction (after filesystem_yum's review 20261118T131226Z, same pattern): the run checks
  # computed their evidence (versions after the run, the pending-upgrade count) inside the action; the actions now
  # record only what they changed and what the wrapper reported, and each effect reads the node's state itself.
  # 2026-11-18 purpose correction (review 20261118T122159Z): the surface, kernel and full update scripts were checked
  # as installed files only; the next three checks run each one (the full update last, as it upgrades everything).
  - id: the-surface-script-updates-an-outdated-surface-package
    what: >-
      a surface-list package one version behind the archive (less, gzip or vim, downgraded first) is brought to the
      archive's candidate by apt-update-surface.sh, through the wrapper
    control: negative
    timeout: 600
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "63-70", text: "content => template('puppet_infrastructure/apt/apt-update-surface.sh.erb'),"}
      - {path: manifests/filesystem_apt.pp, lines: "33-41", text: "'coreutils', 'gzip', 'less', 'multitail',"}
    mutates: >-
      picks the first of less, gzip, vim whose archive has an older version, downgrades it, then runs
      apt-update-surface.sh (which updates every installed surface package that has an update); the package's
      versions go to /run/p8test-apt/surface.vars
    probe: |
      install -d -m 0700 /run/p8test-apt
      for p in less gzip vim; do
        cand=$(apt-cache policy "$p" | awk '/Candidate:/ {print $2}')
        old=$(apt-cache madison "$p" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | grep -v -x "$cand" | head -1)
        [ -n "$old" ] && dpkg-query -W "$p" >/dev/null 2>&1 && break
        old=""
      done
      [ -n "$old" ] || { echo "no surface package with an older archive version" > /run/p8test-apt/surface.none; exit 0; }
      DEBIAN_FRONTEND=noninteractive apt-get -qq -y --allow-downgrades install "$p=$old" >/dev/null 2>&1
      before=$(dpkg-query -W -f '${Version}' "$p")
      out=$(/opt/puppet-infrastructure/bin/apt-update-surface.sh 2>&1)
      printf '%s\n' "$out" | grep -q "^package $p updated to version $cand$" && reported=yes || reported=no
      printf 'p=%s\ncand=%s\nold=%s\nbefore=%s\nreported=%s\n' "$p" "$cand" "$old" "$before" "$reported" > /run/p8test-apt/surface.vars
    effect: |
      . /run/p8test-apt/surface.vars
      [ -n "$old" ] && [ "$before" = "$old" ] && echo "surface package one version behind"
      [ "$(dpkg-query -W -f '${Version}' "$p")" = "$cand" ] && echo "upgraded to the candidate"
      [ "$reported" = yes ] && echo "reported through the wrapper"
    expect: {rc: 0, stdout: "\\Asurface package one version behind\\nupgraded to the candidate\\nreported through the wrapper\\n\\Z"}

  - id: the-kernel-script-brings-the-kernel-metapackage-up-to-date
    what: apt-update-kernel.sh finds the installed kernel metapackage and leaves it at the archive's candidate, exit 0
    control: negative
    timeout: 600
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "84-91", text: "source  => 'puppet:///modules/puppet_infrastructure/apt/apt-update-kernel.sh',"}
      - {path: files/apt/apt-update-kernel.sh, sha256: "8ea185cfd1e85d8d07a7eb071311cf8b8c4c2f3bbc89deee121a5fbb9cb3a1db"}
    mutates: runs apt-update-kernel.sh on the node (an --only-upgrade install of the kernel metapackage, if newer); the result goes to /run/p8test-apt/kernel.txt
    probe: |
      install -d -m 0700 /run/p8test-apt
      /opt/puppet-infrastructure/bin/apt-update-kernel.sh >/dev/null 2>&1; echo "rc=$?" > /run/p8test-apt/kernel.txt
    effect: |
      cat /run/p8test-apt/kernel.txt
      m=$(dpkg -l 'linux-image-*' | awk '/^ii/ && $2 !~ /-[0-9]+\.[0-9]+\.[0-9]/ {print $2}')
      [ -n "$m" ] && [ "$(dpkg-query -W -f '${Version}' "$m")" = "$(apt-cache policy "$m" | awk '/Candidate:/ {print $2}')" ] && echo "metapackage at the candidate"
    expect: {rc: 0, stdout: "\\Arc=0\\nmetapackage at the candidate\\n\\Z"}

  - id: the-full-update-script-leaves-nothing-to-upgrade
    what: apt-update-dist.sh runs a non-interactive dist-upgrade, after which nothing is left to upgrade
    control: negative
    timeout: 600
    derived_from:
      - {path: manifests/filesystem_apt.pp, lines: "93-100", text: "source  => 'puppet:///modules/puppet_infrastructure/apt/apt-update-dist.sh',"}
      - {path: files/apt/apt-update-dist.sh, sha256: "c240c6764a5d2009dad22da00f2b6d432dcabb86e314372a9e4904ef79ec92a3"}
    mutates: runs apt-update-dist.sh on the node (apt-get dist-upgrade -y, keeping changed configuration files); the result goes to /run/p8test-apt/dist.txt
    probe: |
      install -d -m 0700 /run/p8test-apt
      /opt/puppet-infrastructure/bin/apt-update-dist.sh >/dev/null 2>&1; echo "rc=$?" > /run/p8test-apt/dist.txt
    effect: |
      cat /run/p8test-apt/dist.txt
      apt-get -s dist-upgrade | grep -E '^[0-9]+ upgraded' 
    expect: {rc: 0, stdout: "\\Arc=0\\n0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded\\.\\n\\Z"}

