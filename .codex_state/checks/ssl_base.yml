# Phase 3 checks for puppet_infrastructure::ssl_base (define; node ubuntu; required_external nginx). Fixture (params,
# never committed): myprefix p8test, myservice nginx, myservicename nginx; owner/group root and letsencrypt false at
# their defaults. The master's extra_files mount holds the lab's throwaway PKI (master_fixtures.sh): p8test.key and
# p8test.crt are a server key and certificate (CN p8test.invalid), and p8test.intermediate.crt is the throwaway CA's
# certificate that signed it, standing in for an intermediate. Probes read only the node.
class: ssl_base
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Deploys a service's TLS key and certificate: the key into the private directory (0600), and the certificate bundled
  with its intermediate in the order a service needs (leaf first) into the certificates directory, and restarts the
  service when either changes.
node_agent:
  after: the-key-and-bundle-drift
  why: the define restarts the service when the key or bundle changes, which only its next agent run after a change can show
outcomes:
  - outcome: the key is deployed to /etc/ssl/private/<prefix>.key, 0600, and it is the key of the deployed certificate
    from: manifests/ssl_base.pp:5-6, 77-92
    checks: [the-key-is-private-and-matches-the-certificate]
  - outcome: the bundle /etc/ssl/certs/<prefix>.<service>.bundle.crt is the certificate then its intermediate, 0644, and the certificate verifies against that intermediate
    from: manifests/ssl_base.pp:7-9, 79-81, 99-119
    checks: [the-bundle-is-the-leaf-then-its-issuer]
  - outcome: the service is restarted once when the key or certificate changes
    from: manifests/ssl_base.pp:10, 84-107
    checks: [the-key-and-bundle-drift, the-agent-run-restores-both-and-restarts-the-service-once]
  # Correction round 2 (2026-11-18, review 20261118T212404Z): the Let's Encrypt row says what nginx_frontend_mail's set
  # covers and what no set covers.
  # Correction round 1 (2026-11-18, review 20261118T211825Z): the variant row claimed other sets cover these
  # variants; none does. It is now three rows that say what is untested and what would lift it.
  - outcome: Let's Encrypt material (<prefix>-key.pem into the private directory, <prefix>.pem then <prefix>-chain.pem into <prefix>.<service>.bundle.pem)
    from: manifests/ssl_base.pp:44, 70-76
    uncovered: {why: "a fixture variant (letsencrypt_certificate true; one set holds one fixture). Covered elsewhere in part: nginx_frontend_mail's set (fixture letsencrypt_certificate true, reaching ssl_base through ssl_nginx_domain) checks, in smtps-and-imaps-serve-the-frontend-certificate, that 465 and 993 serve the first certificate of p8test.nginx.bundle.pem, which nginx loads with p8test-key.pem, so the file names and the leaf-first order hold there. Checked by no set: the -chain.pem second certificate in the bundle, the two files' modes and owners, and the restart on change. The lab's test PKI already provides the -key.pem, .pem and -chain.pem files", lifted_by: ubuntu}
  - outcome: on RedHat the key goes to /etc/pki/tls/private
    from: manifests/ssl_base.pp:57-62
    uncovered: {why: "the RedHat branch; this set runs on the plan's Ubuntu node", lifted_by: rhel9}
  - outcome: other owners and groups for the files, and a warning notify for services other than nginx and postfix
    from: manifests/ssl_base.pp:46-50, 94-97
    uncovered: {why: "untested: no consumer at the baseline (ssl_nginx, ssl_nginx_domain, ssl_postfix) passes owner or group or a service other than nginx or postfix, and this set's fixture uses the defaults", lifted_by: ubuntu}
checks:
  - id: the-key-is-private-and-matches-the-certificate
    what: the key file is root:root 0600, and its public key is the bundle's first certificate's
    control: negative
    derived_from:
      - {path: manifests/ssl_base.pp, lines: "77-78", text: "$key_file                 = \"${ssl_private_dir}/${myprefix}.key\""}
      - {path: manifests/ssl_base.pp, lines: "85-92", text: "mode   => '0600',"}
    probe: |
      k=/etc/ssl/private/p8test.key; b=/etc/ssl/certs/p8test.nginx.bundle.crt
      stat -c '%U:%G %a' "$k"
      [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(openssl x509 -in "$b" -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
    mismatch:
      varies: the certificate compared (the bundle's second one, the issuer's, instead of the first)
      probe: |
        k=/etc/ssl/private/p8test.key; b=/etc/ssl/certs/p8test.nginx.bundle.crt
        stat -c '%U:%G %a' "$k"
        second=$(awk '/BEGIN CERT/{i++} i==2' "$b")
        [ "$(openssl pkey -in "$k" -pubout 2>/dev/null)" = "$(echo "$second" | openssl x509 -noout -pubkey 2>/dev/null)" ] && echo key-matches-certificate || echo key-does-not-match
    expect: {rc: 0, stdout: "\\Aroot:root 600\\nkey-matches-certificate\\n\\Z"}

  - id: the-bundle-is-the-leaf-then-its-issuer
    what: >-
      the bundle is root:root 0644 and holds two certificates, the server's (CN p8test.invalid) then its issuer's
      (the throwaway CA), and the first verifies against the second
    control: negative
    derived_from:
      - {path: manifests/ssl_base.pp, lines: "79-81", text: "$bundle_file              = \"${ssl_certs_dir}/${myprefix}.${myservice}.bundle.crt\""}
      - {path: manifests/ssl_base.pp, lines: "109-119", text: "order  => '02',"}
    probe: |
      b=/etc/ssl/certs/p8test.nginx.bundle.crt
      cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
      stat -c '%U:%G %a' "$b"
      grep -c 'BEGIN CERTIFICATE' "$b"
      for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
      openssl verify -CAfile <(cert 2) <(cert 1) 2>&1 | sed 's/^.*: //'
    mismatch:
      varies: the trust anchor (the system CA bundle instead of the bundle's second certificate), which did not sign the server's certificate
      probe: |
        b=/etc/ssl/certs/p8test.nginx.bundle.crt
        cert() { awk -v n="$1" '/BEGIN CERT/{i++} i==n' "$b"; }
        stat -c '%U:%G %a' "$b"
        grep -c 'BEGIN CERTIFICATE' "$b"
        for n in 1 2; do cert $n | openssl x509 -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= //p'; done
        openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt <(cert 1) 2>&1 | tail -1 | sed 's/^.*: //'
    expect: {rc: 0, stdout: "\\Aroot:root 644\\n2\\np8test\\.invalid\\np8test throwaway CA\\nOK\\n\\Z"}

  - id: the-key-and-bundle-drift
    what: setup for the next check, the key and the bundle changed by hand (as a renewal changes them), with nginx's process id and journal cursor noted
    control: negative
    derived_from:
      - {path: manifests/ssl_base.pp, lines: "85-92", text: "notify => Service[$myservicename],"}
    mutates: notes nginx's main PID and its journal cursor in /run/p8test-ssl/before, then appends a comment line to /etc/ssl/private/p8test.key and to /etc/ssl/certs/p8test.nginx.bundle.crt on the node
    probe: |
      install -d -m 0700 /run/p8test-ssl
      printf "pid='%s'\ncursor='%s'\n" "$(systemctl show -p MainPID --value nginx)" "$(journalctl -u nginx -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p')" > /run/p8test-ssl/before
      echo '# p8test drift' >> /etc/ssl/private/p8test.key
      echo '# p8test drift' >> /etc/ssl/certs/p8test.nginx.bundle.crt
    effect: |
      grep -c '^# p8test drift$' /etc/ssl/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt | cut -d: -f2 | paste -sd' '
      grep -q "^pid='[1-9]" /run/p8test-ssl/before && echo noted
    expect: {rc: 0, stdout: "\\A1 1\\nnoted\\n\\Z"}

  - id: the-agent-run-restores-both-and-restarts-the-service-once
    what: >-
      after the node's agent run, neither file holds the drift line, and nginx was restarted exactly once for the two
      changes (a new main PID; one start in its journal since the change)
    control: negative
    derived_from:
      - {path: manifests/ssl_base.pp, lines: "10", text: "# The service is restarted if the certificate changes."}
      - {path: manifests/ssl_base.pp, lines: "100-107", text: "notify         => Service[$myservicename],"}
    mutates: none beyond reading the files, nginx's state and its journal (declared mutating so it runs after the node's agent run)
    probe: |
      true
    effect: |
      grep -c '^# p8test drift$' /etc/ssl/private/p8test.key /etc/ssl/certs/p8test.nginx.bundle.crt | cut -d: -f2 | paste -sd' '
      . /run/p8test-ssl/before
      now=$(systemctl show -p MainPID --value nginx)
      [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$pid" ] && echo restarted
      journalctl -u nginx --after-cursor "$cursor" --no-pager -q | grep -c 'Started nginx.service'
    expect: {rc: 0, stdout: "\\A0 0\\nrestarted\\n1\\n\\Z"}
