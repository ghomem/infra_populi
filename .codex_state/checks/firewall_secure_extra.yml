      - {path: manifests/firewall_secure_extra.pp, lines: "151", text: "recent          => 'update', rseconds => '60', rhitcount => $indilim_minute, action => 'drop' }"}
    mutates: after 61 s, 18 TCP connects from the peer's primary address to the class node's port 22, one every 3.5 s; the sequence goes to /run/p8test-fwx/spaced.txt on the peer
    probe: |
      sleep 61
      for i in $(seq 18); do nc -z -w2 192.168.56.20 22 >/dev/null 2>&1 && echo in || echo dropped; sleep 3.5; done > /run/p8test-fwx/spaced.raw
      uniq -c /run/p8test-fwx/spaced.raw | awk '{print $2, $1}' > /run/p8test-fwx/spaced.txt
    effect: |
      cat /run/p8test-fwx/spaced.txt
    expect: {rc: 0, stdout: "\\Ain 14\\ndropped 4\\n\\Z"}

  - id: an-unmanaged-rule-is-added
    what: setup for the purge check, a rule Puppet does not manage added to INPUT by hand
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "79-80", text: "resources { 'firewall': purge => true, }"}
    mutates: appends `-A INPUT -s 10.255.255.1/32 -m comment --comment p8test-rogue -j ACCEPT` on the node
    probe: |
      iptables -A INPUT -s 10.255.255.1/32 -m comment --comment p8test-rogue -j ACCEPT
    effect: |
      iptables -S INPUT | grep -c p8test-rogue
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}

  - id: the-next-agent-run-purges-the-unmanaged-rule
    what: after the node's agent run, the hand-added rule is gone and the side chain stands
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "79-80", text: "resources { 'firewall': purge => true, }"}
    mutates: none beyond reading the rules (declared mutating so it runs after the node's agent run)
    probe: |
      true
    effect: |
      iptables -S INPUT | grep -c p8test-rogue
      iptables -S WHITELIST_SIDE_CHAIN | grep -c -- '524 drop all traffic in the side chain'
    expect: {rc: 0, stdout: "\\A0\\n1\\n\\Z"}

  # Flush script, added in correction round 1: the class's WARNING (lines 11-13) asks for it after any input change.
  - id: the-flush-script-clears-every-rule
    what: the installed flush script (root 0755, the module's file) leaves no rule and every policy ACCEPT, so SSH stays up
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "63-70", text: "source  => 'puppet:///modules/puppet_infrastructure/iptables/iptables-flush.sh',"}
      - {path: files/iptables/iptables-flush.sh, sha256: "af2e05ea3178cc4d26319a1267eae4d8245767a803a77580e72e1414e48a7935"}
    mutates: runs /opt/puppet-infrastructure/bin/iptables-flush.sh on the node (every IPv4 and IPv6 rule and chain removed, policies ACCEPT)
    probe: |
      /opt/puppet-infrastructure/bin/iptables-flush.sh
    effect: |
      f=/opt/puppet-infrastructure/bin/iptables-flush.sh
      stat -c '%U:%G %a' "$f"; sha256sum "$f" | cut -d' ' -f1
      for t in filter mangle nat; do iptables -t "$t" -S | grep -c '^-A'; done | paste -sd' '
      iptables -S | grep -E '^-P (INPUT|FORWARD) '
    expect: {rc: 0, stdout: "\\Aroot:root 755\\naf2e05ea3178cc4d26319a1267eae4d8245767a803a77580e72e1414e48a7935\\n0 0 0\\n-P INPUT ACCEPT\\n-P FORWARD ACCEPT\\n\\Z"}

  - id: the-next-agent-run-rebuilds-the-firewall
    what: after the node's agent run, the policies drop again and the anti-DDoS, whitelist and side-chain rules are back
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "83-84", text: "firewallchain { 'INPUT:filter:IPv4':   ensure => present, purge => true, policy => drop   }"}
      - {path: manifests/firewall_secure_extra.pp, lines: "252", text: "firewall { '524 drop all traffic in the side chain': chain => 'WHITELIST_SIDE_CHAIN', action => 'drop', }"}
    mutates: none beyond reading the rules (declared mutating so it runs after the node's agent run)
    probe: |
      true
    effect: |
      iptables -S | grep -E '^-P (INPUT|FORWARD) '
      iptables -t mangle -S PREROUTING | grep -c -E -- '--comment "5(0[1-9]|1[0-8]) [^"]*" -j DROP'
      iptables -S WHITELIST_SIDE_CHAIN | grep -c -- '524 drop all traffic in the side chain'
    expect: {rc: 0, stdout: "\\A-P INPUT DROP\\n-P FORWARD DROP\\n18\\n1\\n\\Z"}

  - id: anti-ddos-without-ip-filter-limits-every-source
    variant: ddosonly
    what: with anti_ddos and no ip_filter, INPUT holds the per-source connection limit and the new-connection rate rules for port 8888
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "269-303", text: "firewall { \"521 limit connections per source IP ${service}\":"}
    probe: |
      for r in '521 limit connections per source IP' '522 limit mew connections per source IP and time unit' '523 limit mew connections'; do
        iptables -S INPUT | grep -F -- "$r" | grep -c -- '--dport 8888'
      done
    expect: {rc: 0, stdout: "\\A1\\n1\\n1\\n\\Z"}

  - id: without-anti-ddos-the-port-is-opened-and-ssh-is-strict
    variant: plain
    what: >-
      without anti_ddos the service port 8888 is simply accepted (rule 555) with no DDoS rules, and in strict mode INPUT
      has no SSH rate-limit rule (only listed sources reach SSH)
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "306-312", text: "firewall { \"555 open service ports: ${service}\": chain => 'INPUT', proto => $service[1], dport => $service[0], action => 'accept', }"}
      - {path: manifests/firewall_secure_extra.pp, lines: "139-143", text: "if ( $strict == true ) {"}
    probe: |
      iptables -S INPUT | grep -F '555 open service ports' | grep -c -- '--dport 8888'
      iptables -S INPUT | grep -cE '52[123] limit' || true
