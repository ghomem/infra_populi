    mutates: none beyond reading the rule counters (declared mutating so it runs after the peer's attempts)
    probe: |
      true
    effect: |
      n=$(iptables -t mangle -v -x -L PREROUTING -n | awk '/503 drop syn packets with suspicious mss/ {print $1; exit}')
