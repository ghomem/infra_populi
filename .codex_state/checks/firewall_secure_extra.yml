    expect: {rc: 0, stdout: "\\A1\\n0\\n0\\n-P INPUT DROP\\n\\Z"}

  - id: ddosonly-any-source-is-held-to-the-connection-limit
    variant: ddosonly
    what: >-
      with anti_ddos and no ip_filter, held connections to the service from a source on no list (192.0.2.2, from a
      network namespace on the node) stop at ddos_limit: 3 established of 5
    control: negative
    timeout: 150
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "269-303", text: "firewall { \"521 limit connections per source IP ${service}\":"}
    mutates: >-
      on the node: starts a transient unit p8test-listener (python3 -m http.server 8888 on 0.0.0.0); creates the network
      namespace p8fwx and the veth pair p8fwx0 (node side, 192.0.2.1/24) and p8fwx1 (in the namespace, 192.0.2.2/24);
      opens 5 TCP connections from 192.0.2.2 to 192.0.2.1:8888, one per second, each ended after 20 s; the established
      count goes to /run/p8test-fwx/ns-held.txt
    probe: |
      systemd-run --unit p8test-listener -q python3 -m http.server 8888 --bind 0.0.0.0
      ip netns add p8fwx
      ip link add p8fwx0 type veth peer name p8fwx1
      ip link set p8fwx1 netns p8fwx
      ip addr add 192.0.2.1/24 dev p8fwx0
      ip link set p8fwx0 up
      ip netns exec p8fwx ip addr add 192.0.2.2/24 dev p8fwx1
      ip netns exec p8fwx ip link set lo up
      ip netns exec p8fwx ip link set p8fwx1 up
      sleep 2
      install -d -m 0700 /run/p8test-fwx
      for i in $(seq 5); do (timeout 20 ip netns exec p8fwx nc -s 192.0.2.2 192.0.2.1 8888 </dev/null >/dev/null 2>&1) & sleep 1; done
      sleep 1
      ip netns exec p8fwx ss -tnH state established '( dport = :8888 )' | wc -l > /run/p8test-fwx/ns-held.txt
      wait
    effect: |
      cat /run/p8test-fwx/ns-held.txt
    expect: {rc: 0, stdout: "\\A3\\n\\Z"}

  - id: ddosonly-any-source-is-held-to-the-new-connection-rate
    variant: ddosonly
    what: >-
      with anti_ddos and no ip_filter, 20 new connections to the service from a source on no list (192.0.2.2, the
      namespace of the previous check), one every 0.1 s: the rate limit (2 a second, iptables' default burst 5) lets in
      at least 5 and at most 5 plus 2 per second of the measured duration (rounded up) plus 1, and drops the rest
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "269-303", text: "limit   => \"${ddos_limit_per_time_unit}/${ddos_limit_time_unit}\","}
    mutates: >-
      after 3 s (the limit refills), 20 TCP connection attempts from 192.0.2.2 in the namespace p8fwx to 192.0.2.1:8888,
      one every 0.1 s, each closed after at most 80 ms; the count and duration go to /run/p8test-fwx/ns-rate.txt
    probe: |
      sleep 3
      ip netns exec p8fwx python3 - > /run/p8test-fwx/ns-rate.txt <<'PY'
      import socket, select, time
      got, t0 = 0, time.monotonic()
      for _ in range(20):
          start = time.monotonic()
          s = socket.socket(); s.setblocking(False); s.bind(("192.0.2.2", 0)); s.connect_ex(("192.0.2.1", 8888))
          _, w, _ = select.select([], [s], [], 0.08)
          if w and s.getsockopt(socket.SOL_SOCKET, socket.SO_ERROR) == 0:
              got += 1
          s.close()
          time.sleep(max(0, 0.1 - (time.monotonic() - start)))
      print(f"in {got} of 20 in {int((time.monotonic() - t0) * 1000)} ms")
      PY
    effect: |
      cat /run/p8test-fwx/ns-rate.txt
      read _ n _ _ _ t _ < /run/p8test-fwx/ns-rate.txt
      [ -n "$n" ] && [ -n "$t" ] && [ "$n" -ge 5 ] && [ "$n" -lt 20 ] && [ "$n" -le $(( 5 + 2 * ((t + 999) / 1000) + 1 )) ] && echo limited || echo "not limited"
    expect: {rc: 0, stdout: "\\Ain \\d+ of 20 in \\d+ ms\\nlimited\\n\\Z"}

  - id: plain-strict-ssh-and-the-open-port-from-a-namespace
    variant: plain
    what: >-
      in strict mode without anti_ddos, from a network namespace on the node: a listed source (192.0.2.3, in the
      variant's acl) reaches SSH, an unlisted one (192.0.2.2) is dropped at SSH, and the unlisted one still reaches the
      opened service port 8888
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "139-143", text: "if ( $strict == true ) {"}
      - {path: manifests/firewall_secure_extra.pp, lines: "306-312", text: "firewall { \"555 open service ports: ${service}\": chain => 'INPUT', proto => $service[1], dport => $service[0], action => 'accept', }"}
    mutates: >-
      on the node: starts a transient unit p8test-listener (python3 -m http.server 8888 on 0.0.0.0); creates the network
      namespace p8fwx and the veth pair p8fwx0 (node side, 192.0.2.1/24) and p8fwx1 (in the namespace, 192.0.2.2/24 and
      192.0.2.3/24); three TCP connection attempts (nc -z, 5 s timeout); results in /run/p8test-fwx/ns-plain.txt
    probe: |
      systemd-run --unit p8test-listener -q python3 -m http.server 8888 --bind 0.0.0.0
      ip netns add p8fwx
      ip link add p8fwx0 type veth peer name p8fwx1
      ip link set p8fwx1 netns p8fwx
      ip addr add 192.0.2.1/24 dev p8fwx0
      ip link set p8fwx0 up
      ip netns exec p8fwx ip addr add 192.0.2.2/24 dev p8fwx1
      ip netns exec p8fwx ip addr add 192.0.2.3/24 dev p8fwx1
      ip netns exec p8fwx ip link set lo up
      ip netns exec p8fwx ip link set p8fwx1 up
      sleep 2
      install -d -m 0700 /run/p8test-fwx
      t() { ip netns exec p8fwx nc -z -w 5 -s "$1" 192.0.2.1 "$2" 2>/dev/null && echo in || echo dropped; }
      {
        echo "ssh from listed $(t 192.0.2.3 22)"
        echo "ssh from unlisted $(t 192.0.2.2 22)"
        echo "service from unlisted $(t 192.0.2.2 8888)"
      } > /run/p8test-fwx/ns-plain.txt
    effect: |
      cat /run/p8test-fwx/ns-plain.txt
    expect: {rc: 0, stdout: "\\Assh from listed in\\nssh from unlisted dropped\\nservice from unlisted in\\n\\Z"}
