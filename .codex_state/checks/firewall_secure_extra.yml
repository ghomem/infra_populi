    expect: {rc: 0, stdout: "\\Arule 503: \\d+\\nlow-MSS SYN dropped\\n\\Z"}

  # SSH brute-force limits, added in correction round 1 (the same rules and numbers as firewall_secure, whose set
  # measured them): each check first waits 61 s so the previous check's 60 s recent window and the overall limit
  # clear; held connections end by `timeout` (netcat-openbsd keeps a connection open after its input ends).
  - id: an-ssh-burst-is-cut-at-the-overall-limit
    what: >-
      20 simultaneous new SSH connections from the peer's primary address (on no list): the overall limit (20 a
      minute, iptables' default burst of 5) lets 5 through and the rest are dropped
    control: negative
    host: peer
    timeout: 150
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "132", text: "$overlim_minute='20'   # overall limit for new connections per minute"}
      - {path: manifests/firewall_secure_extra.pp, lines: "153-154", text: "firewall { '116 SSH LIMIT_OVERALL':      chain => 'LIMIT_OVERALL',    proto => tcp, dport => $ssh_port, limit           => \"${overlim_minute}/min\", action => 'accept' }"}
    mutates: after 61 s, 20 parallel TCP connects from the peer's primary address to the class node's port 22; counts in /run/p8test-fwx/burst.txt on the peer
    probe: |
      sleep 61
      for i in $(seq 20); do (nc -z -w2 192.168.56.20 22 >/dev/null 2>&1 && echo in || echo dropped) & done > /run/p8test-fwx/burst.raw
      wait
      sort /run/p8test-fwx/burst.raw | uniq -c | awk '{print $2, $1}' > /run/p8test-fwx/burst.txt
    effect: |
      cat /run/p8test-fwx/burst.txt
    expect: {rc: 0, stdout: "\\Adropped 15\\nin 5\\n\\Z"}

  - id: the-ssh-rule-counters-are-recorded
    what: setup for the held-connection checks, the packet counters of the SSH limit rules (112, 114, 116, 117) recorded on the node
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "149", text: "-> firewall { '112 SSH connlimit':"}
    mutates: writes the counters of rules 112, 114, 116 and 117 to /run/p8test-fwx/ssh-before on the node
    probe: |
      install -d -m 0700 /run/p8test-fwx
      { iptables -v -x -L LIMIT_INDIVIDUAL -n; iptables -v -x -L LIMIT_OVERALL -n; } | awk '/\/\* 11[2467] SSH/ {n=$0; sub(/.*\/\* /, "", n); print substr(n, 1, 3), $1}' > /run/p8test-fwx/ssh-before
    effect: |
      cut -d' ' -f1 /run/p8test-fwx/ssh-before | paste -sd' '
    expect: {rc: 0, stdout: "\\A112 114 116 117\\n\\Z"}

  - id: held-ssh-connections-stop-at-eight
    what: >-
      from the peer's primary address, new SSH connections one every 4 s (slower than the overall limit refills), each
      held open: the per-host connection limit lets 8 stay established and drops the 9th and 10th
    control: negative
    host: peer
    timeout: 240
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "130", text: "$indilim='8'           # limit for individual IP simultaneous connections"}
      - {path: manifests/firewall_secure_extra.pp, lines: "149", text: "-> firewall { '112 SSH connlimit':          chain => 'LIMIT_INDIVIDUAL', proto => tcp, dport => $ssh_port, connlimit_above => $indilim, action => 'drop', }"}
    mutates: >-
      after 61 s, 10 SSH connections from the peer's primary address to the class node, one every 4 s, each held 50 s
      (p8_hold); the established count goes to /run/p8test-fwx/held-ssh.txt on the peer
    probe: |
      sleep 61
      for i in $(seq 10); do p8_hold 192.168.56.20 22 50; sleep 4; done
      sleep 1
      p8_established 192.168.56.20 22 > /run/p8test-fwx/held-ssh.txt
      sleep 50
    effect: |
      cat /run/p8test-fwx/held-ssh.txt
    expect: {rc: 0, stdout: "\\A8\\n\\Z"}

  - id: only-the-per-host-limit-dropped-the-held-connections
    what: >-
      on the node, during the held connections only the per-host connection limit (112) dropped packets (the 9th and
      10th connections' SYNs and their retransmissions, at least 2); the recent limit (114) and the overall drop (117)
      dropped none, and the overall limit (116) accepted at least 8
    control: negative
    derived_from:
      - {path: manifests/firewall_secure_extra.pp, lines: "149", text: "connlimit_above => $indilim, action => 'drop', }"}
    mutates: none beyond reading the rule counters (declared mutating so it runs after the held connections)
    probe: |
      true
    effect: |
      join <(sort /run/p8test-fwx/ssh-before) <({ iptables -v -x -L LIMIT_INDIVIDUAL -n; iptables -v -x -L LIMIT_OVERALL -n; } | awk '/\/\* 11[2467] SSH/ {n=$0; sub(/.*\/\* /, "", n); print substr(n, 1, 3), $1}' | sort) | awk '{d=$3-$2; printf "%s %d\n", $1, d}' | awk '$1=="112"{print ($2>=2 ? "112 dropped the 9th and 10th" : "112 dropped "$2)} $1=="114"{print "114 dropped "$2} $1=="116"{print ($2>=8 ? "116 accepted at least 8" : "116 accepted "$2)} $1=="117"{print "117 dropped "$2}'
    expect: {rc: 0, stdout: "\\A112 dropped the 9th and 10th\\n114 dropped 0\\n116 accepted at least 8\\n117 dropped 0\\n\\Z"}

  - id: new-ssh-connections-stop-at-fifteen-a-minute
