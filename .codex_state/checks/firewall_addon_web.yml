# Phase 3 checks for puppet_infrastructure::firewall_addon_web (class; node ubuntu; no parameters, no required base).
# The class adds two accept rules (200 http, 201 https; tcp, chain INPUT by the firewall type's defaults) that are
# COMPLEMENTARY to a base firewall (its comment, lines 3-7), which supplies the default drop. Its plan row has no base,
# so on the lab node the INPUT policy is ACCEPT; the set stands in for the base's default drop with one rule appended
# after the class's (a drop of ports 80, 443 and 8888 on the host-only NIC: no address named, SSH untouched). The peer
# (ubuntu2) connects as any other host on the network; peer probes name only the class node's host-only address.
class: firewall_addon_web
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Opens a web server's ports, HTTP (80) and HTTPS (443) over TCP, in a node's firewall, as a complement to the base
  firewall's default drop.
peer:
  kind: ubuntu2
  why: what a firewall lets in can only be seen from another machine on the network
outcomes:
  - outcome: with a default drop beneath them, HTTP and HTTPS from another host get in while another port does not
    from: manifests/firewall_addon_web.pp:1-7, 13-15
    checks: [web-ports-and-another-listen, a-default-drop-stands-in-for-the-base-firewall, another-host-reaches-http-and-https-only, the-class-rules-accepted-them]
  - outcome: the rules are TCP accepts in INPUT, numbered 200 and 201
    from: manifests/firewall_addon_web.pp:14-15
    checks: [the-two-accept-rules]
checks:
  # 2026-11-19 authoring correction (run 20261119T041438Z): the sed back-references were written as \\N (escaped twice)
  # and printed literally; they are \N now (here and in the stand-in check).
  - id: the-two-accept-rules
    what: INPUT holds the class's two accept rules, tcp to 80 and to 443 (the type's default protocol and chain)
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_web.pp, lines: "14", text: "firewall { '200 accept http':  proto  => 'tcp', dport  => 80,  action => 'accept', }"}
      - {path: manifests/firewall_addon_web.pp, lines: "15", text: "firewall { '201 accept https': proto  => 'tcp', dport  => 443, action => 'accept', }"}
    probe: |
      iptables -S INPUT | grep -E -- '--comment "20[01] accept https?"' | sed -E 's/.*-p ([a-z]+) .*--dport ([0-9]+) .*--comment "([^"]+)" -j ([A-Z]+).*/\3: \1 \2 \4/'
    expect: {rc: 0, stdout: "\\A200 accept http: tcp 80 ACCEPT\\n201 accept https: tcp 443 ACCEPT\\n\\Z"}

  - id: web-ports-and-another-listen
    what: setup for the reach checks, TCP services on ports 80, 443 and 8888 of the node, listening on every address
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_web.pp, lines: "13", text: "# webserver specific firewall rules - simple case"}
    mutates: starts three transient units p8test-web-80, p8test-web-443 and p8test-web-8888 (python3 -m http.server on 0.0.0.0) on the node
    probe: |
      for p in 80 443 8888; do systemd-run --unit "p8test-web-$p" -q python3 -m http.server "$p" --bind 0.0.0.0; done
      sleep 2
    effect: |
      for p in 80 443 8888; do p8_listening "$p"; done
    expect: {rc: 0, stdout: "\\A0\\.0\\.0\\.0:80\\n0\\.0\\.0\\.0:443\\n0\\.0\\.0\\.0:8888\\n\\Z"}

  # 2026-11-19 authoring correction (run 20261119T041703Z): iptables -S prints a one-word comment without quotes, so
  # the stand-in rule was not matched; the quotes are optional now.
  - id: a-default-drop-stands-in-for-the-base-firewall
    what: >-
      setup for the reach checks, the base firewall's default drop stood in by one rule appended after the class's:
      TCP to 80, 443 and 8888 arriving on the host-only NIC is dropped
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_web.pp, lines: "3-7", text: "# Do not forget to do the main firewall configuration,"}
    mutates: appends `-A INPUT -i enp0s8 -p tcp -m multiport --dports 80,443,8888 -m comment --comment p8test-default-drop -j DROP` on the node
    probe: |
      iptables -A INPUT -i enp0s8 -p tcp -m multiport --dports 80,443,8888 -m comment --comment p8test-default-drop -j DROP
    effect: |
      iptables -S INPUT | grep -n -E -- '--comment "?(200 accept http|201 accept https|p8test-default-drop)"?( |$)' | sed -E 's/^([0-9]+):.*--comment "?(200 accept http|201 accept https|p8test-default-drop)"?.*/\2/'
    expect: {rc: 0, stdout: "\\A200 accept http\\n201 accept https\\np8test-default-drop\\n\\Z"}

  - id: another-host-reaches-http-and-https-only
    what: from the peer, ports 80 and 443 of the node are open and port 8888 is closed (dropped)
    control: negative
    host: peer
    derived_from:
      - {path: manifests/firewall_addon_web.pp, lines: "14-15", text: "firewall { '200 accept http':  proto  => 'tcp', dport  => 80,  action => 'accept', }"}
    mutates: three TCP connection attempts from the peer to the class node (80, 443, 8888)
    probe: |
      true
    effect: |
      for p in 80 443 8888; do echo "$p $(p8_tcp 192.168.56.20 "$p")"; done
    expect: {rc: 0, stdout: "\\A80 open\\n443 open\\n8888 closed\\n\\Z"}

  - id: the-class-rules-accepted-them
    what: on the node, rules 200 and 201 counted the peer's connections, and the stand-in drop counted the one to 8888
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_web.pp, lines: "14-15", text: "firewall { '201 accept https': proto  => 'tcp', dport  => 443, action => 'accept', }"}
    mutates: none beyond reading the rule counters (declared mutating so it runs after the peer's attempts)
    probe: |
      true
    effect: |
      iptables -v -x -L INPUT -n | awk '/200 accept http/ {a=$1} /201 accept https/ {b=$1} /p8test-default-drop/ {c=$1} END {print "200: " (a+0 != 0 ? "counted" : "zero"); print "201: " (b+0 != 0 ? "counted" : "zero"); print "stand-in drop: " (c+0 != 0 ? "counted" : "zero")}'
    expect: {rc: 0, stdout: "\\A200: counted\\n201: counted\\nstand-in drop: counted\\n\\Z"}
