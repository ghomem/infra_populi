# Phase 3 checks for puppet_infrastructure::user_lock (define; harness title p8testuser; required_base hashman_base;
# until 2026-11-23 MOCK-APPLY with node fixture hashman_lock_standin, which seeded p8testuser's hashman entries before
# the lock: the Unix hash and the Samba hash of the lab's user test password). Migrated with the ruled upstream-defect fix: the lock exec is
# guarded by its post-condition (upstream_defects.md user_lock). hashman's own `pp_auth.py lock` marks both entries
# locked (LOCKPREFIX '!'), and hashman's auth then refuses the user (the checks below).
# 2026-11-21 (backfill batch 9): purpose and outcomes (HQ rulings 2 and C1).
# Correction round 1, 2026-11-21 (review 20261121T124336Z, purpose): the refusal itself, through hashman's own auth on
# the node (hashman_base installs the same CLI and library a master runs). The node fixture now seeds the SHA-512 hash
# of the lab's user test password, so the refusal is the lock's and not a fake hash's.
# Correction round 2, 2026-11-21 (review 20261121T130357Z, purpose; the last round, production use 0): the Samba hash.
# The fixture also seeds p8testuser's Samba entry (hashes_smb.pp), which lockpw invalidates with the same prefix.
# 2026-11-23 (HQ after batch 20, item 6, the stand-in lift): the class runs on the master-role node (kind puppetserver,
# OpenVox server with its own code tree) and the user is no longer seeded: node fixture hashman_user_via_hashman (a
# test asset) has hashman create p8testuser (`pp_auth.py useradd ... SILENT`, then `unlock`), as an administrator does
# before a lock, keeping hashman's initial password in /root/p8test-hashman-initial (0600). A new user's entry carries
# hashman's expiry prefix on the salt type ($!6$, EXPIREPREFIX '!': an initial password, which auth still accepts), so
# the locked entry is '!$!6$...'; the hashes are hashman's own, so the checks match their shape, not a seeded value.
class: user_lock
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Locks an existing user in hashman, the fleet's user database on the Puppet master: hashman's own pp_auth.py marks the
  user's password entry locked, so hashman (and the services that authenticate through it) refuse the user.
outcomes:
  - outcome: hashman's pp_auth.py lock marks the user's entry locked, in place (one entry, not a duplicate), and invalidates the user's Samba hash the same way
    from: manifests/user_lock.pp:5-16
    checks: [user-entry-locked-by-hashman, exactly-one-entry, the-samba-hash-is-locked-too]
  - outcome: the locked user is refused by hashman's authentication (pp_auth auth, which hashman's web interface and services use), although the password matches the entry under the lock prefix
    from: manifests/user_lock.pp:2, 11-14; templates/hashman/libhashman/dbutils.py.erb:168-206
    checks: [the-locked-user-is-refused-by-hashman]
checks:
  - id: user-entry-locked-by-hashman
    what: >-
      the user's password entry in hashman's database carries the lock prefix '!' before hashman's own entry for a new
      user (SHA-512 with the expiry prefix on its salt type, $!6$), written by `pp_auth.py lock` in hashman's
      `$<user>_pwd_hash = '<value>'` format
    control: negative
    derived_from:
      - {path: manifests/user_lock.pp, lines: "11-14", text: "command => \"${hashmandir}/common/pp_auth.py lock ${myuser} DUMMYARG; exit 0\","}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "58", text: "LOCKPREFIX = '!'"}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "59", text: "EXPIREPREFIX = '!'"}
    probe: |
      grep -E '^[$]p8testuser_pwd_hash' /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp
    expect: {rc: 0, stdout: "\\A\\$p8testuser_pwd_hash = '!\\$!6\\$[./A-Za-z0-9]+\\$[./A-Za-z0-9]{86}'\\n\\Z"}

  - id: exactly-one-entry
    what: locking rewrites the user's entry in place (one line for the user, no duplicate appended)
    control: negative
    derived_from:
      - {path: manifests/user_lock.pp, lines: "11-14", text: "command => \"${hashmandir}/common/pp_auth.py lock ${myuser} DUMMYARG; exit 0\","}
      - {path: templates/hashman/libhashman/dbutils.py.erb, lines: "804-807", text: "return setpw(username, pwentry, True, '', smbhashentry)"}
    probe: |
      grep -cE '^[$]p8testuser_pwd_hash' /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}

  - id: the-locked-user-is-refused-by-hashman
    what: >-
      hashman's pp_auth auth refuses p8testuser with the initial password hashman gave it (exit 1), while that password
      does match the stored entry once the lock prefix is taken off (with the expiry prefix, which auth accepts, read as
      hashman reads it: crypt of the password with the entry's salt equals it): the refusal is the lock
    control: negative
    timeout: 120
    derived_from:
      - {path: templates/hashman/libhashman/dbutils.py.erb, lines: "199-205", text: "ourentry = crypt.crypt( password , '$' + salttype + '$' + saltstr + '$')"}
      - {path: manifests/user_lock.pp, lines: "11-14", text: "command => \"${hashmandir}/common/pp_auth.py lock ${myuser} DUMMYARG; exit 0\","}
    mutates: >-
      one authentication attempt through hashman's CLI (it takes hashman's database lock briefly and logs to syslog); the
      outcomes go to /run/p8test-lock/auth.txt
    probe: |
      install -d -m 0700 /run/p8test-lock
      pw=$(cat /root/p8test-hashman-initial)
      { /opt/puppet-infrastructure/bin/pp_auth.sh auth p8testuser "$pw" >/dev/null 2>&1; echo "hashman auth rc=$?"
        e=$(sed -n "s/^[$]p8testuser_pwd_hash = '\(.*\)'$/\1/p" /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp)
        python3 -W ignore -c 'import crypt,sys; e=sys.argv[1]; print("locked" if e.startswith("!") else "not locked"); u=e[1:].replace("$!6$", "$6$", 1); print("password matches the unlocked entry" if crypt.crypt(sys.argv[2], u) == u else "password does not match")' "$e" "$pw"
      } > /run/p8test-lock/auth.txt
    effect: |
      cat /run/p8test-lock/auth.txt
    expect: {rc: 0, stdout: "\\Ahashman auth rc=1\\nlocked\\npassword matches the unlocked entry\\n\\Z"}

  - id: the-samba-hash-is-locked-too
    what: >-
      the user's Samba hash entry in hashes_smb.pp (hashman's base64 NT hash) now carries the lock prefix '!', rewritten
      in place (one line), so Samba services using it refuse the user as well
    control: negative
    derived_from:
      - {path: templates/hashman/libhashman/dbutils.py.erb, lines: "804-807", text: "return setpw(username, pwentry, True, '', smbhashentry)"}
      - {path: templates/hashman/libhashman/miscutils.py.erb, lines: "129-148", text: "return LOCKPREFIX + currentsmbhash"}
    probe: |
      grep -E '^[$]p8testuser_pwd_hash_smb ' /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes_smb.pp
    expect: {rc: 0, stdout: "\\A\\$p8testuser_pwd_hash_smb = '![A-Za-z0-9+/]{22}=='\\n\\Z"}

