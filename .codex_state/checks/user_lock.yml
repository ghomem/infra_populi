# Phase 3 checks for puppet_infrastructure::user_lock (define; harness title p8testuser; required_base hashman_base;
# MOCK-APPLY: node fixture hashman_lock_standin seeds one fake hashman entry for p8testuser before the lock). Migrated
# with the ruled upstream-defect fix: the lock exec is guarded by its post-condition (upstream_defects.md user_lock).
# What a node can show: hashman's own `pp_auth.py lock` marked the user's password entry locked (LOCKPREFIX '!'), in
# hashman's line format. NOT shown: a locked user refused by pp_auth/the web interface on a master (mock-apply; the
# fixture hash is not a real password).
# 2026-11-21 (backfill batch 9): purpose and outcomes (HQ rulings 2 and C1); the master-side refusal as a row lifted by
# the active puppetserver node kind (a work item for the stand-in lifts).
class: user_lock
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Locks an existing user in hashman, the fleet's user database on the Puppet master: hashman's own pp_auth.py marks the
  user's password entry locked, so hashman (and the services that authenticate through it) refuse the user.
outcomes:
  - outcome: hashman's pp_auth.py lock marks the user's entry locked, in place (one entry, not a duplicate)
    from: manifests/user_lock.pp:5-16
    checks: [user-entry-locked-by-hashman, exactly-one-entry]
  - outcome: the locked user is refused by hashman's authentication on a master whose database holds the user
    from: manifests/user_lock.pp:2, 9-10
    uncovered:
      why: the node's hashman entry is a stand-in seeded by the node fixture hashman_lock_standin (a fake hash), not a master's user database
      lifted_by: "capability: user_lock's set run on the puppetserver node (its hashman database), i.e. the class's plan node moved there; phase3.py runs a set on its class's plan node only (the stand-in lift after the backfill, HQ order)"
      evidence: "plan node column for user_lock empty (default ubuntu) and node_fixture hashman_lock_standin; phase3.py run selects the node with nodes.select(cls); status.py --standins: user_lock"
checks:
  - id: user-entry-locked-by-hashman
    what: >-
      the user's password entry in hashman's database carries the lock prefix '!' (written by `pp_auth.py lock`, so
      the line is in hashman's own `$<user>_pwd_hash = '<value>'` format)
    control: negative
    derived_from:
      - {path: manifests/user_lock.pp, lines: "11-14", text: "command => \"${hashmandir}/common/pp_auth.py lock ${myuser} DUMMYARG; exit 0\","}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "58", text: "LOCKPREFIX = '!'"}
    probe: |
      grep -E '^[$]p8testuser_pwd_hash' /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp
    expect: {rc: 0, stdout: "\\A\\$p8testuser_pwd_hash = '!\\$6\\$p8testsalt\\$p8testfixturehash'\\n\\Z"}

  - id: exactly-one-entry
    what: locking rewrites the user's entry in place (one line for the user, no duplicate appended)
    control: negative
    derived_from:
      - {path: manifests/user_lock.pp, lines: "11-14", text: "command => \"${hashmandir}/common/pp_auth.py lock ${myuser} DUMMYARG; exit 0\","}
      - {path: templates/hashman/libhashman/dbutils.py.erb, lines: "804-807", text: "return setpw(username, pwentry, True, '', smbhashentry)"}
    probe: |
      grep -cE '^[$]p8testuser_pwd_hash' /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}
