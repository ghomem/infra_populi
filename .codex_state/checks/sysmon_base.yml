# Phase 3 checks for puppet_infrastructure::sysmon_base (class; node ubuntu; required_base filesystem_lib64 [Debian];
# no parameters). The class installs the node-side Nagios checks a monitoring server runs over NRPE or SSH. Each check
# below runs one of them on the node as the monitoring server would, with thresholds chosen to reach a known state.
# Values were measured on the node after one harness apply (2026-11-18) before writing them; the netstat scripts and
# nagios-puppet.sh did not reach their intended results there (see the outcomes table).
class: sysmon_base
baseline: release-0.9.10 (cf477c6)
fixture: defaults
authoring:
  minutes: 14.5
  notes: "19:43:18Z to 19:57:49Z 2026-11-18 (date at the start of reading the baseline and at validation), including one harness apply and the hand measurements of every script on the applied node."
purpose: >-
  Installs the node-side Nagios checks a monitoring server runs: Puppet agent health, pending reboot, file handles,
  network connections, upgradable packages, bandwidth, disk write latency, OS version, TLS certificate expiry, CPU and
  memory. Each prints a Nagios status line with performance data and exits 0 (OK), 1 (WARNING), 2 (CRITICAL) or
  3 (UNKNOWN).
outcomes:
  - outcome: the checks are installed root-owned 0755 as the module's files (check_cpu.py from its template, run by the local python)
    from: manifests/sysmon_base.pp:22-136
    checks: [the-checks-are-installed]
  - outcome: the Puppet check runs the agent and reports OK with the agent's exit code, and UNKNOWN (not CRITICAL) when another agent run holds the lock
    from: manifests/sysmon_base.pp:24-29; files/sysmon/nagios-puppet.sh
    checks: [the-puppet-check-ok-then-unknown-under-lock]
  - outcome: the reboot check says OK, and WARNING once a package asks for a reboot
    from: manifests/sysmon_base.pp:31-37; files/sysmon/check_reboot_required.sh
    checks: [the-reboot-check-says-ok, a-pending-reboot-gives-a-warning]
  - outcome: the file-handle check reports the kernel's used and maximum handles
    from: manifests/sysmon_base.pp:40-47; files/sysmon/check_file_handles.sh
    checks: [the-file-handle-check-reports-the-kernel-counts]
  - outcome: the connection checks count the node's listening and established connections, and the remote IPs on a port
    from: manifests/sysmon_base.pp:49-65; files/sysmon/check_netstat_conns.sh, check_netstat_cip.sh
    checks: [the-connection-checks-count-real-connections]
  - outcome: the package-count check warns at the given number of upgradable packages from the update list
    from: manifests/sysmon_base.pp:67-74; files/sysmon/check_package_count.sh
    checks: [the-package-count-check-warns-at-its-threshold]
  - outcome: the bandwidth check reports the interface's throughput against its thresholds
    from: manifests/sysmon_base.pp:76-83; files/sysmon/check_bandwidth.sh
    checks: [the-bandwidth-check-reports-throughput]
  - outcome: the disk latency check times a synchronous write and goes CRITICAL past its threshold
    from: manifests/sysmon_base.pp:85-92; files/sysmon/check_dd_latency.sh
    checks: [the-latency-check-times-a-write]
  - outcome: the CPU and memory plugins report usage, and memory goes CRITICAL past its threshold
    from: manifests/sysmon_base.pp:94-110
    checks: [cpu-and-memory-are-reported]
  - outcome: the OS check reports the release
    from: manifests/sysmon_base.pp:112-119; files/sysmon/check_os_version.sh
    checks: [the-os-check-reports-the-release]
  - outcome: the TLS certificate check reports a certificate's expiry in short words, WARNING inside the warning window
    from: manifests/sysmon_base.pp:121-128; files/sysmon/check_http_ssl_cert.sh
    checks: [the-certificate-check-reports-expiry-in-short-words]
  - outcome: the Elasticsearch query check counts log events matching a query
    from: manifests/sysmon_base.pp:130-136; files/sysmon/elastic_query_check.py
    uncovered: {why: "needs an Elasticsearch server holding the node's logs; no lab node runs one and no class installs one", lifted_by: ubuntu2}
  - outcome: on RedHat the same checks are installed (the computed package name nagios-plugins-disk is not used by any resource)
    from: manifests/sysmon_base.pp:4-15
    uncovered: {why: "the set runs on the plan's Ubuntu node; sysmon_base's RedHat run is the Phase 1 per-node verdict on rhel9", lifted_by: rhel9}
checks:
  - id: the-checks-are-installed
    what: every check root:root 0755; the module's files byte for byte (nagios-puppet.sh by owner and mode only); check_cpu.py runs under the local mypython
    control: negative
    derived_from:
      - {path: manifests/sysmon_base.pp, lines: "22-29", text: "source  => 'puppet:///modules/puppet_infrastructure/sysmon/nagios-puppet.sh',"}
      - {path: manifests/sysmon_base.pp, lines: "95-101", text: "content => template('puppet_infrastructure/sysmon/check_cpu.py.erb'),"}
      - {path: files/sysmon/check_reboot_required.sh, sha256: "9bacf362399850082a6bedaafd7989b5c6241909672bde173eddef2ef8b53835"}
      - {path: files/sysmon/check_file_handles.sh, sha256: "7e4e37bfea8176710919ce81a4e8a9884005b2596bca0249c1060dd72b6878d4"}
      - {path: files/sysmon/check_netstat_conns.sh, sha256: "7857765d96f23f987d877311fabd00c51624f25d890c28cef8d068673903f700"}
      - {path: files/sysmon/check_netstat_cip.sh, sha256: "b23b5c205237f0e3c35c93657ffbb63336f60587a52f6b88f785e535092a242c"}
      - {path: files/sysmon/check_package_count.sh, sha256: "a2a5bd075742a0073e201fc418fb5692177b4081d5f19d8082cbc83bd439f351"}
      - {path: files/sysmon/check_bandwidth.sh, sha256: "93923b2ac8f27d18472598c51edd3a56c7a612607ae92aea1615161f87222e8d"}
      - {path: files/sysmon/check_dd_latency.sh, sha256: "d2a32fb788053263612dbcf6765ef1cc0269e5f18c4d5522bf4ff691e5280b84"}
      - {path: files/sysmon/check_os_version.sh, sha256: "0a586c32bcefc10c45bf150c81f520310a2f949ca5013acda6a3c9818342a43e"}
      - {path: files/sysmon/check_http_ssl_cert.sh, sha256: "c1d17f8f136d3c5542ff09553cd3713578a99f8d0a1e900394aabcb161c97e77"}
      - {path: files/sysmon/elastic_query_check.py, sha256: "901a03a3b60e6f3b7c433cf94ef056b4de2247b58d0b4b483a874d3c0927a168"}
      - {path: files/sysmon/check_mem.pl, sha256: "aadc9c91a7faa555bcf3662860cddc69b5e884176f91f9170f0533baf887e560"}
    probe: |
      B=/opt/puppet-infrastructure/bin; P=/usr/lib64/nagios/plugins
      stat -c '%U:%G %a' $B/nagios-puppet.sh
      cd $B && sha256sum check_reboot_required.sh check_file_handles.sh check_netstat_conns.sh check_netstat_cip.sh check_package_count.sh check_bandwidth.sh check_dd_latency.sh check_os_version.sh check_http_ssl_cert.sh elastic_query_check.py | awk '{print $1}' | paste -sd' '
      sha256sum $P/check_mem.pl | cut -d' ' -f1
      stat -c '%U:%G %a' $B/check_*.sh $B/elastic_query_check.py $P/check_mem.pl $P/check_cpu.py | sort -u
      head -1 $P/check_cpu.py
    expect: {rc: 0, stdout: "\\Aroot:root 755\\n9bacf362399850082a6bedaafd7989b5c6241909672bde173eddef2ef8b53835 7e4e37bfea8176710919ce81a4e8a9884005b2596bca0249c1060dd72b6878d4 7857765d96f23f987d877311fabd00c51624f25d890c28cef8d068673903f700 b23b5c205237f0e3c35c93657ffbb63336f60587a52f6b88f785e535092a242c a2a5bd075742a0073e201fc418fb5692177b4081d5f19d8082cbc83bd439f351 93923b2ac8f27d18472598c51edd3a56c7a612607ae92aea1615161f87222e8d d2a32fb788053263612dbcf6765ef1cc0269e5f18c4d5522bf4ff691e5280b84 0a586c32bcefc10c45bf150c81f520310a2f949ca5013acda6a3c9818342a43e c1d17f8f136d3c5542ff09553cd3713578a99f8d0a1e900394aabcb161c97e77 901a03a3b60e6f3b7c433cf94ef056b4de2247b58d0b4b483a874d3c0927a168\\naadc9c91a7faa555bcf3662860cddc69b5e884176f91f9170f0533baf887e560\\nroot:root 755\\n#!/opt/puppet-infrastructure/bin/mypython\\n\\Z"}

  - id: the-reboot-check-says-ok
    what: with no pending reboot, the reboot check says OK and exits 0
    control: negative
    derived_from:
      - {path: files/sysmon/check_reboot_required.sh, sha256: "9bacf362399850082a6bedaafd7989b5c6241909672bde173eddef2ef8b53835"}
    probe: |
      /opt/puppet-infrastructure/bin/check_reboot_required.sh; echo "rc=$?"
    expect: {rc: 0, stdout: "\\AOK - No reboot required\\nrc=0\\n\\Z"}

  - id: the-file-handle-check-reports-the-kernel-counts
    what: the file-handle check says OK with the kernel's allocated, free and maximum handles, and the maximum as performance data
    control: negative
    derived_from:
      - {path: files/sysmon/check_file_handles.sh, sha256: "7e4e37bfea8176710919ce81a4e8a9884005b2596bca0249c1060dd72b6878d4"}
    probe: |
      out=$(/opt/puppet-infrastructure/bin/check_file_handles.sh); rc=$?
      max=$(cut -f3 /proc/sys/fs/file-nr)
      echo "$out" | grep -qE "^OK - [0-9]+ [0-9]+ [0-9]+ \| f_handle_used=[0-9]+;;;;$max\$" && echo "kernel counts, max $max" | sed 's/max [0-9]*/max as the kernel says/'
      echo "rc=$rc"
    expect: {rc: 0, stdout: "\\Akernel counts, max as the kernel says\\nrc=0\\n\\Z"}

  # 2026-11-18 authoring correction (run 2, 20261118T201641Z): `grep -c` exits 1 when it counts 0, so the probe's last
  # line made rc 1 once netstat was present; it now ends with `|| true`.
  - id: the-connection-checks-count-real-connections
    what: >-
      the connection check counts at least one listening TCP socket (sshd) and one established connection (the
      runner's own SSH session); the per-port check counts at least one remote IP on port 22 (that session's)
    control: negative
    derived_from:
      - {path: files/sysmon/check_netstat_conns.sh, sha256: "7857765d96f23f987d877311fabd00c51624f25d890c28cef8d068673903f700"}
      - {path: files/sysmon/check_netstat_cip.sh, sha256: "b23b5c205237f0e3c35c93657ffbb63336f60587a52f6b88f785e535092a242c"}
    probe: |
      B=/opt/puppet-infrastructure/bin
      $B/check_netstat_conns.sh 2>&1 | sed -n 's/.*tcp_listen=\([0-9]*\) .*tcp_established=\([0-9]*\) .*/listen \1 established \2/p' | awk '{print "tcp listen", ($2 != 0 ? "counted" : "zero"), "established", ($4 != 0 ? "counted" : "zero")}'
      $B/check_netstat_cip.sh 22 2>&1 | sed -n 's/.*num_of_ips=\([0-9]*\);.*/\1/p' | awk '{print "remote IPs on 22", ($1 != 0 ? "counted" : "zero")}'
      $B/check_netstat_conns.sh 2>&1 >/dev/null | grep -c 'command not found' || true
    expect: {rc: 0, stdout: "\\Atcp listen counted established counted\\nremote IPs on 22 counted\\n0\\n\\Z"}

  - id: the-bandwidth-check-reports-throughput
    what: the bandwidth check samples the host-only NIC for 1 s and reports OK with its throughput against thresholds of 100/200 Mbit/s
    control: negative
    derived_from:
      - {path: files/sysmon/check_bandwidth.sh, sha256: "93923b2ac8f27d18472598c51edd3a56c7a612607ae92aea1615161f87222e8d"}
    probe: |
      /opt/puppet-infrastructure/bin/check_bandwidth.sh enp0s8 1 100 200 1000 | sed -E 's/[0-9]+\.[0-9]+/N/g; s/[0-9]+\/[0-9]+ Bytes/B Bytes/'; echo "rc=${PIPESTATUS[0]}"
    expect: {rc: 0, stdout: "\\AIN N Mbit/s OUT N Mbit/s - OK - B Bytes in 1 sec \\| InUsage=N% OutUsage=N% inBandwidth=NMbps;100;200 outBandwidth=NMbps;100;200\\nrc=0\\n\\Z"}

  - id: cpu-and-memory-are-reported
    what: the CPU plugin says OK with total and per-CPU usage; the memory plugin says OK on free memory over 5% and CRITICAL when used memory passes 2%
    control: negative
    derived_from:
      - {path: manifests/sysmon_base.pp, lines: "95-101", text: "content => template('puppet_infrastructure/sysmon/check_cpu.py.erb'),"}
      - {path: files/sysmon/check_mem.pl, sha256: "aadc9c91a7faa555bcf3662860cddc69b5e884176f91f9170f0533baf887e560"}
    probe: |
      P=/usr/lib64/nagios/plugins
      $P/check_cpu.py | grep -oE '^OK: Total=[0-9]+%' | sed 's/[0-9]*%/N%/'; echo "rc=${PIPESTATUS[0]}"
      $P/check_mem.pl -f -w 5 -c 2 | cut -d' ' -f1; echo "rc=${PIPESTATUS[0]}"
      $P/check_mem.pl -u -w 1 -c 2 | cut -d' ' -f1; echo "rc=${PIPESTATUS[0]}"
    expect: {rc: 0, stdout: "\\AOK: Total=N%\\nrc=0\\nOK\\nrc=0\\nCRITICAL\\nrc=2\\n\\Z"}

  - id: the-os-check-reports-the-release
    what: the OS check says OK with the distribution and release
    control: negative
    derived_from:
      - {path: files/sysmon/check_os_version.sh, sha256: "0a586c32bcefc10c45bf150c81f520310a2f949ca5013acda6a3c9818342a43e"}
    probe: |
      /opt/puppet-infrastructure/bin/check_os_version.sh; echo "rc=$?"
    expect: {rc: 0, stdout: "\\AOK - OS: Ubuntu 24\\.04\\nrc=0\\n\\Z"}

  - id: the-puppet-check-ok-then-unknown-under-lock
    what: >-
      the Puppet check is run twice at once: the first runs the agent and reports OK with its exit code; the second,
      started once the first holds the agent's run lock, reports UNKNOWN with exit 3
    control: negative
    timeout: 600
    derived_from:
      - {path: files/sysmon/nagios-puppet.sh, sha256: "a20117e8983bb2df71e2083a37afe060a4350e38a273889a33d78977a48b9828"}
    mutates: >-
      runs the class's Puppet check twice on the node (the first makes one agent run, which applies the node's catalog;
      the second starts while that run holds the lock); outputs and exit codes in /run/p8test-sysmon/puppet.txt
    probe: |
      install -d -m 0700 /run/p8test-sysmon; cd /run/p8test-sysmon
      lf=/opt/puppetlabs/puppet/cache/state/agent_catalog_run.lock
      ( /opt/puppet-infrastructure/bin/nagios-puppet.sh > first.out; echo $? > first.rc ) &
      for i in $(seq 120); do [ -e "$lf" ] && break; sleep 0.25; done
      /opt/puppet-infrastructure/bin/nagios-puppet.sh > second.out; echo $? > second.rc
      wait
      { echo "first: $(cut -d' ' -f1-4 first.out) rc=$(cat first.rc)"; echo "second: $(cut -d' ' -f1-4 second.out) rc=$(cat second.rc)"; } > puppet.txt
    effect: |
      cat /run/p8test-sysmon/puppet.txt
    expect: {rc: 0, stdout: "\\Afirst: OK: exit code [02] rc=0\\nsecond: UNKNOWN: exit code 1 rc=3\\n\\Z"}

  - id: a-pending-reboot-gives-a-warning
    what: once /var/run/reboot-required exists (as a package upgrade leaves it), the reboot check says WARNING and exits 1
    control: negative
    derived_from:
      - {path: files/sysmon/check_reboot_required.sh, sha256: "9bacf362399850082a6bedaafd7989b5c6241909672bde173eddef2ef8b53835"}
    mutates: creates /var/run/reboot-required on the node
    probe: |
      touch /var/run/reboot-required
    effect: |
      /opt/puppet-infrastructure/bin/check_reboot_required.sh; echo "rc=$?"
    expect: {rc: 0, stdout: "\\AWARNING - Reboot required to update host \\(/var/run/reboot-required found\\)\\nrc=1\\n\\Z"}

  # 2026-11-18 authoring correction (run 3, 20261118T202120Z): the check prints its package list one name per line
  # after the status, so only its first line is compared now.
  - id: the-package-count-check-warns-at-its-threshold
    what: >-
      with a fresh update list of 3 package names (filesystem_apt's update script writes it in production), the
      package check says OK below a threshold of 10 and WARNING at a threshold of 2
    control: negative
    derived_from:
      - {path: files/sysmon/check_package_count.sh, sha256: "a2a5bd075742a0073e201fc418fb5692177b4081d5f19d8082cbc83bd439f351"}
    mutates: writes /var/lib/apt-check-updates/list (3 names, p8test-a p8test-b p8test-c) on the node
    probe: |
      install -d /var/lib/apt-check-updates
      printf 'p8test-a\np8test-b\np8test-c\n' > /var/lib/apt-check-updates/list
    effect: |
      B=/opt/puppet-infrastructure/bin
      $B/check_package_count.sh 10 | head -1 | cut -d' ' -f1-3; echo "rc=${PIPESTATUS[0]}"
      $B/check_package_count.sh 2 | head -1 | cut -d' ' -f1-3; echo "rc=${PIPESTATUS[0]}"
    expect: {rc: 0, stdout: "\\AOK - 3\\nrc=0\\nWARNING - 3\\nrc=1\\n\\Z"}

  # 2026-11-18 authoring correction (run 3, 20261118T202120Z): `grep -c` exits 1 when it counts 0; the last line now
  # ends with `|| true`.
  - id: the-latency-check-times-a-write
    what: the latency check times a 1 MB synchronous write into /tmp, OK under 5 s, and CRITICAL with a threshold of 0 s
    control: negative
    derived_from:
      - {path: files/sysmon/check_dd_latency.sh, sha256: "d2a32fb788053263612dbcf6765ef1cc0269e5f18c4d5522bf4ff691e5280b84"}
    mutates: two 1 MB test files written to and removed from /tmp on the node by the check itself
    probe: |
      true
    effect: |
      B=/opt/puppet-infrastructure/bin
      $B/check_dd_latency.sh /tmp 1 5 10 | cut -d' ' -f1; echo "rc=${PIPESTATUS[0]}"
      $B/check_dd_latency.sh /tmp 1 0 0 | cut -d' ' -f1; echo "rc=${PIPESTATUS[0]}"
      ls /tmp | grep -c '^zero\.img\.' || true
    expect: {rc: 0, stdout: "\\AOK\\nrc=0\\nCRITICAL\\nrc=2\\n0\\n\\Z"}

  - id: the-certificate-check-reports-expiry-in-short-words
    what: >-
      against a local TLS server with a 10-day certificate, the certificate check says OK in short words ("expires
      on", no "Certificate") with a 5-day window, and WARNING with a 30-day window, passing check_http's exit codes
    control: negative
    derived_from:
      - {path: files/sysmon/check_http_ssl_cert.sh, sha256: "c1d17f8f136d3c5542ff09553cd3713578a99f8d0a1e900394aabcb161c97e77"}
    mutates: starts openssl s_server on 127.0.0.1:8443 with a self-signed 10-day certificate (CN p8test.local) in /run/p8test-sysmon, as transient unit p8test-tls
    probe: |
      install -d -m 0700 /run/p8test-sysmon; d=/run/p8test-sysmon
      openssl req -x509 -newkey rsa:2048 -nodes -keyout $d/k.pem -out $d/c.pem -days 10 -subj /CN=p8test.local 2>/dev/null
      systemd-run --unit p8test-tls -q openssl s_server -accept 127.0.0.1:8443 -cert $d/c.pem -key $d/k.pem -www -quiet
      sleep 1
    effect: |
      B=/opt/puppet-infrastructure/bin
      $B/check_http_ssl_cert.sh -H 127.0.0.1 -p 8443 -S -C 5,2 | sed -E "s/'p8test.local' expires on .*/'p8test.local' expires on DATE/"; echo "rc=${PIPESTATUS[0]}"
      $B/check_http_ssl_cert.sh -H 127.0.0.1 -p 8443 -S -C 30,5 | sed -E 's/expires in [0-9]+ day.*/expires in N days/'; echo "rc=${PIPESTATUS[0]}"
    expect: {rc: 0, stdout: "\\AOK - 'p8test\\.local' expires on DATE\\nrc=0\\nWARNING - 'p8test\\.local' expires in N days\\nrc=1\\n\\Z"}
