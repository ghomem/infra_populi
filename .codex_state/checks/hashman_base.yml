# Phase 3 checks for puppet_infrastructure::hashman_base (class; required_base filesystem_base; a plain GREEN since
# 2026-11-17, HQ ruling 2: the agent package ships /etc/puppetlabs/code/environments/production/manifests, so the former
# node_fixture puppetserver_code_tree was dropped).
# Fixture: class defaults (debug_mode false) and the lab Hiera (hashman::company 'My Company', hashman::address via
# puppet::address puppet.example.com, hashman::testenv 'False', no minpasswordlen/relaxpassword keys -> 6 / True,
# hashman::dbdir = puppet::manifdir/01_hashman/, hashman::bindir = /opt/puppet-infrastructure/hashman).
# What the checks show: the CLI and its library rendered from Hiera, the empty database files, the Python packages, that
# the CLI starts, and (2026-11-18, HQ ruling C2: node puppetserver, the master-role node p8lab-puppetserver; hashman_base
# composed with postfix_smtp_node, the local MTA its mail needs) the database as Puppet code on a master: the
# administrator adds the fixture user p8hashuser with the CLI, sets its password with `setpw`, and copies the role line
# it prints into the client's node definition. The peer's (ubuntu2) agent run against the master-role server applies
# the user, and PAM there accepts the password. The former `uncovered` note is lifted by that.
# 2026-11-20 (backfill batch 6): purpose and outcomes (HQ rulings 2 and C1), and the server's own agent run after the
# administrator's change (node_agent), which must leave the database alone (replace => 'no').
# 2026-11-20 correction round 1 (review 20261120T104729Z, purpose gap): the CLI's revocation and key distribution were
# not covered. Added: the administrator sets p8hashuser's SSH key (setpubkey), adds p8hashlocked and p8hashexpired with
# passwords and locks one, expires the other, adds and deletes p8hashdel (userdel); the client node definition gets the
# three users' role lines. The agent runs now follow that change. Prototyped on p8lab-puppetserver 2026-11-20: lock
# prefixes the hash with '!', expire turns '$6$' into '$!6$' (the CLI's own auth still accepts an expired password;
# user_base treats any '!' as locked), userdel leaves no line of the user in any database file.
# 2026-11-20 correction round 2 (review 20261120T111006Z, purpose gap): the CLI's support-team notifications (the lab's
# MTA queues them: the fake relayhost defers them, so the queue can be read) and the hashman_web precondition for the
# mails to users. The earlier mail row's evidence was wrong (the lab's hashman::mailfrom is hashman@mycompany.com).
# Authoring error 2026-11-20 (run 20261120T105405Z): the key lines were matched with p8_count (grep -E), and a key's
# base64 body holds '+', a regex quantifier, so the present key read 0; the locked user's key-absence check read 0 for
# the same reason whatever the file held. All three now match the key as a fixed string (grep -F). The behaviour in
# that run was as expected (keys.pp held the key: the-next-agent-run-keeps-the-database passed).
class: hashman_base
baseline: release-0.9.10 (cf477c6)
fixture: defaults
peer:
  kind: ubuntu2
  why: the database is consumed by the master's catalogs for other machines, so another machine must apply a user from it
  files: [/run/p8test-hashman/id_p8.pub, /run/p8test-hashman/id_p8l.pub]
node_agent:
  after: admin-sets-a-key-and-revokes-users
  why: the database files are declared replace => 'no', which only an agent run of the server after a user was added can show
peer_agent:
  after: admin-sets-a-key-and-revokes-users
  certname: p8test-hashman-client
  why: the database reaches another machine only through that machine's agent run against the master-role server
purpose: >-
  Provides Hashman, a Puppet-based user directory managed from the command line: the pp_auth CLI and its library,
  configured from Hiera, and a user database kept as Puppet code in the master's manifests, created empty on the first
  run and never overwritten afterwards, from which the master's catalogs give users and password hashes to other
  machines.
outcomes:
  - outcome: the CLI, its library configured from Hiera and its Python packages are installed, and the CLI starts
    from: manifests/hashman_base.pp:13-151, 170-171
    checks: [config-rendered-from-hiera, python-dependencies-installed, cli-wrapper-starts-the-cli]
  - outcome: an empty, usable user database in the master's manifests after the first run
    from: manifests/hashman_base.pp:47, 160-167
    checks: [empty-database-files, admin-adds-a-user-with-a-password]
  - outcome: the administrator adds a user, unlocks it and sets its password with the CLI, and the CLI authenticates it
    from: templates/hashman/pp_auth.py.erb:111-148, 202-215
    checks: [admin-adds-a-user-with-a-password]
  - outcome: the server's next agent run leaves the database as the administrator left it (replace no)
    from: manifests/hashman_base.pp:160-167
    checks: [the-next-agent-run-keeps-the-database]
  - outcome: another machine gets the user, its name, its password and its SSH key from the database through the master's catalog
    from: templates/hashman/libhashman/interface.py.erb:343; templates/hashman/libhashman/dbutils.py.erb:431-445
    checks: [admin-sets-a-key-and-revokes-users, a-client-applies-the-user-from-the-database]
  - outcome: a user the administrator locks or expires is refused on the other machine and gets no SSH key there; a deleted user leaves the database
    from: templates/hashman/libhashman/dbutils.py.erb:780-805; templates/hashman/libhashman/config.py.erb:58-59; manifests/user_base.pp:41-62
    checks: [admin-sets-a-key-and-revokes-users, a-client-refuses-the-locked-and-expired-users]
  - outcome: every notifying CLI command (useradd, unlock, setpw, auth, lock, expire, userdel) mails the support team its result, through the local MTA
    from: templates/hashman/pp_auth.py.erb:524-548; templates/hashman/libhashman/config.py.erb:6-7, 19; files/hashman/common/hashman_utils.py:11-24, 40-55
    checks: [the-support-team-is-notified-of-each-command]
  - outcome: without hashman_web, the CLI refuses the commands that mail the user (useradd without SILENT, inform) and changes nothing
    from: templates/hashman/libhashman/miscutils.py.erb:151-158
    checks: [user-mail-commands-need-hashman-web]
  - outcome: the mails to the user themselves (a new user's initial password, reset, inform, testemail)
    from: templates/hashman/libhashman/miscutils.py.erb:151-158; templates/hashman/libhashman/config.py.erb:66
    uncovered:
      why: they need hashman_web's email template, which this class does not install; they belong to hashman_web composed with this class
      lifted_by: "capability: hashman_web composed with hashman_base on the class's node"
      evidence: "check_hashman_web exits before mailing when EMAIL_TEMPLATE (TEMPLATE_DIR/email/index.html) is absent, and hashman_base declares no file there (manifests/hashman_base.pp); user-mail-commands-need-hashman-web shows the refusal"
  - outcome: encrypted home data (setecryptfs) reaching the other machine
    from: templates/hashman/libhashman/dbutils.py.erb:431-445; manifests/user_base.pp:104-110
    uncovered:
      why: the wrapped-passphrase data belongs to a user's real ecryptfs setup, which no fixture user has
      lifted_by: "capability: an ecryptfs-encrypted home fixture on the peer"
      evidence: "the fixture users are created by the CLI with passwords only; no ecryptfs package or wrapped passphrase exists on p8lab-ubuntu2's baseline"
  - outcome: debug output, another minimum password length or strict password rules
    from: manifests/hashman_base.pp:14-15, 26-27
    uncovered:
      why: one set holds one fixture (the class defaults and the lab Hiera)
      lifted_by: "capability: more than one params fixture per set"
      evidence: "phase3.py applies the class once with its single `fixture` (params or defaults)"
checks:
  - id: config-rendered-from-hiera
    what: the library config carries the database dir, company, URL, test-env and debug flags and the password defaults
    control: negative
    derived_from:
      - {path: manifests/hashman_base.pp, lines: "20", text: "$url        = join ( [ 'https://' , lookup('hashman::address') ] )"}
      - {path: manifests/hashman_base.pp, lines: "26-27", text: "$minpasswordlen = lookup({ name => 'hashman::minpasswordlen' , default_value => '6' })"}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "4-11", text: "DBDIR  = '<%= @dbdir %>'"}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "109-113", text: "MINPASSWORDLEN = <%= @minpasswordlen %>"}
    probe: |
      grep -E "^(DBDIR|MAIN_COMPANY|HASHMAN_URL|TESTENV|DEBUG_MODE|MINPASSWORDLEN|RELAXPASSWORD) *=" /opt/puppet-infrastructure/hashman/common/libhashman/config.py
    expect: {rc: 0, stdout: "\\ADBDIR  = '/etc/puppetlabs/+code/environments/production/manifests/01_hashman/'\\nMAIN_COMPANY = 'My Company'\\nHASHMAN_URL = 'https://puppet\\.example\\.com'\\nTESTENV = False\\nDEBUG_MODE = False\\nMINPASSWORDLEN = 6\\nRELAXPASSWORD = True\\n\\Z"}

  - id: empty-database-files
    what: the seven database files exist, empty, 0644, in the master's manifests/01_hashman
    control: negative
    derived_from:
      - {path: manifests/hashman_base.pp, lines: "47", text: "$dbfiles = [ \"${dbdir}/cnames.pp\" , \"${dbdir}/companies.pp\", \"${dbdir}/emails.pp\", \"${dbdir}/hashes.pp\", \"${dbdir}/keys.pp\", \"${dbdir}/ppsigs.pp\", \"${dbdir}/ppwrapped.pp\" ]"}
      - {path: manifests/hashman_base.pp, lines: "163-167", text: "replace => 'no', # can't touch this!"}
    probe: |
      cd /etc/puppetlabs/code/environments/production/manifests/01_hashman && stat -c '%n %s %a' cnames.pp companies.pp emails.pp hashes.pp keys.pp ppsigs.pp ppwrapped.pp
    expect: {rc: 0, stdout: "\\Acnames\\.pp 0 644\\ncompanies\\.pp 0 644\\nemails\\.pp 0 644\\nhashes\\.pp 0 644\\nkeys\\.pp 0 644\\nppsigs\\.pp 0 644\\nppwrapped\\.pp 0 644\\n\\Z"}

  - id: python-dependencies-installed
    what: the CLI's Python packages are installed
    control: negative
    derived_from:
      - {path: manifests/hashman_base.pp, lines: "171", text: "package { [ 'python3-cracklib', 'python3-setproctitle', 'python3-openssl', 'python3-rsa', 'python3-prettytable' ]: ensure => present, }"}
    probe: dpkg-query -W -f '${Package} ${Status}\n' python3-cracklib python3-setproctitle python3-openssl python3-rsa python3-prettytable | sort
    expect: {rc: 0, stdout: "\\Apython3-cracklib install ok installed\\npython3-openssl install ok installed\\npython3-prettytable install ok installed\\npython3-rsa install ok installed\\npython3-setproctitle install ok installed\\n\\Z"}

  - id: cli-wrapper-starts-the-cli
    what: >-
      the pp_auth.sh wrapper (root 0755) runs pp_auth.py, whose imports (cracklib, setproctitle, prettytable, the
      rendered libhashman) load on the node's Python: with no arguments it prints its usage
    control: negative
    derived_from:
      - {path: manifests/hashman_base.pp, lines: "153-158", text: "content => template('puppet_infrastructure/hashman/pp_auth.sh.erb'),"}
      - {path: templates/hashman/pp_auth.sh.erb, lines: "4", text: "<%= @localdir %>/hashman/common/pp_auth.py \"$@\""}
      - {path: templates/hashman/libhashman/interface.py.erb, lines: "445-447", text: "print('Usage: ' + basename + ' auth          USER PASSWORD')"}
    probe: |
      stat -c '%U %a' /opt/puppet-infrastructure/bin/pp_auth.sh
      /opt/puppet-infrastructure/bin/pp_auth.sh 2>/dev/null | head -1
    expect: {rc: 0, stdout: "\\Aroot 755\\nUsage: pp_auth\\.py auth +USER PASSWORD\\n\\Z"}


  # 2026-11-18 authoring correction (run 1, 20261118T091214Z): the action ran `setpw` before `unlock`; setpw first
  # authenticates the old password (pp_auth.py.erb:146), which a locked user cannot, so `set -e` stopped the action
  # and nothing was written. The administrator unlocks first, as the web flow (unlock, then login) does. The behaviour
  # is unchanged.
  - id: admin-adds-a-user-with-a-password
    what: >-
      with the CLI the administrator adds p8hashuser, unlocks it, changes its initial password with `setpw` and copies
      the role line `printinfo` prints into the client's node definition; `auth` then accepts the set password only
    control: negative
    derived_from:
      - {path: templates/hashman/pp_auth.py.erb, lines: "202-215", text: "if ( confirm_mail == \"SILENT\" ):"}
      - {path: templates/hashman/pp_auth.py.erb, lines: "137-148", text: "rc = setpw( username, newpassword, False, password )"}
      - {path: templates/hashman/pp_auth.py.erb, lines: "111-120", text: "rc = auth( username , password )"}
      - {path: templates/hashman/libhashman/interface.py.erb, lines: "343", text: "puppet_infrastructure::user        {"}
      - {path: manifests/hashman_base.pp, lines: "18", text: "$dbdir      = lookup('hashman::dbdir')"}
    mutates: >-
      on the node, through the wrapper /opt/puppet-infrastructure/bin/pp_auth.sh: useradd p8hashuser (SILENT), unlock,
      setpw from the logged initial password to p8test-Cli-pw5!, and the printinfo role line written as node
      'p8test-hashman-client' into the server's manifests/nodes/p8test-hashman-client.pp; the auth answers for the set
      and for a wrong password go to /run/p8test-hashman/cli.txt
    probe: |
      set -e
      c=/opt/puppet-infrastructure/bin/pp_auth.sh
      install -d -m 0700 /run/p8test-hashman
      initial=$($c useradd p8hashuser p8hashuser@example.invalid "P8test Hash User" p8test SILENT 2>&1 | sed -n 's/.*created with initial password //p' | head -1)
      $c unlock p8hashuser "p8test end to end" > /dev/null 2>&1
      $c setpw p8hashuser "$initial" 'p8test-Cli-pw5!' > /dev/null 2>&1
      line=$($c printinfo p8hashuser 2>/dev/null | grep -E '^  puppet_infrastructure::user +[{]')
      install -d -m 0755 /etc/puppetlabs/code/environments/production/manifests/nodes
      printf "node 'p8test-hashman-client' {\n%s\n}\n" "$line" > /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp
      set +e
      $c auth p8hashuser 'p8test-Cli-pw5!' > /dev/null 2>&1; echo "auth set password rc=$?" > /run/p8test-hashman/cli.txt
      $c auth p8hashuser 'p8test-Wrong-pw5!' > /dev/null 2>&1; echo "auth wrong password rc=$?" >> /run/p8test-hashman/cli.txt
    effect: |
      cat /run/p8test-hashman/cli.txt
      grep -c -E "^[$]p8hashuser_pwd_hash = '[$]6[$]" /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp
      sed -n 2p /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp
    expect: {rc: 0, stdout: "\\Aauth set password rc=0\\nauth wrong password rc=[1-9]\\d*\\n1\\n  puppet_infrastructure::user        \\{ 'p8hashuser': myname => \\$::p8hashuser_cname, myhash => \\$::p8hashuser_pwd_hash, mykey  => \\$::p8hashuser_ssh_key,  \\}\\n\\Z"}

  - id: admin-sets-a-key-and-revokes-users
    what: >-
      the administrator sets p8hashuser's SSH key, locks p8hashlocked and expires p8hashexpired (both with a set
      password and the first with a key), deletes p8hashdel, and gives the client the three users' role lines: the
      database then holds the key, the locked hash ('!' first) and the expired one ('$!6$'), no line of p8hashdel, and
      the CLI refuses the locked user's password
    control: negative
    derived_from:
      - {path: templates/hashman/libhashman/dbutils.py.erb, lines: "431-445", text: "return setent( username, index, pubkey , DBFILE_KEY )"}
      - {path: templates/hashman/libhashman/dbutils.py.erb, lines: "780-791", text: "def lockpw(username, ignorestatus=False):"}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "58-59", text: "EXPIREPREFIX = '!'"}
      - {path: templates/hashman/pp_auth.py.erb, lines: "177-182", text: "if case('lock'):"}
    mutates: >-
      generates two throwaway RSA keys in /run/p8test-hashman; through the CLI: setpubkey p8hashuser; useradd (SILENT),
      unlock and setpw p8test-Revoked-pw5! for p8hashlocked, p8hashexpired and p8hashdel; setpubkey p8hashlocked; lock
      p8hashlocked; expire p8hashexpired; userdel p8hashdel; rewrites the server's nodes/p8test-hashman-client.pp with the
      role lines of p8hashuser, p8hashlocked and p8hashexpired; the CLI's auth answers go to /run/p8test-hashman/revoke.txt
    probe: |
      set -e
      c=/opt/puppet-infrastructure/bin/pp_auth.sh; r=/run/p8test-hashman
      ssh-keygen -q -t rsa -b 2048 -N '' -C p8test -f $r/id_p8
      ssh-keygen -q -t rsa -b 2048 -N '' -C p8test -f $r/id_p8l
      $c setpubkey p8hashuser "$(cut -d' ' -f2 $r/id_p8.pub)" > /dev/null 2>&1
      for u in p8hashlocked p8hashexpired p8hashdel; do
        initial=$($c useradd $u $u@example.invalid "P8test $u" p8test SILENT 2>&1 | sed -n 's/.*created with initial password //p' | head -1)
        $c unlock $u "p8test end to end" > /dev/null 2>&1
        $c setpw $u "$initial" 'p8test-Revoked-pw5!' > /dev/null 2>&1
      done
      $c setpubkey p8hashlocked "$(cut -d' ' -f2 $r/id_p8l.pub)" > /dev/null 2>&1
      $c lock p8hashlocked > /dev/null 2>&1
      $c expire p8hashexpired > /dev/null 2>&1
      $c userdel p8hashdel > /dev/null 2>&1
      { echo "node 'p8test-hashman-client' {"; for u in p8hashuser p8hashlocked p8hashexpired; do $c printinfo $u 2>/dev/null | grep -E '^  puppet_infrastructure::user +[{]'; done; echo "}"; } > /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp
      set +e
      $c auth p8hashlocked 'p8test-Revoked-pw5!' > /dev/null 2>&1; echo "auth locked rc=$?" > $r/revoke.txt
    effect: |
      d=/etc/puppetlabs/code/environments/production/manifests/01_hashman
      cat /run/p8test-hashman/revoke.txt
      grep -cxF "\$p8hashuser_ssh_key = '$(cut -d' ' -f2 /run/p8test-hashman/id_p8.pub)'" $d/keys.pp
      p8_count "^[$]p8hashlocked_pwd_hash = '!" $d/hashes.pp
      p8_count "^[$]p8hashexpired_pwd_hash = '[$]!6[$]" $d/hashes.pp
      p8_count 'p8hashdel' $d/cnames.pp $d/companies.pp $d/emails.pp $d/hashes.pp $d/keys.pp
      p8_count '^  puppet_infrastructure::user ' /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp
    expect: {rc: 0, stdout: "\\Aauth locked rc=[1-9]\\d*\\n1\\n1\\n1\\n0\\n3\\n\\Z"}

  - id: the-next-agent-run-keeps-the-database
    what: >-
      after the server's own agent run, which follows the administrator's changes, hashes.pp still holds p8hashuser's
      hash, keys.pp its key, and the client's node file is still there (the class's empty database files are never put
      back)
    control: negative
    derived_from:
      - {path: manifests/hashman_base.pp, lines: "160-167", text: "replace => 'no', # can't touch this!"}
    mutates: none beyond reading the database (declared mutating so it runs after the node's agent run)
    probe: |
      true
    effect: |
      grep -c -E "^[$]p8hashuser_pwd_hash = '[$]6[$]" /etc/puppetlabs/code/environments/production/manifests/01_hashman/hashes.pp
      grep -c -E "^[$]p8hashuser_ssh_key = 'AAAA" /etc/puppetlabs/code/environments/production/manifests/01_hashman/keys.pp
      test -s /etc/puppetlabs/code/environments/production/manifests/nodes/p8test-hashman-client.pp && echo "node file kept"
    expect: {rc: 0, stdout: "\\A1\\n1\\nnode file kept\\n\\Z"}

  - id: a-client-applies-the-user-from-the-database
    what: >-
      after its agent run against the master-role server, the peer has p8hashuser with the database's name, PAM accepts
      the password set with the CLI and refuses a wrong one, and its authorized_keys holds the key set with setpubkey
    control: negative
    host: peer
    derived_from:
      - {path: manifests/user_base.pp, lines: "71", text: "password       => $myhash,"}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "38", text: "SUFFIX_USER      = '_pwd_hash'"}
    mutates: none beyond authenticating p8hashuser with PAM (declared mutating so it runs after the peer's agent run)
    probe: |
      true
    effect: |
      getent passwd p8hashuser | cut -d: -f1,5
      printf '%s\n' 'p8test-Cli-pw5!' | pamtester login p8hashuser authenticate 2>&1 | sed -n 's/.*pamtester: //p'
      printf '%s\n' 'p8test-Wrong-pw5!' | pamtester login p8hashuser authenticate 2>&1 | sed -n 's/.*pamtester: //p'
      grep -cxF "ssh-rsa $(cut -d' ' -f2 /run/p8test-from-node/id_p8.pub) p8hashuser@puppet" /home/p8hashuser/.ssh/authorized_keys
    expect: {rc: 0, stdout: "\\Ap8hashuser:P8test Hash User\\nsuccessfully authenticated\\nAuthentication failure\\n1\\n\\Z"}

  - id: a-client-refuses-the-locked-and-expired-users
    what: >-
      after the same agent run, the peer has p8hashlocked and p8hashexpired, PAM refuses each one's password set before
      the lock or expiry, the locked user's own key is not in its authorized_keys (user_base pushes a placeholder for a
      locked hash), and the peer has no p8hashdel
    control: negative
    host: peer
    derived_from:
      - {path: manifests/user_base.pp, lines: "45-50", text: "if ( '!' in $myhash ){"}
      - {path: manifests/user_base.pp, lines: "71", text: "password       => $myhash,"}
    mutates: none beyond authenticating the two users with PAM (declared mutating so it runs after the peer's agent run)
    probe: |
      true
    effect: |
      for u in p8hashlocked p8hashexpired; do
        getent passwd $u | cut -d: -f1
        printf '%s\n' 'p8test-Revoked-pw5!' | pamtester login $u authenticate 2>&1 | sed -n 's/.*pamtester: //p'
      done
      grep -cF "$(cut -d' ' -f2 /run/p8test-from-node/id_p8l.pub)" /home/p8hashlocked/.ssh/authorized_keys || true
      p8_count '^ssh-rsa userlocked' /home/p8hashlocked/.ssh/authorized_keys
      getent passwd p8hashdel || echo "no p8hashdel"
    expect: {rc: 0, stdout: "\\Ap8hashlocked\\nAuthentication failure\\np8hashexpired\\nAuthentication failure\\n0\\n1\\nno p8hashdel\\n\\Z"}

  - id: the-support-team-is-notified-of-each-command
    what: >-
      after the administrator's commands, the local MTA holds one notification per command and user from the Hiera
      sender to the support team, subject `Hashman <action> <SUCCESS|FAIL> for <user> at <time>`: 18 distinct subjects
      (creation, unlock and password change of four users, login success and failure of p8hashuser, lock and login
      failure of p8hashlocked, expiration of p8hashexpired, deletion of p8hashdel)
    control: negative
    derived_from:
      - {path: templates/hashman/pp_auth.py.erb, lines: "528-530", text: "notif_email( MAIL_FROM  , SUPPORT_TEAM, username , cmd , 'SUCCESS', extra_msg )"}
      - {path: templates/hashman/libhashman/config.py.erb, lines: "19", text: "NOTIFCMDS  = [ 'setpw' , 'lock' , 'unlock' , 'useradd' , 'userdel' , 'expire', 'unexpire', 'reset', 'auth', 'extauth', 'inform' ]"}
      - {path: files/hashman/common/hashman_utils.py, lines: "50-53", text: "subject = 'Hashman ' + ACTIONS[action] + ' ' + result + ' for ' + username + ' at ' + datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M\")"}
    mutates: none beyond reading the mail queue and mail.log (declared mutating so it runs after the administrator's commands)
    probe: |
      true
    effect: |
      for id in $(postqueue -j | sed -n 's/.*"queue_id": *"\([^"]*\)".*/\1/p'); do postcat -hq "$id" | sed -n 's/^Subject: //p'; done | sed -E 's/ at [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$//' | LC_ALL=C sort -u
