# Phase 3 checks for puppet_infrastructure::user_kde_lock_screen (define; harness title p8testuser, the user-identity
# fixture; required_base user_base creates the user; node kubuntu, Kubuntu 24.04 KDE Plasma 5). Fixture: params, an empty
# file (timeout 5 minutes, grace 0 seconds at their defaults). Replaces the 2026-11-16 deferral (needs: desktop, lifted by kubuntu).
# The define runs configure_lock_screen.sh as the user, guarded by the same script's --check mode; the script acts only
# when `who` lists the user and talks to the user's KDE session. The set's `session` block makes the runner log
# p8testuser in to Plasma after the apply and make two agent runs (the first applies the settings, the second must be
# clean), as a desktop user's next periodic agent run would; the checks then read the result.
class: user_kde_lock_screen
baseline: release-0.9.10 (cf477c6)
fixture: params
authoring:
  minutes: 0.4
  notes: "Wall clock 22:46:52Z to 22:47:16Z 2026-11-17 (draft to valid; the baseline define, the common class and the script read before)."
session:
  user: p8testuser
  desktop: plasma
  why: the exec applies the lock settings only on an agent run while the user is logged in to a KDE session
checks:
  - id: script-installed-root-executable
    what: the shared script is in bindir, root:root 0755
    control: negative
    derived_from:
      - {path: manifests/user_kde_lock_screen_common.pp, lines: "8-12", text: "mode   => '0755',"}
    probe: stat -c '%U %G %a' /opt/puppet-infrastructure/bin/configure_lock_screen.sh
    expect: {rc: 0, stdout: "\\Aroot root 755\\n\\Z"}

  - id: lock-settings-in-the-users-kscreenlockerrc
    what: >-
      after an agent run with the user logged in, the user's kscreenlockerrc [Daemon] has Autolock and LockOnResume on,
      Timeout 5 and LockGrace 0 (the define's defaults)
    control: negative
    derived_from:
      - {path: manifests/user_kde_lock_screen.pp, lines: "5-6", text: "Integer $screenlock_timeout_minutes = 5,"}
      - {path: manifests/user_kde_lock_screen.pp, lines: "14-18", text: "command => \"${bindir}/configure_lock_screen.sh ${screenlock_timeout_minutes} ${screenlock_grace_seconds}\","}
      - {path: files/user_kde_lock_screen/configure_lock_screen.sh, lines: "66-95", text: "--group Daemon --key Timeout ${LOCK_TIMEOUT}"}
    probe: |
      f=/home/p8testuser/.config/kscreenlockerrc
      stat -c '%U' "$f"
      sed -n '/^\[Daemon\]/,/^\[/p' "$f" | grep -E '^(Autolock|LockOnResume|Timeout|LockGrace)=' | sort
    expect: {rc: 0, stdout: "\\Ap8testuser\\nAutolock=true\\nLockGrace=0\\nLockOnResume=true\\nTimeout=5\\n\\Z"}

  - id: applied-in-the-session-and-reloaded-live
    what: >-
      the script saw the user logged in (its syslog note) and the live screenlocker reload over the session D-Bus did
      not fall back (no "DBus service unavailable" note)
    control: negative
    derived_from:
      - {path: files/user_kde_lock_screen/configure_lock_screen.sh, lines: "15-17", text: "logger -p local1.notice -t $SYSLOG_TAG \"User ${USERNAME} loged in, updating screenlock settings if needed\""}
      - {path: files/user_kde_lock_screen/configure_lock_screen.sh, lines: "102-105", text: "qdbus org.kde.screensaver /ScreenSaver configure || {"}
    probe: |
      journalctl -t linuxint-screenlocker -o cat --no-pager | grep -c '^User p8testuser loged in, updating screenlock settings if needed$' | sed 's/^[1-9][0-9]*$/logged-in-run/'
      journalctl -t linuxint-screenlocker -o cat --no-pager | grep -c 'DBus service unavailable' || true
    expect: {rc: 0, stdout: "\\Alogged-in-run\\n0\\n\\Z"}
