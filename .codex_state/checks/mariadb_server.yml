# Phase 3 checks for puppet_infrastructure::mariadb_server (class; per-class baseline exception 874f854; migrated with
# the ruled certificate-exec guard (upstream_defects.md mariadb_server) and the HQ batch-7 ruling-4 module-compatibility
# change: the module's File['/var/log/mysql'] carries the class's mode and ordering through a collector override).
# Fixture (params, never committed): a fake root password and, since 2026-11-21, the users p8test_mrw (rw) and p8test_mro
# (ro) with ed25519 hashes of p8test passwords (p8test-mrw-not-a-secret, p8test-mro-not-a-secret); generate_certificates
# default true. The hashes were computed by the lab's MariaDB 10.11 itself (CREATE USER ... IDENTIFIED VIA ed25519 USING
# PASSWORD(...), then mysql.user's authentication_string): the class header's `SELECT ed25519_password(...)` does not
# exist on 10.11 (ERROR 1305), a documentation note.
# Lab Hiera: db::organization 'My Company', db::cname 'example.com', db::email 'user@example.com' (the upstream example
# common.yaml, first in the hierarchy; the p8test_fixtures.yaml keys of the same names come after it and never win).
# Probes run as root, so the mysql client authenticates as root@localhost through /root/.my.cnf (puppetlabs-mysql).
class: mariadb_server
baseline: 874f854 (874f854)
fixture: params
peer:
  kind: ubuntu2
  why: the class's users are for any host, so another machine must log in to the class node over the network
purpose: >-
  Runs a MariaDB server whose root account is local only, with up to two users (read/write and read-only) that log in
  from any host with ed25519 passwords and only over TLS, using certificates the class generates from Hiera's subject
  data.
outcomes:
  - outcome: MariaDB runs with the class's TLS files, required secure transport, the ed25519 plugin and a bind on every address
    from: manifests/mariadb_server.pp:40-55, 158-166
    checks: [mariadb-server-installed-and-running, server-runs-the-override-options, ed25519-plugin-active, insecure-transport-refused]
  - outcome: root is local only and no anonymous user remains
    from: manifests/mariadb_server.pp:1-4, 161
    checks: [root-is-local-only-and-no-anonymous-user]
  - outcome: the class generates the server certificate from Hiera's subject data and deploys key, certificate and CA
    from: manifests/mariadb_server.pp:89-130
    checks: [server-key-matches-certificate, certificate-subject-from-hiera, certificate-files-owner-and-mode]
  - outcome: the log directory has the class's owner and mode
    from: manifests/mariadb_server.pp:168-174
    checks: [log-directory-attributes]
  - outcome: the rw and ro users exist for any host with ed25519 and required TLS; they log in over TLS, rw with every privilege, ro read-only
    from: manifests/mariadb_server.pp:5-12, 135-164
    checks: [the-users-are-ed25519-and-require-tls, the-users-log-in-with-their-grants]
  - outcome: another host logs in over the network with TLS, and without TLS is refused
    from: manifests/mariadb_server.pp:5-12, 53
    checks: [another-host-logs-in-over-tls]
  - outcome: custom mysqld or mariadb options, certificates not generated, a single user or none
    from: manifests/mariadb_server.pp:30-37, 89
    uncovered:
      why: one set holds one params fixture (generated certificates, both users, no custom options)
      lifted_by: "capability: more than one params fixture per set"
      evidence: "phase3.py applies the class once with its single `fixture` (params or defaults)"
checks:
  - id: mariadb-server-installed-and-running
    what: the MariaDB server package is installed and the running server reports itself as MariaDB
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "159", text: "package_name            => 'mariadb-server',"}
    probe: |
      dpkg-query -W -f '${Package} ${Status}\n' mariadb-server
      mysql -NB -e 'SELECT @@version' | grep -c MariaDB
    expect: {rc: 0, stdout: "\\Amariadb-server install ok installed\\n1\\n\\Z"}

  - id: server-runs-the-override-options
    what: the server runs with the class's TLS files, required secure transport and bind address
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "37", text: "$ssl_dir      = '/etc/mysql/certificates/'"}
      - {path: manifests/mariadb_server.pp, lines: "49-53", text: "'require_secure_transport' => 'ON',"}
    probe: |
      mysql -NB -e 'SELECT @@ssl_ca, @@ssl_cert, @@ssl_key, @@require_secure_transport, @@bind_address'
    expect: {rc: 0, stdout: "\\A/etc/mysql/certificates//ca\\.pem\\t/etc/mysql/certificates//server-cert\\.pem\\t/etc/mysql/certificates//server-key\\.pem\\t1\\t0\\.0\\.0\\.0\\n\\Z"}

  - id: ed25519-plugin-active
    what: the ed25519 authentication plugin is loaded and active
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "44", text: "'plugin_load_add' => 'auth_ed25519',"}
    probe: |
      mysql -NB -e "SELECT PLUGIN_STATUS FROM information_schema.PLUGINS WHERE PLUGIN_NAME = 'ed25519'"
    expect: {rc: 0, stdout: "\\AACTIVE\\n\\Z"}

  - id: insecure-transport-refused
    what: the root login connects over TCP with TLS and is refused over the same TCP without TLS (secure transport required)
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "52", text: "'require_secure_transport' => 'ON',"}
    probe: |
      tls=$(mysql --protocol=TCP -h 127.0.0.1 --ssl -NB -e 'SELECT 1' >/dev/null 2>&1 && echo connected || echo refused)
      plain=$(mysql --protocol=TCP -h 127.0.0.1 --skip-ssl -NB -e 'SELECT 1' >/dev/null 2>&1 && echo connected || echo refused)
      echo "tls=$tls plain=$plain"
    mismatch:
      varies: >-
        only the transport of the first login (--skip-ssl instead of --ssl): it must be refused too, so "tls=connected"
        must not come back
      probe: |
        tls=$(mysql --protocol=TCP -h 127.0.0.1 --skip-ssl -NB -e 'SELECT 1' >/dev/null 2>&1 && echo connected || echo refused)
        plain=$(mysql --protocol=TCP -h 127.0.0.1 --skip-ssl -NB -e 'SELECT 1' >/dev/null 2>&1 && echo connected || echo refused)
        echo "tls=$tls plain=$plain"
    expect: {rc: 0, stdout: "\\Atls=connected plain=refused\\n\\Z"}

  - id: root-is-local-only-and-no-anonymous-user
    what: after removing the default accounts, root exists only as root@localhost and there is no anonymous user
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "161", text: "remove_default_accounts => true,"}
    probe: |
      mysql -NB -e "SELECT CONCAT(user, '@', host) FROM mysql.user WHERE user IN ('root', '') ORDER BY 1"
    expect: {rc: 0, stdout: "\\Aroot@localhost\\n\\Z"}

  - id: server-key-matches-certificate
    what: the deployed server key is the key of the deployed server certificate
    control: negative
    derived_from:
      - {path: templates/mariadb/deploy_self_signed_certificates.sh.erb, lines: "10-11", text: "openssl req -newkey rsa:2048 -days 365000 -nodes -keyout server-key.pem -subj \"$CERT_INFO\" -out server-req.pem"}
      - {path: templates/mariadb/deploy_self_signed_certificates.sh.erb, lines: "19", text: "mv ca.pem server-key.pem server-cert.pem <%= @ssl_dir %>"}
    probe: |
      a=$(openssl x509 -in /etc/mysql/certificates/server-cert.pem -noout -pubkey)
      b=$(openssl pkey -in /etc/mysql/certificates/server-key.pem -pubout)
      test -n "$a" && test "$a" = "$b" && echo key-matches-certificate
    mismatch:
      varies: >-
        only the certificate compared (the generated ca.pem instead of server-cert.pem): the CA has its own key, so the
        public keys must differ
      probe: |
        a=$(openssl x509 -in /etc/mysql/certificates/ca.pem -noout -pubkey)
        b=$(openssl pkey -in /etc/mysql/certificates/server-key.pem -pubout)
        test -n "$a" && test "$a" = "$b" && echo key-matches-certificate
    expect: {rc: 0, stdout: "\\Akey-matches-certificate\\n\\Z"}

  - id: certificate-subject-from-hiera
    what: the server certificate's subject carries the organization, common name and email from Hiera
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "38-40", text: "$cname        = lookup('db::cname')"}
      - {path: templates/mariadb/deploy_self_signed_certificates.sh.erb, lines: "4", text: "CERT_INFO=\"/C=PT/ST=Lisbon/L=Lisbon/O=<%= @organization %>/OU=IT/CN=<%= @cname %>/emailAddress=<%= @email %>\""}
    probe: |
      openssl x509 -in /etc/mysql/certificates/server-cert.pem -noout -subject
    expect: {rc: 0, stdout: "\\Asubject=C = PT, ST = Lisbon, L = Lisbon, O = My Company, OU = IT, CN = example\\.com, emailAddress = user@example\\.com\\n\\Z"}

  - id: certificate-files-owner-and-mode
    what: the three deployed files are root:root 0644
    control: negative
    derived_from:
      - {path: templates/mariadb/deploy_self_signed_certificates.sh.erb, lines: "20-21", text: "chmod 644 <%= @ssl_dir %>*"}
    probe: |
      stat -c '%n %U %G %a' /etc/mysql/certificates/ca.pem /etc/mysql/certificates/server-cert.pem /etc/mysql/certificates/server-key.pem
    expect: {rc: 0, stdout: "\\A/etc/mysql/certificates/ca\\.pem root root 644\\n/etc/mysql/certificates/server-cert\\.pem root root 644\\n/etc/mysql/certificates/server-key\\.pem root root 644\\n\\Z"}

  - id: log-directory-attributes
    what: /var/log/mysql is a directory owned by mysql:adm with mode 0755
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "168-172", text: "group   => 'adm',"}
    probe: |
      stat -c '%F %U %G %a' /var/log/mysql
    expect: {rc: 0, stdout: "\\Adirectory mysql adm 755\\n\\Z"}

  - id: the-users-are-ed25519-and-require-tls
    what: p8test_mrw and p8test_mro exist for host % with the ed25519 plugin and required SSL (ssl_type 1, ANY)
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "138", text: "plugin => 'ed25519', tls_options => [ 'SSL' ]"}
      - {path: manifests/mariadb_server.pp, lines: "7-12", text: "# Those users can only connect using ssl (ex: --ssl flag on the command line)"}
    probe: |
      mysql -NB -e "SELECT user, host, plugin, JSON_VALUE(priv,'$.ssl_type') FROM mysql.global_priv g JOIN mysql.user u USING (user, host) WHERE user LIKE 'p8test_m%' ORDER BY user"
    expect: {rc: 0, stdout: "\\Ap8test_mro\\t%\\ted25519\\t1\\np8test_mrw\\t%\\ted25519\\t1\\n\\Z"}

  - id: the-users-log-in-with-their-grants
    what: >-
      over TCP with TLS both users log in with their passwords (CURRENT_USER at %); a wrong password is refused; the ro
      user's CREATE DATABASE is refused (ERROR 1044) while rw creates and drops one
    control: negative
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "139", text: "privileges => ['ALL'], table => '*.*'"}
      - {path: manifests/mariadb_server.pp, lines: "149", text: "privileges => ['SELECT','SHOW VIEW'], table => '*.*'"}
    mutates: >-
      six TCP logins to 127.0.0.1:3306; as p8test_mrw creates and drops the database p8test_mrwdb, as p8test_mro one
      refused CREATE DATABASE; the server records them in its data directory (/var/lib/mysql: system tables, logs); the
      answers go to /run/p8test-mariadb/answers.txt
    probe: |
      install -d -m 0700 /run/p8test-mariadb; o=/run/p8test-mariadb/answers.txt
      m="mysql --protocol=TCP -h 127.0.0.1 -P3306 --ssl -NB"
      $m -u p8test_mrw -p'p8test-mrw-not-a-secret' -e 'SELECT CURRENT_USER()' > $o 2>/dev/null
      $m -u p8test_mro -p'p8test-mro-not-a-secret' -e 'SELECT CURRENT_USER()' >> $o 2>/dev/null
      $m -u p8test_mrw -p'p8test-wrong-password' -e 'SELECT 1' 2>&1 | grep -oE 'ERROR [0-9]+' | head -1 | sed 's/^/wrong password: /' >> $o
      $m -u p8test_mro -p'p8test-mro-not-a-secret' -e 'CREATE DATABASE p8test_mrodb' 2>&1 | grep -oE 'ERROR [0-9]+' | head -1 | sed 's/^/ro create: /' >> $o
      $m -u p8test_mrw -p'p8test-mrw-not-a-secret' -e 'CREATE DATABASE p8test_mrwdb; DROP DATABASE p8test_mrwdb' 2>&1 | grep -oE 'ERROR [0-9]+' | head -1 | sed 's/^/rw create: /' >> $o
    effect: |
      cat /run/p8test-mariadb/answers.txt
    expect: {rc: 0, stdout: "\\Ap8test_mrw@%\\np8test_mro@%\\nwrong password: ERROR 1045\\nro create: ERROR 1044\\n\\Z"}

  - id: another-host-logs-in-over-tls
    what: >-
      from another machine (the peer), p8test_mrw logs in to the class node's MariaDB over TLS (ed25519) and the class
      node answers; the same login without TLS is refused
    control: negative
    host: peer
    timeout: 300
    derived_from:
      - {path: manifests/mariadb_server.pp, lines: "1-12", text: "# 3. and 2 other users that can access from any host"}
      - {path: manifests/mariadb_server.pp, lines: "53", text: "'bind-address'             => \"0.0.0.0\","}
    mutates: >-
      installs mariadb-client-core on the peer if absent; makes three TCP logins from the peer to the class node's port
      3306; the answers go to /run/p8test-mariadb-peer/answers.txt
    probe: |
      command -v mariadb >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install mariadb-client-core >/dev/null 2>&1
      install -d -m 0700 /run/p8test-mariadb-peer; o=/run/p8test-mariadb-peer/answers.txt
      m="mariadb --protocol=TCP -h 192.168.56.20 -P3306 -u p8test_mrw -pp8test-mrw-not-a-secret -NB"
      $m --ssl -e 'SELECT CURRENT_USER(), @@hostname' 2>/dev/null > $o
      $m --ssl -e "SHOW SESSION STATUS LIKE 'Ssl_version'" 2>/dev/null | cut -f2 | sed 's/^TLSv1\.[23]$/TLS/' >> $o
      $m --skip-ssl -e 'SELECT 1' 2>&1 | grep -oE 'ERROR [0-9]+' | head -1 >> $o
    effect: |
      cat /run/p8test-mariadb-peer/answers.txt
    expect: {rc: 0, stdout: "\\Ap8test_mrw@%\\tpuppet8node\\nTLS\\nERROR 1045\\n\\Z"}

