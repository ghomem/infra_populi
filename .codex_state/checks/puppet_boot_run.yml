# Phase 3 checks for puppet_infrastructure::puppet_boot_run (class, no parameters: no params file; required_base
# filesystem_base). Migrated with HQ ruling 8's upstream-defect fix (`ensure => running` dropped from the oneshot unit,
# upstream_defects.md). The class installs puppet_boot_run.sh and a oneshot unit wanted by multi-user.target, so a boot
# makes one agent run.
# 2026-11-20 (backfill batch 6): first set. A run does not reboot the node, so the exercise starts the unit as the boot
# does (`systemctl start`), once with another agent run's lockfile present (the script must skip and exit 0 without
# competing) and once without (the unit's script makes the agent run). That agent run is the class's own behaviour,
# not a probe's: the catalog is the one the harness applied, whose second run was clean.
class: puppet_boot_run
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Makes sure a machine runs the Puppet agent once during every boot: a oneshot systemd unit, enabled for the
  multi-user target, runs a script that waits for apt/dpkg locks, skips if another agent run is in progress, and runs
  the agent with a time limit.
outcomes:
  - outcome: the script and the unit are installed, and the unit is enabled for multi-user.target (not kept running)
    from: manifests/puppet_boot_run.pp:8-40; templates/etc/puppet_boot_run.service.erb:1-11
    checks: [script-and-unit-installed, unit-enabled-for-boot]
  - outcome: started while another agent run holds the lockfile, the unit skips without competing and succeeds
    from: files/etc/puppet_boot_run.sh:10-17
    checks: [the-unit-skips-while-another-run-is-active]
  - outcome: started as the boot does while dpkg's lock is held, the unit waits for the lock, then makes one agent run and succeeds
    from: files/etc/puppet_boot_run.sh:19-46
    checks: [the-unit-makes-an-agent-run]
  - outcome: the unit runs during a real boot, after the network is up enough for the agent to reach the master
    from: templates/etc/puppet_boot_run.service.erb:3, 10-11
    uncovered:
      why: a run does not reboot the class's node; the unit is started by hand instead
      lifted_by: "capability: a reboot of the class's node inside a phase3 run"
      evidence: "phase3.py has no reboot step: a run reverts, applies, probes, and at most runs the node's agent (node_agent)"
checks:
  - id: script-and-unit-installed
    what: the script is root:root 0750 with the module file's content, and the unit (0644) runs it as a oneshot
    control: negative
    derived_from:
      - {path: manifests/puppet_boot_run.pp, lines: "11-17", text: "source => ('puppet:///modules/puppet_infrastructure/etc/puppet_boot_run.sh')"}
      - {path: files/etc/puppet_boot_run.sh, sha256: 4e69688ce0bb941774382bff816ba3190d185adf6341e04e1e1cfa2b2c4b9c6a}
      - {path: templates/etc/puppet_boot_run.service.erb, lines: "5-7", text: "ExecStart=<%= @boot_run_script %>"}
    probe: |
      p8_digest /opt/puppet-infrastructure/bin/puppet_boot_run.sh | cut -d' ' -f2-
      stat -c '%U %G %a' /etc/systemd/system/puppet_boot_run.service
      grep -E '^(Type|ExecStart|WantedBy)=' /etc/systemd/system/puppet_boot_run.service
    expect: {rc: 0, stdout: "\\Aroot:root 750 4e69688ce0bb941774382bff816ba3190d185adf6341e04e1e1cfa2b2c4b9c6a\\nroot root 644\\nType=oneshot\\nExecStart=/opt/puppet-infrastructure/bin/puppet_boot_run\\.sh\\nWantedBy=multi-user\\.target\\n\\Z"}

  - id: unit-enabled-for-boot
    what: systemd knows the unit (daemon-reload ran), it is enabled, and multi-user.target wants it
    control: negative
    derived_from:
      - {path: manifests/puppet_boot_run.pp, lines: "27-38", text: "enable   => true,"}
      - {path: templates/etc/puppet_boot_run.service.erb, lines: "10-11", text: "WantedBy=multi-user.target"}
    probe: |
      systemctl is-enabled puppet_boot_run.service
      systemctl show -p Wants --value multi-user.target | tr ' ' '\n' | grep -x puppet_boot_run.service
    expect: {rc: 0, stdout: "\\Aenabled\\npuppet_boot_run\\.service\\n\\Z"}

  - id: the-unit-skips-while-another-run-is-active
    what: >-
      with the agent's catalog-run lockfile present, the unit started as the boot does finishes successfully, and its log
      says it skipped (no agent run of its own)
    control: negative
    timeout: 180
    derived_from:
      - {path: files/etc/puppet_boot_run.sh, lines: "10-17", text: "echo \"Another puppet run appears active (lockfile exists: $LOCKFILE). Skipping boot run.\" >> \"$LOG\""}
    mutates: >-
      creates the agent's catalog-run lockfile (/opt/puppetlabs/puppet/cache/state/agent_catalog_run.lock) with a dead
      pid, starts puppet_boot_run.service (the script skips; it writes its log /tmp/puppet_boot_run.log), removes the
      lockfile; copies the unit's log and result to /run/p8test-bootrun (skip.log, skip.rc)
    probe: |
      lock=/opt/puppetlabs/puppet/cache/state/agent_catalog_run.lock
      install -d -m 0700 /run/p8test-bootrun
      echo 999999 > "$lock"
      systemctl start puppet_boot_run.service; echo "start rc=$?" > /run/p8test-bootrun/skip.rc
      systemctl show -p Result --value puppet_boot_run.service >> /run/p8test-bootrun/skip.rc
      cp /tmp/puppet_boot_run.log /run/p8test-bootrun/skip.log
      rm -f "$lock"
    effect: |
      cat /run/p8test-bootrun/skip.rc
      p8_count 'Skipping boot run\.$' /run/p8test-bootrun/skip.log
      p8_count '^Running puppet.agent at' /run/p8test-bootrun/skip.log
    expect: {rc: 0, stdout: "\\Astart rc=0\\nsuccess\\n1\\n0\\n\\Z"}

  - id: the-unit-makes-an-agent-run
    what: >-
      started as the boot does while another process holds dpkg's frontend lock for 15 s, the unit waits: its agent run
      starts only after the lock is released; the unit finishes successfully, its log shows the agent run it made, and
      the agent's last run summary is from that run
    control: negative
    timeout: 600
    derived_from:
      - {path: files/etc/puppet_boot_run.sh, lines: "33-42", text: "timeout \"$PUPPET_TIMEOUT\" /opt/puppetlabs/bin/puppet agent -t >> \"$LOG\" 2>&1"}
      - {path: templates/etc/puppet_boot_run.service.erb, lines: "6-7", text: "Type=oneshot"}
      - {path: files/etc/puppet_boot_run.sh, lines: "19-31", text: "if ! lsof /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; then"}
    mutates: >-
      holds /var/lib/dpkg/lock-frontend open (flock) for 15 s in a background shell, which writes the release time to
      /run/p8test-bootrun/released; starts puppet_boot_run.service, whose script makes one agent run against the lab master (the node's catalog, which
      the harness applied with a clean second run; the run writes the agent's state, reports and last run summary under
      /opt/puppetlabs/puppet/cache) and its log /tmp/puppet_boot_run.log; records the start time and copies the unit's
      log and result to /run/p8test-bootrun (start, run.log, run.rc)
    probe: |
      install -d -m 0700 /run/p8test-bootrun
      date +%s > /run/p8test-bootrun/start
      ( exec 9>/var/lib/dpkg/lock-frontend; flock 9; sleep 15; date +%s > /run/p8test-bootrun/released ) &
      sleep 2
      systemctl start puppet_boot_run.service; echo "start rc=$?" > /run/p8test-bootrun/run.rc
      systemctl show -p Result --value puppet_boot_run.service >> /run/p8test-bootrun/run.rc
      cp /tmp/puppet_boot_run.log /run/p8test-bootrun/run.log
    effect: |
      cat /run/p8test-bootrun/run.rc
      ran=$(date -d "$(sed -n 's/^Running puppet.agent at: //p' /run/p8test-bootrun/run.log)" +%s)
      [ "$ran" -ge "$(cat /run/p8test-bootrun/released)" ] && echo "the agent run started after the dpkg lock was released"
      p8_count '^Running puppet.agent at' /run/p8test-bootrun/run.log
      p8_count 'Notice: Applied catalog in ' /run/p8test-bootrun/run.log
      last=$(sed -n 's/^ *last_run: *//p' /opt/puppetlabs/puppet/public/last_run_summary.yaml)
      [ "$last" -ge "$(cat /run/p8test-bootrun/start)" ] && echo "last run is the unit's"
    expect: {rc: 0, stdout: "\\Astart rc=0\\nsuccess\\nthe agent run started after the dpkg lock was released\\n1\\n1\\nlast run is the unit's\\n\\Z"}
