# Phase 3 checks for puppet_infrastructure::caching_nameserver (class; node ubuntu; no required base). Fixture (params,
# never committed): allowed_networks ["192.168.56.0/25"], which holds the node's host-only address (.20) and the peer's
# +100 address (.124) and leaves out the peer's +150 address (.174). The template uses the list both for listen-on
# (bind listens on its local addresses that match) and for allow-query and allow-query-cache. The peer (ubuntu2) asks
# from inside and from outside the list; peer probes name only the class node's host-only address and compute their
# own addresses. Recursion goes out through the lab's NAT uplink.
# 2026-11-19, HQ batch-14 ruling 5 (keep the IPv4-only fixture for the lab): the lab IPv6 fixture also runs named
# with -4, as network_vpn's does. Removing the route alone left named spending its max-recursion-queries (50) on
# IPv6 attempts that fail at once (measured on network_vpn's node: SERVFAIL for www.debian.org, 49 of the 50
# queries IPv6; with -4 every name resolved). On an IPv4-only production host the same limit is an approval
# condition (approval_conditions.md #2), not something this lab can show.
# 2026-11-19, HQ batch-15 ruling 6 (local change #9): the production VPN server has no global IPv6 address, so
# the IPv4-only condition became a finding. The lab fixture no longer sets -4: the class does, on a host without
# a 2000::/3 address (Facter reports the NAT's unique-local fd17:... address as scope global, so the class reads
# the address itself). New checks: named runs -4 on this IPv4-only node, and the names that failed resolve cold,
# with no retries (the cache check below retries, which would hide an intermittent SERVFAIL).
class: caching_nameserver
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  A caching nameserver with bind: it resolves names recursively for the node itself and for the allowed networks,
  answers repeated questions from its cache, and refuses everyone else; a changed configuration restarts it.
peer:
  kind: ubuntu2
  why: who may query the nameserver can only be seen from other machines on the network
node_agent:
  after: the-options-drift
  why: the options file notifies named, which only the next agent run after a change to it can show
outcomes:
  - outcome: bind9 is installed and named runs with a configuration named-checkconf accepts
    from: manifests/caching_nameserver.pp:15-31
    checks: [named-runs-with-a-valid-configuration]
  # Correction round 1 (2026-11-19, run 20261119T042407Z): recursion failed in the lab because named sent its queries
  # over the VirtualBox NAT's IPv6 (a ULA address with a default route learned by router advertisement), which reaches
  # no internet (tcpdump: 27 queries out to root servers' IPv6 addresses, 0 answers); a lab-environment fixture now
  # removes that route, stops advertisements re-adding it, restarts named, and waits until it resolves a name the
  # checks do not ask (its first wait, on the root hints' answer, ended before named could resolve: run 20261119T042847Z).
  - outcome: the node itself gets recursive answers from 127.0.0.1, and a repeated question is answered from the cache
    from: manifests/caching_nameserver.pp:1-2; templates/bind/named.conf.options.erb:3, 9-10
    checks: [the-lab-nat-ipv6-route-is-removed, the-node-resolves-through-it-and-the-cache-answers-again]
  - outcome: a client in an allowed network gets answers; a client outside them is refused
    from: manifests/caching_nameserver.pp:4-5; templates/bind/named.conf.options.erb:3, 9-10
    checks: [the-lab-nat-ipv6-route-is-removed, the-peer-adds-an-allowed-and-an-outside-address, an-allowed-client-is-answered-and-an-outside-one-refused]
  - outcome: a changed options file is restored by the next agent run, which restarts named once
    from: manifests/caching_nameserver.pp:33-39
    checks: [the-options-drift, the-agent-run-restores-the-options-and-restarts-named-once]
  - outcome: on a host without a global IPv6 address (2000::/3), named runs IPv4-only and names with long delegation chains resolve (local change #9)
    from: manifests/caching_nameserver.pp:1-2; templates/bind/named.conf.options.erb:3-7
    checks: [named-runs-ipv4-only-without-global-ipv6, the-lab-nat-ipv6-route-is-removed, the-names-that-failed-resolve-cold]
  - outcome: on a host with a global IPv6 address, named is left as it is
    from: manifests/caching_nameserver.pp:1-2
    uncovered:
      why: the lab has no node with global IPv6 connectivity, so the branch that leaves named unchanged cannot be shown
      lifted_by: "capability: a lab node with a global (2000::/3) IPv6 address and IPv6 internet"
      evidence: "ip -6 addr and Facter on puppet8node, 2026-11-19 (DESIGN_DECISIONS 2026-11-19, the VM crash entry, item 5): only fd17:625c:f037:2:a00:27ff:fe76:5ec6 (unique-local, from the VirtualBox NAT) and link-local addresses; Facter networking.ip6 is that ULA; no 2000::/3 address on any lab node's NAT"
  - outcome: the RedHat branch (package bind, /etc/named.conf, /var/named, /etc/sysconfig/named)
    from: manifests/caching_nameserver.pp:7-14
    uncovered:
      why: the RedHat branch; this set runs on the plan's Ubuntu node, and a set runs on one node kind only
      lifted_by: "capability: running a set on a second node kind (phase3.py runs a set on the class's plan node)"
      evidence: "phase3.py run reverts and applies on the node of the plan's node column only; nodes.py get --class caching_nameserver kind prints ubuntu"

checks:
  - id: named-runs-with-a-valid-configuration
    what: bind9 is installed, named is active, and named-checkconf accepts the configuration with the class's options file
    control: negative
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "23-31", text: "service { $service_name:"}
      - {path: manifests/caching_nameserver.pp, lines: "33-39", text: "content => template('puppet_infrastructure/bind/named.conf.options.erb'),"}
    probe: |
      dpkg-query -W -f '${Package} ${Status}\n' bind9
      p8_service named | cut -d' ' -f1
      named-checkconf && echo config-valid
      p8_count 'allow-query-cache' /etc/bind/named.conf.options
    expect: {rc: 0, stdout: "\\Abind9 install ok installed\\nactive\\nconfig-valid\\n1\\n\\Z"}

  - id: named-runs-ipv4-only-without-global-ipv6
    what: >-
      the node has no global unicast IPv6 address (2000::/3), and named runs IPv4-only: -4 in its command line, from
      OPTIONS in /etc/default/named (local change #9)
    control: negative
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "28-31", text: "ensure  => 'running',"}
      - {path: manifests/caching_nameserver.pp, lines: "1-2", text: "# This class provides a caching nameserver server using bind"}
    probe: |
      ip -6 -o addr show | awk '{print $4}' | grep -cE '^[23][0-9a-fA-F]{3}:' || true
      tr '\0' ' ' < "/proc/$(systemctl show -p MainPID --value named)/cmdline" | p8_count ' -4( |$)'
      grep '^OPTIONS=' /etc/default/named
    expect: {rc: 0, stdout: "\\A0\\n1\\nOPTIONS=\"-u bind -4\"\\n\\Z"}

  - id: the-lab-nat-ipv6-route-is-removed
    what: >-
      lab-environment fixture for the resolution checks: the lab NAT has no IPv6, so its IPv6 default route (learned by
      router advertisement, reaching no internet) is removed, as on a host without IPv6; named is restarted, then
      resolves
    control: negative
    timeout: 150
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "28-31", text: "ensure  => 'running',"}
    mutates: >-
      sets net.ipv6.conf.enp0s3.accept_ra to 0, deletes the IPv6 default route on enp0s3 (the VirtualBox NAT
      interface), restarts named and waits up to 90 s until it resolves example.com (a name the checks do not ask; named
      takes 20-40 s after a restart to give up on its IPv6 servers, measured 2026-11-19)
    probe: |
      sysctl -q -w net.ipv6.conf.enp0s3.accept_ra=0
      ip -6 route del default dev enp0s3 2>/dev/null || true
      systemctl restart named
      for i in $(seq 30); do dig +time=2 +tries=1 @127.0.0.1 example.com A +noall +comments | grep -q 'status: NOERROR' && break; sleep 3; done
    effect: |
      ip -6 route show default dev enp0s3 | wc -l
      p8_service named | cut -d' ' -f1
      dig +time=3 +tries=1 @127.0.0.1 example.com A +noall +comments | grep -o 'status: [A-Z]*'
    expect: {rc: 0, stdout: "\\A0\\nactive\\nstatus: NOERROR\\n\\Z"}

  # 2026-11-19 authoring correction (run 20261119T043144Z): the first question timed out once more on the lab's IPv6
  # (www.debian.org's servers have many IPv6 addresses); it is asked up to 10 times, 3 s apart, before the cache test.
  - id: the-names-that-failed-resolve-cold
    what: >-
      after a cache flush, www.debian.org and www.kernel.org (the names that got SERVFAIL on the IPv4-only node,
      2026-11-19) each resolve at the first attempt, no retries
    control: negative
    timeout: 90
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "1-2", text: "# This class provides a caching nameserver server using bind"}
      - {path: templates/bind/named.conf.options.erb, lines: "3-7", text: "forwarders {"}
    mutates: flushes named's cache (rndc flush) and asks each name once; the statuses go to /run/p8test-bind/cold.txt
    probe: |
      install -d -m 0700 /run/p8test-bind
      rndc flush
      for n in www.debian.org www.kernel.org; do
        echo "$n $(dig +time=5 +tries=2 @127.0.0.1 $n A +noall +comments | grep -o 'status: [A-Z]*' | cut -d' ' -f2)"
      done > /run/p8test-bind/cold.txt
    effect: |
      cat /run/p8test-bind/cold.txt
    expect: {rc: 0, stdout: "\\Awww\\.debian\\.org NOERROR\\nwww\\.kernel\\.org NOERROR\\n\\Z"}

  - id: the-node-resolves-through-it-and-the-cache-answers-again
    what: >-
      a question from the node to 127.0.0.1 gets a recursive answer (NOERROR, with an address), and the same question
      asked again is answered with a lower TTL, from the cache
    control: negative
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "1-2", text: "# This class provides a caching nameserver server using bind"}
    mutates: none beyond two DNS questions to 127.0.0.1 (declared mutating so it runs after the reach setup)
    probe: |
      true
    effect: |
      for i in $(seq 10); do
        first=$(dig +tries=1 +time=3 @127.0.0.1 www.debian.org A +noall +answer +comments)
        echo "$first" | grep -q 'status: NOERROR' && break; sleep 3
      done
      echo "$first" | grep -o 'status: [A-Z]*'
      t1=$(echo "$first" | awk '$4 == "A" {print $2; exit}')
      sleep 2
      t2=$(dig @127.0.0.1 www.debian.org A +noall +answer | awk '$4 == "A" {print $2; exit}')
      [ -n "$t1" ] && [ -n "$t2" ] && [ "$t2" -lt "$t1" ] && echo "answered again from the cache"
    expect: {rc: 0, stdout: "\\Astatus: NOERROR\\nanswered again from the cache\\n\\Z"}

  - id: the-peer-adds-an-allowed-and-an-outside-address
    what: setup for the next check, the peer's +100 address (inside 192.168.56.0/25) and +150 address (outside it) on its host-only NIC
    control: negative
    host: peer
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "4-5", text: "class puppet_infrastructure::caching_nameserver ( Array $allowed_networks = [] ){"}
    mutates: adds the peer's host-only address + 100 and + 150 (/24) to its host-only NIC
    probe: |
      a=$(ip -4 -o addr show enp0s8 | awk '{print $4}' | cut -d/ -f1 | head -1)
      ip addr add "${a%.*}.$(( ${a##*.} + 100 ))/24" dev enp0s8 2>/dev/null || true
      ip addr add "${a%.*}.$(( ${a##*.} + 150 ))/24" dev enp0s8 2>/dev/null || true
    effect: |
      ip -4 -o addr show enp0s8 | wc -l
    expect: {rc: 0, stdout: "\\A3\\n\\Z"}

  - id: an-allowed-client-is-answered-and-an-outside-one-refused
    what: from the peer, a question from its +100 address (in the allowed network) is answered, one from its +150 address (outside it) is refused
    control: negative
    host: peer
    derived_from:
      - {path: templates/bind/named.conf.options.erb, lines: "9-10", text: "allow-query     { localhost;"}
    mutates: none beyond two DNS questions from the peer to the class node (declared mutating so it runs after the addresses are added)
    probe: |
      true
    effect: |
      a=$(ip -4 -o addr show enp0s8 | awk '{print $4}' | cut -d/ -f1 | head -1)
      for n in 100 150; do
        s="${a%.*}.$(( ${a##*.} + n ))"
        echo "+$n: $(dig +tries=1 +time=5 -b "$s" @192.168.56.20 www.debian.org A +noall +comments | grep -o 'status: [A-Z]*' | head -1)"
      done
    expect: {rc: 0, stdout: "\\A\\+100: status: NOERROR\\n\\+150: status: REFUSED\\n\\Z"}

  - id: the-options-drift
    what: setup for the next check, the options file changed by hand, with named's process id and journal cursor noted
    control: negative
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "33-39", text: "notify  => Service[ $service_name ],"}
    mutates: notes named's main PID and journal cursor in /run/p8test-bind/before, then appends a comment line to /etc/bind/named.conf.options on the node
    probe: |
      install -d -m 0700 /run/p8test-bind
      printf "pid='%s'\ncursor='%s'\n" "$(systemctl show -p MainPID --value named)" "$(journalctl -u named.service -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p')" > /run/p8test-bind/before
      echo '// p8test drift' >> /etc/bind/named.conf.options
    effect: |
      p8_count '^// p8test drift$' /etc/bind/named.conf.options
      grep -q "^pid='[1-9]" /run/p8test-bind/before && echo noted
    expect: {rc: 0, stdout: "\\A1\\nnoted\\n\\Z"}

  - id: the-agent-run-restores-the-options-and-restarts-named-once
    what: after the node's agent run, the options file is restored and named was restarted exactly once (a new main PID; one start in its journal since the change)
    control: negative
    derived_from:
      - {path: manifests/caching_nameserver.pp, lines: "33-39", text: "notify  => Service[ $service_name ],"}
    mutates: none beyond reading the file, named's state and its journal (declared mutating so it runs after the node's agent run)
    probe: |
      true
    effect: |
      p8_count '^// p8test drift$' /etc/bind/named.conf.options
      . /run/p8test-bind/before
      now=$(systemctl show -p MainPID --value named)
      [ -n "$now" ] && [ "$now" != 0 ] && [ "$now" != "$pid" ] && echo restarted
      journalctl -u named.service --after-cursor "$cursor" --no-pager -q | p8_count 'Started named.service'
    expect: {rc: 0, stdout: "\\A0\\nrestarted\\n1\\n\\Z"}
