# Phase 3 checks for puppet_infrastructure::rsyslog_server (class; required_base filesystem_base; it includes
# rsyslog_base itself). Fixture: class defaults (port 6514, log_root /var/log, active/retention 7 days, rotation 00:00,
# retention 03:17, max_sessions 2000, notify_on_connection_close false); the lab Hiera binds rsyslog_base's ssldir to
# /etc/puppetlabs/puppet/ssl (master_fixtures.sh). The node's own Puppet certificate (CN/SAN puppet8node) is the
# listener's certificate.
# 2026-11-20 (backfill batch 7): purpose and outcomes (HQ rulings 2 and C1); exercises for the certificate check (a
# self-signed client is refused), the rotation (forced, then a new message lands in a fresh file: rsyslog reopened
# it after the postrotate HUP) and the retention script (planted files of known dates and ages).
class: rsyslog_server
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Makes a node the central log server: an rsyslog listener that accepts logs only over TLS from clients with a
  CA-signed certificate and stores them in a per-host tree, rotates those files daily, compresses rotated files after the
  active period and deletes compressed ones after the retention period.
outcomes:
  - outcome: rsyslogd listens on the port over TLS with the node's own certificate, configured for the per-host tree and the session limit
    from: manifests/rsyslog_server.pp:20-39; templates/rsyslog/listener_simple.conf.epp:1-35
    checks: [listener-config-rendered, tls-listener-presents-the-node-certificate, self-forward-config-absent]
  - outcome: a message from a client with a CA-signed certificate lands in <log_root>/hosts/<hostname>/<program>.log; a client with a self-signed certificate is refused
    from: templates/rsyslog/listener_simple.conf.epp:15-35
    checks: [remote-message-lands-in-the-host-tree, a-self-signed-client-is-refused]
  - outcome: the per-host logs rotate daily at the rotation time, date-suffixed and uncompressed, and rsyslog reopens its files after the rotation
    from: manifests/rsyslog_server.pp:43-87; templates/rsyslog/rsyslog-hosts.logrotate.epp:1-13; templates/rsyslog/logrotate.timer.override.epp:1-5
    checks: [logrotate-timer-override-active, host-logs-rotation-rule, a-rotation-reopens-the-host-log]
  - outcome: rotated logs older than the active period are compressed and compressed logs older than the retention period are deleted, from root's cron at the retention time
    from: manifests/rsyslog_server.pp:89-108; templates/rsyslog/rsyslog-hosts-retention.sh.epp:1-34
    checks: [retention-script-and-cron, the-retention-script-compresses-and-deletes]
  - outcome: other ports, roots, periods, times, session limits or connection-close notices
    from: manifests/rsyslog_server.pp:7-18
    uncovered:
      why: one set holds one fixture, the class defaults
      lifted_by: "capability: more than one params fixture per set"
      evidence: "phase3.py applies the class once with its single `fixture` (params or defaults)"
checks:
  - id: listener-config-rendered
    what: the TLS listener config names the node's own certificate files, the port, the session limit and the host-based tree
    control: negative
    derived_from:
      - {path: manifests/rsyslog_server.pp, lines: "25", text: "file { '/etc/rsyslog.d/30-listener.conf':"}
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "7-8", text: "DefaultNetstreamDriverCertFile=\"/etc/rsyslog.d/tls/<%= $certname %>.pem\""}
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "12-14", text: "port=\"<%= $port %>\""}
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "19", text: "constant(value=\"<%= $log_root %>/hosts/\")"}
    probe: |
      grep -E 'DefaultNetstreamDriver(Cert|Key)File|^\s+(port|maxSessions|notifyOnConnectionClose)=|constant\(value="/var/log/hosts/"\)' /etc/rsyslog.d/30-listener.conf | sed 's/^\s*//'
    expect: {rc: 0, stdout: "\\ADefaultNetstreamDriverCertFile=\"/etc/rsyslog\\.d/tls/puppet8node\\.pem\"\\nDefaultNetstreamDriverKeyFile=\"/etc/rsyslog\\.d/tls/puppet8node\\.key\"\\nport=\"6514\"\\nmaxSessions=\"2000\"\\nnotifyOnConnectionClose=\"off\"\\nconstant\\(value=\"/var/log/hosts/\"\\)\\nconstant\\(value=\"/var/log/hosts/\"\\)\\n\\Z"}

  - id: tls-listener-presents-the-node-certificate
    what: rsyslogd listens on 6514 with TLS, presenting a certificate that verifies against the Puppet CA for the node's name
    control: negative
    derived_from:
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "5-8", text: "DefaultNetstreamDriver=\"gtls\""}
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "15", text: "streamdriver.mode=\"1\""}
      - {path: manifests/rsyslog_server.pp, lines: "21", text: "$certname = $trusted['certname']"}
    probe: |
      c=$(basename /etc/rsyslog.d/tls/*.key .key)   # the node's certname (the class names its files after it)
      echo | timeout 15 openssl s_client -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -verify_return_error -verify_hostname "$c" -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" 2>&1 | grep -oE 'Verify return code: [0-9]+ \([^)]*\)' | head -1
    mismatch:
      varies: >-
        the name: the same handshake verified for p8test-wrong.invalid must fail, so the pass above is the certificate's
        name and chain, not a tool that always says ok
      probe: |
        c=$(basename /etc/rsyslog.d/tls/*.key .key)
        echo | timeout 15 openssl s_client -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -verify_return_error -verify_hostname p8test-wrong.invalid -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" 2>&1 | grep -oE 'Verify return code: [0-9]+ \([^)]*\)' | head -1
    expect: {rc: 0, stdout: "\\AVerify return code: 0 \\(ok\\)\\n\\Z"}

  - id: self-forward-config-absent
    what: the old self-forward config is absent
    control: invariant
    why_invariant: the stock node has no /etc/rsyslog.d/40-forward-self.conf; the class keeps it absent
    derived_from:
      - {path: manifests/rsyslog_server.pp, lines: "41-42", text: "ensure => absent,"}
    probe: test ! -e /etc/rsyslog.d/40-forward-self.conf && echo absent
    expect: {rc: 0, stdout: "\\Aabsent\\n\\Z"}

  - id: logrotate-timer-override-active
    what: >-
      systemd runs logrotate.timer with the override (daily at rotation_hour:rotation_minute, accuracy 1 min): the
      daemon-reload and timer restart took effect (the stock timer's accuracy is 1 h)
    control: negative
    derived_from:
      - {path: manifests/rsyslog_server.pp, lines: "54", text: "file { '/etc/systemd/system/logrotate.timer.d/override.conf':"}
      - {path: manifests/rsyslog_server.pp, lines: "68", text: "command     => '/bin/systemctl daemon-reload',"}
      - {path: templates/rsyslog/logrotate.timer.override.epp, lines: "3-5", text: "AccuracySec=1min"}
    probe: |
      systemctl show logrotate.timer -p DropInPaths -p AccuracyUSec -p ActiveState
      systemctl show logrotate.timer -p TimersCalendar | grep -oE 'OnCalendar=[^;]*[0-9]'
    expect: {rc: 0, stdout: "\\AAccuracyUSec=1min\\nActiveState=active\\nDropInPaths=/etc/systemd/system/logrotate\\.timer\\.d/override\\.conf\\nOnCalendar=\\*-\\*-\\* 00:00:00\\n\\Z"}

  - id: host-logs-rotation-rule
    what: logrotate rotates the per-host logs daily, keeping all, uncompressed, date-suffixed
    control: negative
    derived_from:
      - {path: manifests/rsyslog_server.pp, lines: "79", text: "file { '/etc/logrotate.d/rsyslog-hosts':"}
      - {path: templates/rsyslog/rsyslog-hosts.logrotate.epp, lines: "2-7", text: "<%= $log_root %>/hosts/*/*.log <%= $log_root %>/hosts/*/.log {"}
    probe: |
      logrotate -d /etc/logrotate.d/rsyslog-hosts >/dev/null 2>&1 && head -6 /etc/logrotate.d/rsyslog-hosts | sed 's/^\s*//'
    expect: {rc: 0, stdout: "\\A/var/log/hosts/\\*/\\*\\.log /var/log/hosts/\\*/\\.log \\{\\ndaily\\nrotate -1\\nnocompress\\ndateext\\ndateformat -%Y%m%d\\n\\Z"}

  - id: retention-script-and-cron
    what: the retention script (root 0755, the 7/7-day defaults, valid bash) runs from root's crontab at 03:17
    control: negative
    derived_from:
      - {path: manifests/rsyslog_server.pp, lines: "91-97", text: "file { \"${bindir}/rsyslog-hosts-retention.sh\":"}
      - {path: templates/rsyslog/rsyslog-hosts-retention.sh.epp, lines: "4-6", text: "ROOT_DIR=\"<%= $log_root %>/hosts\""}
      - {path: manifests/rsyslog_server.pp, lines: "103-107", text: "cron { 'rsyslog_hosts_retention_cleanup':"}
      - {path: manifests/rsyslog_server.pp, lines: "12-13", text: "Integer[0, 23] $retention_hour      = 3,"}
    probe: |
      f=/opt/puppet-infrastructure/bin/rsyslog-hosts-retention.sh
      stat -c '%U %a' "$f"; bash -n "$f" && grep -E '^(ROOT_DIR|ACTIVE_DAYS|RETENTION_DAYS)=' "$f"
      crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: rsyslog_hosts_retention_cleanup' | tail -1
    expect: {rc: 0, stdout: "\\Aroot 755\\nROOT_DIR=\"/var/log/hosts\"\\nACTIVE_DAYS=7\\nRETENTION_DAYS=7\\n17 3 \\* \\* \\* /opt/puppet-infrastructure/bin/rsyslog-hosts-retention\\.sh\\n\\Z"}

  - id: remote-message-lands-in-the-host-tree
    what: >-
      the exercise: a syslog message sent over TLS to the listener, from a client presenting a CA-signed certificate,
      is written to <log_root>/hosts/<hostname>/<programname>.log
    control: negative
    derived_from:
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "16", text: "streamdriver.authMode=\"x509/certvalid\"   # accept any cert signed by CA"}
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "18-23", text: "property(name=\"programname\" securePath=\"replace\")"}
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "34-35", text: "action(type=\"omfile\" dynaFile=\"remote\" createDirs=\"on\")"}
    mutates: >-
      sends one RFC3164 line (host p8testremote, tag p8test) to 127.0.0.1:6514 over TLS with the node's own Puppet
      certificate as the client certificate; rsyslogd creates /var/log/hosts/p8testremote/p8test.log and, through the
      stock /etc/rsyslog.d/50-default.conf (the listener's rules do not stop the message), appends the same line to
      /var/log/syslog
    probe: |
      c=$(basename /etc/rsyslog.d/tls/*.key .key)
      { printf '<14>Nov 16 19:00:00 p8testremote p8test: p8test-remote-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" >/dev/null 2>&1; sleep 2
    effect: |
      grep -c 'p8test-remote-marker' /var/log/hosts/p8testremote/p8test.log
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}

  - id: a-self-signed-client-is-refused
    what: >-
      a client presenting a self-signed certificate (not signed by the Puppet CA) sends a message; it is not written,
      while the CA-signed client's message from the check before is there
    control: negative
    derived_from:
      - {path: templates/rsyslog/listener_simple.conf.epp, lines: "16", text: "streamdriver.authMode=\"x509/certvalid\"   # accept any cert signed by CA"}
    mutates: >-
      creates a throwaway RSA key and self-signed certificate (CN p8test-selfsigned) in /run/p8test-rsyslog; sends one
      RFC3164 line (host p8testremote, tag p8test) to 127.0.0.1:6514 over TLS with it; rsyslogd logs the refused
      session to syslog (the journal, /var/log/syslog, and through the listener's own rules the node's
      /var/log/hosts/<node>/rsyslogd.log)
    probe: |
      install -d -m 0700 /run/p8test-rsyslog; d=/run/p8test-rsyslog
      openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=p8test-selfsigned -keyout $d/self.key -out $d/self.pem 2>/dev/null
      { printf '<14>Nov 16 19:01:00 p8testremote p8test: p8test-selfsigned-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert $d/self.pem -key $d/self.key >/dev/null 2>&1; sleep 2
    effect: |
      p8_count 'p8test-remote-marker' /var/log/hosts/p8testremote/p8test.log
      cat /var/log/hosts/*/*.log 2>/dev/null | p8_count 'p8test-selfsigned-marker'
    expect: {rc: 0, stdout: "\\A1\\n0\\n\\Z"}

  - id: a-rotation-reopens-the-host-log
    what: >-
      a forced rotation of the per-host rule moves p8test.log to p8test.log-<today> (uncompressed, holding the earlier
      message), and a message sent after it lands in a fresh p8test.log: rsyslog reopened its file after the HUP
    control: negative
    derived_from:
      - {path: templates/rsyslog/rsyslog-hosts.logrotate.epp, lines: "2-12", text: "/bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true"}
    mutates: >-
      runs `logrotate -f /etc/logrotate.d/rsyslog-hosts` once (it renames the per-host logs, HUPs rsyslog and updates
      logrotate's state file /var/lib/logrotate/status); sends one more RFC3164 line over TLS with the node's own
      certificate; rsyslogd creates a new /var/log/hosts/p8testremote/p8test.log and appends to /var/log/syslog
    probe: |
      logrotate -f /etc/logrotate.d/rsyslog-hosts; sleep 1
      c=$(basename /etc/rsyslog.d/tls/*.key .key)
      { printf '<14>Nov 16 19:02:00 p8testremote p8test: p8test-after-rotation-marker\n'; sleep 2; } | timeout 15 openssl s_client -quiet -connect 127.0.0.1:6514 -CAfile /etc/rsyslog.d/tls/ca.pem -cert "/etc/rsyslog.d/tls/$c.pem" -key "/etc/rsyslog.d/tls/$c.key" >/dev/null 2>&1; sleep 2
    effect: |
      d=/var/log/hosts/p8testremote
      p8_count 'p8test-remote-marker' "$d/p8test.log-$(date +%Y%m%d)"
      p8_count 'p8test-after-rotation-marker' "$d/p8test.log"
      p8_count 'p8test-remote-marker' "$d/p8test.log"
    expect: {rc: 0, stdout: "\\A1\\n1\\n0\\n\\Z"}

  - id: the-retention-script-compresses-and-deletes
    what: >-
      run as cron would, the retention script compresses a rotated log dated 10 days ago, leaves one dated 2 days ago,
      deletes a compressed log 10 days old and keeps one 2 days old (active and retention 7 days)
    control: negative
    derived_from:
      - {path: templates/rsyslog/rsyslog-hosts-retention.sh.epp, lines: "10-28", text: "OLDEST_ALLOWED_DATE_FOR_PLAIN_TEXT=$(date -d \"$((ACTIVE_DAYS - 1)) days ago\" +%Y%m%d)"}
      - {path: templates/rsyslog/rsyslog-hosts-retention.sh.epp, lines: "30-34", text: "! -newermt \"${RETENTION_DAYS} days ago\" \\"}
    mutates: >-
      creates /var/log/hosts/p8testold with p8test.log-<10 days ago> and p8test.log-<2 days ago> (clear text) and
      older.log-20200101.gz (mtime 10 days ago) and newer.log-20200102.gz (mtime 2 days ago); runs the retention
      script once as root (it gzips, touches and deletes in /var/log/hosts)
    probe: |
      d=/var/log/hosts/p8testold; install -d "$d"
      old=$(date -d '10 days ago' +%Y%m%d); new=$(date -d '2 days ago' +%Y%m%d)
      echo p8test > "$d/p8test.log-$old"; echo p8test > "$d/p8test.log-$new"
      echo p8test | gzip > "$d/older.log-20200101.gz"; touch -d '10 days ago' "$d/older.log-20200101.gz"
      echo p8test | gzip > "$d/newer.log-20200102.gz"; touch -d '2 days ago' "$d/newer.log-20200102.gz"
      /opt/puppet-infrastructure/bin/rsyslog-hosts-retention.sh
    effect: |
      cd /var/log/hosts/p8testold && ls -1 | sed -e "s/$(date -d '10 days ago' +%Y%m%d)/OLD/" -e "s/$(date -d '2 days ago' +%Y%m%d)/NEW/" | LC_ALL=C sort | tr '\n' ' '; echo
    expect: {rc: 0, stdout: "\\Anewer\\.log-20200102\\.gz p8test\\.log-NEW p8test\\.log-OLD\\.gz \\n\\Z"}

