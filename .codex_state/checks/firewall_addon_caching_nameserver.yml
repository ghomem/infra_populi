# Phase 3 checks for puppet_infrastructure::firewall_addon_caching_nameserver (class; node ubuntu; no required base).
# Fixture (params, never committed): lan_iface p8test0 (the fixture interface name; never the node's real NIC), port
# at its default 53. The class adds one rule, 1301: accept UDP to the port arriving on the LAN interface (chain INPUT
# by the firewall type's default). The checks give p8test0 a client: a network namespace p8testns joined to the node by
# a veth pair (p8test0 10.250.0.1/30 on the node, p8testpeer 10.250.0.2/30 in the namespace), UDP responders on
# 10.250.0.1:53 and :5353, and a stand-in for the base firewall's default drop (the class is complementary, like
# firewall_addon_web) appended after the class's rule: UDP to 53 and 5353 arriving on p8test0 is dropped. Everything
# stays on the node.
class: firewall_addon_caching_nameserver
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Lets a caching nameserver's clients on the LAN interface reach it: DNS over UDP to the nameserver port arriving on
  that interface is accepted, over the base firewall's default drop.
outcomes:
  - outcome: the rule accepts UDP to the nameserver port (53) on the LAN interface only
    from: manifests/firewall_addon_caching_nameserver.pp:4-11
    checks: [the-nameserver-rule]
  - outcome: a client on the LAN interface reaches the nameserver port over a default drop, while another UDP port stays dropped
    from: manifests/firewall_addon_caching_nameserver.pp:1-2, 11
    checks: [a-lan-client-a-responder-and-a-default-drop, the-lan-client-reaches-port-53-only, rule-1301-accepted-the-lan-client]
  - outcome: another nameserver port (port parameter)
    from: manifests/firewall_addon_caching_nameserver.pp:7
    uncovered: {why: "a fixture variant (one set holds one fixture, the default 53); untested", lifted_by: ubuntu}
checks:
  - id: the-nameserver-rule
    what: INPUT holds rule 1301, accepting UDP to port 53 on interface p8test0
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_caching_nameserver.pp, lines: "11", text: "firewall { '1301 accept nameserver': proto => 'udp', iniface => $lan_iface, dport => $port, action => 'accept' }"}
    probe: |
      iptables -S INPUT | grep -- '--comment "1301 accept nameserver"' | sed -E 's/.*-i ([^ ]+) -p ([a-z]+) .*--dport ([0-9]+) .* -j ([A-Z]+).*/\1 \2 \3 \4/'
    expect: {rc: 0, stdout: "\\Ap8test0 udp 53 ACCEPT\\n\\Z"}

  - id: a-lan-client-a-responder-and-a-default-drop
    what: >-
      setup for the reach checks: the namespace client on p8test0, UDP responders on 10.250.0.1:53 and :5353, and the
      stand-in default drop appended after rule 1301
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_caching_nameserver.pp, lines: "1-2", text: "# This class provides necessary firewall configurations for caching nameservers"}
    mutates: >-
      creates network namespace p8testns and veth pair p8test0 (10.250.0.1/30, node) / p8testpeer (10.250.0.2/30,
      namespace); starts transient units p8test-udp-53 and p8test-udp-5353 (python UDP responders on 10.250.0.1);
      appends `-A INPUT -i p8test0 -p udp -m multiport --dports 53,5353 -m comment --comment p8test-default-drop -j DROP`
    probe: |
      ip netns add p8testns
      ip link add p8test0 type veth peer name p8testpeer
      ip link set p8testpeer netns p8testns
      ip addr add 10.250.0.1/30 dev p8test0; ip link set p8test0 up
      ip netns exec p8testns ip addr add 10.250.0.2/30 dev p8testpeer
      ip netns exec p8testns ip link set p8testpeer up
      for p in 53 5353; do
        systemd-run --unit "p8test-udp-$p" -q python3 -c "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(('10.250.0.1', $p))
      while True:
          d, a = s.recvfrom(512); s.sendto(b'p8test-answer', a)"
      done
      iptables -A INPUT -i p8test0 -p udp -m multiport --dports 53,5353 -m comment --comment p8test-default-drop -j DROP
      sleep 1
    effect: |
      ip netns exec p8testns ip -4 -o addr show p8testpeer | awk '{print $4}'
      for p in 53 5353; do p8_service "p8test-udp-$p" | cut -d' ' -f1; done
      iptables -S INPUT | p8_count 'p8test-default-drop'
    expect: {rc: 0, stdout: "\\A10\\.250\\.0\\.2/30\\nactive\\nactive\\n1\\n\\Z"}

  - id: the-lan-client-reaches-port-53-only
    what: from the namespace client on p8test0, a UDP question to port 53 gets an answer and one to 5353 does not
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_caching_nameserver.pp, lines: "11", text: "proto => 'udp', iniface => $lan_iface, dport => $port, action => 'accept'"}
    mutates: none beyond two UDP datagrams from the namespace to the node (declared mutating so it runs after the setup)
    probe: |
      true
    effect: |
      for p in 53 5353; do
        ip netns exec p8testns python3 -c "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'q', ('10.250.0.1', $p))
      try:
          print('$p answered' if s.recv(512) == b'p8test-answer' else '$p wrong answer')
      except OSError:
          print('$p no answer')"
      done
    expect: {rc: 0, stdout: "\\A53 answered\\n5353 no answer\\n\\Z"}

  - id: rule-1301-accepted-the-lan-client
    what: on the node, rule 1301 counted the client's datagram to 53 and the stand-in drop the one to 5353
    control: negative
    derived_from:
      - {path: manifests/firewall_addon_caching_nameserver.pp, lines: "11", text: "firewall { '1301 accept nameserver':"}
    mutates: none beyond reading the rule counters (declared mutating so it runs after the client's datagrams)
    probe: |
      true
    effect: |
      iptables -v -x -L INPUT -n | awk '/1301 accept nameserver/ {a=$1} /p8test-default-drop/ {c=$1} END {print "1301: " (a+0 != 0 ? "counted" : "zero"); print "stand-in drop: " (c+0 != 0 ? "counted" : "zero")}'
    expect: {rc: 0, stdout: "\\A1301: counted\\nstand-in drop: counted\\n\\Z"}
