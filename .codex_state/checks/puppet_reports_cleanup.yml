# Phase 3 checks for puppet_infrastructure::puppet_reports_cleanup (class, no parameters: no params file). Lab Hiera:
# puppet::reportdir /opt/puppetlabs/server/data/puppetserver/reports, puppet::reportdays 7. Production declares it on the
# Puppet master (operations/puppet.pp), whose puppetserver writes the reports; the plan's default node is an agent with
# no puppetserver, so the exercise plants a report store of that shape (the server's, not the class's, to create) and
# runs the command root's crontab holds, as cron would at midnight.
# 2026-11-20 (backfill batch 6): first set.
class: puppet_reports_cleanup
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Keeps the Puppet server's stored reports from filling the disk: a daily root cron job deletes report files older
  than the configured number of days.
outcomes:
  - outcome: root's crontab runs the cleanup at midnight every day, on the Hiera report directory and age
    from: manifests/puppet_reports_cleanup.pp:5-14
    checks: [cron-entry-with-the-hiera-values]
  - outcome: the command deletes report files older than 7 days and keeps newer ones
    from: manifests/puppet_reports_cleanup.pp:6, 9
    checks: [aged-reports-are-planted, the-cron-command-deletes-only-old-reports]
  - outcome: cron itself firing at midnight
    from: manifests/puppet_reports_cleanup.pp:11-13
    uncovered:
      why: a run would have to wait for midnight; the crontab entry is checked and the command it holds is run by hand
      lifted_by: "capability: a clock-controlled cron trigger inside a phase3 run"
      evidence: "phase3.py runs probes and agent runs only; it has no step that advances or waits for the node's cron schedule"
checks:
  - id: cron-entry-with-the-hiera-values
    what: root's crontab holds puppet_report_cleanup at 00:00 every day, deleting files older than 7 days in the report directory
    control: negative
    derived_from:
      - {path: manifests/puppet_reports_cleanup.pp, lines: "5-6", text: "$reportdir  = lookup('puppet::reportdir')"}
      - {path: manifests/puppet_reports_cleanup.pp, lines: "8-14", text: "command  => \"find ${reportdir} -type f -mtime +${reportdays} | xargs rm\","}
    probe: |
      crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: puppet_report_cleanup'
    expect: {rc: 0, stdout: "\\A# Puppet Name: puppet_report_cleanup\\n0 0 \\* \\* \\* find /opt/puppetlabs/server/data/puppetserver/reports -type f -mtime \\+7 \\| xargs rm\\n\\Z"}

  - id: aged-reports-are-planted
    what: setup for the run, a report store with a 10-day-old and a 2-day-old report of one node
    control: negative
    derived_from:
      - {path: manifests/puppet_reports_cleanup.pp, lines: "5-6", text: "$reportdays = lookup('puppet::reportdays')"}
    mutates: >-
      creates /opt/puppetlabs/server/data/puppetserver/reports/p8test-node with old.yaml dated 10 days ago and
      recent.yaml dated 2 days ago (the store the master's puppetserver keeps)
    probe: |
      d=/opt/puppetlabs/server/data/puppetserver/reports/p8test-node
      install -d -m 0750 "$d"
      for f in old:10 recent:2; do printf -- '--- p8test planted\n' > "$d/${f%%:*}.yaml"; touch -d "${f##*:} days ago" "$d/${f%%:*}.yaml"; done
    effect: |
      cd /opt/puppetlabs/server/data/puppetserver/reports && find . -type f -mtime +7 | LC_ALL=C sort | tr '\n' ' '; echo
    expect: {rc: 0, stdout: "\\A\\./p8test-node/old\\.yaml \\n\\Z"}

  - id: the-cron-command-deletes-only-old-reports
    what: the command root's crontab holds for puppet_report_cleanup, run once as root, leaves only the 2-day-old report
    control: negative
    derived_from:
      - {path: manifests/puppet_reports_cleanup.pp, lines: "8-10", text: "command  => \"find ${reportdir} -type f -mtime +${reportdays} | xargs rm\","}
    mutates: runs the cron entry's command once as root (sh -c, as cron does), which deletes the planted 10-day-old report
    probe: |
      cmd=$(crontab -l -u root | grep -A1 -x '# Puppet Name: puppet_report_cleanup' | tail -1 | cut -d' ' -f6-)
      sh -c "$cmd"
    effect: |
      cd /opt/puppetlabs/server/data/puppetserver/reports && find . -type f | LC_ALL=C sort | tr '\n' ' '; echo
    expect: {rc: 0, stdout: "\\A\\./p8test-node/recent\\.yaml \\n\\Z"}
