# Phase 3 for puppet_infrastructure::letsencrypt_certificate (define; harness title letsencrypt_certificate): DEFERRED.
# The define's whole behaviour is one certbot run: letsencrypt::certonly with the domain list it builds and a DNS-01
# authenticator (DigitalOcean or Hetzner) reading API credentials from credentials_path. The lab has no ACME CA and no
# DNS provider API; Phase 1 went GREEN as mock-apply (node fixture letsencrypt_cert_standin: a self-signed stand-in
# certificate satisfies puppet-letsencrypt's domain-validation guard, so certbot never runs). Nothing the define does
# can be observed on the lab node: the only evidence there is the stand-in the fixture wrote.
# 2026-11-20 (backfill batch 7): purpose added (HQ ruling C1); the deferral stands until the stand-in lifts that follow
# the backfill (a test ACME CA with a DNS-01 stand-in on ubuntu2).
class: letsencrypt_certificate
baseline: release-0.9.10 (cf477c6)
purpose: >-
  Obtains a Let's Encrypt certificate for a domain (and, on request, its parent domain) through certbot with a DNS-01
  challenge answered by the DigitalOcean or Hetzner DNS API, stored under /etc/letsencrypt/live/<name> for the services
  that use it.
deferred:
  needs: second-node
  why: >-
    issuance needs an ACME CA and a DNS-01 provider API that certbot on the node can reach (for example a Pebble test
    CA with a DNS challenge stand-in on a second lab node); without them certbot cannot run and only the fixture's
    stand-in certificate exists
  lifted_by: ubuntu2
derived_from:
  - {path: manifests/letsencrypt_certificate.pp, lines: "32-34", text: "letsencrypt::certonly { $final_certificate_path:"}
  - {path: manifests/letsencrypt_certificate.pp, lines: "26", text: "$additional_args = ['--dns-digitalocean', \"--dns-digitalocean-credentials ${credentials_path}\"]"}
  - {path: manifests/letsencrypt_certificate.pp, lines: "28", text: "$additional_args = ['--authenticator dns-hetzner', \"--dns-hetzner-credentials ${credentials_path}\"]"}
