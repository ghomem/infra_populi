# Phase 3 checks for puppet_infrastructure::ssh_secure (class; fixture params since 2026-11-19: client_alive_interval
# 10, every other parameter at its default, so the idle-session timeout can be seen in seconds instead of 4 hours).
# Lab Hiera fixture (master_fixtures.sh, 2026-11-19): puppet8node::ssh::othergroups 'p8testgroup', so AllowGroups is
# "sudo naemon p8testgroup ssh_in". Correction round 1 (2026-11-19, review 20261119T020808Z): root joins ssh_in for the
# probe so PermitRootLogin, not AllowGroups, is what refuses it (sshd logs ROOT LOGIN REFUSED); the Hiera group's
# login is a check.
# The node is Ubuntu 24.04 (osfamily Debian): $ssh_service = ssh, $admin_group = sudo. (Until 2026-11-19 the lab master
# had no othergroups key and AllowGroups was "sudo naemon  ssh_in"; the fixture above replaced that.)
# Effective configuration is read with `sshd -T` (what sshd will enforce, after Includes and defaults); negotiation
# checks connect from the node to itself (127.0.0.1) and stop at algorithm negotiation or authentication — no login.
# 2026-11-19, local change #8 (HQ batch-14 ruling 3): sshd's own idle timeouts (ChannelTimeout session=, Unused-
# ConnectionTimeout) are set from client_alive_interval on OpenSSH 9.2+; the idle check's expectation is unchanged
# (ended), its wording and the idle outcome name the new mechanism, and RHEL 9 is a row of its own (not enforced).
# Correction the same day (run 20261119T164515Z: still-connected): my value `session=` matched no channel type; on
# OpenSSH 9.6 they are session:command, session:shell and session:subsystem:... (sshd_config(5) on the node, whose
# example is `session:*=5m`). With `session:*=10s`, measured on the applied node: an idle command session ended after
# 11 s, an idle interactive shell after 10 s, and a session printing every 5 s ran its 21 s. The real timeout also cut
# the lab's own silent SSH session to the node (exit 255), so the params fixture moved from 10 to 30 s (room for the
# harness's agent runs), and the idle check runs its test session detached, 60 s silent, with the probe printing while
# it waits; it now also checks the session ended within 30 to 45 s, not merely at some point.
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1): the RedHat branch and the older sshd's idle behaviour are checks in
# the variant run `rhel` (rhel9); the Protocol 2 row names what is missing.
# 2026-11-23 authoring correction (sweep run 20261123T123442Z-author): the idle session ended, measured 29 s, under the
# window's 30 s floor. The window's floor does not allow for whole-second clocks: sshd keeps a channel's last use and
# checks its deadline in whole seconds (OpenSSH's monotime() returns time_t), so it may end the session up to 1 s before
# 30 s of real idle time, and the probe's start and end (`date +%s`) are whole seconds too; together the measured value
# is at least 29. The floor is now 29 s; it still tells an idle timeout from a session refused or cut at once.
# 2026-11-23 second authoring correction (sweep re-run 20261123T142843Z-author): with the 29 s floor the session ended,
# measured 28 s, so whole seconds did not explain it. The probe timed the session by the wall clock, and on this uplink
# the clean node's timesyncd steps that clock by about a second at each 32 s poll (measured 2026-11-23: offset
# -1.145530 s, jitter 427.644 ms, delay 196.258 ms to ntp.ubuntu.com); a backward step shortens a wall-clock interval.
# Both idle probes (Ubuntu and the rhel variant) now time the session by the monotonic clock (/proc/uptime, one decimal)
# and record the wall-clock seconds beside it; the 29 s floor stays for sshd's whole-second deadline.
# Correction round 1 of the swept set (2026-11-25, review 20261125T125545Z, purpose): the parameter variants other
# than client_alive_interval were in no row. node_base_domain_desktop sets password_authentication true on ssh_secure,
# so that is a check in the variant run `password` (a password login, right and wrong); production sets none of the
# others (not on ssh_secure, and node_base, which forwards them, gets none either), so they are an accepted-gap row. The moduli row says what is checked: the class's
# file installed with its content and mode.
# 2026-11-25 authoring correction (run 20261125T125931Z-author): the askpass helpers sat in /run, which Ubuntu mounts
# noexec, so ssh could not run them ("exec ... Permission denied") and neither login sent a password; they now live in
# /root/p8test-ssh. sshd's PasswordAuthentication was yes, as the baseline makes it.
class: ssh_secure
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Manages sshd with hardened settings: the daemon runs with the class's restricted ciphers, key exchanges, MACs and
  login rules, so clients can log in only within those restrictions.
# Outcomes table added 2026-11-19 (backfill batch 3, HQ batch-10 ruling 2), with login behaviour and the idle-session
# timeout as checks (the set read the configuration only); the fixture moved to params for the timeout.
outcomes:
  - outcome: only the class's key exchange, ciphers and MACs are negotiated
    from: manifests/ssh_secure.pp:10-12, 59-61
    checks: [kex-only-dh-gex-sha256, kex-negotiation-refuses-curve25519, ciphers-exact, cipher-negotiation-refuses-chacha20, macs-exact, mac-negotiation-refuses-umac]
  - outcome: a member of an allowed group (sudo, naemon, the node's Hiera othergroups, ssh_in) logs in with a key; a user in none of them is refused even with a valid key
    from: manifests/ssh_secure.pp:35-41, 71, 79
    checks: [allow-groups, ssh-in-group, login-test-accounts-and-key, a-key-login-in-an-allowed-group-works, a-key-login-in-the-hiera-group-works, a-key-login-outside-the-allowed-groups-is-refused]
  - outcome: password logins and root logins are refused
    from: manifests/ssh_secure.pp:43-53, 66-68
    checks: [password-auth-off, root-login-off, login-test-accounts-and-key, password-and-root-logins-are-refused]
  - outcome: an idle session is ended after client_alive_interval (on OpenSSH 9.2+ by sshd's own idle timeouts, local change #8)
    from: manifests/ssh_secure.pp:5, 75-76
    checks: [client-alive, login-test-accounts-and-key, an-idle-session-is-ended-after-the-interval]
  - outcome: on an sshd older than 9.2 (RHEL 9) the idle disconnect is not enforced (HQ batch-14 ruling 3; approval_conditions.md)
    from: manifests/ssh_secure.pp:5, 75-76
    checks: [rhel-login-account-and-key, on-redhat-an-idle-session-is-not-ended]
  - outcome: the host keys are offered in the given order, and the class's own moduli file is installed (its content and mode)
    from: manifests/ssh_secure.pp:9, 26-33, 58
    checks: [host-keys-in-order, moduli-file]
  - outcome: the other hardening settings hold (no host-based auth, rhosts ignored, 120 s login grace, empty passwords refused, strict modes, port)
    from: manifests/ssh_secure.pp:62-78
    checks: [unchanged-hardening-defaults]
  - outcome: with password_authentication true (node_base_domain_desktop sets it) a password logs in, and a wrong one is refused
    from: manifests/ssh_secure.pp:6, 43-47, 66; manifests/node_base_domain_desktop.pp:10
    checks: [with-password-authentication-a-password-logs-in]
  - outcome: >-
      the other parameter variants (root_login true, another port, other host keys, kex algorithms, ciphers or MACs)
    from: manifests/ssh_secure.pp:3-12, 48-53
    uncovered:
      why: parameter variants no production node uses
      accepted_gap: [root_login, port, host_keys, kex_algorithm, ciphers, macs]
      evidence: >-
        diagnosis/fleet_variant_usage.md (2026-11-23): no production node statement sets any parameter of ssh_secure,
        and none sets node_base's ssh_allow_root_login, ssh_port, host_keys, kex_algorithm, ciphers or macs, which
        node_base forwards to it; no class of the repository sets them
  - outcome: Protocol 2 and UsePrivilegeSeparation yes
    from: manifests/ssh_secure.pp:57, 77
    uncovered:
      why: deprecated and ignored by OpenSSH 7.5 and later, so they have no behaviour on any lab sshd (Phase 5 backlog #3)
      lifted_by: "capability: an OpenSSH older than 7.5 in the lab"
      evidence: >-
        sshd -V on the lab nodes (2026-11-23 runs): OpenSSH 9.6p1 on Ubuntu 24.04 and OpenSSH 8.7p1 on RHEL 9; both
        ignore Protocol and UsePrivilegeSeparation
  - outcome: the RedHat branch (service sshd, admin group wheel)
    from: manifests/ssh_secure.pp:15-19
    checks: [on-redhat-the-service-and-the-admin-group]
variants:
  - name: password
    why: password_authentication true, which node_base_domain_desktop sets on ssh_secure; the set's fixture otherwise
    params: password
  - name: rhel
    why: >-
      the RedHat branch (service sshd, admin group wheel) and an sshd older than 9.2 (OpenSSH 8.7), on the rhel9 node
      with the set's own params fixture
    node: rhel9
checks:
  - id: kex-only-dh-gex-sha256
    what: the effective KexAlgorithms is exactly diffie-hellman-group-exchange-sha256
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "10", text: "String $kex_algorithm            = 'diffie-hellman-group-exchange-sha256',"}
      - {path: manifests/ssh_secure.pp, lines: "59", text: "'KexAlgorithms'           => $kex_algorithm,"}
    probe: sshd -T 2>/dev/null | grep -E '^kexalgorithms '
    expect: {rc: 0, stdout: "\\Akexalgorithms diffie-hellman-group-exchange-sha256\\n\\Z"}

  - id: kex-negotiation-refuses-curve25519
    what: a client offering only curve25519-sha256 cannot negotiate a key exchange with the node's sshd
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "10", text: "diffie-hellman-group-exchange-sha256"}
    probe: ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o KexAlgorithms=curve25519-sha256 nobody@127.0.0.1 true 2>&1
    mismatch:
      varies: >-
        the offered KEX: the class's own diffie-hellman-group-exchange-sha256 must negotiate (reaching authentication), so the expectation of 'no matching key exchange method' must fail
      probe: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o KexAlgorithms=diffie-hellman-group-exchange-sha256 nobody@127.0.0.1 true 2>&1
    expect: {rc: 255, stdout: "no matching key exchange method found"}

  - id: ciphers-exact
    what: the effective Ciphers list is exactly the class's five AES-GCM/CTR ciphers, in order
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "11", text: "'aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'"}
      - {path: manifests/ssh_secure.pp, lines: "60", text: "'Ciphers'                 => $ciphers,"}
    probe: sshd -T 2>/dev/null | grep -E '^ciphers '
    expect: {rc: 0, stdout: "\\Aciphers aes256-gcm@openssh\\.com,aes128-gcm@openssh\\.com,aes256-ctr,aes192-ctr,aes128-ctr\\n\\Z"}

  - id: cipher-negotiation-refuses-chacha20
    what: a client offering only chacha20-poly1305 cannot negotiate a cipher
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "11", text: "aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"}
    probe: ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o Ciphers=chacha20-poly1305@openssh.com nobody@127.0.0.1 true 2>&1
    mismatch:
      varies: >-
        the offered cipher: the class's own aes256-gcm@openssh.com must negotiate, so 'no matching cipher found' must not appear
      probe: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o Ciphers=aes256-gcm@openssh.com nobody@127.0.0.1 true 2>&1
    expect: {rc: 255, stdout: "no matching cipher found"}

  - id: macs-exact
    what: the effective MACs list is exactly the class's four SHA-2 MACs, in order
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "12", text: "'hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256'"}
      - {path: manifests/ssh_secure.pp, lines: "61", text: "'MACs'                    => $macs,"}
    probe: sshd -T 2>/dev/null | grep -E '^macs '
    expect: {rc: 0, stdout: "\\Amacs hmac-sha2-512-etm@openssh\\.com,hmac-sha2-256-etm@openssh\\.com,hmac-sha2-512,hmac-sha2-256\\n\\Z"}

  - id: mac-negotiation-refuses-umac
    what: with a non-AEAD cipher, a client offering only umac-64-etm cannot negotiate a MAC
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "12", text: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"}
    probe: ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o Ciphers=aes256-ctr -o MACs=umac-64-etm@openssh.com nobody@127.0.0.1 true 2>&1
    mismatch:
      varies: >-
        the offered MAC: the class's own hmac-sha2-256 (with aes256-ctr) must negotiate, so 'no matching MAC found' must not appear
      probe: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o Ciphers=aes256-ctr -o MACs=hmac-sha2-256 nobody@127.0.0.1 true 2>&1
    expect: {rc: 255, stdout: "no matching MAC found"}

  - id: password-auth-off
    what: password authentication is disabled — the effective setting sshd enforces is `no`
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "6", text: "Boolean $password_authentication = false,"}
      - {path: manifests/ssh_secure.pp, lines: "43-47", text: "$my_password_authentication = 'no'"}
      - {path: manifests/ssh_secure.pp, lines: "66", text: "'PasswordAuthentication'  => $my_password_authentication ,"}
    probe: sshd -T 2>/dev/null | grep -E '^passwordauthentication '
    expect: {rc: 0, stdout: "\\Apasswordauthentication no\\n\\Z"}

  - id: root-login-off
    what: the effective PermitRootLogin is `no`
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "7", text: "Boolean $root_login              = false,"}
      - {path: manifests/ssh_secure.pp, lines: "49-53", text: "$my_root_login = 'no'"}
      - {path: manifests/ssh_secure.pp, lines: "68", text: "'PermitRootLogin'         => $my_root_login ,"}
    probe: sshd -T 2>/dev/null | grep -E '^permitrootlogin '
    expect: {rc: 0, stdout: "\\Apermitrootlogin no\\n\\Z"}

  - id: client-alive
    what: ClientAliveInterval as given (30 in this fixture; 14400 by default) with ClientAliveCountMax 0
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "5", text: "Integer $client_alive_interval   = 14400,"}
      - {path: manifests/ssh_secure.pp, lines: "75-76", text: "'ClientAliveCountMax'     => '0',"}
    probe: sshd -T 2>/dev/null | grep -E '^clientalive' | sort
    expect: {rc: 0, stdout: "\\Aclientalivecountmax 0\\nclientaliveinterval 30\\n\\Z"}

  - id: allow-groups
    what: only members of sudo (Debian admin group), naemon and ssh_in may log in
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "20-23", text: "$admin_group = 'sudo'"}
      - {path: manifests/ssh_secure.pp, lines: "41", text: "$othergroups = join([lookup ( \"${clientcert}::ssh::othergroups\", String, 'first', '' ), ' ssh_in'])"}
      - {path: manifests/ssh_secure.pp, lines: "79", text: "'AllowGroups'             => \"${admin_group} naemon ${othergroups}\" ,"}
    probe: sshd -T 2>/dev/null | awk '$1 == "allowgroups" { for (i = 2; i <= NF; i++) print $i }'
    expect: {rc: 0, stdout: "\\Asudo\\nnaemon\\np8testgroup\\nssh_in\\n\\Z"}

  - id: ssh-in-group
    what: the group ssh_in exists (for non-sudoers that need ssh in)
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "35-38", text: "group {'ssh_in':"}
    probe: getent group ssh_in
    expect: {rc: 0, stdout: "^ssh_in:"}

  - id: host-keys-in-order
    what: sshd loads exactly the ed25519, ecdsa and rsa host keys, in the class's order
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "9", text: "['/etc/ssh/ssh_host_ed25519_key','/etc/ssh/ssh_host_ecdsa_key','/etc/ssh/ssh_host_rsa_key']"}
      - {path: manifests/ssh_secure.pp, lines: "58", text: "'HostKey'                 => $host_keys,"}
    probe: sshd -T 2>/dev/null | grep -E '^hostkey '
    expect: {rc: 0, stdout: "\\Ahostkey /etc/ssh/ssh_host_ed25519_key\\nhostkey /etc/ssh/ssh_host_ecdsa_key\\nhostkey /etc/ssh/ssh_host_rsa_key\\n\\Z"}

  - id: moduli-file
    what: /etc/ssh/moduli is the module's own file, 0644 root:root
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "26-33", text: "source => 'puppet:///modules/puppet_infrastructure/ssh/moduli',"}
      - {path: files/ssh/moduli, sha256: 01f903391abe367b549ae37822983bd3d5a8dd3d6465523f3b5f14729573b8b0}
    probe: |
      sha256sum /etc/ssh/moduli | cut -d' ' -f1
      stat -c '%a %U %G' /etc/ssh/moduli
    expect: {rc: 0, stdout: "\\A01f903391abe367b549ae37822983bd3d5a8dd3d6465523f3b5f14729573b8b0\\n644 root root\\n\\Z"}

  - id: unchanged-hardening-defaults
    what: the class's remaining options hold (port 22, LoginGraceTime 120, INFO/AUTH logging, no host-based auth, ...)
    control: invariant
    why_invariant: >-
      Ubuntu 24.04's OpenSSH 9.6 defaults already equal these twelve values on the clean node (read 2026-11-10);
      the check guards that the class's sshd_config keeps them, it cannot discriminate before/after.
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "62-74", text: "'HostbasedAuthentication' => 'no' ,"}
      - {path: manifests/ssh_secure.pp, lines: "78", text: "'X11DisplayOffset'        => '10' ,"}
      - {path: manifests/ssh_secure.pp, lines: "8", text: "Integer $port                    = 22,"}
    probe: sshd -T 2>/dev/null | grep -E '^(hostbasedauthentication|ignorerhosts|logingracetime|loglevel|permitemptypasswords|port|printlastlog|pubkeyauthentication|strictmodes|syslogfacility|tcpkeepalive|x11displayoffset) ' | sort
    expect:
      rc: 0
      stdout: "\\Ahostbasedauthentication no\\nignorerhosts yes\\nlogingracetime 120\\nloglevel INFO\\npermitemptypasswords no\\nport 22\\nprintlastlog yes\\npubkeyauthentication yes\\nstrictmodes yes\\nsyslogfacility AUTH\\ntcpkeepalive yes\\nx11displayoffset 10\\n\\Z"

  # 2026-11-19 authoring corrections (run 20261119T015853Z): the key's base64 holds + and /, which an extended regex
  # reads as operators, so the key is now matched literally (grep -F); and ssh read the rest of the probe's own script
  # from its standard input (the runner feeds scripts to bash -s), so the lines after it never ran; every ssh in the
  # set now runs with -n.
  - id: login-test-accounts-and-key
    what: >-
      setup for the login checks, three fixture accounts with one throwaway key (p8testin in ssh_in, p8testother in the
      Hiera group p8testgroup, p8testout in no allowed group), and root in ssh_in with the key, with sshd's journal
      cursor noted
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "35-38", text: "group {'ssh_in':"}
    mutates: >-
      creates /run/p8test-ssh/key (an ed25519 key pair), the group p8testgroup, the accounts p8testin (in ssh_in),
      p8testother (in p8testgroup) and p8testout (no allowed group) with that key in ~/.ssh/authorized_keys, adds root to
      ssh_in, appends the key to /root/.ssh/authorized_keys, and notes sshd's journal cursor in /run/p8test-ssh/cursor
    probe: |
      install -d -m 0700 /run/p8test-ssh
      [ -f /run/p8test-ssh/key ] || ssh-keygen -q -t ed25519 -N '' -f /run/p8test-ssh/key
      getent group p8testgroup >/dev/null || groupadd p8testgroup
      for u in p8testin p8testother p8testout; do
        id "$u" >/dev/null 2>&1 || useradd -m -s /bin/bash "$u"
        install -d -m 0700 -o "$u" -g "$u" "/home/$u/.ssh"
        install -m 0600 -o "$u" -g "$u" /run/p8test-ssh/key.pub "/home/$u/.ssh/authorized_keys"
      done
      usermod -aG ssh_in p8testin
      usermod -aG p8testgroup p8testother
      usermod -aG ssh_in root
      install -d -m 0700 /root/.ssh
      cat /run/p8test-ssh/key.pub >> /root/.ssh/authorized_keys
      journalctl -u ssh.service -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p' > /run/p8test-ssh/cursor
    effect: |
      id -nG p8testin | tr ' ' '\n' | p8_count '^ssh_in$'
      id -nG p8testother | tr ' ' '\n' | p8_count '^p8testgroup$'
      id -nG root | tr ' ' '\n' | p8_count '^ssh_in$'
      id -nG p8testout | tr ' ' '\n' | p8_count '^(sudo|naemon|p8testgroup|ssh_in)$'
      grep -cF -- "$(cut -d' ' -f2 /run/p8test-ssh/key.pub)" /root/.ssh/authorized_keys || true
    expect: {rc: 0, stdout: "\\A1\\n1\\n1\\n0\\n1\\n\\Z"}

  - id: a-key-login-in-an-allowed-group-works
    what: p8testin (group ssh_in) logs in over loopback with the key and runs a command
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "79", text: "'AllowGroups'             => \"${admin_group} naemon ${othergroups}\" ,"}
    mutates: none beyond one SSH login over loopback (declared mutating so it runs after the accounts exist)
    probe: |
      true
    effect: |
      ssh -n -i /run/p8test-ssh/key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 p8testin@127.0.0.1 'echo logged-in-as-$(id -un)' 2>/dev/null
    expect: {rc: 0, stdout: "\\Alogged-in-as-p8testin\\n\\Z"}

  - id: a-key-login-in-the-hiera-group-works
    what: p8testother, in the group the node's Hiera othergroups adds (p8testgroup), logs in over loopback with the key
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "39-41", text: "$othergroups = join([lookup ( \"${clientcert}::ssh::othergroups\", String, 'first', '' ), ' ssh_in'])"}
    mutates: none beyond one SSH login over loopback (declared mutating so it runs after the accounts exist)
    probe: |
      true
    effect: |
      ssh -n -i /run/p8test-ssh/key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 p8testother@127.0.0.1 'echo logged-in-as-$(id -un)' 2>/dev/null
    expect: {rc: 0, stdout: "\\Alogged-in-as-p8testother\\n\\Z"}

  - id: a-key-login-outside-the-allowed-groups-is-refused
    what: p8testout, with the same valid key but in no allowed group, is refused
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "79", text: "'AllowGroups'             => \"${admin_group} naemon ${othergroups}\" ,"}
    mutates: none beyond one SSH login attempt over loopback (declared mutating so it runs after the accounts exist)
    probe: |
      true
    effect: |
      ssh -n -i /run/p8test-ssh/key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 p8testout@127.0.0.1 true 2>&1 | grep -o 'Permission denied ([a-z,-]*)'
      id p8testout >/dev/null && echo account-exists
    expect: {rc: 0, stdout: "\\APermission denied \\(publickey\\)\\naccount-exists\\n\\Z"}

  - id: password-and-root-logins-are-refused
    what: >-
      a password login is not offered (publickey only), and root, though in an allowed group (ssh_in) and with the key
      in its authorized_keys, is refused by PermitRootLogin (sshd logs ROOT LOGIN REFUSED)
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "66-68", text: "'PermitRootLogin'         => $my_root_login ,"}
      - {path: manifests/ssh_secure.pp, lines: "49-53", text: "$my_root_login = 'no'"}
    mutates: none beyond two SSH login attempts over loopback (declared mutating so they run after the key is in place)
    probe: |
      true
    effect: |
      o='-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5'
      ssh -n $o -o PreferredAuthentications=password -o PubkeyAuthentication=no p8testin@127.0.0.1 true 2>&1 | grep -o 'Permission denied ([a-z,-]*)'
      ssh -n $o -i /run/p8test-ssh/key root@127.0.0.1 true 2>&1 | grep -o 'Permission denied ([a-z,-]*)'
      sleep 1
      journalctl -u ssh.service --after-cursor "$(cat /run/p8test-ssh/cursor)" --no-pager -q | p8_count 'ROOT LOGIN REFUSED FROM 127\.0\.0\.1' | awk '{print ($1 != 0 ? "refused by PermitRootLogin" : "not refused by PermitRootLogin")}'
    expect: {rc: 0, stdout: "\\APermission denied \\(publickey\\)\\nPermission denied \\(publickey\\)\\nrefused by PermitRootLogin\\n\\Z"}

  - id: an-idle-session-is-ended-after-the-interval
    what: >-
      a session that sends nothing for 60 s is ended by the server once the 30 s interval has passed (29 to 45 s as measured; sshd's
      idle timeouts from client_alive_interval, local change #8), so its remote command never prints
    control: negative
    timeout: 180
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "75-76", text: "'ClientAliveInterval'     => $client_alive_interval,"}
    mutates: >-
      one SSH session over loopback as p8testin, idle for up to 60 s, run detached as transient unit p8test-ssh-idle
      (the runner's own session to the node would itself be cut if it stayed silent that long); the outcome goes to
      /run/p8test-ssh/idle.txt, and the probe prints a line every 5 s while it waits
    probe: |
      rm -f /run/p8test-ssh/idle.txt
      cat > /run/p8test-ssh/idle.sh <<'T'
      start=$(cut -d' ' -f1 /proc/uptime); wall=$(date +%s)
      out=$(timeout 90 ssh -n -i /run/p8test-ssh/key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=0 p8testin@127.0.0.1 'sleep 60; echo still-connected' 2>/dev/null)
      echo "${out:-ended} after $(awk -v s="$start" '{printf "%.1f", $1 - s}' /proc/uptime)s (wall clock $(( $(date +%s) - wall ))s)" > /run/p8test-ssh/idle.txt
      T
      systemd-run --unit p8test-ssh-idle -q bash /run/p8test-ssh/idle.sh
      for i in $(seq 30); do [ -s /run/p8test-ssh/idle.txt ] && break; echo waiting; sleep 5; done
    effect: |
      awk '{t=$3; sub(/s$/, "", t); print $1 " " ((t + 0 < 29 || 45 < t + 0) ? "after " t "s" : "within the interval window")}' /run/p8test-ssh/idle.txt
    expect: {rc: 0, stdout: "\\Aended within the interval window\\n\\Z"}

  - id: on-redhat-the-service-and-the-admin-group
    variant: rhel
    what: on RedHat the service sshd runs and AllowGroups starts with the RedHat admin group wheel, then naemon
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "15-19", text: "$admin_group = 'wheel'"}
      - {path: manifests/ssh_secure.pp, lines: "79", text: "'AllowGroups'             => \"${admin_group} naemon ${othergroups}\" ,"}
    probe: |
      systemctl is-active sshd
      sshd -T 2>/dev/null | awk '$1 == "allowgroups" { for (i = 2; i <= NF; i++) print $i }' | head -2
    expect: {rc: 0, stdout: "\\Aactive\\nwheel\\nnaemon\\n\\Z"}

  - id: rhel-login-account-and-key
    variant: rhel
    what: setup for the idle check on RedHat, the fixture account p8testin in ssh_in with one throwaway key
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "35-38", text: "group {'ssh_in':"}
    mutates: >-
      creates /run/p8test-ssh/key (an ed25519 key pair) and the account p8testin (in ssh_in) with that key in
      ~/.ssh/authorized_keys
    probe: |
      install -d -m 0700 /run/p8test-ssh
      [ -f /run/p8test-ssh/key ] || ssh-keygen -q -t ed25519 -N '' -f /run/p8test-ssh/key
      id p8testin >/dev/null 2>&1 || useradd -m -s /bin/bash p8testin
      install -d -m 0700 -o p8testin -g p8testin /home/p8testin/.ssh
      install -m 0600 -o p8testin -g p8testin /run/p8test-ssh/key.pub /home/p8testin/.ssh/authorized_keys
      usermod -aG ssh_in p8testin
    effect: |
      id -nG p8testin | tr ' ' '\n' | p8_count '^ssh_in$'
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}

  - id: on-redhat-an-idle-session-is-not-ended
    variant: rhel
    what: >-
      on RHEL 9 (OpenSSH 8.7, older than 9.2) a session that sends nothing for 60 s is not ended by the server: the
      idle disconnect is not enforced there (HQ batch-14 ruling 3; approval_conditions.md), so its command prints
    control: negative
    timeout: 180
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "75-76", text: "'ClientAliveInterval'     => $client_alive_interval,"}
    mutates: >-
      one SSH session over loopback as p8testin, idle for 60 s, run detached as transient unit p8test-ssh-idle; the
      outcome goes to /run/p8test-ssh/idle.txt, and the probe prints a line every 5 s while it waits
    probe: |
      rm -f /run/p8test-ssh/idle.txt
      cat > /run/p8test-ssh/idle.sh <<'T'
      start=$(cut -d' ' -f1 /proc/uptime); wall=$(date +%s)
      out=$(timeout 90 ssh -n -i /run/p8test-ssh/key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=0 p8testin@127.0.0.1 'sleep 60; echo still-connected' 2>/dev/null)
      echo "${out:-ended} after $(awk -v s="$start" '{printf "%.1f", $1 - s}' /proc/uptime)s (wall clock $(( $(date +%s) - wall ))s)" > /run/p8test-ssh/idle.txt
      T
      systemd-run --unit p8test-ssh-idle -q bash /run/p8test-ssh/idle.sh
      for i in $(seq 30); do [ -s /run/p8test-ssh/idle.txt ] && break; echo waiting; sleep 5; done
    effect: |
      cut -d' ' -f1 /run/p8test-ssh/idle.txt
    expect: {rc: 0, stdout: "\\Astill-connected\\n\\Z"}

  - id: with-password-authentication-a-password-logs-in
    variant: password
    what: >-
      with password_authentication true sshd's effective PasswordAuthentication is yes, an account in ssh_in logs in
      from the node to itself with its password alone, and a wrong password is refused
    control: negative
    derived_from:
      - {path: manifests/ssh_secure.pp, lines: "43-47", text: "if ( $password_authentication == false) {"}
      - {path: manifests/ssh_secure.pp, lines: "66", text: "'PasswordAuthentication'  => $my_password_authentication ,"}
    mutates: >-
      on the node: creates the account p8testpw in group ssh_in with the password p8test-ssh-not-a-secret (a lab
      fixture), two askpass scripts /root/p8test-ssh/askpass-good and askpass-bad, and makes two SSH logins to
      127.0.0.1 as p8testpw with password authentication only (one with each); their output goes to
      /run/p8test-ssh/pw-good.txt and pw-bad.txt
    probe: |
      install -d -m 0700 /run/p8test-ssh /root/p8test-ssh
      id p8testpw >/dev/null 2>&1 || useradd -m -s /bin/bash -G ssh_in p8testpw
      echo 'p8testpw:p8test-ssh-not-a-secret' | chpasswd
      printf '#!/bin/sh\necho p8test-ssh-not-a-secret\n' > /root/p8test-ssh/askpass-good
      printf '#!/bin/sh\necho p8test-wrong-password\n' > /root/p8test-ssh/askpass-bad
      chmod 0700 /root/p8test-ssh/askpass-good /root/p8test-ssh/askpass-bad
      for k in good bad; do
        SSH_ASKPASS=/root/p8test-ssh/askpass-$k SSH_ASKPASS_REQUIRE=force DISPLAY=:0 setsid -w ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no \
          -o NumberOfPasswordPrompts=1 -o ConnectTimeout=10 p8testpw@127.0.0.1 id -un < /dev/null > /run/p8test-ssh/pw-$k.txt 2>&1
      done
    effect: |
      sshd -T | grep -i '^passwordauthentication '
      grep -x p8testpw /run/p8test-ssh/pw-good.txt
      grep -c 'Permission denied' /run/p8test-ssh/pw-bad.txt
    expect: {rc: 0, stdout: "\\Apasswordauthentication yes\\np8testpw\\n1\\n\\Z"}
