# Phase 3 checks for puppet_infrastructure::users_sudoers (define; harness title users_sudoers). It creates one
# user_sudoer per entry of `configs` except the names in `unmanaged_users`. Fixture (params, never committed): configs
# for p8testuser (the user-identity fixture: fake hash, throwaway RSA key) and p8testuser2, unmanaged_users
# [p8testuser2].
class: users_sudoers
baseline: release-0.9.10 (cf477c6)
fixture: params
authoring:
  minutes: 0.2
  notes: "Wall clock 00:37:56Z to 00:38:06Z 2026-11-17, outside the worktree while the Phase 1 review ran."
checks:
  - id: managed-user-is-a-sudoer
    what: the managed entry becomes a sudoer user (own primary group plus sudo)
    control: negative
    derived_from:
      - {path: manifests/users_sudoers.pp, lines: "18", text: "create_resources (puppet_infrastructure::user_sudoer, $configs_filtered)"}
    probe: |
      getent passwd p8testuser | cut -d: -f1,5
      id -nG p8testuser | tr ' ' '\n' | sort | tr '\n' ' '
    expect: {rc: 0, stdout: "\\Ap8testuser:P8 Test User\\np8testuser sudo \\Z"}

  - id: unmanaged-user-is-left-alone
    what: an entry named in unmanaged_users is filtered out, so no account is created for it
    control: invariant
    why_invariant: the clean node has no p8testuser2 account, and the filter must keep it that way
    derived_from:
      - {path: manifests/users_sudoers.pp, lines: "15", text: "$configs_filtered = $configs.filter |$key, $value| {!member($unmanaged_users, $key)}"}
    probe: |
      getent passwd p8testuser2 || echo no-p8testuser2
    expect: {rc: 0, stdout: "\\Ano-p8testuser2\\n\\Z"}
