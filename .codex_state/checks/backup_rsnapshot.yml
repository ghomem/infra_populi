# Phase 3 checks for puppet_infrastructure::backup_rsnapshot (define, harness title `backup_rsnapshot`).
# Fixture (params): basedir /etc, prefix etc, backdir /opt/puppet-infrastructure/backup, ndays 7; user/hour/minute
# at their defaults (root, 23, 0). Required base (plan): backup_rsnapshot_pre (rsnapshot package, /etc/rsnapshot.d),
# filesystem_base. Read-only probes, except daily-backup-executes (opt-in mutating: one real `rsnapshot daily`,
# judged on the snapshot it leaves). `rsnapshot -t` in daily-plan is test mode (prints, executes nothing).
# Outcomes table added 2026-11-19 (backfill batch 5, HQ batch-10 rulings 2 and C1), with retention as behaviour: eight
# more daily runs after the first must leave exactly ndays (7) snapshots, daily.0 to daily.6.
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1): other parameters (undeterminable production use: the passwd/ layer)
# are a check in the variant run `other`; the 23:00 firing names what is missing.
class: backup_rsnapshot
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Simple rsnapshot-based generic backups: a configuration per title and a daily cron run that snapshots the configured
  directory into the snapshot root, so its files can be restored from there.
outcomes:
  - outcome: a per-title rsnapshot configuration, 0644 root:root, rendered from the parameters and accepted by rsnapshot
    from: manifests/backup_rsnapshot.pp:5-11; templates/backup/rsnapshot.conf.erb:4, 7, 12, 23
    checks: [conf-file-mode, conf-rendered-values, conf-syntax]
  - outcome: root's crontab runs `rsnapshot -c <conf> daily` at 23:00, which rsyncs the backup point into the snapshot root
    from: manifests/backup_rsnapshot.pp:3, 13-19
    checks: [cron-daily-2300, daily-plan]
  - outcome: a run takes a daily snapshot holding a byte-identical copy of the backup point, so its files can be restored from there
    from: manifests/backup_rsnapshot.pp:1-2, 14; templates/backup/rsnapshot.conf.erb:4, 12
    checks: [daily-backup-executes]
  - outcome: retention keeps exactly ndays daily snapshots, rotating the oldest away
    from: templates/backup/rsnapshot.conf.erb:7
    checks: [daily-retention-keeps-ndays]
  - outcome: cron itself firing at 23:00
    from: manifests/backup_rsnapshot.pp:13-19
    uncovered:
      why: a run would have to wait for 23:00; the crontab entry is checked and its exact command is run by hand
      lifted_by: "capability: a wall-clock trigger in phase3.py runs (waiting for, or shifting, the node's time)"
      evidence: >-
        clock_check.py (HQ 2026-11-17 batch-8 ruling 4) requires every lab clock to agree with the laptop's, and
        phase3.py has no step that waits for a time of day
  - outcome: other users, times, backup points, prefixes or retention counts
    from: manifests/backup_rsnapshot.pp:3
    checks: [other-parameters-render-the-config-and-the-cron-entry]
variants:
  - name: other
    why: >-
      other parameters (directory, prefix, retention, user, time); production's backups are declared in the passwd/
      layer, which the engine never reads, so whether production uses them is undeterminable and they are tested
    params: other
checks:
  - id: conf-file-mode
    what: the per-title rsnapshot config exists at /etc/rsnapshot.d/rsnapshot-<title>.conf, 0644 root:root
    control: negative
    derived_from:
      - {path: manifests/backup_rsnapshot.pp, lines: "5-11", text: "$myconffile = \"/etc/rsnapshot.d/rsnapshot-${title}.conf\""}
      - {path: manifests/backup_rsnapshot.pp, lines: "7-9", text: "mode    => '0644',"}
    probe: stat -c '%a %U %G' /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf
    expect: {rc: 0, stdout: "^644 root root$"}

  - id: conf-rendered-values
    what: the template renders snapshot_root, retain, backup point and lockfile from the parameters and title
    control: negative
    derived_from:
      - {path: templates/backup/rsnapshot.conf.erb, lines: "4", text: "snapshot_root\t<%= @backdir %>"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "7", text: "retain\tdaily\t<%= @ndays %>"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "12", text: "backup\t<%= @basedir %>\t./<%= @prefix %>"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "23", text: "lockfile\t/tmp/rsnapshot_<%= @title %>.pid"}
    probe: grep -E '^(snapshot_root|retain|backup|lockfile)[[:space:]]' /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf | tr -s '\t ' ' '
    expect:
      rc: 0
      stdout: "\\Asnapshot_root /opt/puppet-infrastructure/backup\\nretain daily 7\\nbackup /etc \\./etc\\nlockfile /tmp/rsnapshot_backup_rsnapshot\\.pid\\n\\Z"

  - id: conf-syntax
    what: rsnapshot accepts the rendered config (configtest), i.e. the template is a valid rsnapshot file
    control: negative
    derived_from:
      - {path: templates/backup/rsnapshot.conf.erb, sha256: 7000d5569e7c2a4d33fc7d2c018505ef5ccea75b6979138583fe908dd9a7b06c}
      - {path: manifests/backup_rsnapshot.pp, lines: "14", text: "/usr/bin/rsnapshot -c ${myconffile} daily"}
    probe: /usr/bin/rsnapshot -c /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf configtest 2>&1
    expect: {rc: 0, stdout: "^Syntax OK$"}

  - id: daily-plan
    what: a `daily` run would rsync the backup point /etc into <snapshot_root>/daily.0 with /usr/bin/rsync
    control: negative
    derived_from:
      - {path: manifests/backup_rsnapshot.pp, lines: "14", text: "/usr/bin/rsnapshot -c ${myconffile} daily"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "12-14", text: "cmd_rsync\t/usr/bin/rsync"}
    probe: |
      /usr/bin/rsnapshot -c /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf -t daily 2>&1 | sed -e ':a' -e '/\\$/N; s/\\\n *//; ta'
    expect: {rc: 0, stdout: "^/usr/bin/rsync .*--relative.* /etc/? /opt/puppet-infrastructure/backup/daily\\.0/+(\\./)?etc\\s*$"}

  - id: cron-daily-2300
    what: root's crontab runs `rsnapshot -c <conf> daily` at 23:00 (hour/minute/user defaults)
    control: negative
    derived_from:
      - {path: manifests/backup_rsnapshot.pp, lines: "3", text: "$user = 'root', $hour = '23', $minute = '0'"}
      - {path: manifests/backup_rsnapshot.pp, lines: "13-19", text: "command => \"/usr/bin/rsnapshot -c ${myconffile} daily\","}
    probe: crontab -l -u root
    expect: {rc: 0, stdout: "^0 23 \\* \\* \\* /usr/bin/rsnapshot -c /etc/rsnapshot\\.d/rsnapshot-backup_rsnapshot\\.conf daily$"}

  - id: daily-backup-executes
    what: the cron's command, run once, takes a daily snapshot holding a byte-identical copy of the backup point /etc
    control: negative
    derived_from:
      - {path: manifests/backup_rsnapshot.pp, lines: "14", text: "/usr/bin/rsnapshot -c ${myconffile} daily"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "4", text: "snapshot_root\t<%= @backdir %>"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "12", text: "backup\t<%= @basedir %>\t./<%= @prefix %>"}
    mutates: >-
      runs `rsnapshot daily` once: creates /opt/puppet-infrastructure/backup/daily.0 (a copy of /etc), takes and
      releases the lockfile /tmp/rsnapshot_backup_rsnapshot.pid, logs through logger to syslog
    probe: /usr/bin/rsnapshot -c /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf daily 2>&1
    effect: |
      f=$(find /opt/puppet-infrastructure/backup/daily.0 -path '*/etc/hostname' -type f 2>/dev/null | head -1)
      test -n "$f" || { echo "no snapshot of /etc/hostname under daily.0"; exit 1; }
      cmp -s "$f" /etc/hostname && echo "daily.0 holds /etc ($f)"
    expect: {rc: 0, stdout: "^daily\\.0 holds /etc \\(/opt/puppet-infrastructure/backup/daily\\.0/.*etc/hostname\\)$"}

  - id: daily-retention-keeps-ndays
    what: >-
      after eight more daily runs (nine in all), exactly ndays (7) daily snapshots remain, daily.0 to daily.6: the
      oldest were rotated away
    control: negative
    timeout: 300
    derived_from:
      - {path: templates/backup/rsnapshot.conf.erb, lines: "7", text: "retain\tdaily\t<%= @ndays %>"}
      - {path: manifests/backup_rsnapshot.pp, lines: "14", text: "/usr/bin/rsnapshot -c ${myconffile} daily"}
    mutates: runs `rsnapshot daily` eight more times (the snapshots rotate under /opt/puppet-infrastructure/backup)
    probe: |
      for i in $(seq 8); do /usr/bin/rsnapshot -c /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf daily >/dev/null 2>&1 || echo "run $i failed"; done
    effect: |
      ls -1 /opt/puppet-infrastructure/backup | sort -V | tr '\n' ' '; echo
    expect: {rc: 0, stdout: "\\Adaily\\.0 daily\\.1 daily\\.2 daily\\.3 daily\\.4 daily\\.5 daily\\.6 \\n\\Z"}

  - id: other-parameters-render-the-config-and-the-cron-entry
    variant: other
    what: >-
      with basedir /etc/default, prefix p8test-default, backdir /var/tmp/p8test-backups, ndays 3, user nobody, 04:17,
      the configuration holds those values and nobody's crontab runs rsnapshot daily at 04:17
    control: negative
    derived_from:
      - {path: templates/backup/rsnapshot.conf.erb, lines: "4", text: "snapshot_root\t<%= @backdir %>"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "7", text: "retain\tdaily\t<%= @ndays %>"}
      - {path: templates/backup/rsnapshot.conf.erb, lines: "12", text: "backup\t<%= @basedir %>\t./<%= @prefix %>"}
      - {path: manifests/backup_rsnapshot.pp, lines: "13-19", text: "command => \"/usr/bin/rsnapshot -c ${myconffile} daily\","}
    probe: |
      grep -E '^(snapshot_root|retain|backup)[[:space:]]' /etc/rsnapshot.d/rsnapshot-backup_rsnapshot.conf | tr -s '\t ' ' '
      crontab -l -u nobody | grep -v '^#'
    expect: {rc: 0, stdout: "\\Asnapshot_root /var/tmp/p8test-backups\\nretain daily 3\\nbackup /etc/default \\./p8test-default\\n17 4 \\* \\* \\* /usr/bin/rsnapshot -c /etc/rsnapshot\\.d/rsnapshot-backup_rsnapshot\\.conf daily\\n\\Z"}
