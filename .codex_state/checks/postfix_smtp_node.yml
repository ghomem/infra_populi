# Phase 3 checks for puppet_infrastructure::postfix_smtp_node (class, no parameters; values from the lab master's Hiera).
# Lab Hiera: relayhost mailserver.mycompany.com, relayport 587, myorigin mycompany.com (common.yaml), relayuser
# p8test-relay and a fake relaypass (p8test_fixtures.yaml); mynetworks, mydestination, message_size_limit and
# root_email_alias take their lookup defaults (127.0.0.0/8, the hostname, 10240000, ''). Ubuntu: libsasl2-modules,
# CA file /etc/ssl/certs/ca-certificates.crt. No probe sends mail: the fixture relayhost is a real-world domain, and a
# probe must never contact another host. The relay password is never printed.
# Purpose, outcomes and the relay as behaviour added 2026-11-19 (backfill batch 4, HQ batch-10 rulings 2 and C1): the
# peer (ubuntu2) plays the relayhost (postfix submission on 587 with SASL from dovecot, the relay account p8test-relay
# with the lab fixture's fake password, marked not-a-secret in master_fixtures.sh). On the node the relayhost name is
# pinned to the peer in /etc/hosts (the runner's P8_PEER_ADDR), and a fence rejects mail ports to every other address,
# so no message can reach the real-world domain. Measured on an applied node (2026-11-19, a TEST-NET pin): the MX
# question for the name gets NXDOMAIN and the A question the /etc/hosts address, and postfix falls back from a missing
# MX to the A record; sendmail refuses an over-size message with exit 75 'message file too big'.
# AUTHORING ERROR corrected 2026-11-19 after run 20261119T055606Z (3 FAIL): (1) that measurement asked the resolved
# stub (127.0.0.53) directly, but the node's /etc/resolv.conf is a static file naming public resolvers, which postfix's
# chroot copy also names, so postfix never saw the /etc/hosts pin ('Host not found', message deferred). The relay
# check now points /etc/resolv.conf and postfix's chroot copy at the stub (a declared lab fixture: production resolves
# the relayhost through its DNS), waits until the stub answers the pin, and reloads postfix. (2) The peer's postfix also
# listens on [::]:587; the expectation allows that line.
# AUTHORING ERROR corrected 2026-11-19 after run 20261119T060057Z (1 FAIL; the relay itself passed: queue empty,
# status=sent, the mailbox holds the message with ESMTPSA): the peer's submission service logs under the tag
# postfix/smtpd (the master.cf entry sets no syslog_name), not postfix/submission/smtpd; read on the peer's journal
# ('client=unknown[...], sasl_method=PLAIN, sasl_username=p8test-relay').
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1): the RedHat branch is a check in the variant run `rhel` (rhel9); the
# per-node Hiera variants name what is missing.
# Correction round 1 of the swept set (2026-11-25, review 20261125T074313Z): the per-node Hiera row was uncovered for a
# false reason. The keys are looked up under the node's certname, and the lab Hiera fixture (master_fixtures.sh) now
# gives p8lab-rhel9 non-default values for all four, so the variant run `rhel` checks that they reach postfix.
# 2026-11-25 authoring correction (run 20261125T075907Z-author): the new check expected mydestination to be the Hiera
# value alone; the template appends ', localhost.localdomain, , localhost' to it (main.cf:34), as the base check's
# expectation already shows. The node's value was as the baseline makes it.
class: postfix_smtp_node
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Lets a node send mail through the organisation's relay: postfix hands every message to the relayhost on the relay
  port, authenticated as the node's relay user over opportunistic TLS, refuses messages over the size limit, and does
  not relay for other hosts.
peer:
  kind: ubuntu2
  why: the class relays every message to a relayhost, so a second machine must play it
outcomes:
  - outcome: postfix is installed, runs, starts at boot, and its configuration is the template rendered from Hiera and the lookup defaults
    from: manifests/postfix_smtp_node.pp:6-14, 24-49, 68-76; templates/postfix_smtp_node/main.cf
    checks: [effective-relay-config, postfix-config-sane, postfix-running-and-enabled, sasl-plain-module-installed]
  - outcome: a message sent on the node reaches the relayhost on the relay port, authenticated as the relay user over TLS
    from: manifests/postfix_smtp_node.pp:1-2, 6-7, 17-18, 51-66; templates/postfix_smtp_node/main.cf:44-53; templates/postfix_smtp_node/sasl_passwd:1
    checks: [sasl-map-compiled-for-the-relayhost, the-peer-plays-the-relayhost, a-message-from-the-node-goes-to-the-relayhost, the-relayhost-received-it-authenticated-over-tls]
  - outcome: a message over the size limit is refused
    from: manifests/postfix_smtp_node.pp:12-13; templates/postfix_smtp_node/main.cf:37
    checks: [a-message-over-the-size-limit-is-refused]
  - outcome: another host cannot relay through the node (only mynetworks and authenticated clients may)
    from: manifests/postfix_smtp_node.pp:9; templates/postfix_smtp_node/main.cf:31, 35
    checks: [another-host-cannot-relay-through-the-node]
  - outcome: root's mail alias, rendered from root_email_alias and compiled
    from: manifests/postfix_smtp_node.pp:14, 78-85; templates/postfix_smtp_node/aliases
    checks: [root-alias-rendered-from-default]
  - outcome: a non-default root alias, mynetworks, mydestination or size limit (per-node Hiera keys)
    from: manifests/postfix_smtp_node.pp:8-14; templates/postfix_smtp_node/aliases
    checks: [on-redhat-the-per-node-values-reach-postfix]
  - outcome: the RedHat branch (cyrus-sasl-plain, /etc/ssl/certs/ca-bundle.crt)
    from: manifests/postfix_smtp_node.pp:24-28
    checks: [on-redhat-sasl-plain-and-the-ca-bundle]
variants:
  - name: rhel
    why: >-
      the RedHat branch (cyrus-sasl-plain, /etc/ssl/certs/ca-bundle.crt), on the rhel9 node (the lab Hiera has its relay
      keys, and non-default per-node values for the root alias, mynetworks, mydestination and the size limit)
    node: rhel9
checks:
  - id: effective-relay-config
    what: postfix's effective configuration is the template rendered from Hiera and the lookup defaults
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "6-14", text: "default_value => '10240000' })"}
      - {path: templates/postfix_smtp_node/main.cf, lines: "11-12", text: "myhostname = <%= @hostname %>"}
      - {path: templates/postfix_smtp_node/main.cf, lines: "34-40", text: "mynetworks = <%= @mynetworks %>"}
      - {path: templates/postfix_smtp_node/main.cf, lines: "44-54", text: "relayhost = <%= @relayhost %>:<%= @relayport %>"}
      - {path: manifests/postfix_smtp_node.pp, lines: "29-32", text: "$smtp_tls_CAfile = '/etc/ssl/certs/ca-certificates.crt'"}
    probe: postconf -h myhostname myorigin mydestination relayhost mynetworks message_size_limit smtp_sasl_auth_enable smtp_sasl_password_maps smtp_tls_CAfile inet_protocols
    expect:
      rc: 0
      stdout: "\\Apuppet8node\\nmycompany\\.com\\npuppet8node, localhost\\.localdomain, , localhost\\nmailserver\\.mycompany\\.com:587\\n127\\.0\\.0\\.0/8\\n10240000\\nyes\\nhash:/etc/postfix/sasl_passwd\\n/etc/ssl/certs/ca-certificates\\.crt\\nipv4\\n\\Z"

  - id: postfix-config-sane
    what: postfix's own consistency check passes on the installed configuration (postfix check)
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "42-49", text: "content   => template('puppet_infrastructure/postfix_smtp_node/main.cf'),"}
    probe: postfix check 2>&1 && echo postfix-check-ok
    expect: {rc: 0, stdout: "^postfix-check-ok\\n\\Z"}

  - id: sasl-map-compiled-for-the-relayhost
    what: the SASL password map is compiled (postmap ran) with the relayhost's user, and the source file is 0640 root:root
    control: negative
    derived_from:
      - {path: templates/postfix_smtp_node/sasl_passwd, lines: "1", text: "<%= @relayhost %> <%= @relayuser %>:<%= @relaypass %>"}
      - {path: manifests/postfix_smtp_node.pp, lines: "51-66", text: "command     => 'postmap /etc/postfix/sasl_passwd',"}
    probe: |
      stat -c '%a %U %G' /etc/postfix/sasl_passwd
      postmap -q mailserver.mycompany.com hash:/etc/postfix/sasl_passwd | cut -d: -f1
    mismatch:
      varies: >-
        the looked-up relay host (relay.p8test.invalid): the map holds only the configured relayhost, so the lookup must
        return no user
      probe: |
        stat -c '%a %U %G' /etc/postfix/sasl_passwd
        postmap -q relay.p8test.invalid hash:/etc/postfix/sasl_passwd | cut -d: -f1
    expect: {rc: 0, stdout: "\\A640 root root\\np8test-relay\\n\\Z"}

  - id: postfix-running-and-enabled
    what: the postfix service runs and starts at boot
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "68-72", text: "ensure    => running,"}
    probe: |
      systemctl is-active postfix
      systemctl is-enabled postfix
    expect: {rc: 0, stdout: "\\Aactive\\nenabled\\n\\Z"}

  - id: sasl-plain-module-installed
    what: the Debian-family SASL module package (libsasl2-modules) is installed
    control: invariant
    why_invariant: >-
      libsasl2-modules is already installed on the clean Ubuntu 24.04 node (a dependency of the base system); the check
      guards that the class keeps it, it cannot discriminate before/after
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "29-40", text: "$cyrus_sasl_package = 'libsasl2-modules'"}
    probe: dpkg-query -W -f='${Status}\n' libsasl2-modules 2>&1
    expect: {rc: 0, stdout: "\\Ainstall ok installed\\n\\Z"}

  - id: root-alias-rendered-from-default
    what: "with root_email_alias at its default '' the aliases file gets the line 'root: ' (empty target) and is compiled"
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "14", text: "$root_email_alias = lookup({ name => \"${clientcert}::postfix_smtp_node::root_email_alias\", default_value => '' })"}
      - {path: templates/postfix_smtp_node/aliases, lines: "2-4", text: "root: <%=@root_email_alias%>"}
    probe: |
      grep -n '^root:' /etc/aliases
      test -f /etc/aliases.db && echo aliases-db-present
    expect: {rc: 0, stdout: "\\A[0-9]+:root: \\naliases-db-present\\n\\Z"}

  - id: the-peer-plays-the-relayhost
    what: >-
      setup for the relay checks, the peer runs a stand-in relayhost: postfix submission on 587 (STARTTLS on the
      snakeoil certificate, SASL from dovecot, relaying only for authenticated clients) with the relay account
      p8test-relay and a local mailbox p8testuser
    control: negative
    host: peer
    timeout: 600
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "6-7", text: "$relayport  = lookup('postfix_smtp_node::relayport')"}
      - {path: manifests/postfix_smtp_node.pp, lines: "17-18", text: "$relayuser  = lookup(\"${clientcert}::postfix_smtp_node::relayuser\")"}
    mutates: >-
      on the peer: installs postfix (local delivery for p8test-backend.invalid, every other destination bounced by
      default_transport error), dovecot-core and ssl-cert; creates the accounts p8testuser and p8test-relay (the
      latter with the lab Hiera fixture's fake relay password, marked not-a-secret); enables postfix submission (587,
      STARTTLS may) with SASL from dovecot's auth socket and relay for authenticated clients only; restarts postfix and
      dovecot
    probe: |
      export DEBIAN_FRONTEND=noninteractive
      debconf-set-selections <<'EOF'
      postfix postfix/main_mailer_type select Local only
      postfix postfix/mailname string p8test-backend.invalid
      EOF
      apt-get -qq -y install postfix dovecot-core ssl-cert >/dev/null 2>&1
      for u in p8testuser p8test-relay; do id "$u" >/dev/null 2>&1 || useradd -m -s /usr/sbin/nologin "$u"; done
      echo 'p8test-relay:p8test-not-a-secret' | chpasswd
      postconf -e 'inet_interfaces = all' 'default_transport = error:p8test relayhost relays nothing' \
        'smtpd_tls_cert_file = /etc/ssl/certs/ssl-cert-snakeoil.pem' 'smtpd_tls_key_file = /etc/ssl/private/ssl-cert-snakeoil.key'
      postconf -M 'submission/inet=submission inet n - y - - smtpd'
      postconf -P 'submission/inet/smtpd_tls_security_level=may' 'submission/inet/smtpd_sasl_auth_enable=yes' \
        'submission/inet/smtpd_sasl_type=dovecot' 'submission/inet/smtpd_sasl_path=private/auth' \
        'submission/inet/smtpd_recipient_restrictions=permit_sasl_authenticated,reject' \
        'submission/inet/smtpd_relay_restrictions=permit_sasl_authenticated,reject'
      cat > /etc/dovecot/conf.d/99-p8test.conf <<'EOF'
      disable_plaintext_auth = no
      service auth {
        unix_listener /var/spool/postfix/private/auth {
          mode = 0660
          user = postfix
          group = postfix
        }
      }
      EOF
      systemctl restart postfix dovecot
    effect: |
      p8_listening 587
      p8_service dovecot | cut -d' ' -f1
    expect: {rc: 0, stdout: "\\A0\\.0\\.0\\.0:587\\n(\\[::\\]:587\\n)?active\\n\\Z"}

  - id: a-message-from-the-node-goes-to-the-relayhost
    what: >-
      a message submitted on the node (sendmail) leaves the queue, delivered to the relayhost on port 587; the
      relayhost's name is pinned to the peer and a fence rejects mail ports to any other address
    control: negative
    timeout: 180
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "1-2", text: "# Parametrized class for postfix to allow email sending from any non specialized node, by mean of a relayhost."}
      - {path: templates/postfix_smtp_node/main.cf, lines: "53", text: "relayhost = <%= @relayhost %>:<%= @relayport %>"}
    mutates: >-
      on the node: appends "$P8_PEER_ADDR mailserver.mycompany.com" to /etc/hosts (the peer's host-only address, from
      the runner); inserts `-I OUTPUT -p tcp -m multiport --dports 25,465,587 ! -d $P8_PEER_ADDR -m comment --comment
      p8test-mail-fence -j REJECT` so no message can reach the real-world relayhost domain; saves /etc/resolv.conf to
      /run/p8test-mail/resolv.conf.orig and points it and postfix's chroot copy (/var/spool/postfix/etc/resolv.conf) at
      the systemd-resolved stub 127.0.0.53, which answers from /etc/hosts; waits up to 10 s for the stub to answer the
      pin; reloads postfix; notes the journal cursor in
      /run/p8test-mail/cursor; submits one message (token p8test-relay-token) from root to
      p8testuser@p8test-backend.invalid with sendmail and waits up to 60 s for the queue to empty
    probe: |
      grep -q ' mailserver\.mycompany\.com$' /etc/hosts || echo "$P8_PEER_ADDR mailserver.mycompany.com" >> /etc/hosts
      iptables -I OUTPUT -p tcp -m multiport --dports 25,465,587 ! -d "$P8_PEER_ADDR" -m comment --comment p8test-mail-fence -j REJECT
      install -d -m 0700 /run/p8test-mail
      cp /etc/resolv.conf /run/p8test-mail/resolv.conf.orig
      echo 'nameserver 127.0.0.53' > /etc/resolv.conf
      echo 'nameserver 127.0.0.53' > /var/spool/postfix/etc/resolv.conf
      for i in $(seq 10); do [ "$(dig +short @127.0.0.53 mailserver.mycompany.com A)" = "$P8_PEER_ADDR" ] && break; sleep 1; done
      postfix reload 2>/dev/null
      sleep 2
      journalctl -n 0 --show-cursor --no-pager -q | sed -n 's/^-- cursor: //p' > /run/p8test-mail/cursor
      printf 'Subject: p8test-relay-token\n\np8test relay check\n' | sendmail -f root p8testuser@p8test-backend.invalid
      for i in $(seq 60); do postqueue -p | grep -q '^Mail queue is empty' && break; sleep 1; done
    effect: |
      postqueue -p | head -1
      journalctl --after-cursor "$(cat /run/p8test-mail/cursor)" --no-pager -q -t postfix/smtp | p8_count 'relay=mailserver\.mycompany\.com\[[0-9.]+\]:587, .*status=sent'
    expect: {rc: 0, stdout: "\\AMail queue is empty\\n1\\n\\Z"}

  - id: the-relayhost-received-it-authenticated-over-tls
    what: >-
      on the peer, the message is in p8testuser's mailbox, received with ESMTPSA (STARTTLS and SASL authentication),
      and the submission service logged the node's login as p8test-relay
    control: negative
    host: peer
    derived_from:
      - {path: templates/postfix_smtp_node/main.cf, lines: "44-46", text: "smtp_sasl_auth_enable = yes"}
      - {path: templates/postfix_smtp_node/sasl_passwd, lines: "1", text: "<%= @relayhost %> <%= @relayuser %>:<%= @relaypass %>"}
    mutates: none beyond reading the mailbox and the journal (declared mutating so it runs after the node's message)
    probe: |
      true
    effect: |
      p8_count 'p8test-relay-token' /var/mail/p8testuser
      grep -B30 'Subject: p8test-relay-token' /var/mail/p8testuser | p8_count 'with ESMTPSA'
      journalctl --no-pager -q -t postfix/smtpd | p8_count 'sasl_method=PLAIN, sasl_username=p8test-relay$'
    expect: {rc: 0, stdout: "\\A1\\n1\\n1\\n\\Z"}

  - id: a-message-over-the-size-limit-is-refused
    what: on the node, sendmail refuses a message larger than message_size_limit (10240000 bytes, the lookup default)
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "12-13", text: "default_value => '10240000' })"}
      - {path: templates/postfix_smtp_node/main.cf, lines: "37", text: "message_size_limit = <%= @message_size_limit %>"}
    mutates: >-
      submits one message of about 10.5 MB from root to p8testuser@p8test-backend.invalid with sendmail (the fence
      from the relay check stays in place); writes its exit status to /run/p8test-mail/big.rc
    probe: |
      install -d -m 0700 /run/p8test-mail
      { printf 'Subject: p8test-big\n\n'; head -c 10500000 /dev/zero | tr '\0' 'a' | fold -w 76; } | sendmail -f root p8testuser@p8test-backend.invalid 2>/run/p8test-mail/big.err
      echo $? > /run/p8test-mail/big.rc
    effect: |
      [ "$(cat /run/p8test-mail/big.rc)" != 0 ] && echo refused
      p8_count 'too big' /run/p8test-mail/big.err
    expect: {rc: 0, stdout: "\\Arefused\\n1\\n\\Z"}

  - id: another-host-cannot-relay-through-the-node
    what: >-
      from the peer (outside mynetworks 127.0.0.0/8), the node's SMTP service on port 25 refuses a recipient in a
      foreign domain (relay access denied)
    control: negative
    host: peer
    derived_from:
      - {path: templates/postfix_smtp_node/main.cf, lines: "31", text: "smtpd_relay_restrictions = permit_mynetworks permit_sasl_authenticated defer_unauth_destination"}
      - {path: templates/postfix_smtp_node/main.cf, lines: "35", text: "mynetworks = <%= @mynetworks %>"}
    mutates: one SMTP session from the peer to the class node's port 25, ending before DATA (no message is accepted)
    probe: |
      true
    effect: |
      python3 - <<'EOF'
      import smtplib
      try:
          s = smtplib.SMTP("192.168.56.20", 25, timeout=15)
          s.ehlo("p8test-peer.invalid")
          s.mail("p8test@p8test-peer.invalid")
          code, msg = s.rcpt("p8test@example.org")
          print(code, "Relay access denied" if b"Relay access denied" in msg else msg.decode())
          s.quit()
      except OSError as e:
          print("no session", e.__class__.__name__)
      EOF
    expect: {rc: 0, stdout: "\\A454 Relay access denied\\n\\Z"}

  - id: on-redhat-sasl-plain-and-the-ca-bundle
    variant: rhel
    what: on RedHat cyrus-sasl-plain is installed, postfix trusts /etc/ssl/certs/ca-bundle.crt for the relay, and postfix runs
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "24-28", text: "$smtp_tls_CAfile = '/etc/ssl/certs/ca-bundle.crt'"}
      - {path: manifests/postfix_smtp_node.pp, lines: "24-28", text: "$cyrus_sasl_package = 'cyrus-sasl-plain'"}
    probe: |
      rpm -q --qf '%{NAME}\n' cyrus-sasl-plain
      postconf -h smtp_tls_CAfile
      systemctl is-active postfix
    expect: {rc: 0, stdout: "\\Acyrus-sasl-plain\\n/etc/ssl/certs/ca-bundle\\.crt\\nactive\\n\\Z"}

  - id: on-redhat-the-per-node-values-reach-postfix
    variant: rhel
    what: >-
      the node's own Hiera values (p8lab-rhel9::postfix_smtp_node::*, lab fixture) override the defaults: mynetworks
      127.0.0.0/8 192.0.2.0/24, mydestination p8test-dest.invalid, localhost (the template appends its own
      localhost.localdomain, , localhost), size limit 20480000, and root's alias
      p8test-admin@p8test.invalid in /etc/aliases
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_node.pp, lines: "9", text: "$mynetworks = lookup({ name => \"${clientcert}::postfix_smtp_node::mynetworks\", default_value => '127.0.0.0/8' })"}
      - {path: manifests/postfix_smtp_node.pp, lines: "10-13", text: "\"${clientcert}::postfix_smtp_node::message_size_limit\""}
      - {path: manifests/postfix_smtp_node.pp, lines: "14", text: "$root_email_alias = lookup({ name => \"${clientcert}::postfix_smtp_node::root_email_alias\", default_value => '' })"}
      - {path: templates/postfix_smtp_node/aliases, lines: "2-4", text: "root: <%=@root_email_alias%>"}
      - {path: templates/postfix_smtp_node/main.cf, lines: "34", text: "mydestination = <%= @mydestination %>, localhost.localdomain, , localhost"}
    probe: |
      postconf -h mynetworks mydestination message_size_limit
      grep '^root:' /etc/aliases
    expect: {rc: 0, stdout: "\\A127\\.0\\.0\\.0/8 192\\.0\\.2\\.0/24\\np8test-dest\\.invalid, localhost, localhost\\.localdomain, , localhost\\n20480000\\nroot: p8test-admin@p8test\\.invalid\\n\\Z"}
