# Phase 3 checks for puppet_infrastructure::nginx_frontend_mail (class; node ubuntu; required_base nginx_base with the
# per-target fixture my_configs {mail, stream, package_name nginx-core, nginx_version 1.24.0}). Fixture (params, never
# committed): domain p8test.example.com, frontend_sslprefix p8test, letsencrypt_certificate true, mail_backend = the
# peer's host-only address. Purpose (the class header): a mail reverse proxy, IMAPS 993, SMTPS 465 and SMTP 25, each
# authenticated by a local auth_http server that points nginx at a local stream which carries the session to the mail
# backend; plus the backend's web interface on 443 through nginx_frontend_domain.
# The peer (ubuntu2) plays the mail backend: postfix (SMTP 25; SMTPS 465 with SASL from dovecot), dovecot IMAPS 993 and
# a TLS web page on 443. Its account p8testuser has the fake password p8test-mail-not-a-secret. Relayed mail never
# leaves it (default_transport error). Node probes name no lab host: the backend reaches the node only through the
# rendered nginx configuration. Mutating checks run after the read-only ones, in file order: the peer is set up first,
# then the node's sessions go through the proxy, then the peer is asked what arrived.
class: nginx_frontend_mail
baseline: release-0.9.10 (cf477c6)
fixture: params
peer:
  kind: ubuntu2
  why: the class proxies mail and web sessions to a backend server, so a second machine must serve SMTP, IMAPS and HTTPS
checks:
  - id: nginx-config-valid-and-running
    what: the configuration the class produces passes `nginx -t` and nginx runs
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "54", text: "nginx::resource::mailhost { \"imaps_${domain}\":"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "96", text: "nginx::resource::streamhost { 'imap_auth_stream':"}
    probe: |
      nginx -t 2>&1 | grep -c 'test is successful'
      systemctl is-active nginx
    expect: {rc: 0, stdout: "\\A1\\nactive\\n\\Z"}

  - id: mail-ports-listen
    what: nginx listens for IMAPS 993, SMTPS 465 and SMTP 25 (the class's default ports)
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "21-23", text: "Integer $imaps_port = 993,"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "57", text: "listen_port              => $imaps_port,"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "70", text: "listen_port              => $smtps_port,"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "87", text: "listen_port              => $smtp_port,"}
    probe: |
      for p in 993 465 25; do ss -ltnpH "sport = :$p" | grep -c '"nginx"'; done
    expect: {rc: 0, stdout: "\\A1\\n1\\n1\\n\\Z"}

  - id: auth-servers-point-each-protocol-at-its-stream
    what: >-
      the three auth_http servers answer OK and send IMAPS to stream 9993, SMTPS to 9465 and SMTP to 9925 on 127.0.0.1
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "126-136", text: "'  add_header Auth-Port   9993;',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "138-148", text: "'  add_header Auth-Port   9465;',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "150-160", text: "'  add_header Auth-Port   9925;',"}
    probe: |
      for p in 4242 4243 4244; do
        curl -s -o /dev/null -D - "http://127.0.0.1:$p/auth" | tr -d '\r' | grep -E '^(HTTP/|Auth-Status|Auth-Server|Auth-Port)' | sed 's/ \+/ /g' | tr '\n' ' '; echo
      done
    expect: {rc: 0, stdout: "\\AHTTP/1\\.1 204 No Content Auth-Status: OK Auth-Server: 127\\.0\\.0\\.1 Auth-Port: 9993 \\nHTTP/1\\.1 204 No Content Auth-Status: OK Auth-Server: 127\\.0\\.0\\.1 Auth-Port: 9465 \\nHTTP/1\\.1 204 No Content Auth-Status: OK Auth-Server: 127\\.0\\.0\\.1 Auth-Port: 9925 \\n\\Z"}

  - id: streams-listen-and-stream-access-log-off
    what: >-
      the three backend streams listen on 9993, 9465 and 9925, and the stream block logs nothing (access_log off,
      HQ 2026-11-18 ruling A1: the rendering production's module produced)
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "99", text: "listen_port => 9993,"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "109", text: "listen_port => 9465,"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "119", text: "listen_port => 9925,"}
    probe: |
      for p in 9993 9465 9925; do ss -ltnpH "sport = :$p" | grep -c '"nginx"'; done
      sed -n '/^stream {/,/^}/p' /etc/nginx/nginx.conf | grep -E '^\s*access_log' | sed 's/^ *//'
    expect: {rc: 0, stdout: "\\A1\\n1\\n1\\naccess_log off;\\n\\Z"}

  - id: smtps-and-imaps-serve-the-frontend-certificate
    what: 465 and 993 complete a TLS handshake with the frontend certificate the class names (letsencrypt bundle path)
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "31-33", text: "$ssl_cert_path = \"/etc/ssl/certs/${frontend_sslprefix}.nginx.bundle.pem\""}
      - {path: manifests/nginx_frontend_mail.pp, lines: "61-64", text: "ssl_cert                 => $ssl_cert_path,"}
    probe: |
      want=$(openssl x509 -in /etc/ssl/certs/p8test.nginx.bundle.pem -noout -fingerprint -sha256)
      for p in 465 993; do
        got=$(openssl s_client -connect 127.0.0.1:$p </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
        [ -n "$want" ] && [ "$got" = "$want" ] && echo "$p same" || echo "$p differs"
      done
    mismatch:
      varies: the expected certificate (the first CA of the system bundle instead of the class's), so no port may match
      probe: |
        want=$(openssl x509 -in /etc/ssl/certs/ca-certificates.crt -noout -fingerprint -sha256)
        for p in 465 993; do
          got=$(openssl s_client -connect 127.0.0.1:$p </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
          [ -n "$want" ] && [ "$got" = "$want" ] && echo "$p same" || echo "$p differs"
        done
    expect: {rc: 0, stdout: "\\A465 same\\n993 same\\n\\Z"}

  - id: the-peer-serves-the-mail-backend
    what: the peer runs the mail backend (setup for the end-to-end checks)
    control: negative
    host: peer
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "15", text: "String $mail_backend,"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "98", text: "proxy       => \"${mail_backend}:${imaps_port}\","}
    mutates: >-
      on the peer: installs postfix (local delivery, every relayed message bounced locally by default_transport error),
      dovecot-imapd (IMAPS 993 on the snakeoil certificate, mbox in /var/mail) and nginx-light (a TLS page on 443);
      creates the account p8testuser with the fake password p8test-mail-not-a-secret; enables postfix submissions (465,
      TLS wrapper) with SASL from dovecot's auth socket; restarts the three services
    probe: |
      export DEBIAN_FRONTEND=noninteractive
      debconf-set-selections <<'EOF'
      postfix postfix/main_mailer_type select Local only
      postfix postfix/mailname string p8test-backend.invalid
      EOF
      apt-get -qq -y install postfix dovecot-imapd nginx-light ssl-cert >/dev/null 2>&1
      id p8testuser >/dev/null 2>&1 || useradd -m -s /usr/sbin/nologin p8testuser
      echo 'p8testuser:p8test-mail-not-a-secret' | chpasswd
      postconf -e 'inet_interfaces = all' 'default_transport = error:p8test backend relays nothing' \
        'smtpd_tls_cert_file = /etc/ssl/certs/ssl-cert-snakeoil.pem' 'smtpd_tls_key_file = /etc/ssl/private/ssl-cert-snakeoil.key'
      postconf -M 'submissions/inet=submissions inet n - y - - smtpd'
      postconf -P 'submissions/inet/smtpd_tls_wrappermode=yes' 'submissions/inet/smtpd_sasl_auth_enable=yes' \
        'submissions/inet/smtpd_sasl_type=dovecot' 'submissions/inet/smtpd_sasl_path=private/auth' \
        'submissions/inet/smtpd_recipient_restrictions=permit_sasl_authenticated,reject' \
        'submissions/inet/smtpd_relay_restrictions=permit_sasl_authenticated,reject'
      cat > /etc/dovecot/conf.d/99-p8test.conf <<'EOF'
      disable_plaintext_auth = no
      service auth {
        unix_listener /var/spool/postfix/private/auth {
          mode = 0660
          user = postfix
          group = postfix
        }
      }
      EOF
      cat > /etc/nginx/sites-enabled/p8test-backend <<'EOF'
      server {
        listen 443 ssl;
        ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
        ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
        location / { return 200 "p8test-webmail-backend\n"; }
      }
      EOF
      systemctl restart postfix dovecot nginx
    effect: |
      for p in 25 465 993 443; do ss -ltnH "sport = :$p" | wc -l; done
    expect: {rc: 0, stdout: "\\A[1-9]\\n[1-9]\\n[1-9]\\n[1-9]\\n\\Z"}

  - id: smtp-25-delivers-through-the-proxy
    what: >-
      a message sent to the node's port 25 without authentication (smtp_auth none, proxy_smtp_auth off) reaches the
      backend, which queues it for a local mailbox
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "83-94", text: "smtp_auth                => 'none',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "116-124", text: "proxy       => \"${mail_backend}:${smtp_port}\","}
      - {path: manifests/nginx_frontend_mail.pp, lines: "150-160", text: "'  add_header Auth-Port   9925;',"}
    mutates: sends one message (token p8test-smtp-25-token) to p8testuser@localhost through 127.0.0.1:25; writes the SMTP replies to /run/p8test-mail/smtp25.txt
    probe: |
      mkdir -p /run/p8test-mail
      python3 - > /run/p8test-mail/smtp25.txt 2>&1 <<'EOF'
      import smtplib
      s = smtplib.SMTP("127.0.0.1", 25, timeout=30)
      s.ehlo("p8test-client")
      print("MAIL", s.mail("p8test@client.invalid")[0])
      print("RCPT", s.rcpt("p8testuser@localhost")[0])
      code, msg = s.data(b"Subject: p8test\r\n\r\np8test-smtp-25-token\r\n")
      print("DATA", code, msg.decode())
      s.quit()
      EOF
    effect: |
      cat /run/p8test-mail/smtp25.txt
    expect: {rc: 0, stdout: "\\AMAIL 250\\nRCPT 250\\nDATA 250 2\\.0\\.0 Ok: queued as \\w+\\n\\Z"}

  # 2026-11-18 authoring correction (run 1, 20261118T073212Z): the check sent to p8test@relay.invalid, which the
  # backend's own `default_transport = error:` refused at RCPT (550 "relays nothing") although nginx had passed the
  # login on (the peer logged auth=1). The backend's submissions service now accepts any recipient only from an
  # authenticated sender (permit_sasl_authenticated, reject), and the message goes to the local mailbox. The behaviour
  # is unchanged.
  - id: smtps-465-relays-the-client-login-to-the-backend
    what: >-
      over SMTPS (smtp_auth login plain) the client's login is passed on to the backend (proxy_smtp_auth on), so the
      backend, which accepts a recipient on 465 only from an authenticated sender, queues the message
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "67-81", text: "'proxy_smtp_auth          on;',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "73", text: "smtp_auth                => 'login plain',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "106-114", text: "proxy       => \"${mail_backend}:${smtps_port}\","}
    mutates: >-
      logs in as p8testuser over 127.0.0.1:465 and sends one message (token p8test-smtps-465-token) to
      p8testuser@localhost; writes the SMTP replies to /run/p8test-mail/smtps465.txt
    probe: |
      mkdir -p /run/p8test-mail
      python3 - > /run/p8test-mail/smtps465.txt 2>&1 <<'EOF'
      import smtplib, ssl
      ctx = ssl._create_unverified_context()
      s = smtplib.SMTP_SSL("127.0.0.1", 465, timeout=30, context=ctx)
      s.ehlo("p8test-client")
      print("AUTH", s.login("p8testuser", "p8test-mail-not-a-secret")[0])
      print("MAIL", s.mail("p8testuser@localhost")[0])
      print("RCPT", s.rcpt("p8testuser@localhost")[0])
      code, msg = s.data(b"Subject: p8test\r\n\r\np8test-smtps-465-token\r\n")
      print("DATA", code, msg.decode())
      s.quit()
      EOF
    effect: |
      cat /run/p8test-mail/smtps465.txt
    expect: {rc: 0, stdout: "\\AAUTH 235\\nMAIL 250\\nRCPT 250\\nDATA 250 2\\.0\\.0 Ok: queued as \\w+\\n\\Z"}

  - id: imaps-993-logs-in-at-the-backend-and-sees-the-mail
    what: >-
      over IMAPS the client's login reaches the backend's IMAP server, and the mailbox holds the message sent through
      port 25
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "54-65", text: "imap_auth                => 'login plain',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "96-104", text: "'proxy_ssl        on;',"}
    mutates: logs in as p8testuser over 127.0.0.1:993 and searches INBOX for the port-25 token; writes the replies to /run/p8test-mail/imaps993.txt
    probe: |
      mkdir -p /run/p8test-mail
      sleep 5
      python3 - > /run/p8test-mail/imaps993.txt 2>&1 <<'EOF'
      import imaplib, ssl
      m = imaplib.IMAP4_SSL("127.0.0.1", 993, ssl_context=ssl._create_unverified_context(), timeout=30)
      print("LOGIN", m.login("p8testuser", "p8test-mail-not-a-secret")[0])
      m.select("INBOX", readonly=True)
      typ, data = m.search(None, "BODY", "p8test-smtp-25-token")
      print("FOUND", len(data[0].split()))
      m.logout()
      EOF
    effect: |
      cat /run/p8test-mail/imaps993.txt
    expect: {rc: 0, stdout: "\\ALOGIN OK\\nFOUND 1\\n\\Z"}

  # 2026-11-18 authoring correction (run 1): nginx does not relay the backend's 535; it closes the session after the
  # backend refuses the login (the peer logged "SASL PLAIN authentication failed"). The probe records any refusal,
  # and the peer check below proves the refusal was the backend's.
  - id: smtps-465-wrong-password-is-refused-by-the-backend
    what: >-
      over SMTPS a wrong password is refused, because nginx passes the login on and the backend refuses it (the
      discrimination control of the SMTPS relay check: auth_http itself accepts every login)
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "67-81", text: "'proxy_smtp_auth          on;',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "138-148", text: "'  add_header Auth-Status OK;',"}
    mutates: attempts one login as p8testuser with a wrong password over 127.0.0.1:465; writes the outcome to /run/p8test-mail/smtps465-wrong.txt
    probe: |
      mkdir -p /run/p8test-mail
      python3 - > /run/p8test-mail/smtps465-wrong.txt 2>&1 <<'EOF'
      import smtplib, ssl
      s = smtplib.SMTP_SSL("127.0.0.1", 465, timeout=30, context=ssl._create_unverified_context())
      s.ehlo("p8test-client")
      try:
          print("AUTH", s.login("p8testuser", "p8test-wrong-password")[0])
      except (smtplib.SMTPAuthenticationError, smtplib.SMTPServerDisconnected) as e:
          print("REFUSED", type(e).__name__)
      EOF
    effect: |
      cat /run/p8test-mail/smtps465-wrong.txt
    expect: {rc: 0, stdout: "\\AREFUSED SMTP(AuthenticationError|ServerDisconnected)\\n\\Z"}

  - id: imaps-993-wrong-password-is-refused-by-the-backend
    what: >-
      over IMAPS a wrong password is refused by the backend's IMAP server (the discrimination control of the IMAPS
      check: auth_http itself accepts every login)
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "54-65", text: "imap_auth                => 'login plain',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "126-136", text: "'  add_header Auth-Status OK;',"}
    mutates: attempts one login as p8testuser with a wrong password over 127.0.0.1:993; writes the outcome to /run/p8test-mail/imaps993-wrong.txt
    probe: |
      mkdir -p /run/p8test-mail
      python3 - > /run/p8test-mail/imaps993-wrong.txt 2>&1 <<'EOF'
      import imaplib, ssl
      m = imaplib.IMAP4_SSL("127.0.0.1", 993, ssl_context=ssl._create_unverified_context(), timeout=30)
      try:
          print("LOGIN", m.login("p8testuser", "p8test-wrong-password")[0])
      except imaplib.IMAP4.error:
          print("REFUSED")
      EOF
    effect: |
      cat /run/p8test-mail/imaps993-wrong.txt
    expect: {rc: 0, stdout: "\\AREFUSED\\n\\Z"}

  - id: https-443-proxies-to-the-backend-web-interface
    what: the domain's HTTPS server passes requests to the backend's web interface (nginx_frontend_domain, backend https)
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "45-52", text: "backend_hosts_and_ports => [\"${mail_backend}:${https_port}\", ],"}
    mutates: requests https://p8test.example.com/ from 127.0.0.1:443; writes the body to /run/p8test-mail/https443.txt
    probe: |
      mkdir -p /run/p8test-mail
      curl -sk --resolve p8test.example.com:443:127.0.0.1 https://p8test.example.com/ > /run/p8test-mail/https443.txt 2>&1
    effect: |
      cat /run/p8test-mail/https443.txt
    expect: {rc: 0, stdout: "\\Ap8test-webmail-backend\\n\\Z"}

  # 2026-11-18 authoring correction (run 1): the SMTPS session logs as postfix/smtpd (not submissions/smtpd), and its
  # client= line with the SASL user appears only for a queued message; the evidence now reads both tokens in the
  # mailbox, the queued SMTPS message's SASL user, and the backend's own refusals of the wrong passwords.
  - id: the-backend-received-the-sessions-from-the-proxy
    what: >-
      on the backend: both messages sit in p8testuser's mailbox; the SMTPS one was queued for the SASL user
      p8testuser; the wrong passwords were refused by the backend itself (postfix SASL, dovecot), all from the node
    control: negative
    host: peer
    derived_from:
      - {path: manifests/nginx_frontend_mail.pp, lines: "116-124", text: "proxy       => \"${mail_backend}:${smtp_port}\","}
      - {path: manifests/nginx_frontend_mail.pp, lines: "67-81", text: "'proxy_smtp_auth          on;',"}
      - {path: manifests/nginx_frontend_mail.pp, lines: "54-65", text: "imap_auth                => 'login plain',"}
    mutates: none beyond reading the backend's mailbox and log (declared mutating so it runs after the node's sessions)
    probe: |
      true
    effect: |
      grep -c -e 'p8test-smtp-25-token' -e 'p8test-smtps-465-token' /var/mail/p8testuser
      journalctl --no-pager -q -b | grep -c 'client=unknown\[192\.168\.56\.20\], sasl_method=[A-Z]*, sasl_username=p8testuser$'
      journalctl --no-pager -q -b | grep -c 'unknown\[192\.168\.56\.20\]: SASL [A-Z]* authentication failed: .*sasl_username=p8testuser'
      journalctl --no-pager -q -b | grep -c 'imap-login: .*auth failed.*user=.p8testuser..*rip=192\.168\.56\.20'
    expect: {rc: 0, stdout: "\\A2\\n1\\n[1-9]\\d*\\n[1-9]\\d*\\n\\Z"}
