# Phase 3 checks for puppet_infrastructure::docker_container (define; node ubuntu; required_external docker, the
# puppetlabs-docker module's class). Fixture (params, never committed): title docker_container (the plan's), image
# nginx, tag alpine, app_port 80, host_port 18080; no registry login, digest, volumes, env or command; network bridge.
# The container is named after the title, and puppetlabs-docker 10.4.1 runs it as systemd unit docker-<title>. Probes
# read the node's own docker and loopback.
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1): environment, a named volume, a command and another network
# (production uses them) are checks in the variant runs `runopts` and `nonet`; digest is an accepted gap; the registry
# login and the image-change recreation name what is missing.
class: docker_container
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Runs one container from an image (pulled at a tag or digest, optionally from a registry with credentials) under
  systemd, with its app port published on 127.0.0.1 only, and recreates it when the image changes.
outcomes:
  - outcome: the image is pulled at the given tag
    from: manifests/docker_container.pp:41-47
    checks: [the-container-runs-the-image-under-systemd]
  - outcome: the container runs from that image as a systemd service named after the title
    from: manifests/docker_container.pp:49-50, 82-93
    checks: [the-container-runs-the-image-under-systemd]
  - outcome: the app port is published on 127.0.0.1 at the host port, and on no other address
    from: manifests/docker_container.pp:20-24, 52-57, 86
    checks: [the-app-answers-on-loopback-only]
  - outcome: a container that dies is started again by its service
    from: manifests/docker_container.pp:82-93
    checks: [the-container-is-killed, the-service-starts-it-again]
  - outcome: the container is recreated when its image changes (subscribe to the image)
    from: manifests/docker_container.pp:92
    uncovered:
      why: >-
        needs a second image version behind the same tag between two agent runs, which needs a registry the lab
        controls (the lab pulls from Docker Hub)
      lifted_by: "capability: a container registry in the lab"
      evidence: >-
        nodes.yml (2026-11-23): no node kind runs a registry, and no class of the repository installs one
  - outcome: environment, a named volume, a command and another network reach the container
    from: manifests/docker_container.pp:7-14, 26-40, 59-80
    checks: [environment-volume-and-command-reach-the-container, another-network-is-used]
  - outcome: a registry login (username and token)
    from: manifests/docker_container.pp:7-14, 26-40, 59-80
    uncovered:
      why: a login needs a private registry with credentials; production sets them (5 node statements)
      lifted_by: "capability: a private container registry in the lab"
      evidence: >-
        nodes.yml (2026-11-23): no node kind runs a registry; diagnosis/fleet_variant_usage.md: username and token set on
        5 production node statements
  - outcome: an image pinned by digest
    from: manifests/docker_container.pp:7-14, 26-40, 59-80
    uncovered:
      why: a parameter variant no production node uses
      accepted_gap: [digest]
      evidence: >-
        diagnosis/fleet_variant_usage.md (2026-11-23): no production node statement sets digest, and no class of the
        repository sets it on docker_container
variants:
  - name: runopts
    why: environment, a named volume and a command, which production sets (7, 5 and 1 node statements)
    params: runopts
  - name: nonet
    why: another network (none here), which production sets (2 node statements), without published ports
    params: nonet
checks:
  - id: the-container-runs-the-image-under-systemd
    what: the image nginx:alpine is present, the unit docker-docker_container is active, and the running container docker_container uses that image
    control: negative
    derived_from:
      - {path: manifests/docker_container.pp, lines: "42-46", text: "image_tag => $tag,"}
      - {path: manifests/docker_container.pp, lines: "82-84", text: "docker::run { $container_name:"}
    probe: |
      docker image inspect nginx:alpine --format '{{index .RepoTags 0}}' 2>/dev/null
      systemctl is-active docker-docker_container
      docker ps --filter name='^docker_container$' --format '{{.Names}} {{.Image}}'
    expect: {rc: 0, stdout: "\\Anginx:alpine\\nactive\\ndocker_container nginx:alpine\\n\\Z"}

  # 2026-11-18 authoring correction (run 1, 20261118T221532Z): nginx's welcome page names nginx in its title and its
  # heading, so the count was 2; the heading alone is counted now (here and in the restart check).
  - id: the-app-answers-on-loopback-only
    what: port 18080 is published on 127.0.0.1 only, and the container's nginx answers there
    control: negative
    derived_from:
      - {path: manifests/docker_container.pp, lines: "52-54", text: "$myapp_port = [\"127.0.0.1:${myhost_port}:${app_port}\"]"}
    probe: |
      docker port docker_container 80/tcp
      ss -ltnH 'sport = :18080' | awk '{print $4}' | sort -u
      curl -s --max-time 5 http://127.0.0.1:18080/ | grep -c '<h1>Welcome to nginx'
    mismatch:
      varies: the address asked (the node's host-only address instead of 127.0.0.1), where nothing may listen
      probe: |
        docker port docker_container 80/tcp
        ss -ltnH 'sport = :18080' | awk '{print $4}' | sort -u
        curl -s --max-time 5 "http://$(ip -4 -o addr show enp0s8 | awk '{print $4}' | cut -d/ -f1):18080/" | grep -c '<h1>Welcome to nginx'
    expect: {rc: 0, stdout: "\\A127\\.0\\.0\\.1:18080\\n127\\.0\\.0\\.1:18080\\n1\\n\\Z"}

  - id: the-container-is-killed
    what: setup for the next check, the container killed by hand (as a crash would end it), with its start time noted
    control: negative
    derived_from:
      - {path: manifests/docker_container.pp, lines: "82-93", text: "remove_container_on_stop          => false,"}
    mutates: notes the container's start time in /run/p8test-docker/before, then kills the container docker_container on the node
    probe: |
      install -d -m 0700 /run/p8test-docker
      docker inspect -f '{{.State.StartedAt}}' docker_container > /run/p8test-docker/before
      docker kill docker_container >/dev/null
    effect: |
      test -s /run/p8test-docker/before && echo noted
    expect: {rc: 0, stdout: "\\Anoted\\n\\Z"}

  - id: the-service-starts-it-again
    what: within 60 s the service has started the container again (a new start time) and the app answers
    control: negative
    timeout: 120
    derived_from:
      - {path: manifests/docker_container.pp, lines: "82-93", text: "restart_service_on_docker_refresh => true,"}
    mutates: none beyond waiting up to 60 s and reading the container's state (declared mutating so it runs after the kill)
    probe: |
      true
    effect: |
      before=$(cat /run/p8test-docker/before)
      for i in $(seq 30); do
        now=$(docker inspect -f '{{.State.Running}} {{.State.StartedAt}}' docker_container 2>/dev/null)
        [ "${now%% *}" = true ] && [ "${now#* }" != "$before" ] && break; sleep 2
      done
      [ "${now%% *}" = true ] && [ "${now#* }" != "$before" ] && echo started-again
      curl -s --max-time 5 http://127.0.0.1:18080/ | grep -c '<h1>Welcome to nginx'
    expect: {rc: 0, stdout: "\\Astarted-again\\n1\\n\\Z"}

  - id: environment-volume-and-command-reach-the-container
    variant: runopts
    what: >-
      the running container has the environment variable P8TEST_ENV=on, the named volume p8test-vol mounted at
      /p8test-data, and the given command
    control: negative
    derived_from:
      - {path: manifests/docker_container.pp, lines: "82-93", text: "env                               => $env,"}
      - {path: manifests/docker_container.pp, lines: "59-79", text: "command => \"/usr/bin/docker volume create ${vol}\","}
    probe: |
      docker inspect -f '{{.State.Running}}' docker_container
      docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' docker_container | grep -x 'P8TEST_ENV=on'
      docker inspect -f '{{range .Mounts}}{{.Name}} {{.Destination}}{{println}}{{end}}' docker_container | grep -x 'p8test-vol /p8test-data'
      docker inspect -f '{{json .Config.Cmd}}' docker_container | grep -c 'daemon off;'
    expect: {rc: 0, stdout: "\\Atrue\\nP8TEST_ENV=on\\np8test-vol /p8test-data\\n1\\n\\Z"}

  - id: another-network-is-used
    variant: nonet
    what: with network none the container runs in that network mode, with no published port
    control: negative
    derived_from:
      - {path: manifests/docker_container.pp, lines: "82-93", text: "net                               => $network,"}
    probe: |
      docker inspect -f '{{.State.Running}} {{.HostConfig.NetworkMode}}' docker_container
      docker port docker_container | wc -l
    expect: {rc: 0, stdout: "\\Atrue none\\n0\\n\\Z"}
