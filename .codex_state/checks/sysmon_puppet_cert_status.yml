# Phase 3 checks for puppet_infrastructure::sysmon_puppet_cert_status (class; node ubuntu; required_base filesystem_base;
# required_external apt, sudo; no parameters, fixture defaults). It installs a Nagios check, meant for the Puppet
# master, that runs `puppet certregen healthcheck --all` and reports the earliest certificate expiry (OK above 30 days,
# Warning under 30, Critical under 10 or when one has expired), plus python3-yaml and a sudo rule for naemon.
# 2026-11-21 (backfill batch 10): first set, with purpose and outcomes (HQ rulings 2 and C1). Measured before writing the
# health check: `puppet certregen` is an unknown subcommand on the OpenVox 8 agent node (puppet 8.24.2) and on the lab's
# master-role node p8lab-puppetserver (openvox-server, puppet 8.24.2, no certregen module), so the check prints
# "command ... failed" with exit 1 wherever it runs; escalations/sysmon_puppet_cert_status.behaviour.md.
# 2026-11-22 (HQ after batch 20, item 3): the checks now use fixture certificates in the CA's signed directory
# (/etc/puppetlabs/puppetserver/ca/signed, as on the OpenVox master): a 400-day one, then one expiring in 20 days,
# then 5 days, then one that expired on 2025-01-02 (made with `openssl ca` and explicit dates). Before evidence on the
# baseline script (certregen); after evidence on local change #19 (the expiry read from the certificates).
class: sysmon_puppet_cert_status
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Gives the monitoring system (naemon, through sudo) a Nagios check on the Puppet master that reports the certificate
  expiry of every node the CA signed: Critical when one has expired or expires within 10 days, Warning within 30, OK
  otherwise, naming the certificate that expires first.
outcomes:
  - outcome: the check script (the module's file, root 0755) and its dependency python3-yaml are installed
    from: manifests/sysmon_puppet_cert_status.pp:3-19
    checks: [script-and-dependency-installed]
  - outcome: naemon may run the check as root through sudo, and the check refuses to run unprivileged
    from: manifests/sysmon_puppet_cert_status.pp:21-24; files/sysmon/check_puppet_cert_health.py:12-21
    checks: [naemon-may-run-it-through-sudo, refuses-to-run-unprivileged]
  - outcome: >-
      run as root on the master, the check reads every signed certificate's expiry and reports OK when the earliest is
      30 days or more away, Warning under 30 days and Critical under 10 days (naming that certificate), and Critical
      when a certificate has expired
    from: files/sysmon/check_puppet_cert_health.py:9-48
    checks: [a-fixture-ca-with-a-long-lived-certificate, ok-when-every-certificate-is-far-from-expiry, warns-under-30-days, critical-under-10-days, critical-when-a-certificate-has-expired]
checks:
  - id: script-and-dependency-installed
    what: the check script is the module's file (local change #19, 2026-11-22: the expiry read from the certificates), root:root 0755, and python3-yaml is installed
    control: negative
    derived_from:
      - {path: manifests/sysmon_puppet_cert_status.pp, lines: "12-19", text: "source  => 'puppet:///modules/puppet_infrastructure/sysmon/check_puppet_cert_health.py',"}
      - {path: manifests/sysmon_puppet_cert_status.pp, lines: "3-4", text: "$check_puppet_cert_health_deps = [ 'python3-yaml' ]"}
      - {path: files/sysmon/check_puppet_cert_health.py, sha256: "dcc07a961db070d9dc54691ef52929f3c85312ddf91dcfbc9f9b3c28c0b28282"}
    probe: |
      p8_digest /opt/puppet-infrastructure/bin/check_puppet_cert_health.py | cut -d' ' -f2-
      dpkg-query -W -f '${Package} ${Status}\n' python3-yaml
    expect: {rc: 0, stdout: "\\Aroot:root 755 cf56fd4bf16a6032c56d50389a3e427e2fe04df427217f7255e7d8f8f11f2b3a\\npython3-yaml install ok installed\\n\\Z"}

  - id: naemon-may-run-it-through-sudo
    what: a sudoers drop-in (priority 20) lets naemon run exactly this script without a password, and sudoers stays valid
    control: negative
    derived_from:
      - {path: manifests/sysmon_puppet_cert_status.pp, lines: "21-24", text: "content  => \"naemon ALL=NOPASSWD:${localdir}/bin/check_puppet_cert_health.py\","}
    probe: |
      grep -h '^naemon ' /etc/sudoers.d/20_check_puppet_cert_health
      visudo -c -q && echo sudoers-valid
    expect: {rc: 0, stdout: "\\Anaemon ALL=NOPASSWD:/opt/puppet-infrastructure/bin/check_puppet_cert_health\\.py\\nsudoers-valid\\n\\Z"}

  - id: refuses-to-run-unprivileged
    what: run as an unprivileged account (nobody), the check prints "please run as root" and exits 1
    control: negative
    derived_from:
      - {path: files/sysmon/check_puppet_cert_health.py, lines: "12-21", text: "print(\"please run as root\")"}
    probe: |
      out=$(cd /tmp && runuser -u nobody -- /opt/puppet-infrastructure/bin/check_puppet_cert_health.py 2>&1); echo "$out rc=$?"
    mismatch:
      varies: the account (root), for which the privilege test passes, so the "please run as root" verdict must not come
      probe: |
        out=$(cd /tmp && /opt/puppet-infrastructure/bin/check_puppet_cert_health.py 2>&1); echo "$out rc=$?"
    expect: {rc: 0, stdout: "\\Aplease run as root rc=1\\n\\Z"}

  - id: a-fixture-ca-with-a-long-lived-certificate
    what: setup, the CA's signed directory with one fixture certificate (p8test-long) valid for 400 days
    control: negative
    derived_from:
      - {path: files/sysmon/check_puppet_cert_health.py, lines: "11", text: "healthcheck_command = [\"puppet\", \"certregen\", \"healthcheck\", \"--all\",  \"--render-as\", \"yaml\"]"}
    mutates: >-
      creates /etc/puppetlabs/puppetserver/ca/signed (absent on an agent node) with the self-signed fixture certificate
      p8test-long.pem (CN p8test-long, 400 days; its key discarded)
    probe: |
      d=/etc/puppetlabs/puppetserver/ca/signed; install -d -m 0755 $d
      openssl req -x509 -newkey rsa:2048 -nodes -days 400 -subj /CN=p8test-long -keyout /dev/null -out $d/p8test-long.pem 2>/dev/null
    effect: |
      ls /etc/puppetlabs/puppetserver/ca/signed
    expect: {rc: 0, stdout: "\\Ap8test-long\\.pem\\n\\Z"}

  - id: ok-when-every-certificate-is-far-from-expiry
    what: with only the 400-day certificate, the check reports OK naming it, with exit 0
    control: negative
    timeout: 120
    derived_from:
      - {path: files/sysmon/check_puppet_cert_health.py, lines: "46-48", text: "print (\"OK: The next certificate expiration will be from %s, in %s\" % (expiring_machine_name, expiring_time))"}
    mutates: runs the check once as root (it only reads the certificates); the output goes to /run/p8test-certhealth/ok.txt
    probe: |
      install -d -m 0700 /run/p8test-certhealth
      { cd /tmp; /opt/puppet-infrastructure/bin/check_puppet_cert_health.py 2>&1; echo "rc=$?"; } > /run/p8test-certhealth/ok.txt
    effect: |
      cat /run/p8test-certhealth/ok.txt
    expect: {rc: 0, stdout: "\\AOK: The next certificate expiration will be from p8test-long, in 39[89] days\\nrc=0\\n\\Z"}

  - id: warns-under-30-days
    what: with a certificate expiring in 20 days added (p8test-soon), the check reports Warning naming it, with exit 1
    control: negative
    timeout: 120
    derived_from:
      - {path: files/sysmon/check_puppet_cert_health.py, lines: "43-45", text: "print (\"Warning: Certificate of %s will expire in %s\" % (expiring_machine_name, expiring_time))"}
    mutates: adds the fixture certificate p8test-soon.pem (20 days) to the signed directory and runs the check once; the output goes to /run/p8test-certhealth/warning.txt
    probe: |
      openssl req -x509 -newkey rsa:2048 -nodes -days 20 -subj /CN=p8test-soon -keyout /dev/null -out /etc/puppetlabs/puppetserver/ca/signed/p8test-soon.pem 2>/dev/null
      { cd /tmp; /opt/puppet-infrastructure/bin/check_puppet_cert_health.py 2>&1; echo "rc=$?"; } > /run/p8test-certhealth/warning.txt
    effect: |
      cat /run/p8test-certhealth/warning.txt
    expect: {rc: 0, stdout: "\\AWarning: Certificate of p8test-soon will expire in (19|20) days\\nrc=1\\n\\Z"}

  - id: critical-under-10-days
    what: with a certificate expiring in 5 days added (p8test-imminent), the check reports Critical naming it, with exit 2
    control: negative
    timeout: 120
    derived_from:
      - {path: files/sysmon/check_puppet_cert_health.py, lines: "40-42", text: "print (\"Critical: certificate of %s will expire in %s\" % (expiring_machine_name, expiring_time))"}
    mutates: adds the fixture certificate p8test-imminent.pem (5 days) and runs the check once; the output goes to /run/p8test-certhealth/critical.txt
    probe: |
      openssl req -x509 -newkey rsa:2048 -nodes -days 5 -subj /CN=p8test-imminent -keyout /dev/null -out /etc/puppetlabs/puppetserver/ca/signed/p8test-imminent.pem 2>/dev/null
      { cd /tmp; /opt/puppet-infrastructure/bin/check_puppet_cert_health.py 2>&1; echo "rc=$?"; } > /run/p8test-certhealth/critical.txt
    effect: |
      cat /run/p8test-certhealth/critical.txt
    expect: {rc: 0, stdout: "\\ACritical: certificate of p8test-imminent will expire in [45] days\\nrc=2\\n\\Z"}

  - id: critical-when-a-certificate-has-expired
    what: with a certificate that expired on 2025-01-02 added (p8test-expired), the check reports Critical "has expired", with exit 2
    control: negative
    timeout: 120
    derived_from:
      - {path: files/sysmon/check_puppet_cert_health.py, lines: "29-32", text: "print(\"Critical: certificate of %s has expired on %s.\" % (element[':name'], element[':expiry'][':expiration_date']))"}
    mutates: >-
      builds a throwaway CA in /run/p8test-certca (key, certificate, index, serial, config), signs p8test-expired with
      -startdate 2025-01-01 and -enddate 2025-01-02 into the signed directory, and runs the check once; the output goes
      to /run/p8test-certhealth/expired.txt
    probe: |
      d=/run/p8test-certca; install -d -m 0700 $d/newcerts; : > $d/index.txt; echo 1000 > $d/serial
      openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=p8test-fixture-ca -keyout $d/ca.key -out $d/ca.crt 2>/dev/null
      openssl req -newkey rsa:2048 -nodes -subj /CN=p8test-expired -keyout $d/e.key -out $d/e.csr 2>/dev/null
      printf '%s\n' '[ca]' 'default_ca = p8' '[p8]' "dir = $d" "database = $d/index.txt" "new_certs_dir = $d/newcerts" "serial = $d/serial" "certificate = $d/ca.crt" "private_key = $d/ca.key" 'default_md = sha256' 'policy = pol' '[pol]' 'commonName = supplied' > $d/ca.cnf
      openssl ca -batch -notext -config $d/ca.cnf -startdate 20250101000000Z -enddate 20250102000000Z -in $d/e.csr -out /etc/puppetlabs/puppetserver/ca/signed/p8test-expired.pem 2>/dev/null
      { cd /tmp; /opt/puppet-infrastructure/bin/check_puppet_cert_health.py 2>&1; echo "rc=$?"; } > /run/p8test-certhealth/expired.txt
    effect: |
      cat /run/p8test-certhealth/expired.txt
    expect: {rc: 0, stdout: "\\ACritical: certificate of p8test-expired has expired on 2025-01-02 00:00:00\\+00:00\\.\\nrc=2\\n\\Z"}
