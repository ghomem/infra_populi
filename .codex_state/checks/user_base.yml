# Phase 3 checks for puppet_infrastructure::user_base (define; harness title p8testuser, the user-identity fixture).
# Fixture (params): myname "P8 Test User", myhash the SHA-512 hash (salt p8testsalt) of the test password
# p8test-user-not-a-secret, mykey a test RSA public key, ignorekey false; defaults: mygrouplist [], myhome ''
# (/home/p8testuser), myhomemode '', user_shell /bin/bash, no ecryptfs passphrase (the ruled exec-guard branch,
# user_base.pp:108-135, needs an ecryptfs home that the lab node lacks). Until 2026-11-19 the fixture had a fake hash
# and ignorekey true.
# Purpose and outcomes added 2026-11-19 (backfill batch 5, HQ batch-10 rulings 2 and C1). The fixture moved closer to
# the defaults: ignorekey false (the default) with a test RSA public key as mykey (the class always writes ssh-rsa;
# the private half is not kept anywhere in the repository), and myhash is now the SHA-512 hash (salt p8testsalt) of
# the test password p8test-user-not-a-secret, a lab fixture like the relay password, so the password can be used.
# The login with the password runs su as an unprivileged account in a pty (root's su asks no password), the password
# sent 2 s in (su flushes earlier input: measured 2026-11-19, both passwords refused without the delay).
class: user_base
baseline: release-0.9.10 (cf477c6)
fixture: params
authoring:
  minutes: 0.4
  notes: "Wall clock 2026-11-16T13:46:28Z to 13:46:55Z (written + validated outside the worktree while the Phase 1 review ran; one YAML error caught by the validator). Extended 2026-11-19 (purpose, outcomes, the key, purge and password as behaviour; the fixture change): 17:13:36Z to 17:15:04Z (date at the start of reading the set and at validation), including the su prototype on the node."
node_agent:
  after: an-out-of-band-key-is-planted
  why: purge_ssh_keys removes a key Puppet does not manage only on the next agent run after it appears
purpose: >-
  A base wrapper for a system user: the account with its own same-named primary group, comment, home and shell, the
  given password hash (refusing an empty one), and SSH access through exactly one pushed key (any other authorized key
  is purged; a locked or keyless user gets an unusable key), with optional home mode and ecryptfs wrapped passphrase.
outcomes:
  - outcome: the account exists with its own primary group, comment, home (created, owned by the user) and shell, and no other group with an empty list
    from: manifests/user_base.pp:6-15, 24-37, 63-74
    checks: [user-and-own-primary-group, no-supplementary-groups, home-created-and-owned]
  - outcome: the given password hash is set, so the password logs in and a wrong one is refused
    from: manifests/user_base.pp:19-22, 63-72
    checks: [password-hash-set, the-password-logs-in-and-a-wrong-one-is-refused]
  - outcome: the given key is pushed as the user's only authorized key, and a key added out of band is purged by the next agent run
    from: manifests/user_base.pp:56-59, 72, 93-102
    checks: [the-pushed-key-is-the-only-authorized-key, an-out-of-band-key-is-planted, the-agent-run-purges-the-out-of-band-key]
  - outcome: a login with the pushed key
    from: manifests/user_base.pp:93-102
    uncovered: {why: "the private half of the fixture key would have to be on the node, and the repository keeps no private keys; the key's line, owner and modes are checked instead (key logins as behaviour are in ssh_secure's set)", lifted_by: ubuntu}
  - outcome: a locked hash or an empty key pushes an unusable key; a group list sets the primary group; another home, home mode or shell
    from: manifests/user_base.pp:4, 8-15, 24-31, 41-61, 81-91
    uncovered: {why: "parameter variants (one set holds one params fixture); untested", lifted_by: ubuntu}
  - outcome: the ecryptfs branch (wrapped passphrase written from the .b64 file, with the HQ-ruled exec guard)
    from: manifests/user_base.pp:104-135
    uncovered: {why: "the fixture user has no ecryptfs home, and the lab node has no ecryptfs setup to create /home/.ecryptfs/<user>/.ecryptfs (HQ 2026-11-16 item 7a: an ecryptfs fixture user)", lifted_by: kubuntu}
checks:
  - id: user-and-own-primary-group
    what: the user exists with its own same-named primary group, the comment, /home/<title> and /bin/bash
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "25-31", text: "$myprimary = $title"}
      - {path: manifests/user_base.pp, lines: "35-37", text: "group { $myusername:"}
      - {path: manifests/user_base.pp, lines: "63-74", text: "gid            => $myprimary,"}
      - {path: manifests/user_base.pp, lines: "8-15", text: "$myhomedir = \"/home/${myusername}\""}
    probe: |
      IFS=: read -r name _ uid gid gecos home shell < <(getent passwd p8testuser)
      echo "$name|$gecos|$home|$shell"
      echo "primary group: $(getent group "$gid" | cut -d: -f1)"
    expect: {rc: 0, stdout: "\\Ap8testuser\\|P8 Test User\\|/home/p8testuser\\|/bin/bash\\nprimary group: p8testuser\\n\\Z"}

  - id: no-supplementary-groups
    what: with an empty group list the user is in no other group than its own
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "63-66", text: "groups         => $mygrouplist ,"}
    probe: id -nG p8testuser
    expect: {rc: 0, stdout: "\\Ap8testuser\\n\\Z"}

  - id: home-created-and-owned
    what: the home directory is created (managehome) and owned by the user
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "63-70", text: "managehome     => true,"}
    probe: stat -c '%U %G %F' /home/p8testuser
    expect: {rc: 0, stdout: "\\Ap8testuser p8testuser directory\\n\\Z"}

  - id: password-hash-set
    what: the shadow entry carries the fixture's SHA-512 hash (asserted by algorithm and salt only)
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "19-22", text: "fail ( 'Can\\'t touch this - hash is empty! Where is the user database?' )"}
      - {path: manifests/user_base.pp, lines: "63-72", text: "password       => $myhash,"}
    probe: |
      getent shadow p8testuser | cut -d: -f2 | cut -d'$' -f1-3
    expect: {rc: 0, stdout: "\\A\\$6\\$p8testsalt\\n\\Z"}

  - id: the-pushed-key-is-the-only-authorized-key
    what: >-
      authorized_keys holds exactly one key, the fixture's RSA key named p8testuser@puppet, in a .ssh directory and
      file owned by the user with the modes sshd's StrictModes accepts
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "93-102", text: "ssh_authorized_key { \"${myusername}@puppet\" :"}
      - {path: manifests/user_base.pp, lines: "56-59", text: "$sshkey = $mykey"}
      - {path: manifests/user_base.pp, lines: "63-73", text: "purge_ssh_keys => true,"}
    probe: |
      grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
      ssh-keygen -lf /home/p8testuser/.ssh/authorized_keys
      stat -c '%U %a' /home/p8testuser/.ssh /home/p8testuser/.ssh/authorized_keys
    expect: {rc: 0, stdout: "\\A1\\n3072 SHA256:c3nO5XoVs1uB2\\+1IZ7smzFyWjvF8SXWkfav4BUMd4/E p8testuser@puppet \\(RSA\\)\\np8testuser 700\\np8testuser 600\\n\\Z"}

  - id: the-password-logs-in-and-a-wrong-one-is-refused
    what: >-
      su to p8testuser, run by an unprivileged account in a pty, succeeds with the test password and is refused with a
      wrong one
    control: negative
    timeout: 90
    derived_from:
      - {path: manifests/user_base.pp, lines: "63-72", text: "password       => $myhash,"}
    mutates: two su attempts as the account nobody (one with the test password, one with a wrong one); the outcomes go to /run/p8test-user/pw.txt
    probe: |
      install -d -m 0700 /run/p8test-user; : > /run/p8test-user/pw.txt
      for pw in 'p8test-user-not-a-secret' 'p8test-wrong-password'; do
        out=$( (sleep 2; printf '%s\n' "$pw"; sleep 3) | timeout 20 runuser -u nobody -- script -qec "su p8testuser -c 'echo logged-in-as-\$(id -un)'" /dev/null 2>&1 | tr -d '\r' | grep -o -e 'logged-in-as-[a-z0-9]*' -e 'Authentication failure' | head -1)
        echo "${out:-no answer}" >> /run/p8test-user/pw.txt
      done
    effect: |
      cat /run/p8test-user/pw.txt
    expect: {rc: 0, stdout: "\\Alogged-in-as-p8testuser\\nAuthentication failure\\n\\Z"}

  - id: an-out-of-band-key-is-planted
    what: setup for the purge check, a second key appended to the user's authorized_keys by hand
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "63-73", text: "purge_ssh_keys => true,"}
    mutates: generates a throwaway ed25519 key pair under /run/p8test-user and appends its public key (comment p8test-out-of-band) to /home/p8testuser/.ssh/authorized_keys
    probe: |
      install -d -m 0700 /run/p8test-user
      rm -f /run/p8test-user/extra /run/p8test-user/extra.pub
      ssh-keygen -q -t ed25519 -N '' -C p8test-out-of-band -f /run/p8test-user/extra
      cat /run/p8test-user/extra.pub >> /home/p8testuser/.ssh/authorized_keys
    effect: |
      grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
      p8_count 'p8test-out-of-band$' /home/p8testuser/.ssh/authorized_keys
    expect: {rc: 0, stdout: "\\A2\\n1\\n\\Z"}

  - id: the-agent-run-purges-the-out-of-band-key
    what: after the node's agent run, the planted key is gone and the pushed key is the only one left
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "63-73", text: "purge_ssh_keys => true,"}
    mutates: none beyond reading the file (declared mutating so it runs after the node's agent run)
    probe: |
      true
    effect: |
      grep -cvE '^(#|$)' /home/p8testuser/.ssh/authorized_keys
      p8_count 'p8test-out-of-band$' /home/p8testuser/.ssh/authorized_keys
      ssh-keygen -lf /home/p8testuser/.ssh/authorized_keys | awk '{print $2, $3}'
    expect: {rc: 0, stdout: "\\A1\\n0\\nSHA256:c3nO5XoVs1uB2\\+1IZ7smzFyWjvF8SXWkfav4BUMd4/E p8testuser@puppet\\n\\Z"}
