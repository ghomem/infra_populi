# Phase 3 checks for puppet_infrastructure::hello_world_flask (define; harness title hello_world_flask). It deploys a
# Flask app under <localdir>/hello_world_flask/<title> and runs it with gunicorn as the systemd service
# hello-world-flask-<title>. Fixture (params, never committed): ip_address 127.0.0.1, port 8080, welcome_msg
# "P8 test flask hello". Probes talk to the node's own addresses only.
# 2026-11-20 (backfill batch 7): purpose and outcomes (HQ rulings 2 and C1), and the restart chain as behaviour: a hand
# change to the running app is undone by the next agent run, which restarts the service (gunicorn keeps the code it loaded).
class: hello_world_flask
baseline: release-0.9.10 (cf477c6)
fixture: params
node_agent:
  after: the-app-is-changed-by-hand
  why: the define restores its files and restarts the service only on an agent run after they changed
purpose: >-
  Deploys a small Flask web application (a welcome page) under the local directory and runs it with gunicorn as a
  systemd service on the given address and port, restarting it whenever its files or unit change.
outcomes:
  - outcome: the service runs gunicorn in the app directory, bound to the configured address and port only
    from: manifests/hello_world_flask.pp:35-83; templates/hello_world_flask/hello-world-flask.service.erb:10
    checks: [service-running-and-enabled, unit-runs-gunicorn-in-the-app-dir, not-served-on-another-address]
  - outcome: the page serves the configured welcome message
    from: templates/hello_world_flask/hello_world_flask.py.erb:10-15
    checks: [app-serves-the-welcome-message]
  - outcome: a hand change to the app is undone by the next agent run, which restarts the service so the configured page is served again
    from: manifests/hello_world_flask.pp:27-29, 44-65, 85-93
    checks: [the-app-is-changed-by-hand, the-agent-run-restores-and-restarts]
  - outcome: uninstalling (uninstall true), another address, port or message
    from: manifests/hello_world_flask.pp:3-12, 19-26
    uncovered:
      why: one set holds one params fixture (installed, 127.0.0.1:8080, the test message)
      lifted_by: "capability: more than one params fixture per set"
      evidence: "phase3.py applies the class once with its single `fixture` (params or defaults)"
checks:
  - id: service-running-and-enabled
    what: the systemd service hello-world-flask-<title> is running and enabled
    control: negative
    derived_from:
      - {path: manifests/hello_world_flask.pp, lines: "29-30", text: "$service_ensure = 'running'"}
      - {path: manifests/hello_world_flask.pp, lines: "76-79", text: "service { \"hello-world-flask-${title}\":"}
    probe: |
      systemctl is-active hello-world-flask-hello_world_flask; systemctl is-enabled hello-world-flask-hello_world_flask
    expect: {rc: 0, stdout: "\\Aactive\\nenabled\\n\\Z"}

  - id: unit-runs-gunicorn-in-the-app-dir
    what: the unit starts gunicorn bound to the configured address and port, in <localdir>/hello_world_flask/<title>
    control: negative
    derived_from:
      - {path: templates/hello_world_flask/hello-world-flask.service.erb, lines: "10", text: "ExecStart=python3 -m gunicorn --bind <%= @ip_address %>:<%= @port %> wsgi:app"}
      - {path: templates/hello_world_flask/hello-world-flask.service.erb, lines: "13", text: "WorkingDirectory=<%= @app_dir %>"}
      - {path: manifests/hello_world_flask.pp, lines: "34", text: "$app_dir = \"${localdir}/hello_world_flask/$title\""}
    probe: |
      grep -E '^(ExecStart|WorkingDirectory)=' /lib/systemd/system/hello-world-flask-hello_world_flask.service
    expect: {rc: 0, stdout: "\\AExecStart=python3 -m gunicorn --bind 127\\.0\\.0\\.1:8080 wsgi:app\\nWorkingDirectory=/opt/puppet-infrastructure/hello_world_flask/hello_world_flask\\n\\Z"}

  - id: app-serves-the-welcome-message
    what: an HTTP GET on the bound address returns the page with the configured welcome message as its heading
    control: negative
    derived_from:
      - {path: manifests/hello_world_flask.pp, lines: "49", text: "content => template('puppet_infrastructure/hello_world_flask/hello_world_flask.py.erb'),"}
      - {path: templates/hello_world_flask/hello_world_flask.py.erb, lines: "10-15", text: "<h1 style='color:blue'>%s</h1>"}
    probe: |
      curl -s --max-time 5 http://127.0.0.1:8080/ | grep -o "<h1 style='color:blue'.[^<]*</h1"
    expect: {rc: 0, stdout: "\\A<h1 style='color:blue'>P8 test flask hello</h1\\n\\Z"}

  - id: not-served-on-another-address
    what: the app listens only on the configured address (127.0.0.1), not on the node's other address
    control: invariant
    why_invariant: nothing listens on port 8080 of 10.0.2.15 on the clean node, and the bind keeps it that way
    derived_from:
      - {path: templates/hello_world_flask/hello-world-flask.service.erb, lines: "10", text: "ExecStart=python3 -m gunicorn --bind <%= @ip_address %>:<%= @port %> wsgi:app"}
    probe: |
      curl -s -o /dev/null --max-time 5 http://10.0.2.15:8080/; echo "curl-rc=$?"
    expect: {rc: 0, stdout: "\\Acurl-rc=7\\n\\Z"}

  - id: the-app-is-changed-by-hand
    what: setup for the agent run, the deployed app's welcome message changed by hand and the service restarted, so it serves the change
    control: negative
    derived_from:
      - {path: manifests/hello_world_flask.pp, lines: "44-52", text: "notify  => $files_notify"}
    mutates: >-
      replaces the welcome message in /opt/puppet-infrastructure/hello_world_flask/hello_world_flask/hello_world_flask.py
      with "p8test drifted" (sed -i) and restarts hello-world-flask-hello_world_flask
    probe: |
      sed -i 's/P8 test flask hello/p8test drifted/' /opt/puppet-infrastructure/hello_world_flask/hello_world_flask/hello_world_flask.py
      systemctl restart hello-world-flask-hello_world_flask; sleep 3
    effect: |
      curl -s --max-time 5 http://127.0.0.1:8080/ | grep -o "<h1 style='color:blue'.[^<]*</h1"
    expect: {rc: 0, stdout: "\\A<h1 style='color:blue'>p8test drifted</h1\\n\\Z"}

  - id: the-agent-run-restores-and-restarts
    what: >-
      after the node's agent run, the page serves the configured message again: the file was restored and the restart
      exec ran (gunicorn keeps the code it loaded, so a restored file alone would still serve the change)
    control: negative
    derived_from:
      - {path: manifests/hello_world_flask.pp, lines: "85-89", text: "command => \"/usr/bin/systemctl restart hello-world-flask-${title}\","}
      - {path: manifests/hello_world_flask.pp, lines: "27-29", text: "$files_notify = [ Exec[\"hello-world-flask-${title}-restart\"], ]"}
    mutates: none beyond one HTTP request to the app (declared mutating so it runs after the node's agent run)
    probe: |
      sleep 3
    effect: |
      curl -s --max-time 5 http://127.0.0.1:8080/ | grep -o "<h1 style='color:blue'.[^<]*</h1"
    expect: {rc: 0, stdout: "\\A<h1 style='color:blue'>P8 test flask hello</h1\\n\\Z"}

