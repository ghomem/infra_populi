# Phase 3 checks for puppet_infrastructure::mysql_server (class; per-class baseline exception 874f854; migrated with the
# HQ-ruled module-compatibility change service_name => 'mysql', class_rulings.txt / HQ batch-5 ruling 2).
# Fixture (params, never committed): version 8.0, base_dir /srv (data dir /srv/mysql), the lab master's fixture TLS
# files p8test-chain.pem / p8test-key.pem / p8test.pem (under /etc/mysql/ssl), a fake root password.
# HQ ruling 2: the checks must show a MySQL (not MariaDB) server running from the managed config.
class: mysql_server
baseline: 874f854 (874f854)
fixture: params
authoring:
  minutes: 0.5
  notes: "Wall clock 22:22:42Z to 22:23:11Z 2026-11-16, outside the worktree while the Phase 1 review ran (templates at 874f854 read)."
checks:
  - id: mysql-not-mariadb-installed-and-running
    what: the Oracle MySQL 8.0 server package is installed (no MariaDB server), and its mysql service is active and enabled
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "48", text: "package_name            => \"mysql-server-${version}\","}
      - {path: manifests/mysql_server.pp, lines: "1", text: "# Install and configure a MySQL server using the Ubuntu packages."}
    probe: |
      dpkg-query -W -f '${Package} ${Status}\n' mysql-server-8.0
      dpkg-query -W -f '${Status}\n' mariadb-server 2>/dev/null | grep -c 'install ok installed' || true
      systemctl is-active mysql; systemctl is-enabled mysql
    expect: {rc: 0, stdout: "\\Amysql-server-8\\.0 install ok installed\\n0\\nactive\\nenabled\\n\\Z"}

  - id: server-reports-mysql-from-the-managed-config
    what: >-
      the running server is MySQL 8.0 (not MariaDB) and runs with the managed config's datadir, TLS files, secure
      transport and bind address
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "18-19", text: "$config_file    = '/etc/mysql/mysql.conf.d/zz-puppet-infrastructure.cnf'"}
      - {path: templates/mysql/server.cnf.epp, lines: "5-11", text: "require_secure_transport = ON"}
    probe: |
      mysql -NB -e 'SELECT @@version, @@version_comment, @@datadir, @@ssl_ca, @@ssl_cert, @@ssl_key, @@require_secure_transport, @@bind_address'
    expect: {rc: 0, stdout: "\\A8\\.0\\.\\d+-0ubuntu\\S*\\t\\(Ubuntu\\)\\t/srv/mysql/\\t/etc/mysql/ssl/p8test-chain\\.pem\\t/etc/mysql/ssl/p8test\\.pem\\t/etc/mysql/ssl/p8test-key\\.pem\\t1\\t0\\.0\\.0\\.0\\n\\Z"}

  - id: managed-config-file-rendered
    what: the managed server config (root 0644) carries the data dir and the TLS file paths
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "19", text: "$config_file    = '/etc/mysql/mysql.conf.d/zz-puppet-infrastructure.cnf'"}
      - {path: templates/mysql/server.cnf.epp, lines: "6-10", text: "datadir = <%= $data_dir %>"}
    probe: |
      f=/etc/mysql/mysql.conf.d/zz-puppet-infrastructure.cnf
      stat -c '%U %a' "$f"; grep -E '^(datadir|ssl-ca|ssl-cert|ssl-key|require_secure_transport) =' "$f"
    expect: {rc: 0, stdout: "\\Aroot 644\\ndatadir = /srv/mysql\\nssl-ca = /etc/mysql/ssl/p8test-chain\\.pem\\nssl-cert = /etc/mysql/ssl/p8test\\.pem\\nssl-key = /etc/mysql/ssl/p8test-key\\.pem\\nrequire_secure_transport = ON\\n\\Z"}

  - id: apparmor-allows-datadir-and-tls
    what: the mysqld AppArmor local include grants the custom data dir and the TLS files, and mysqld runs confined
    control: negative
    derived_from:
      - {path: templates/mysql/apparmor-local.epp, lines: "5-11", text: "<%= $data_dir %>/** rwk,"}
      - {path: manifests/mysql_server.pp, lines: "100", text: "command     => '/usr/sbin/apparmor_parser -r /etc/apparmor.d/usr.sbin.mysqld',"}
    probe: |
      grep -E '^/' /etc/apparmor.d/local/usr.sbin.mysqld
      cat "/proc/$(systemctl show -p MainPID --value mysql)/attr/current"
    expect: {rc: 0, stdout: "\\A/srv/mysql/ r,\\n/srv/mysql/\\*\\* rwk,\\n/etc/mysql/ssl/p8test-chain\\.pem r,\\n/etc/mysql/ssl/p8test\\.pem r,\\n/etc/mysql/ssl/p8test-key\\.pem r,\\n/usr/sbin/mysqld \\(enforce\\)\\n\\Z"}
