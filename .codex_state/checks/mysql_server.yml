# Phase 3 checks for puppet_infrastructure::mysql_server (class; per-class baseline exception 874f854; migrated with the
# HQ-ruled module-compatibility change service_name => 'mysql', class_rulings.txt / HQ batch-5 ruling 2).
# Fixture (params, never committed): version 8.0, base_dir /srv (data dir /srv/mysql), the lab master's fixture TLS
# files p8test-chain.pem / p8test-key.pem / p8test.pem (under /etc/mysql/ssl), a fake root password.
# HQ ruling 2: the checks must show a MySQL (not MariaDB) server running from the managed config.
# 2026-11-20 (backfill batch 6): purpose and outcomes (HQ rulings 2 and C1), and the server's behaviour toward clients:
# TLS required and verified against the chain, root's password enforced, the default accounts gone. The fixture's root
# password stays in the params file: the checks use root's socket login (/root/.my.cnf, written by puppetlabs-mysql)
# and a throwaway account p8testsql. Prototyped on the node 2026-11-20: root's plugin is mysql_native_password (the
# module's); a caching_sha2 account fails a plaintext login in the client (ERROR 2061) before the server's transport
# rule, so the throwaway account uses mysql_native_password and the server answers ERROR 3159.
# Correction round 1, 2026-11-20 (review 20261120T115855Z, purpose gap): the TLS key's confidentiality (mysql reads it,
# other users cannot), with a mismatch reading it as nobody.
# Correction round 2, 2026-11-20 (review 20261120T120720Z, purpose gap): root accounts for hosts other than localhost
# (the rest of remove_default_accounts) are counted too.
class: mysql_server
baseline: 874f854 (874f854)
fixture: params
purpose: >-
  Runs an Oracle MySQL server from the Ubuntu packages with the data in a custom directory, accepting only TLS
  connections with the given certificates, with the given root password and the default accounts removed, AppArmor
  allowing the custom paths.
outcomes:
  - outcome: MySQL (not MariaDB) 8.0 runs, enabled, from the managed configuration and the custom data directory
    from: manifests/mysql_server.pp:44-62, 103-122; templates/mysql/server.cnf.epp:1-10
    checks: [mysql-not-mariadb-installed-and-running, server-reports-mysql-from-the-managed-config, managed-config-file-rendered]
  - outcome: AppArmor confines mysqld and allows the custom data directory and the TLS files
    from: manifests/mysql_server.pp:20-42, 97-102; templates/mysql/apparmor-local.epp:1-11
    checks: [apparmor-allows-datadir-and-tls]
  - outcome: a network client must use TLS, and the server's certificate verifies against the given chain
    from: templates/mysql/server.cnf.epp:7-10; manifests/mysql_server.pp:64-95
    checks: [a-client-needs-tls-and-verifies-the-server]
  - outcome: the TLS key is readable by mysqld's user and by no other local user; the certificate and chain are public
    from: manifests/mysql_server.pp:64-97
    checks: [the-tls-key-is-readable-by-mysql-only]
  - outcome: root needs the given password, and no anonymous account, no root account for another host and no test database remains
    from: manifests/mysql_server.pp:44-52
    checks: [root-needs-the-password-and-defaults-are-gone]
checks:
  - id: mysql-not-mariadb-installed-and-running
    what: the Oracle MySQL 8.0 server package is installed (no MariaDB server), and its mysql service is active and enabled
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "48", text: "package_name            => \"mysql-server-${version}\","}
      - {path: manifests/mysql_server.pp, lines: "1", text: "# Install and configure a MySQL server using the Ubuntu packages."}
    probe: |
      dpkg-query -W -f '${Package} ${Status}\n' mysql-server-8.0
      dpkg-query -W -f '${Status}\n' mariadb-server 2>/dev/null | grep -c 'install ok installed' || true
      systemctl is-active mysql; systemctl is-enabled mysql
    expect: {rc: 0, stdout: "\\Amysql-server-8\\.0 install ok installed\\n0\\nactive\\nenabled\\n\\Z"}

  - id: server-reports-mysql-from-the-managed-config
    what: >-
      the running server is MySQL 8.0 (not MariaDB) and runs with the managed config's datadir, TLS files, secure
      transport and bind address
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "18-19", text: "$config_file    = '/etc/mysql/mysql.conf.d/zz-puppet-infrastructure.cnf'"}
      - {path: templates/mysql/server.cnf.epp, lines: "5-11", text: "require_secure_transport = ON"}
    probe: |
      mysql -NB -e 'SELECT @@version, @@version_comment, @@datadir, @@ssl_ca, @@ssl_cert, @@ssl_key, @@require_secure_transport, @@bind_address'
    expect: {rc: 0, stdout: "\\A8\\.0\\.\\d+-0ubuntu\\S*\\t\\(Ubuntu\\)\\t/srv/mysql/\\t/etc/mysql/ssl/p8test-chain\\.pem\\t/etc/mysql/ssl/p8test\\.pem\\t/etc/mysql/ssl/p8test-key\\.pem\\t1\\t0\\.0\\.0\\.0\\n\\Z"}

  - id: managed-config-file-rendered
    what: the managed server config (root 0644) carries the data dir and the TLS file paths
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "19", text: "$config_file    = '/etc/mysql/mysql.conf.d/zz-puppet-infrastructure.cnf'"}
      - {path: templates/mysql/server.cnf.epp, lines: "6-10", text: "datadir = <%= $data_dir %>"}
    probe: |
      f=/etc/mysql/mysql.conf.d/zz-puppet-infrastructure.cnf
      stat -c '%U %a' "$f"; grep -E '^(datadir|ssl-ca|ssl-cert|ssl-key|require_secure_transport) =' "$f"
    expect: {rc: 0, stdout: "\\Aroot 644\\ndatadir = /srv/mysql\\nssl-ca = /etc/mysql/ssl/p8test-chain\\.pem\\nssl-cert = /etc/mysql/ssl/p8test\\.pem\\nssl-key = /etc/mysql/ssl/p8test-key\\.pem\\nrequire_secure_transport = ON\\n\\Z"}

  - id: apparmor-allows-datadir-and-tls
    what: the mysqld AppArmor local include grants the custom data dir and the TLS files, and mysqld runs confined
    control: negative
    derived_from:
      - {path: templates/mysql/apparmor-local.epp, lines: "5-11", text: "<%= $data_dir %>/** rwk,"}
      - {path: manifests/mysql_server.pp, lines: "100", text: "command     => '/usr/sbin/apparmor_parser -r /etc/apparmor.d/usr.sbin.mysqld',"}
    probe: |
      grep -E '^/' /etc/apparmor.d/local/usr.sbin.mysqld
      cat "/proc/$(systemctl show -p MainPID --value mysql)/attr/current"
    expect: {rc: 0, stdout: "\\A/srv/mysql/ r,\\n/srv/mysql/\\*\\* rwk,\\n/etc/mysql/ssl/p8test-chain\\.pem r,\\n/etc/mysql/ssl/p8test\\.pem r,\\n/etc/mysql/ssl/p8test-key\\.pem r,\\n/usr/sbin/mysqld \\(enforce\\)\\n\\Z"}

  - id: root-needs-the-password-and-defaults-are-gone
    what: >-
      root@localhost authenticates by password (not the socket), so a root login without one is refused while root's
      own client options (the module's /root/.my.cnf) log in; no anonymous account, no root account for any host but
      localhost (127.0.0.1, ::1, the host's names) and no test database exist
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "44-52", text: "remove_default_accounts => true,"}
      - {path: manifests/mysql_server.pp, lines: "44-52", text: "root_password           => $root_pw,"}
    probe: |
      mysql --no-defaults -uroot -e 'SELECT 1' 2>&1 | grep -o 'ERROR 1045' | head -1
      mysql -NB -e "SELECT CURRENT_USER(), (SELECT plugin FROM mysql.user WHERE user='root' AND host='localhost'), (SELECT COUNT(*) FROM mysql.user WHERE user=''), (SELECT COUNT(*) FROM mysql.user WHERE user='root' AND host!='localhost'), (SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='test')"
    mismatch:
      varies: >-
        the password: the same root login with root's own client options (the module's /root/.my.cnf, which holds the
        password) is not refused, so the first line cannot read ERROR 1045
      probe: |
        mysql -uroot -e 'SELECT 1' 2>&1 | grep -o 'ERROR 1045' | head -1
        mysql -NB -e "SELECT CURRENT_USER(), (SELECT plugin FROM mysql.user WHERE user='root' AND host='localhost'), (SELECT COUNT(*) FROM mysql.user WHERE user=''), (SELECT COUNT(*) FROM mysql.user WHERE user='root' AND host!='localhost'), (SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='test')"
    expect: {rc: 0, stdout: "\\AERROR 1045\\nroot@localhost\\tmysql_native_password\\t0\\t0\\t0\\n\\Z"}

  - id: a-client-needs-tls-and-verifies-the-server
    what: >-
      a TCP client account connecting without TLS is refused (insecure transport prohibited); with TLS it connects, and
      it verifies the server's certificate against the chain the class installed (VERIFY_CA), while a CA that did not
      sign it fails verification
    control: negative
    derived_from:
      - {path: templates/mysql/server.cnf.epp, lines: "8-11", text: "require_secure_transport = ON"}
      - {path: manifests/mysql_server.pp, lines: "14-18", text: "$ssl_chain_file = \"${ssl_dir}/${ssl_chain}\""}
    mutates: >-
      creates the account 'p8testsql'@'%' (mysql_native_password, so a plaintext login reaches the server's transport
      rule instead of failing in the client; password p8test-Sql-pw5!) through root's socket login, which the server
      records in its data directory /srv/mysql (mysql.ibd, the system tablespace, the undo, redo and binary logs); makes four TCP logins to 127.0.0.1:3306 as it; the answers go
      to /run/p8test-mysql/tls.txt (/run/p8test-mysql created 0700)
    probe: |
      install -d -m 0700 /run/p8test-mysql; o=/run/p8test-mysql/tls.txt
      mysql -e "CREATE USER IF NOT EXISTS 'p8testsql'@'%' IDENTIFIED WITH mysql_native_password BY 'p8test-Sql-pw5!'"
      m="mysql --no-defaults -h127.0.0.1 -P3306 -up8testsql -pp8test-Sql-pw5! -NB"
      $m --ssl-mode=DISABLED -e 'SELECT 1' 2>&1 | grep -oE 'ERROR [0-9]+' | head -1 > $o
      $m --ssl-mode=REQUIRED -e "SHOW SESSION STATUS LIKE 'Ssl_version'" 2>/dev/null | cut -f2 | sed 's/^TLSv1\.[23]$/TLS/' >> $o
      $m --ssl-mode=VERIFY_CA --ssl-ca=/etc/mysql/ssl/p8test-chain.pem -e 'SELECT "verified"' 2>/dev/null >> $o
      $m --ssl-mode=VERIFY_CA --ssl-ca=/etc/ssl/certs/ISRG_Root_X1.pem -e 'SELECT "verified"' 2>&1 | grep -oE 'ERROR [0-9]+|verified' | head -1 >> $o
    effect: |
      cat /run/p8test-mysql/tls.txt
    expect: {rc: 0, stdout: "\\AERROR 3159\\nTLS\\nverified\\nERROR 2026\\n\\Z"}

  - id: the-tls-key-is-readable-by-mysql-only
    what: >-
      the TLS directory is root:mysql 0750, the key root:mysql 0640, the certificate and chain root:mysql 0644, and
      mysqld's user (mysql) reads the key as a private key
    control: negative
    derived_from:
      - {path: manifests/mysql_server.pp, lines: "64-69", text: "mode    => '0750',"}
      - {path: manifests/mysql_server.pp, lines: "90-96", text: "mode    => '0640',"}
      - {path: manifests/mysql_server.pp, lines: "72-78", text: "mode    => '0644',"}
    probe: |
      stat -c '%U:%G %a' /etc/mysql/ssl /etc/mysql/ssl/p8test-key.pem /etc/mysql/ssl/p8test.pem /etc/mysql/ssl/p8test-chain.pem
      runuser -u mysql -- openssl pkey -in /etc/mysql/ssl/p8test-key.pem -noout 2>/dev/null && echo key-readable-by-mysql
    mismatch:
      varies: the user that reads the key, nobody instead of mysql, who must not read it, so the last line cannot appear
      probe: |
        stat -c '%U:%G %a' /etc/mysql/ssl /etc/mysql/ssl/p8test-key.pem /etc/mysql/ssl/p8test.pem /etc/mysql/ssl/p8test-chain.pem
        runuser -u nobody -- openssl pkey -in /etc/mysql/ssl/p8test-key.pem -noout 2>/dev/null && echo key-readable-by-mysql
    expect: {rc: 0, stdout: "\\Aroot:mysql 750\\nroot:mysql 640\\nroot:mysql 644\\nroot:mysql 644\\nkey-readable-by-mysql\\n\\Z"}
