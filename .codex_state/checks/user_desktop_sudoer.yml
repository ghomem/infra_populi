# Phase 3 checks for puppet_infrastructure::user_desktop_sudoer (define; harness title p8testuser, the user-identity
# fixture; node kubuntu, Kubuntu 24.04, which carries the lpadmin and sambashare groups). The wrapper builds the group
# list [<given>, <title>, cdrom, dip, plugdev, lp, lpadmin, sambashare, adm, sudo], passes everything to user_base and
# declares user_kde_lock_screen for the user. Fixture (params, never committed): as user_desktop's: myname "P8 Test
# User", a fake SHA-512 hash with salt p8testsalt, mykey = a throwaway RSA public key body; defaults otherwise.
# Adapted from user_desktop's reviewed set, plus the sudo right the extra groups grant.
class: user_desktop_sudoer
baseline: release-0.9.10 (cf477c6)
fixture: params
authoring:
  minutes: 0.4
  notes: "Wall clock 22:31:06Z to 22:31:32Z 2026-11-17 (adapted from user_desktop's reviewed set, outside the worktree while the Phase 1 review ran)."
uncovered:
  - what: >-
      the KDE lock-screen settings user_kde_lock_screen applies (configure_lock_screen.sh as the user: kscreenlockerrc
      Autolock/LockOnResume/Timeout/LockGrace and the screenlocker reconfiguration over D-Bus)
    why: >-
      the script acts only for a logged-in user with a KDE session; kubuntu runs headless with no one logged in, so the
      exec's guard succeeds and nothing is applied (user_kde_lock_screen's own Phase 3 is deferred for the same reason)
    lifted_by: kubuntu
checks:
  - id: user-with-own-primary-group
    what: the user exists with its own same-named primary group (the title is the first group of the built list)
    control: negative
    derived_from:
      - {path: manifests/user_desktop_sudoer.pp, lines: "9", text: "$grouplist = flatten( [ $mygrouplist, [ $title, 'cdrom', 'dip', 'plugdev', 'lp', 'lpadmin', 'sambashare', 'adm', 'sudo' ] ] )"}
      - {path: manifests/user_base.pp, lines: "25-31", text: "$myprimary = $title"}
    probe: |
      IFS=: read -r name _ uid gid gecos home shell < <(getent passwd p8testuser)
      echo "$name|$gecos|$home|$shell"
      echo "primary group: $(getent group "$gid" | cut -d: -f1)"
    expect: {rc: 0, stdout: "\\Ap8testuser\\|P8 Test User\\|/home/p8testuser\\|/bin/bash\\nprimary group: p8testuser\\n\\Z"}

  - id: desktop-and-admin-groups
    what: the user is in exactly its own group, the desktop groups cdrom, dip, plugdev, lp, lpadmin, sambashare and the admin groups adm, sudo
    control: negative
    derived_from:
      - {path: manifests/user_desktop_sudoer.pp, lines: "9-10", text: "$grouplist = flatten( [ $mygrouplist, [ $title, 'cdrom', 'dip', 'plugdev', 'lp', 'lpadmin', 'sambashare', 'adm', 'sudo' ] ] )"}
    probe: id -nG p8testuser | tr ' ' '\n' | sort | tr '\n' ' '
    expect: {rc: 0, stdout: "\\Aadm cdrom dip lp lpadmin p8testuser plugdev sambashare sudo \\Z"}

  - id: the-user-may-run-any-command-with-sudo
    what: "membership of sudo gives the user the distribution's full sudo right, (ALL : ALL) ALL"
    control: negative
    derived_from:
      - {path: manifests/user_desktop_sudoer.pp, lines: "9", text: "'adm', 'sudo' ] ] )"}
    probe: |
      sudo -l -U p8testuser | grep -c -F '(ALL : ALL) ALL'
    mismatch:
      varies: the user (nobody, an existing account outside the sudo group), so sudo must deny it
      probe: |
        sudo -l -U nobody | grep -c -F '(ALL : ALL) ALL'
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}

  - id: the-given-key-is-pushed
    what: the key is pushed (ignorekey defaults to false), one ssh-rsa line with comment <title>@puppet
    control: negative
    derived_from:
      - {path: manifests/user_desktop_sudoer.pp, lines: "7", text: "$ignorekey = false"}
      - {path: manifests/user_base.pp, lines: "96-99", text: "ssh_authorized_key { \"${myusername}@puppet\" :"}
    probe: |
      grep -v '^#' /home/p8testuser/.ssh/authorized_keys | grep -v '^$'
    expect: {rc: 0, stdout: "\\Assh-rsa AAAAB3NzaC1yc2EAAAADAQAB[A-Za-z0-9+/=]{200,} p8testuser@puppet\\n\\Z"}

  - id: lock-screen-script-installed
    what: the lock-screen define brings its script into bindir (root, 0755) for the exec it runs as the user
    control: negative
    derived_from:
      - {path: manifests/user_desktop_sudoer.pp, lines: "12", text: "puppet_infrastructure::user_kde_lock_screen { $title : screenlock_timeout_minutes => $screenlock_timeout_minutes, screenlock_grace_seconds => $screenlock_grace_seconds }"}
      - {path: manifests/user_kde_lock_screen_common.pp, lines: "8-12", text: "source => 'puppet:///modules/puppet_infrastructure/user_kde_lock_screen/configure_lock_screen.sh',"}
    probe: stat -c '%U %a' /opt/puppet-infrastructure/bin/configure_lock_screen.sh
    expect: {rc: 0, stdout: "\\Aroot 755\\n\\Z"}
