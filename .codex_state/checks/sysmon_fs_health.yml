# Phase 3 checks for puppet_infrastructure::sysmon_fs_health (define; harness title sysmon_fs_health = the volume name;
# required_base filesystem_base; required_external sudo). Fixture (params, never committed): basedir
# /var/tmp/p8test-fs-health, size_threshold 8 (KB), nfiles 3. bindir = /opt/puppet-infrastructure/bin (lab Hiera).
# 2026-11-21 (backfill batch 8): purpose and outcomes (HQ rulings 2 and C1); the CRITICAL side on an empty tree and
# the sudo rule in use (the nagios account, which production's monitoring base creates, made here only if absent).
class: sysmon_fs_health
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Gives the monitoring system a health check for a storage volume (a backup tree): a Nagios plugin that reports CRITICAL
  when the tree is empty or below its size threshold, cannot be listed, or a sample of its files cannot be read, and
  OK otherwise; the nagios account may run it as root through sudo.
outcomes:
  - outcome: the per-volume check script carries the base directory, the size threshold and the file count, and nagios may run it through sudo
    from: manifests/sysmon_fs_health.pp:3-17
    checks: [check-script-rendered, nagios-may-run-it-through-sudo]
  - outcome: an empty tree (at or under the size threshold) is reported CRITICAL with exit 2
    from: templates/sysmon/check-fs-health.sh.erb:42-52, 80-83
    checks: [check-reports-critical-on-an-empty-tree]
  - outcome: a readable tree above the threshold is listed, a sample of its files read, and reported OK with exit 0, also when nagios runs it through sudo
    from: templates/sysmon/check-fs-health.sh.erb:54-97
    checks: [check-reports-ok-on-a-healthy-tree, nagios-runs-the-check-through-sudo]
  - outcome: a tree that cannot be listed, or a file whose content cannot be read, is reported CRITICAL
    from: templates/sysmon/check-fs-health.sh.erb:54-93
    uncovered:
      why: the script runs as root (through sudo), which reads every file and directory; only an I/O error on the volume makes find or md5sum fail
      lifted_by: "capability: fault injection on a lab volume (an I/O-error block device) inside a phase3 run"
      evidence: "the check runs as root via sudo (sysmon_fs_health.pp:10); phase3.py has no fault-injection step"
checks:
  - id: check-script-rendered
    what: the per-volume check script (root 0755) carries the base directory, the size threshold and the file count
    control: negative
    derived_from:
      - {path: manifests/sysmon_fs_health.pp, lines: "8", text: "$scriptname = \"${prefix}-${volname}.sh\""}
      - {path: manifests/sysmon_fs_health.pp, lines: "13-16", text: "content => template(\"puppet_infrastructure/sysmon/${prefix}.sh.erb\"),"}
      - {path: templates/sysmon/check-fs-health.sh.erb, lines: "8-10", text: "SIZE_THRESHOLD=\"<%= @size_threshold %>\" # in KB, 4KB is an empty directory"}
    probe: |
      f=/opt/puppet-infrastructure/bin/check-fs-health-sysmon_fs_health.sh
      stat -c '%U %a' "$f"; bash -n "$f" && grep -E '^(BASEDIR|SIZE_THRESHOLD|NFILES)=' "$f" | cut -d' ' -f1
    expect: {rc: 0, stdout: "\\Aroot 755\\nBASEDIR=\"/var/tmp/p8test-fs-health\"\\nSIZE_THRESHOLD=\"8\"\\nNFILES=\"3\"\\n\\Z"}

  - id: nagios-may-run-it-through-sudo
    what: a sudoers drop-in (priority 10) lets nagios run exactly this script without a password, and sudoers stays valid
    control: negative
    derived_from:
      - {path: manifests/sysmon_fs_health.pp, lines: "10", text: "sudo::conf { \"nagios_fs_health_${volname}\": priority => 10, content  => \"nagios ALL=NOPASSWD:${bindir}/${scriptname}\" }"}
    probe: |
      grep -h '^nagios ' /etc/sudoers.d/10_nagios_fs_health_sysmon_fs_health
      visudo -c -q && echo sudoers-valid
    expect: {rc: 0, stdout: "\\Anagios ALL=NOPASSWD:/opt/puppet-infrastructure/bin/check-fs-health-sysmon_fs_health\\.sh\\nsudoers-valid\\n\\Z"}

  - id: check-reports-critical-on-an-empty-tree
    what: on an empty tree (4 KB, at most the 8 KB threshold) the check reports CRITICAL "storage space is empty" with exit 2
    control: negative
    derived_from:
      - {path: templates/sysmon/check-fs-health.sh.erb, lines: "42-52", text: "if [ $MYSIZE -gt $SIZE_THRESHOLD ]; then"}
      - {path: templates/sysmon/check-fs-health.sh.erb, lines: "80-83", text: "handle_error $RC \"storage space is empty\""}
    mutates: creates the empty directory /var/tmp/p8test-fs-health (the check itself only reads)
    probe: |
      install -d /var/tmp/p8test-fs-health
    effect: |
      /opt/puppet-infrastructure/bin/check-fs-health-sysmon_fs_health.sh; echo "rc=$?"
    expect: {rc: 0, stdout: "\\ACRITICAL: storage space is empty\\nrc=2\\n\\Z"}

  - id: check-reports-ok-on-a-healthy-tree
    what: >-
      the exercise: on a readable tree above the size threshold the check lists the tree, reads N random files and
      reports OK with exit 0
    control: negative
    derived_from:
      - {path: templates/sysmon/check-fs-health.sh.erb, lines: "43-51", text: "if [ $MYSIZE -gt $SIZE_THRESHOLD ]; then"}
      - {path: templates/sysmon/check-fs-health.sh.erb, lines: "96-97", text: "echo \"OK: exit code $RC $OUTPUT\""}
    mutates: >-
      creates /var/tmp/p8test-fs-health with five 4 KB files of random data (20 KB, above the 8 KB threshold), then runs
      the check script once as root (it only reads the tree)
    probe: |
      install -d /var/tmp/p8test-fs-health
      for i in 1 2 3 4 5; do head -c 4096 /dev/urandom | install -m 0644 /dev/stdin "/var/tmp/p8test-fs-health/f$i"; done
    effect: |
      /opt/puppet-infrastructure/bin/check-fs-health-sysmon_fs_health.sh; echo "rc=$?"
    expect: {rc: 0, stdout: "\\AOK: exit code 0 \\nrc=0\\n\\Z"}

  - id: nagios-runs-the-check-through-sudo
    what: the nagios account runs the check through sudo without a password (the drop-in's rule) and gets OK with exit 0 on the healthy tree
    control: negative
    derived_from:
      - {path: manifests/sysmon_fs_health.pp, lines: "10", text: "sudo::conf { \"nagios_fs_health_${volname}\": priority => 10, content  => \"nagios ALL=NOPASSWD:${bindir}/${scriptname}\" }"}
    mutates: >-
      creates the system account nagios if absent (production's monitoring base provides it), then runs the check once as
      nagios through sudo -n (sudo logs it to the journal and /var/log/auth.log); the output goes to /run/p8test-fs-health/sudo.out
    probe: |
      id nagios >/dev/null 2>&1 || useradd -r -s /usr/sbin/nologin nagios
      install -d -m 0700 /run/p8test-fs-health
      cd /tmp && runuser -u nagios -- sudo -n /opt/puppet-infrastructure/bin/check-fs-health-sysmon_fs_health.sh > /run/p8test-fs-health/sudo.out 2>&1; echo "rc=$?" >> /run/p8test-fs-health/sudo.out
    effect: |
      cat /run/p8test-fs-health/sudo.out
    expect: {rc: 0, stdout: "\\AOK: exit code 0 \\nrc=0\\n\\Z"}

