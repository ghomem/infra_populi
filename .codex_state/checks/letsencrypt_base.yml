# Phase 3 checks for puppet_infrastructure::letsencrypt_base (class; required_base filesystem_base).
# Fixture (params, never committed; every value fake): email p8test@p8test.example.com, dns_api_token
# p8test-not-a-secret, domains [p8test.example.com], provider digitalocean (the apt plugin package); other parameters
# at their defaults (renew 04:00, deploy 05:00, monthdays 5,10,15,20,25, automate_deployment true). etcdir is
# /opt/puppet-infrastructure/etc (lab Hiera).
# Not exercised: obtaining or renewing a certificate (needs the DNS provider's API); running the deploy script (it
# copies into the Puppet master's extra_files/ssl and chowns to the `puppet` user, i.e. it belongs on a master; the lab
# has no master-kind node); the hetzner/hetzner-cloud branches (pip provider), which the fixture does not select.
class: letsencrypt_base
baseline: release-0.9.10 (cf477c6)
fixture: params
authoring:
  minutes: 0.4
  notes: "Wall clock 19:42:17Z to 19:42:42Z 2026-11-16, outside the worktree while the Phase 1 review ran (puppet-letsencrypt 13.4.0 renew.pp read on the master)."
checks:
  - id: dns-plugin-installed
    what: the selected provider's certbot DNS plugin (digitalocean, apt) and certbot itself are installed
    control: negative
    derived_from:
      - {path: manifests/letsencrypt_base.pp, lines: "16", text: "$package_name     = 'python3-certbot-dns-digitalocean'"}
      - {path: manifests/letsencrypt_base.pp, lines: "63", text: "class { 'letsencrypt':"}
    probe: dpkg-query -W -f '${Package} ${Status}\n' python3-certbot-dns-digitalocean certbot
    expect: {rc: 0, stdout: "\\Apython3-certbot-dns-digitalocean install ok installed\\ncertbot install ok installed\\n\\Z"}

  - id: dns-credentials-file-private
    what: the credentials file holds the provider's token property with the given token, root-only (0600)
    control: negative
    derived_from:
      - {path: manifests/letsencrypt_base.pp, lines: "19", text: "$api_property_str = 'dns_digitalocean_token'"}
      - {path: manifests/letsencrypt_base.pp, lines: "55-56", text: "mode      => '600',"}
      - {path: templates/letsencrypt/dns-creds.ini.erb, lines: "1", text: "<%= @api_property_str  %> = <%= @dns_api_token %>"}
    probe: |
      f=/opt/puppet-infrastructure/etc/dns-creds.ini
      stat -c '%U %G %a' "$f"; cat "$f"
    expect: {rc: 0, stdout: "\\Aroot root 600\\ndns_digitalocean_token = p8test-not-a-secret\\n\\Z"}

  - id: renew-cron-with-nginx-reload-hook
    what: certbot renew runs from root's crontab at 04:00 on the 5th/10th/15th/20th/25th with a post hook reloading nginx
    control: negative
    derived_from:
      - {path: manifests/letsencrypt_base.pp, lines: "7-8", text: "Integer $renew_cron_hour            = 4,"}
      - {path: manifests/letsencrypt_base.pp, lines: "11", text: "Array[Integer] $renew_cron_monthday = [5,10,15,20,25],"}
      - {path: manifests/letsencrypt_base.pp, lines: "67-71", text: "renew_post_hook_commands => 'service nginx reload',"}
    probe: |
      crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: letsencrypt-renew' | tail -1
      h=$(crontab -l -u root | grep -A1 -x '# Puppet Name: letsencrypt-renew' | tail -1 | grep -oE -- '--post-hook "[^"]+"' | cut -d'"' -f2)
      grep -x 'service nginx reload' "$h"
    expect: {rc: 0, stdout: "\\A0 4 5,10,15,20,25 \\* \\* \\S*certbot renew -q --post-hook \"/etc/letsencrypt/renewal-hooks-puppet/renew-post\\.sh\"\\nservice nginx reload\\n\\Z"}

  - id: deploy-script-rendered
    what: the deploy script (root 0700) copies from /etc/letsencrypt/live into the master's extra_files/ssl for the given domains
    control: negative
    derived_from:
      - {path: manifests/letsencrypt_base.pp, lines: "78-79", text: "$ssldir          = \"/etc/puppetlabs/puppet/extra_files/ssl\""}
      - {path: manifests/letsencrypt_base.pp, lines: "83-85", text: "mode      => '0700',"}
      - {path: templates/letsencrypt/deploy_maintained_certificates.sh.erb, lines: "3-5", text: "DOMAINS=\"<%= @domains_str %>\""}
    probe: |
      f=/opt/puppet-infrastructure/bin/deploy_maintained_certificates.sh
      stat -c '%U %a' "$f"; bash -n "$f" && grep -E '^(CERT_DIR|SSL_DIR|DOMAINS)=' "$f"
    expect: {rc: 0, stdout: "\\Aroot 700\\nCERT_DIR=/etc/letsencrypt/live\\nSSL_DIR=/etc/puppetlabs/puppet/extra_files/ssl\\nDOMAINS=\"p8test\\.example\\.com\"\\n\\Z"}

  - id: deploy-cron
    what: with automate_deployment the deploy script runs from root's crontab at 05:00 on the renew monthdays
    control: negative
    derived_from:
      - {path: manifests/letsencrypt_base.pp, lines: "9-10", text: "Integer $deploy_cron_hour           = 5,"}
      - {path: manifests/letsencrypt_base.pp, lines: "98-102", text: "monthday => $renew_cron_monthday,"}
    probe: |
      crontab -l -u root 2>/dev/null | grep -A1 -x '# Puppet Name: deploy_maintained_certificates' | tail -1
    expect: {rc: 0, stdout: "\\A0 5 5,10,15,20,25 \\* \\* /opt/puppet-infrastructure/bin/deploy_maintained_certificates\\.sh\\n\\Z"}
