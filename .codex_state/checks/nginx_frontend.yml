# Phase 3 checks for puppet_infrastructure::nginx_frontend (class; node ubuntu; required_base nginx_base,
# filesystem_base). Fixture (params, never committed): domain p8test.example.com, frontend_sslprefix p8test,
# backend_hosts_and_ports ["127.0.0.1:8080"], backend_protocol http, server_monitoring_create true; every other
# parameter at its default (manage_ssl true, server_default_create true, redirect_default false). The class declares
# nginx_frontend_domain for the domain (the frontend checks below are that define's, through this class) and adds a
# default server, a monitoring server and its Nagios check. The lab's throwaway certificate (master_fixtures.sh) names
# p8test.example.com and *.p8test.example.com. Probes connect only to the node's own loopback.
class: nginx_frontend
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  An nginx frontend: the domain's HTTP-to-HTTPS redirects and TLS proxy to its backends (through
  nginx_frontend_domain), the domain's certificate (through ssl_nginx_domain), a default server that answers 404 to
  unknown names, and a monitoring server with nginx's status page and a Nagios check reading it.
outcomes:
  - outcome: plain HTTP on the domain and on www redirects (301) to HTTPS on the same name, keeping the path
    from: manifests/nginx_frontend.pp:280-315; manifests/nginx_frontend_domain.pp:416-454
    checks: [a-backend-answers, http-redirects-to-https]
  - outcome: HTTPS on www and on the domain proxies to the backend with the domain's certificate (managed by this class)
    from: manifests/nginx_frontend.pp:133-137, 280-315
    checks: [https-proxies-to-the-backend]
  - outcome: only TLS 1.3 is accepted (the default protocol list)
    from: manifests/nginx_frontend.pp:42, 117-119
    checks: [only-tls-1-3-is-accepted]
  - outcome: a request for a name no server holds gets 404 from the default server, over HTTP and HTTPS
    from: manifests/nginx_frontend.pp:150-155, 177-206
    checks: [the-default-server-answers-404]
  # Correction round 1 (2026-11-18, review 20261118T220835Z): the status page's refusal off loopback became a check.
  - outcome: the monitoring server, pinned to 127.0.0.1 in /etc/hosts, answers Hello World and serves nginx's status to 127.0.0.1
    from: manifests/nginx_frontend.pp:209-265
    checks: [the-monitoring-server-answers]
  - outcome: the status page is refused (403) to a request that does not come from 127.0.0.1
    from: manifests/nginx_frontend.pp:252-260
    checks: [the-status-page-is-refused-off-loopback]
  - outcome: the Nagios check reads nginx's status, OK under its thresholds, WARNING and CRITICAL over them
    from: manifests/nginx_frontend.pp:268-276
    checks: [the-nginx-status-check-reports]
  - outcome: the variants (redirect_default, no default or monitoring server, no SSL, Let's Encrypt, IP whitelist and the other pass-through parameters)
    from: manifests/nginx_frontend.pp:23-79
    uncovered: {why: "fixture variants (one set holds one fixture), untested: this fixture sets only server_monitoring_create and leaves the rest at their defaults", lifted_by: ubuntu}
  - outcome: on RedHat the key is read from /etc/pki/tls/private
    from: manifests/nginx_frontend.pp:87-99
    uncovered: {why: "the RedHat branch; this set runs on the plan's Ubuntu node", lifted_by: rhel9}
checks:
  - id: a-backend-answers
    what: setup for the frontend checks, a backend on 127.0.0.1:8080 (the fixture's backend) serving a page that names it
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_domain.pp, lines: "409-412", text: "nginx::resource::upstream { $backend_name:"}
    mutates: starts a transient unit p8test-backend (python3 -m http.server on 127.0.0.1:8080, serving /run/p8test-frontend/www, whose index.html says p8test-backend)
    probe: |
      install -d -m 0755 /run/p8test-frontend/www
      echo p8test-backend > /run/p8test-frontend/www/index.html
      systemd-run --unit p8test-backend -q python3 -m http.server 8080 --bind 127.0.0.1 --directory /run/p8test-frontend/www
      sleep 2
    effect: |
      curl -s --max-time 5 http://127.0.0.1:8080/
    expect: {rc: 0, stdout: "\\Ap8test-backend\\n\\Z"}

  - id: http-redirects-to-https
    what: plain HTTP to the domain and to www answers 301 to HTTPS on the same name, with the path and query kept
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_domain.pp, lines: "420", text: "$naked_str = \"301 https://${domain}\\$request_uri\""}
      - {path: manifests/nginx_frontend_domain.pp, lines: "453", text: "'return' => \"301 https://www.${domain}\\$request_uri\","}
    mutates: none beyond two local HTTP requests (declared mutating so it runs after the backend starts)
    probe: |
      true
    effect: |
      for h in p8test.example.com www.p8test.example.com; do
        curl -s -o /dev/null --max-time 5 --resolve "$h:80:127.0.0.1" -w '%{http_code} %{redirect_url}\n' "http://$h/p8test/path?q=1"
      done
    expect: {rc: 0, stdout: "\\A301 https://p8test\\.example\\.com/p8test/path\\?q=1\\n301 https://www\\.p8test\\.example\\.com/p8test/path\\?q=1\\n\\Z"}

  - id: https-proxies-to-the-backend
    what: >-
      HTTPS to www and to the domain returns the backend's page, over a certificate that verifies against the issuer
      in the domain's bundle under each name; under a name the certificate does not hold (other.example.com) the
      verification fails and no page is returned
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_domain.pp, lines: "521-524", text: "$domain_list = [ $domain, \"www.${domain}\" ]"}
      - {path: manifests/nginx_frontend_domain.pp, lines: "564", text: "$proxy_value = \"${backend_protocol}://${backend_name}\""}
    mutates: none beyond two local HTTPS requests (declared mutating so it runs after the backend starts)
    probe: |
      true
    effect: |
      ca=$(awk '/BEGIN CERT/{i++} i==2' /etc/ssl/certs/p8test.nginx.bundle.crt)
      for h in www.p8test.example.com p8test.example.com other.example.com; do
        echo "$h: $(curl -s --max-time 5 --cacert <(echo "$ca") --resolve "$h:443:127.0.0.1" "https://$h/")"
      done
    expect: {rc: 0, stdout: "\\Awww\\.p8test\\.example\\.com: p8test-backend\\np8test\\.example\\.com: p8test-backend\\nother\\.example\\.com: \\n\\Z"}

  - id: only-tls-1-3-is-accepted
    what: a TLS 1.3 handshake with the frontend succeeds and a TLS 1.2 one is refused
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend_domain.pp, lines: "92", text: "$base_ssl_protocols_prefix = ['TLSv1.3', ],"}
      - {path: manifests/nginx_frontend_domain.pp, lines: "695", text: "ssl_protocols             => $base_ssl_protocols,"}
    mutates: none beyond two local TLS handshakes (declared mutating so it runs after the backend starts)
    probe: |
      true
    effect: |
      for v in tls1_3 tls1_2; do
        openssl s_client -connect 127.0.0.1:443 -servername www.p8test.example.com -$v </dev/null 2>/dev/null | grep -q '^New, TLSv1' && echo "$v accepted" || echo "$v refused"
      done
    expect: {rc: 0, stdout: "\\Atls1_3 accepted\\ntls1_2 refused\\n\\Z"}

  - id: the-default-server-answers-404
    what: an HTTP and an HTTPS request for a name no server holds (unknown.invalid) get 404
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend.pp, lines: "153-155", text: "$default_str = '404'"}
      - {path: manifests/nginx_frontend.pp, lines: "177-186", text: "listen_options            => 'default_server',"}
    probe: |
      curl -s -o /dev/null --max-time 5 -w 'http %{http_code}\n' -H 'Host: unknown.invalid' http://127.0.0.1/
      curl -s -k -o /dev/null --max-time 5 -w 'https %{http_code}\n' --resolve unknown.invalid:443:127.0.0.1 https://unknown.invalid/
    mismatch:
      varies: the name (the domain, which the domain's servers hold) in place of unknown.invalid
      probe: |
        curl -s -o /dev/null --max-time 5 -w 'http %{http_code}\n' -H 'Host: p8test.example.com' http://127.0.0.1/
        curl -s -k -o /dev/null --max-time 5 -w 'https %{http_code}\n' --resolve p8test.example.com:443:127.0.0.1 https://p8test.example.com/
    expect: {rc: 0, stdout: "\\Ahttp 404\\nhttps 404\\n\\Z"}

  # 2026-11-18 authoring correction (run 1, 20261118T220129Z): nginx's return turns the \n of 'Hello World!\n' into a
  # newline, so the body ends with one; the expectation allowed only a literal backslash-n.
  - id: the-monitoring-server-answers
    what: >-
      the monitoring name (<host>.monitoring.p8test.example.com) resolves to 127.0.0.1 through /etc/hosts, its server
      answers 200 Hello World as text/plain, and /nginx_status gives nginx's status to a request from 127.0.0.1
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend.pp, lines: "222", text: "$fqdn_monitoring_server = \"${::trusted['hostname']}.${server_monitoring_name}.${domain}\""}
      - {path: manifests/nginx_frontend.pp, lines: "265", text: "host { $fqdn_monitoring_server: ip => '127.0.0.1' }"}
      - {path: manifests/nginx_frontend.pp, lines: "254-260", text: "stub_status    => true,"}
    probe: |
      h="$(hostname -s).monitoring.p8test.example.com"
      getent hosts "$h" | awk '{print $1}'
      curl -s --max-time 5 -w '\n%{http_code} %{content_type}\n' "http://$h/"
      curl -s --max-time 5 "http://$h/nginx_status" | head -1 | sed 's/[0-9][0-9]*/N/'
    expect: {rc: 0, stdout: "\\A127\\.0\\.0\\.1\\nHello World!\\n\\n200 text/plain\\nActive connections: N \\n\\Z"}

  - id: the-nginx-status-check-reports
    what: the installed Nagios check reads nginx's status and exits 0 with its defaults, 1 with a warning threshold of 0 active connections, and 2 with a critical threshold of 0
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend.pp, lines: "270-276", text: "content => template('puppet_infrastructure/sysmon/check_nginx_status.py.erb'),"}
    probe: |
      c=/opt/puppet-infrastructure/bin/check_nginx_status.py
      stat -c '%U:%G %a' "$c"
      "$c" >/dev/null; echo "defaults rc=$?"
      "$c" -m 0 >/dev/null; echo "warning at 0 rc=$?"
      "$c" -M 0 >/dev/null; echo "critical at 0 rc=$?"
    expect: {rc: 0, stdout: "\\Aroot:root 755\\ndefaults rc=0\\nwarning at 0 rc=1\\ncritical at 0 rc=2\\n\\Z"}

  - id: the-status-page-is-refused-off-loopback
    what: a request for /nginx_status sent to the node's own host-only address (so not from 127.0.0.1) gets 403
    control: negative
    derived_from:
      - {path: manifests/nginx_frontend.pp, lines: "254-260", text: "location_deny  => [ 'all', ],"}
    probe: |
      h="$(hostname -s).monitoring.p8test.example.com"; a=$(ip -4 -o addr show enp0s8 | awk '{print $4}' | cut -d/ -f1 | head -1)
      curl -s -o /dev/null --max-time 5 -w '%{http_code}\n' --resolve "$h:80:$a" "http://$h/nginx_status"
    mismatch:
      varies: the address (127.0.0.1, the one address the page allows)
      probe: |
        h="$(hostname -s).monitoring.p8test.example.com"
        curl -s -o /dev/null --max-time 5 -w '%{http_code}\n' --resolve "$h:80:127.0.0.1" "http://$h/nginx_status"
    expect: {rc: 0, stdout: "\\A403\\n\\Z"}
