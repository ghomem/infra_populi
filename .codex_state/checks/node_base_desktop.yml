# Phase 3 checks for puppet_infrastructure::node_base_desktop (class; node gnome; MOCK-APPLY for Service['puppet']: node
# fixture puppet_agent_standin, as node_base_domain_desktop). Synced to release-0.9.10 on 2026-11-17 (hazard 8).
# Fixture (params, never committed): log_target puppet8master.example.com / 192.168.56.10, manage_gnome_screenlock true;
# defaults: password_authentication false, ssh_allow_root_login false, screenlock 5 min / grace 0, screenlock_users [].
# Scope: what this profile itself chooses; its component classes carry their own check sets.
# 2026-11-21 (backfill batch 8): purpose and outcomes (HQ rulings 2 and C1), the log forwarding the profile chooses,
# and the uncovered rows in the current form.
# Authoring error in run 20261121T031451Z: the rendered forward line has two spaces after *.*, which the first probe
# did not allow; it now matches any whitespace. The configuration was as expected.
# Correction round 1, 2026-11-21 (review 20261121T032544Z, purpose): sentinels for the components the profile applies
# and chooses (firewall_secure, filesystem_base_desktop, filesystem_apt in desktop mode), as node_base's set has.
class: node_base_desktop
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  The base profile of a desktop: the common packages without unattended upgrades, SSH hardened, the firewall with IPv6
  input and forwarding dropped, desktop APT helpers with a nightly relevant-updates job, logs shipped to the central log
  server, the GNOME and per-user KDE screen lock policies, and the Puppet agent running as a daemon.
outcomes:
  - outcome: SSH is hardened with no password or root login, and unattended upgrades are removed
    from: manifests/node_base_desktop.pp:39-48
    checks: [ssh-hardened-without-password-or-root-login, unattended-upgrades-removed]
  - outcome: the IPv4 firewall is firewall_secure's (INPUT and FORWARD dropped by default, the SSH whitelist and limit)
    from: manifests/node_base_desktop.pp:54-57
    checks: [the-ipv4-firewall-is-firewall-secure]
  - outcome: the local directories are in place (filesystem_base_desktop), and syslog's file is left to rsyslog (customize_syslog_mode false)
    from: manifests/node_base_desktop.pp:49-52
    checks: [the-local-directories-are-in-place]
  - outcome: the APT helpers are in desktop mode (the desktop surface list, the desktop link) and the relevant-updates script exists
    from: manifests/node_base_desktop.pp:65-78
    checks: [the-apt-helpers-are-in-desktop-mode]
  - outcome: IPv6 input and forwarding are dropped
    from: manifests/node_base_desktop.pp:54-62
    checks: [ipv6-input-and-forward-dropped]
  - outcome: the relevant updates run nightly at 02:00 from root's crontab
    from: manifests/node_base_desktop.pp:65-78
    checks: [nightly-relevant-updates-cron]
  - outcome: logs are forwarded to the configured log target and port
    from: manifests/node_base_desktop.pp:21-24, 80-86
    checks: [logs-forwarded-to-the-log-target]
  - outcome: the GNOME screen lock policy is served (manage_gnome_screenlock)
    from: manifests/node_base_desktop.pp:95-102
    checks: [gnome-lock-policy-served]
  - outcome: the puppet service is enabled and running
    from: manifests/node_base_desktop.pp:104-108
    checks: [puppet-service-enabled-and-running]
  - outcome: the per-user KDE screen lock (screenlock_users)
    from: manifests/node_base_desktop.pp:87-93
    uncovered:
      why: it needs a KDE session environment the GNOME plan node does not have; user_kde_lock_screen's own set exercises it on kubuntu
      lifted_by: "capability: a phase3 set for a node kind other than the class's plan node (kubuntu)"
      evidence: "the fixture leaves screenlock_users empty on gnome; checks/user_kde_lock_screen.yml runs the define in a Plasma session on kubuntu"
  - outcome: the puppet agent daemon running on its interval
    from: manifests/node_base_desktop.pp:104-108
    uncovered:
      why: a real daemon would run the catalog between the harness's two runs; the lab uses a stand-in unit body
      lifted_by: "capability: a harness mode that tolerates a running agent daemon between runs 1 and 2"
      evidence: "node fixture puppet_agent_standin (status.py --standins: node_base_desktop)"
checks:
  - id: ssh-hardened-without-password-or-root-login
    what: ssh_secure runs with the profile's defaults, so sshd refuses passwords and root logins
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "17-18", text: "Boolean $password_authentication            = false,"}
      - {path: manifests/node_base_desktop.pp, lines: "43-46", text: "root_login              => $ssh_allow_root_login,"}
    probe: |
      sshd -T 2>/dev/null | grep -E '^(passwordauthentication|permitrootlogin) ' | sort
    expect: {rc: 0, stdout: "\\Apasswordauthentication no\\npermitrootlogin no\\n\\Z"}

  - id: unattended-upgrades-removed
    what: packages_base runs with unattended_upgrades => false, so the unattended-upgrades package is removed
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "39-41", text: "unattended_upgrades => false,"}
    probe: |
      dpkg-query -W -f '${Status}\n' unattended-upgrades 2>/dev/null | grep -c 'install ok installed' || true
    expect: {rc: 0, stdout: "\\A0\\n\\Z"}

  - id: ipv6-input-and-forward-dropped
    what: the desktop IPv6 policy drops INPUT and FORWARD by default and accepts loopback
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "59", text: "include puppet_infrastructure::firewall_ipv6_drop_policy_desktop"}
    probe: |
      ip6tables -S | grep -E '^-P (INPUT|FORWARD) '
      ip6tables -S INPUT | grep -c -F -- '-i lo'
    expect: {rc: 0, stdout: "\\A-P INPUT DROP\\n-P FORWARD DROP\\n1\\n\\Z"}

  - id: nightly-relevant-updates-cron
    what: root's crontab runs the relevant-updates helper at 02:00
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "71-77", text: "cron { 'apt_update_relevant_daily':"}
    probe: |
      crontab -l -u root 2>/dev/null | grep -F 'apt-update-relevant.sh'
    expect: {rc: 0, stdout: "\\A00 02 \\* \\* \\* /opt/puppet-infrastructure/bin/apt-update-relevant\\.sh\\n\\Z"}

  - id: gnome-lock-policy-served
    what: with manage_gnome_screenlock, the compiled dconf system database answers the profile's 5-minute lock, enabled, no grace
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "96-101", text: "screenlock_timeout_minutes => $screenlock_timeout_minutes,"}
      - {path: manifests/node_base_desktop.pp, lines: "29", text: "Integer $screenlock_timeout_minutes         = 5,"}
    probe: |
      for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
        DCONF_PROFILE=user /usr/bin/dconf read "$k"
      done
    mismatch:
      varies: >-
        the dconf profile: a profile name that does not exist has no system-db:local line, so the three reads must not
        return the policy's values
      probe: |
        for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
          DCONF_PROFILE=p8-phase3-absent-profile /usr/bin/dconf read "$k"
        done
    expect: {rc: 0, stdout: "\\Auint32 300\\ntrue\\nuint32 0\\n\\Z"}

  - id: puppet-service-enabled-and-running
    what: the profile declares the puppet service running and enabled (desktops run puppet directly); stand-in unit body in the lab
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "104-108", text: "service { 'puppet':"}
    probe: |
      systemctl is-enabled puppet; systemctl is-active puppet
    expect: {rc: 0, stdout: "\\Aenabled\\nactive\\n\\Z"}

  - id: logs-forwarded-to-the-log-target
    what: rsyslog forwards every message over TCP to the profile's log target and port (6514, the default)
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "80-86", text: "target      => $log_target,"}
      - {path: manifests/node_base_desktop.pp, lines: "21-24", text: "Integer $log_port                           = 6514,"}
    probe: |
      grep -oE '^\*\.\*[[:space:]]+@@[^ ;]+' /etc/rsyslog.d/40-forward.conf | sed -E 's/[[:space:]]+/ /'
    expect: {rc: 0, stdout: "\\A\\*\\.\\* @@puppet8master\\.example\\.com:6514\\n\\Z"}

  - id: the-ipv4-firewall-is-firewall-secure
    what: INPUT and FORWARD drop by default, the lab Hiera's one address is whitelisted for SSH, and firewall_secure's limit chain stands
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "54-57", text: "class { 'puppet_infrastructure::firewall_secure':"}
    probe: |
      iptables -S | grep -E '^-P (INPUT|FORWARD) '
      iptables -S INPUT | grep -c -- '--comment "100 SSH whitelist '
      iptables -S LIMIT_OVERALL 2>/dev/null | grep -c -- '--comment "116 SSH LIMIT_OVERALL"'
    expect: {rc: 0, stdout: "\\A-P INPUT DROP\\n-P FORWARD DROP\\n1\\n1\\n\\Z"}

  - id: the-local-directories-are-in-place
    what: filesystem_base_desktop's local, bin and etc directories exist, root-owned 0755
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "49-52", text: "class { 'puppet_infrastructure::filesystem_base_desktop':"}
      - {path: manifests/filesystem_base_desktop.pp, lines: "8-17", text: "$basedirs = [ $localdir, $bindir, $etcdir ]"}
    probe: |
      stat -c '%U %a %n' /opt/puppet-infrastructure /opt/puppet-infrastructure/bin /opt/puppet-infrastructure/etc
    expect: {rc: 0, stdout: "\\Aroot 755 /opt/puppet-infrastructure\\nroot 755 /opt/puppet-infrastructure/bin\\nroot 755 /opt/puppet-infrastructure/etc\\n\\Z"}

  - id: the-apt-helpers-are-in-desktop-mode
    what: >-
      the surface update script holds the desktop list (firefox, not the server's nginx-core or postfix), the desktop
      compatibility link points at it, and the relevant-updates script the nightly cron runs exists, root 0755
    control: negative
    derived_from:
      - {path: manifests/node_base_desktop.pp, lines: "65-68", text: "server_mode      => false,"}
      - {path: manifests/filesystem_apt.pp, lines: "72-81", text: "target  => \"${localdir}/bin/apt-update-surface.sh\","}
    probe: |
      s=$(grep '^SURFACE=' /opt/puppet-infrastructure/bin/apt-update-surface.sh)
      for p in nginx-core postfix firefox; do case " ${s#SURFACE=\"} " in *" $p "*|*" $p\""*) echo "$p listed";; *) echo "$p not listed";; esac; done
      readlink /opt/puppet-infrastructure/bin/apt-update-surface-desktop.sh
      stat -c '%U %a' /opt/puppet-infrastructure/bin/apt-update-relevant.sh
    expect: {rc: 0, stdout: "\\Anginx-core not listed\\npostfix not listed\\nfirefox listed\\n/opt/puppet-infrastructure/bin/apt-update-surface\\.sh\\nroot 755\\n\\Z"}

