# Phase 3 checks for puppet_infrastructure::nginx_static (class; required_base nginx_base). The wrapper includes
# nginx_default_removal and declares nginx_static_domain { $domain: } with its own parameters. Fixture (params, never
# committed): domain p8test.example.com, www_root /var/www/html; every other parameter at its default (ssl false,
# redirects false, server_default_create true, redirect_default false).
# Resulting servers (nginx_static_domain.pp at the baseline): static_http_<domain> (port 80, server_name <domain>,
# www_root) and static_default_<domain> (port 80, default_server, return 404); no redirector, no HTTPS server.
# Unlike nginx_static_domain's HTTPS fixture, port 80 here has two servers, so the Host header discriminates.
# Probes talk to the node's own nginx on 127.0.0.1 only.
# 2026-11-21 (backfill batch 8): purpose and outcomes (HQ rulings 2 and C1), and a directory without an index is not listed.
class: nginx_static
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  Serves a domain's static content over nginx with the class's defaults: plain HTTP from the web root, a default
  server that answers any other host with 404, no directory listing, and the distribution's default site removed.
outcomes:
  - outcome: nginx accepts the configuration and serves the domain's files from the web root over plain HTTP
    from: manifests/nginx_static.pp:46-76
    checks: [nginx-config-valid, http-serves-www-root-for-the-domain]
  - outcome: any other host gets 404 from the default server, and the distribution's default site is gone
    from: manifests/nginx_static.pp:27-28, 49
    checks: [other-hosts-get-404, package-default-site-removed]
  - outcome: a directory without an index is not listed
    from: manifests/nginx_static.pp:30, 62
    checks: [a-directory-is-not-listed]
  - outcome: TLS, redirects, directory listing on, an IP whitelist or extra TLS settings
    from: manifests/nginx_static.pp:15-45
    uncovered:
      why: one set holds one params fixture (plain HTTP, the defaults); nginx_static_domain's set exercises the HTTPS combination of the same define
      lifted_by: "capability: more than one params fixture per set"
      evidence: "phase3.py applies the class once with its single `fixture` (params or defaults); checks/nginx_static_domain.yml covers ssl, the redirect and the TLS policy"
checks:
  - id: nginx-config-valid
    what: the nginx configuration the wrapper produces passes `nginx -t`
    control: negative
    derived_from:
      - {path: manifests/nginx_static.pp, lines: "51-53", text: "puppet_infrastructure::nginx_static_domain { $domain:"}
    probe: nginx -t 2>&1
    expect: {rc: 0, stdout: "test is successful"}

  - id: http-serves-www-root-for-the-domain
    what: plain HTTP for the domain serves files from www_root byte for byte (ssl false, no redirect)
    control: negative
    derived_from:
      - {path: manifests/nginx_static.pp, lines: "53", text: "www_root                  => $www_root,"}
      - {path: manifests/nginx_static_domain.pp, lines: "141-143", text: "$http_ensure  = 'present'"}
      - {path: manifests/nginx_static_domain.pp, lines: "287-291", text: "nginx::resource::server { \"static_http_${domain}\":"}
    probe: |
      f=$(find /var/www/html -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -1)
      test -n "$f" || { echo "no file in www_root"; exit 1; }
      a=$(curl -s --max-time 5 -H 'Host: p8test.example.com' "http://127.0.0.1/$f" | sha256sum)
      b=$(sha256sum < "/var/www/html/$f")
      test "$a" = "$b" && echo same-content
    mismatch:
      varies: >-
        the Host (p8test-other.example.com): that name has no server of its own, so the default server answers 404 and
        the byte comparison must fail
      probe: |
        f=$(find /var/www/html -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -1)
        test -n "$f" || { echo "no file in www_root"; exit 1; }
        a=$(curl -s --max-time 5 -H 'Host: p8test-other.example.com' "http://127.0.0.1/$f" | sha256sum)
        b=$(sha256sum < "/var/www/html/$f")
        test "$a" = "$b" && echo same-content
    expect: {rc: 0, stdout: "^same-content$"}

  # 2026-11-17 authoring correction (Phase 3 review FAIL, 20261117T015005Z): run 1 asked for a MISSING path
  # (/p8/phase3), which the domain's own server also answers 404, so the 404 was not attributable to the default
  # server; its mismatch varied the Host AND the path, and claimed `/` serves content (it is 403: no index.html,
  # autoindex off). Now both probes request the same EXISTING www_root file and only the Host varies.
  - id: other-hosts-get-404
    what: the default server (server_default_create true, redirect_default false) answers any other Host with 404, even for a file that exists in www_root
    control: negative
    derived_from:
      - {path: manifests/nginx_static_domain.pp, lines: "148-149", text: "true    : { $server_default_ensure = 'present' }"}
      - {path: manifests/nginx_static_domain.pp, lines: "207-212", text: "$default_str = '404'"}
      - {path: manifests/nginx_static_domain.pp, lines: "236-245", text: "listen_options      => 'default_server',"}
    probe: |
      f=$(find /var/www/html -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -1)
      test -n "$f" || { echo "no file in www_root"; exit 1; }
      curl -s -o /dev/null --max-time 5 -w '%{http_code}\n' -H 'Host: p8test-other.example.com' "http://127.0.0.1/$f"
    mismatch:
      varies: >-
        only the Host (p8test.example.com, the domain's own server), same existing file: that server serves it (200),
        so the 404 expectation must fail
      probe: |
        f=$(find /var/www/html -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | head -1)
        test -n "$f" || { echo "no file in www_root"; exit 1; }
        curl -s -o /dev/null --max-time 5 -w '%{http_code}\n' -H 'Host: p8test.example.com' "http://127.0.0.1/$f"
    expect: {rc: 0, stdout: "\\A404\\n\\Z"}

  - id: package-default-site-removed
    what: the distribution's default site is not enabled (nginx_default_removal)
    control: invariant
    why_invariant: the clean node has no nginx (no sites-enabled/default); after apply the class must have removed the one the package installs
    derived_from:
      - {path: manifests/nginx_static.pp, lines: "49", text: "include puppet_infrastructure::nginx_default_removal"}
      - {path: manifests/nginx_default_removal.pp, lines: "3-4", text: "file { '/etc/nginx/sites-enabled/default':"}
    probe: |
      test -e /etc/nginx/sites-enabled/default && echo default-site-present || echo no-default-site
    expect: {rc: 0, stdout: "\\Ano-default-site\\n\\Z"}

  - id: a-directory-is-not-listed
    what: a request for a directory in the web root that has no index answers 403, not a listing (allow_directory_listing false)
    control: negative
    derived_from:
      - {path: manifests/nginx_static.pp, lines: "30", text: "Boolean $allow_directory_listing = false,"}
    mutates: creates /var/www/html/p8test-dir with one file p8test.txt (no index)
    probe: |
      install -d -m 0755 /var/www/html/p8test-dir; echo p8test > /var/www/html/p8test-dir/p8test.txt
    effect: |
      curl -s --max-time 5 -H 'Host: p8test.example.com' -w '\nHTTP %{http_code}\n' http://127.0.0.1/p8test-dir/ | grep -E '^HTTP [0-9]+$|Index of'
    expect: {rc: 0, stdout: "\\AHTTP 403\\n\\Z"}

