# Phase 3 checks for puppet_infrastructure::gnome_lock_screen (class, parameter defaults: no params file).
# Defaults: screenlock_timeout_minutes 5 -> idle-delay 300 s, screenlock_grace_seconds 0. The class installs dconf-cli,
# writes the system dconf profile, keyfile and locks, and refreshes `dconf update`, which compiles /etc/dconf/db/local.
# The node has no GNOME session: the probes read the COMPILED system database with `dconf read` (it reads the database
# files directly), which proves the refresh-only `dconf update` ran. That the desktop really locks after 5 minutes needs
# a desktop session and is not tested here.
# Purpose and outcomes added 2026-11-19 (backfill batch 5, HQ batch-10 rulings 2 and C1), with the enforcement as
# behaviour: a desktop account, in its own D-Bus session (dbus-run-session, dconf-service installed if absent: the
# writer every GNOME desktop has), cannot override the locked keys, while it can write a key the class does not lock.
class: gnome_lock_screen
baseline: release-0.9.10 (cf477c6)
fixture: defaults
authoring:
  minutes: 0.3
  notes: "Wall clock 2026-11-16T12:46:14Z to 12:46:32Z (written + validated), while the Phase 1 review ran. Extended 2026-11-19 (purpose, outcomes, the user override as behaviour): 18:47:30Z (date at the start of reading the set) to 18:48:14Z (validation); all three locked keys tried at 18:54:55Z (one command's dates); not prototyped on a node."
purpose: >-
  Enforces a GNOME screen lock policy through the system dconf database: the session goes idle after the timeout
  (5 minutes by default), the screen locks with no grace period, and users cannot change these settings.
outcomes:
  - outcome: dconf-cli is installed and the dconf profile stacks the user database over the system database local
    from: manifests/gnome_lock_screen.pp:11-45
    checks: [dconf-cli-installed, profile-uses-system-db-local]
  - outcome: the system database sets idle-delay 300 (5 minutes), lock-enabled true and lock-delay 0, compiled by dconf update
    from: manifests/gnome_lock_screen.pp:5-9, 47-78, 94-98
    checks: [keyfile-and-locks-rendered, compiled-db-serves-the-policy]
  - outcome: a user cannot override the three locked keys, while a key the class does not lock stays writable
    from: manifests/gnome_lock_screen.pp:1-3, 55-61, 80-92
    checks: [keyfile-and-locks-rendered, a-user-cannot-override-the-locked-keys]
  - outcome: a GNOME session actually locking after 5 idle minutes
    from: manifests/gnome_lock_screen.pp:1-3
    uncovered: {why: "needs a running GNOME session; the runner starts only a Plasma session (kubuntu), and the plan's node has no desktop", lifted_by: gnome}
  - outcome: another timeout or grace period
    from: manifests/gnome_lock_screen.pp:5-6
    uncovered: {why: "parameter variants (one set holds one fixture, the defaults); untested", lifted_by: ubuntu}
checks:
  - id: dconf-cli-installed
    what: the dconf-cli package is installed
    control: negative
    derived_from:
      - {path: manifests/gnome_lock_screen.pp, lines: "11-13", text: "package { 'dconf-cli':"}
    probe: dpkg-query -W -f='${Status}\n' dconf-cli 2>&1
    expect: {rc: 0, stdout: "\\Ainstall ok installed\\n\\Z"}

  - id: profile-uses-system-db-local
    what: the dconf profile `user` stacks the user db over the system db `local`, 0644 root:root
    control: negative
    derived_from:
      - {path: manifests/gnome_lock_screen.pp, lines: "38-45", text: "content => \"user-db:user\\nsystem-db:local\\n\","}
    probe: |
      stat -c '%a %U %G' /etc/dconf/profile/user
      cat /etc/dconf/profile/user
    expect: {rc: 0, stdout: "\\A644 root root\\nuser-db:user\\nsystem-db:local\\n\\Z"}

  - id: keyfile-and-locks-rendered
    what: the keyfile sets idle-delay 300, lock-enabled true, lock-delay 0, and the locks file locks exactly those three keys
    control: negative
    derived_from:
      - {path: manifests/gnome_lock_screen.pp, lines: "5-9", text: "$screenlock_timeout_seconds = $screenlock_timeout_minutes * 60"}
      - {path: manifests/gnome_lock_screen.pp, lines: "63-75", text: "idle-delay=uint32 ${screenlock_timeout_seconds}"}
      - {path: manifests/gnome_lock_screen.pp, lines: "80-89", text: "/org/gnome/desktop/screensaver/lock-delay"}
    probe: |
      cat /etc/dconf/db/local.d/00-screenlock
      echo ---
      cat /etc/dconf/db/local.d/locks/00-screenlock
    expect:
      rc: 0
      stdout: "\\A\\[org/gnome/desktop/session\\]\\nidle-delay=uint32 300\\n\\n\\[org/gnome/desktop/screensaver\\]\\nlock-enabled=true\\nlock-delay=uint32 0\\n---\\n/org/gnome/desktop/session/idle-delay\\n/org/gnome/desktop/screensaver/lock-enabled\\n/org/gnome/desktop/screensaver/lock-delay\\n\\Z"

  - id: compiled-db-serves-the-policy
    what: the compiled system database answers the three keys with the class's values (dconf update ran)
    control: negative
    derived_from:
      - {path: manifests/gnome_lock_screen.pp, lines: "94-98", text: "command     => '/usr/bin/dconf update',"}
      - {path: manifests/gnome_lock_screen.pp, lines: "63-78", text: "notify  => Exec['dconf_update_screenlock'],"}
    probe: |
      for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
        DCONF_PROFILE=user /usr/bin/dconf read "$k"
      done
    mismatch:
      varies: >-
        the dconf profile: a profile name that does not exist has no system-db:local line, so the values cannot come
        from the compiled system database and the three reads must not return the class's values
      probe: |
        for k in /org/gnome/desktop/session/idle-delay /org/gnome/desktop/screensaver/lock-enabled /org/gnome/desktop/screensaver/lock-delay; do
          DCONF_PROFILE=p8-phase3-absent-profile /usr/bin/dconf read "$k"
        done
    expect: {rc: 0, stdout: "\\Auint32 300\\ntrue\\nuint32 0\\n\\Z"}

  - id: a-user-cannot-override-the-locked-keys
    what: >-
      a desktop account, in its own D-Bus session, is refused when it writes each of the three locked keys and can
      write text-scaling-factor (not locked); the three keys still read the class's values
    control: negative
    timeout: 300
    derived_from:
      - {path: manifests/gnome_lock_screen.pp, lines: "80-92", text: "/org/gnome/desktop/session/idle-delay"}
      - {path: manifests/gnome_lock_screen.pp, lines: "1-3", text: "# Enforce GNOME screen lock policy using system dconf settings."}
    mutates: >-
      installs dconf-service if absent (the dconf writer a GNOME desktop has), creates the account p8testdesk, and as it
      runs two dconf writes in a dbus-run-session (its own user database under ~/.config/dconf); the results go to
      /run/p8test-dconf/user.txt
    probe: |
      dpkg-query -W -f '${Status}' dconf-service 2>/dev/null | grep -q 'install ok installed' || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install dconf-service >/dev/null 2>&1
      id p8testdesk >/dev/null 2>&1 || useradd -m -s /bin/bash p8testdesk
      install -d -m 0755 /run/p8test-dconf
      cd /tmp && runuser -u p8testdesk -- dbus-run-session -- sh -c '
        for kv in "session/idle-delay uint32 9999" "screensaver/lock-enabled false" "screensaver/lock-delay uint32 600"; do
          set -- $kv; k=/org/gnome/desktop/$1; shift
          if dconf write "$k" "$*" 2>/dev/null; then echo "$k written"; else echo "$k refused"; fi
        done
        if dconf write /org/gnome/desktop/interface/text-scaling-factor 1.25 2>/dev/null; then echo "unlocked key written"; else echo "unlocked key refused"; fi
        for k in session/idle-delay screensaver/lock-enabled screensaver/lock-delay interface/text-scaling-factor; do echo "$k $(dconf read /org/gnome/desktop/$k)"; done
      ' > /run/p8test-dconf/user.txt 2>&1
    effect: |
      cat /run/p8test-dconf/user.txt
    expect: {rc: 0, stdout: "\\A/org/gnome/desktop/session/idle-delay refused\\n/org/gnome/desktop/screensaver/lock-enabled refused\\n/org/gnome/desktop/screensaver/lock-delay refused\\nunlocked key written\\nsession/idle-delay uint32 300\\nscreensaver/lock-enabled true\\nscreensaver/lock-delay uint32 0\\ninterface/text-scaling-factor 1\\.25\\n\\Z"}
