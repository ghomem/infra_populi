# Phase 3 checks for puppet_infrastructure::user_samba (define; harness title p8testuser; MOCK-APPLY: node fixture
# samba_dc_standin stands in for Zentyal's create-user.pl / set-user-samba-hash.sh and Samba's pdbedit / ldbsearch,
# keeping a fake store under /var/tmp/p8test_samba_standin). Fixture (params, never committed): myname "P8 Testuser",
# mysmbhash a fake base64 value.
# What the stand-in store shows: the define split the name and passed user, first name, last name and hash to the two
# commands, in that order. NOT shown (mock-apply): a real Samba DC account.
class: user_samba
baseline: release-0.9.10 (cf477c6)
fixture: params
checks:
  - id: user-created-with-split-name
    what: create-user.pl received the user and the first and last parts of myname
    control: negative
    derived_from:
      - {path: manifests/user_samba.pp, lines: "6-8", text: "$separate_name = split($myname, ' ')"}
      - {path: manifests/user_samba.pp, lines: "11", text: "command => \"create-user.pl $username ${first_name} ${last_name} ${mysmbhash}\","}
    probe: cat /var/tmp/p8test_samba_standin/users
    expect: {rc: 0, stdout: "\\Ap8testuser P8 Testuser\\n\\Z"}

  - id: samba-hash-set-for-the-user
    what: set-user-samba-hash.sh received the names and the given hash, which the store holds for the user
    control: negative
    derived_from:
      - {path: manifests/user_samba.pp, lines: "18", text: "command => \"set-user-samba-hash.sh ${first_name} ${last_name} ${mysmbhash}\","}
    probe: cat /var/tmp/p8test_samba_standin/hash.p8testuser
    expect: {rc: 0, stdout: "\\AIgBQADgAdABlAHMAdAB1AHMAZQByACEAMgAwADIANgAiAA==\\n\\Z"}
