# Phase 3 checks for puppet_infrastructure::extra_packages_el (class; routed to the rhel9 node: RHEL 9.5, registered,
# BaseOS + AppStream enabled at the baseline, CodeReady Builder available but off, no content overrides).
# Fixture: none. The revert clears content overrides after every restore (an enabled repository survives a snapshot
# restore on the subscription server), so the clean node starts with CRB off.
# 2026-11-23 (the sweep, HQ 2026-11-23 ruling 1d): the RHEL 8 row names what is missing, with its evidence.
class: extra_packages_el
baseline: release-0.9.10 (cf477c6)
fixture: defaults
purpose: >-
  Makes the extra package sources of a RHEL node available: the EPEL repository for the node's major version and Red
  Hat's CodeReady Builder repository, so packages from either can be installed, without touching the base repositories.
# Purpose and outcomes table added 2026-11-19 (backfill batch 4, HQ batch-10 rulings 2 and C1), with installs from each
# repository as behaviour (the set read repository state only).
outcomes:
  - outcome: EPEL is installed and enabled for the node's major version, and a package from it installs
    from: manifests/extra_packages_el.pp:6-11
    checks: [epel-release-installed, an-epel-package-installs-from-epel]
  - outcome: CodeReady Builder is enabled for the node's major version and architecture, and a package from it installs
    from: manifests/extra_packages_el.pp:13-19
    checks: [codeready-builder-enabled, a-codeready-builder-package-installs-from-it]
  - outcome: the base repositories (BaseOS, AppStream) stay enabled
    from: manifests/extra_packages_el.pp:13-19
    checks: [baseos-appstream-still-enabled]
  - outcome: the same on RHEL 8
    from: manifests/extra_packages_el.pp:3-4
    uncovered:
      why: the lab has a RHEL 9 node only, so the RHEL 8 branch of the package list is not applied anywhere
      lifted_by: "capability: a RHEL 8 node kind in nodes.yml"
      evidence: >-
        nodes.py list (2026-11-23): ubuntu, rhel9, kubuntu, gnome, ubuntu2, dc and puppetserver; no RHEL 8 kind, active or
        planned
checks:
  - id: epel-release-installed
    what: the EPEL release package for the node's major version is installed and its repository is enabled
    control: negative
    derived_from:
      - {path: manifests/extra_packages_el.pp, lines: "6-10", text: "command => \"sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-${os_major_version}.noarch.rpm\","}
    probe: |
      rpm -q --qf '%{NAME} %{VERSION}\n' epel-release
      dnf -q repolist --enabled epel | tail -n +2 | awk '{print $1}'
    expect: {rc: 0, stdout: "\\Aepel-release 9\\nepel\\n\\Z"}

  - id: codeready-builder-enabled
    what: CodeReady Builder for the node's major version and architecture is enabled through subscription-manager
    control: negative
    derived_from:
      - {path: manifests/extra_packages_el.pp, lines: "13-16", text: "command => \"sudo subscription-manager repos --enable \\\"codeready-builder-for-rhel-${os_major_version}-${os_architecture}-rpms\\\"\","}
    probe: |
      subscription-manager repos --list-enabled | grep -o 'codeready-builder-for-rhel-[0-9]*-[a-z0-9_]*-rpms'
      dnf -q repolist --enabled | awk '{print $1}' | grep -x 'codeready-builder-for-rhel-9-x86_64-rpms'
    expect: {rc: 0, stdout: "\\Acodeready-builder-for-rhel-9-x86_64-rpms\\ncodeready-builder-for-rhel-9-x86_64-rpms\\n\\Z"}

  - id: baseos-appstream-still-enabled
    what: the class adds repositories and removes none (BaseOS and AppStream stay enabled)
    control: invariant
    why_invariant: the registered baseline enables BaseOS and AppStream; the class only enables more
    derived_from:
      - {path: manifests/extra_packages_el.pp, lines: "13-16", text: "unless  => \"subscription-manager repos --list-enabled | grep -q 'codeready-builder-for-rhel-${os_major_version}-${os_architecture}-rpms'\","}
    probe: |
      subscription-manager repos --list-enabled | grep -oE 'rhel-9-for-x86_64-(baseos|appstream)-rpms' | sort
    expect: {rc: 0, stdout: "\\Arhel-9-for-x86_64-appstream-rpms\\nrhel-9-for-x86_64-baseos-rpms\\n\\Z"}

  - id: an-epel-package-installs-from-epel
    what: a package only EPEL carries (htop) installs, and dnf records EPEL as where it came from
    control: negative
    timeout: 300
    derived_from:
      - {path: manifests/extra_packages_el.pp, lines: "6-11", text: "# Install the EPEL release package for RHEL 8 or 9"}
    mutates: installs the package htop on the node with dnf
    probe: |
      dnf -q -y install htop >/dev/null 2>&1
    effect: |
      dnf -q repoquery --installed --qf '%{name} from %{from_repo}' htop 2>/dev/null
    expect: {rc: 0, stdout: "\\Ahtop from epel\\n\\Z"}

  - id: a-codeready-builder-package-installs-from-it
    what: a package from CodeReady Builder (ninja-build) installs, and dnf records that repository as where it came from
    control: negative
    timeout: 300
    derived_from:
      - {path: manifests/extra_packages_el.pp, lines: "13-19", text: "# Enable the CodeReady Builder repository for RHEL 8 or 9"}
    mutates: installs the package ninja-build on the node with dnf
    probe: |
      dnf -q -y install ninja-build >/dev/null 2>&1
    effect: |
      dnf -q repoquery --installed --qf '%{name} from %{from_repo}' ninja-build 2>/dev/null
    expect: {rc: 0, stdout: "\\Aninja-build from codeready-builder-for-rhel-9-x86_64-rpms\\n\\Z"}
