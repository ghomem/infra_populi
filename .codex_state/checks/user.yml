# Phase 3 checks for puppet_infrastructure::user (define; harness title p8testuser, the user-identity fixture).
# The define is a thin wrapper: it passes its parameters to puppet_infrastructure::user_base and cannot pass
# ignorekey, so user_base's default (ignorekey false) applies and the SSH key IS pushed.
# Fixture (params, never committed): myname "P8 Test User", myhash the SHA-512 hash (salt p8testsalt) of the test
# password p8test-user-not-a-secret (a fake hash until 2026-11-19), mykey = the body of a throwaway RSA public key generated for the fixture (private
# half discarded); defaults: mygrouplist [], myhome '', myhomemode '', user_shell /bin/bash.
# Purpose and outcomes added 2026-11-19 (backfill batch 5, HQ batch-10 rulings 2 and C1), with the password login as
# behaviour (su as an unprivileged account in a pty, as in user_base's set). What user_base does on its own (the purge
# of other keys, the empty-hash refusal, the variants) is checked in user_base's set.
# Correction round 1, 2026-11-19 (review 20261119T180604Z FAIL, purpose): 'no ecryptfs' was in the purpose but in no
# outcome row; a check now shows the account exists and no ecryptfs passphrase file was written for it.
# Correction round 2, 2026-11-19 (review 20261119T181328Z FAIL, purpose): my uncovered row said the variants are
# checked in user_base's set, which is untrue (that set leaves them untested too); the row is split into what
# user_base's set covers, the untested variants, and a login with the pushed key.
class: user
baseline: release-0.9.10 (cf477c6)
fixture: params
authoring:
  minutes: 0.7
  notes: "Wall clock 18:52:30Z to 18:53:14Z 2026-11-16, written + validated outside the worktree while the Phase 1 review ran. Extended 2026-11-19 (purpose, outcomes, the password login): 17:43:06Z (the fixture hash changed) to 17:43:23Z (validation). Correction round 1: written and validated 18:07:36Z (one command's dates; reading the review before it was not timed). Correction round 2: written and validated 18:14:56Z (one command's dates; reading the review before it was not timed)."
purpose: >-
  A normal user, in no special group: user_base's account (own primary group, comment, home, shell) with the given
  password hash and the given SSH key, always pushed (the wrapper cannot pass ignorekey) and with no ecryptfs.
outcomes:
  - outcome: the account exists with its own primary group, comment, home (created, owned) and shell, in no other group
    from: manifests/user.pp:1-2, 6-8
    checks: [user-and-own-primary-group, no-supplementary-groups, home-created-and-owned]
  - outcome: the given password hash is set, so the password logs in and a wrong one is refused
    from: manifests/user.pp:6-8
    checks: [password-hash-set, the-password-logs-in-and-a-wrong-one-is-refused]
  - outcome: the given key is always pushed, as the user's only key, in a private file the user owns
    from: manifests/user.pp:6-8
    checks: [the-given-key-is-pushed, key-file-owned-and-private]
  - outcome: no ecryptfs passphrase is managed (the wrapper cannot pass myppsigs or myppwrapped)
    from: manifests/user.pp:6-8
    checks: [no-ecryptfs-passphrase-files]
  - outcome: user_base's own behaviour behind the wrapper, the purge of other keys and the empty-hash refusal
    from: manifests/user.pp:5, 8
    uncovered: {why: "checked in user_base's set: the purge by a check after an agent run, the refusal by a compile-only run (compile time); this wrapper passes the same parameters on", lifted_by: ubuntu}
  - outcome: a login with the pushed key
    from: manifests/user.pp:6-8
    uncovered: {why: "the private half of the fixture key would have to be on the node, and the repository keeps no private keys; the key line, owner and modes are checked instead, as in user_base's set", lifted_by: ubuntu}
  - outcome: the parameter variants the wrapper passes on (a group list, another home, a home mode, another shell) and the locked or keyless placeholders
    from: manifests/user.pp:6-8
    uncovered: {why: "parameter variants (one set holds one params fixture); untested here and in user_base's set", lifted_by: ubuntu}
checks:
  - id: user-and-own-primary-group
    what: the wrapped user exists with its own same-named primary group, the comment, /home/<title> and /bin/bash
    control: negative
    derived_from:
      - {path: manifests/user.pp, lines: "8", text: "puppet_infrastructure::user_base { $title : myname => $myname, myhash => $myhash , mykey => $mykey, mygrouplist => $mygrouplist, myhome => $myhome, myhomemode => $myhomemode, user_shell => $user_shell }"}
      - {path: manifests/user_base.pp, lines: "26", text: "$myprimary = $title"}
    probe: |
      IFS=: read -r name _ uid gid gecos home shell < <(getent passwd p8testuser)
      echo "$name|$gecos|$home|$shell"
      echo "primary group: $(getent group "$gid" | cut -d: -f1)"
    expect: {rc: 0, stdout: "\\Ap8testuser\\|P8 Test User\\|/home/p8testuser\\|/bin/bash\\nprimary group: p8testuser\\n\\Z"}

  - id: no-supplementary-groups
    what: the wrapper's default empty group list leaves the user in its own group only
    control: negative
    derived_from:
      - {path: manifests/user.pp, lines: "6", text: "$mygrouplist = [ ]"}
      - {path: manifests/user_base.pp, lines: "65", text: "groups         => $mygrouplist ,"}
    probe: id -nG p8testuser
    expect: {rc: 0, stdout: "\\Ap8testuser\\n\\Z"}

  - id: home-created-and-owned
    what: the home directory is created (managehome) and owned by the user
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "69", text: "managehome     => true,"}
    probe: stat -c '%U %G %F' /home/p8testuser
    expect: {rc: 0, stdout: "\\Ap8testuser p8testuser directory\\n\\Z"}

  - id: password-hash-set
    what: the shadow entry carries the fixture's SHA-512 hash (asserted by algorithm and salt only)
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "71", text: "password       => $myhash,"}
    probe: |
      getent shadow p8testuser | cut -d: -f2 | cut -d'$' -f1-3
    expect: {rc: 0, stdout: "\\A\\$6\\$p8testsalt\\n\\Z"}

  - id: the-given-key-is-pushed
    what: >-
      the user's key is pushed (the wrapper cannot set ignorekey): exactly one authorized key, type ssh-rsa, comment
      <title>@puppet, carrying the fixture key (an RSA public key body) and not a placeholder (userlocked/emptykey)
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "58", text: "$sshkey = $mykey"}
      - {path: manifests/user_base.pp, lines: "94", text: "if ( $ignorekey == false ) {"}
      - {path: manifests/user_base.pp, lines: "96-99", text: "ssh_authorized_key { \"${myusername}@puppet\" :"}
      - {path: manifests/user_base.pp, lines: "98", text: "type => 'ssh-rsa',"}
    probe: |
      grep -v '^#' /home/p8testuser/.ssh/authorized_keys | grep -v '^$'
    expect: {rc: 0, stdout: "\\Assh-rsa AAAAB3NzaC1yc2EAAAADAQAB[A-Za-z0-9+/=]{200,} p8testuser@puppet\\n\\Z"}

  - id: key-file-owned-and-private
    what: the pushed key file belongs to the user, and it and ~/.ssh are private (the ssh_authorized_key resource)
    control: negative
    derived_from:
      - {path: manifests/user_base.pp, lines: "96-99", text: "user => $myusername,"}
    probe: stat -c '%U %a %n' /home/p8testuser/.ssh /home/p8testuser/.ssh/authorized_keys
    expect: {rc: 0, stdout: "\\Ap8testuser 700 /home/p8testuser/\\.ssh\\np8testuser 600 /home/p8testuser/\\.ssh/authorized_keys\\n\\Z"}

  - id: the-password-logs-in-and-a-wrong-one-is-refused
    what: >-
      su to p8testuser, run by an unprivileged account in a pty, succeeds with the test password and is refused with a
      wrong one
    control: negative
    timeout: 90
    derived_from:
      - {path: manifests/user.pp, lines: "8", text: "myhash => $myhash ,"}
      - {path: manifests/user_base.pp, lines: "63-72", text: "password       => $myhash,"}
    mutates: two su attempts as the account nobody (one with the test password, one with a wrong one); the outcomes go to /run/p8test-user/pw.txt
    probe: |
      install -d -m 0700 /run/p8test-user; : > /run/p8test-user/pw.txt
      for pw in 'p8test-user-not-a-secret' 'p8test-wrong-password'; do
        out=$( (sleep 2; printf '%s\n' "$pw"; sleep 3) | timeout 20 runuser -u nobody -- script -qec "su p8testuser -c 'echo logged-in-as-\$(id -un)'" /dev/null 2>&1 | tr -d '\r' | grep -o -e 'logged-in-as-[a-z0-9]*' -e 'Authentication failure' | head -1)
        echo "${out:-no answer}" >> /run/p8test-user/pw.txt
      done
    effect: |
      cat /run/p8test-user/pw.txt
    expect: {rc: 0, stdout: "\\Alogged-in-as-p8testuser\\nAuthentication failure\\n\\Z"}

  - id: no-ecryptfs-passphrase-files
    what: >-
      the account exists and nothing was written under /home/.ecryptfs/p8testuser (user_base's wrapped-passphrase file
      and its decoding exec are declared only when both ecryptfs parameters are given, which this wrapper cannot pass)
    control: negative
    derived_from:
      - {path: manifests/user.pp, lines: "8", text: "puppet_infrastructure::user_base { $title : myname => $myname, myhash => $myhash , mykey => $mykey, mygrouplist => $mygrouplist, myhome => $myhome, myhomemode => $myhomemode, user_shell => $user_shell }"}
      - {path: manifests/user_base.pp, lines: "108", text: "if( $ppsigs != '' ) and ( $ppwrapped != '' ) {"}
    probe: |
      getent passwd p8testuser >/dev/null && echo account-exists
      find /home/.ecryptfs/p8testuser -type f 2>/dev/null | wc -l
    expect: {rc: 0, stdout: "\\Aaccount-exists\\n0\\n\\Z"}
