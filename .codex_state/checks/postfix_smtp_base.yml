# Phase 3 checks for puppet_infrastructure::postfix_smtp_base (class). Fixture (params, never committed):
# smtp_hostname smtp.p8test.example.com, smtp_sslprefix p8test (the master's throwaway p8test PKI via ssl_postfix),
# postfix_port 587, smtp_users [p8testuser with the fake {PLAIN} password p8test-not-a-secret], allowed_client_ips
# [127.0.0.1], one allowed MAIL FROM address for p8testuser; extra_sec and letsencrypt_certificate false.
# Probes talk to the node's own postfix and dovecot on 127.0.0.1 only.
# 2026-11-21 (backfill batch 8): purpose and outcomes (HQ rulings 2 and C1), and the restrictions as behaviour. The params
# fixture (local) now also holds a second SASL user p8testuser2 and a second allowed address
# p8test-other@p8test.example.com owned by it, so the sender-login rule has an address another user owns. The unlisted
# client is the node's own ::1 (inet_protocols = all; client_access lists 127.0.0.1 only). Prototyped on the node.
# Correction round 1, 2026-11-21 (review 20261121T052303Z, purpose): plaintext tried (TLS mandatory) and a system
# account tried (an OS user p8testsys whose password the OS accepts through PAM, refused by dovecot and SMTP AUTH).
# Correction round 2, 2026-11-21 (review 20261121T053246Z, purpose; the last round, production use 0): a full
# submission queued and delivered to root's local mailbox; onward relay to a remote MX as an uncovered row.
class: postfix_smtp_base
baseline: release-0.9.10 (cf477c6)
fixture: params
purpose: >-
  An SMTP submission server with TLS and layered restrictions: only listed client IPs may use it, only its own SASL
  users (dovecot's passwd-file, not system accounts) may send, only MAIL FROM addresses in a general list are allowed,
  and each address only for the users configured for it; TLS is mandatory.
outcomes:
  - outcome: smtpd listens on the configured port, greets with the configured host name and presents the site's certificate over STARTTLS
    from: templates/postfix_smtp_base/master.cf.erb; templates/postfix_smtp_base/main.cf.erb:10, 23-30, 75
    checks: [smtpd-on-the-configured-port-with-the-hostname, starttls-presents-the-sslprefix-bundle]
  - outcome: the configured SASL users authenticate through dovecot, and the client-access map lists the allowed IPs
    from: manifests/postfix_smtp_base.pp:116-133; templates/postfix_smtp_base/sasl_users.erb; templates/postfix_smtp_base/client_access.erb
    checks: [sasl-user-authenticates-through-dovecot, client-access-map-allows-the-listed-ip]
  - outcome: >-
      a listed client, logged in, may send from an address in the general list that it owns (both users, each from its
      own address); refused are an address outside the general list, an address owned by another user, a client that
      is not logged in, a wrong password (535) and a client address that is not listed
    from: templates/postfix_smtp_base/main.cf.erb:94-118; templates/postfix_smtp_base/client_access.erb; templates/postfix_smtp_base/sender_access.erb; templates/postfix_smtp_base/controlled_envelope_senders.erb
    checks: [smtp-restrictions-exercised]
  - outcome: a message submitted by a logged-in user from its own address is queued (250 Ok queued) and, for a local recipient, delivered to the mailbox
    from: templates/postfix_smtp_base/main.cf.erb:76-79; templates/postfix_smtp_base/master.cf.erb:41-42, 60
    checks: [a-submission-is-queued-and-delivered-locally]
  - outcome: onward delivery of a submitted message to a remote domain's MX (relayhost empty)
    from: templates/postfix_smtp_base/main.cf.erb:80
    uncovered:
      why: the lab has no mail exchanger for a fixture domain; a remote recipient's delivery would go to the internet
      lifted_by: "capability: a mail sink inside the lab that the node resolves as a fixture domain's MX"
      evidence: "main.cf.erb:80 relayhost empty (delivery by MX lookup); nodes.yml lists no mail-sink node kind"
  - outcome: TLS is mandatory (no AUTH offered and MAIL FROM and AUTH refused before STARTTLS)
    from: templates/postfix_smtp_base/main.cf.erb:30
    checks: [tls-and-own-users-only]
  - outcome: system accounts cannot authenticate (dovecot's passdb is the passwd-file only; an OS account whose password the OS accepts gets 535)
    from: manifests/postfix_smtp_base.pp:109-114; files/postfix_smtp_base/10-auth.conf:122-125
    checks: [tls-and-own-users-only]
  - outcome: the From-header warning (smtp_header_checks) for addresses outside do_not_warn_from_addresses_regexes
    from: manifests/postfix_smtp_base.pp:166-176; templates/postfix_smtp_base/smtp_header_checks.regexp.erb; templates/postfix_smtp_base/main.cf.erb:121
    uncovered:
      why: >-
        smtp_header_checks applies to postfix's SMTP client, i.e. outgoing deliveries (relayhost empty: straight to the
        recipient's MX), which the lab makes to no outside host; and the fixture keeps the default empty regex list,
        with which the rule's negated match never fires
      lifted_by: "capability: a mail sink the node delivers to inside the lab (MX for a fixture domain), with a second params fixture setting do_not_warn_from_addresses_regexes"
      evidence: "main.cf.erb:121 smtp_header_checks (not smtpd_); main.cf.erb:80 relayhost empty; the params fixture sets no do_not_warn_from_addresses_regexes"
  - outcome: the extra_sec hardening (protocols, ciphers, a generated DH group) and Let's Encrypt-shaped certificate names
    from: manifests/postfix_smtp_base.pp:54-69; templates/postfix_smtp_base/main.cf.erb:37-68
    uncovered:
      why: the fixture sets extra_sec and letsencrypt_certificate false; one set holds one params fixture
      lifted_by: "capability: more than one params fixture per set"
      evidence: "the params fixture: extra_sec false, letsencrypt_certificate false; phase3.py runs a set with one fixture"
checks:
  # 2026-11-17 authoring correction (run 1, 20261117T023815Z, FINDINGS): the probe called smtplib.SMTP.getwelcome(),
  # which does not exist (AttributeError after a successful connect); the banner is now read from a plain socket.
  - id: smtpd-on-the-configured-port-with-the-hostname
    what: postfix's smtpd listens on postfix_port and greets with myhostname = smtp_hostname
    control: negative
    derived_from:
      - {path: templates/postfix_smtp_base/master.cf.erb, lines: "12", text: "<%=@postfix_port%>      inet  n       -       y       -       -       smtpd"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "75", text: "myhostname = <%=@smtp_hostname%>"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "10", text: "smtpd_banner = $myhostname ESMTP $mail_name (Ubuntu)"}
    probe: |
      python3 -c "import socket; s = socket.create_connection(('127.0.0.1', 587), 5); print(s.recv(512).decode().strip()); s.close()"
    expect: {rc: 0, stdout: "\\A220 smtp\\.p8test\\.example\\.com ESMTP Postfix \\(Ubuntu\\)\\n\\Z"}

  - id: starttls-presents-the-sslprefix-bundle
    what: STARTTLS on postfix_port presents the certificate at /etc/ssl/certs/<smtp_sslprefix>.postfix.bundle.crt
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_base.pp, lines: "58-59", text: "$certificate_filename = \"/etc/ssl/certs/${smtp_sslprefix}.postfix.bundle.crt\""}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "23", text: "smtpd_tls_cert_file=<%=@certificate_filename%>"}
    probe: |
      a=$(openssl s_client -starttls smtp -connect 127.0.0.1:587 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
      b=$(openssl x509 -in /etc/ssl/certs/p8test.postfix.bundle.crt -noout -fingerprint -sha256)
      test -n "$a" && test "$a" = "$b" && echo served-cert-is-bundle
    mismatch:
      varies: >-
        only the certificate compared (the first certificate of the system CA bundle instead of the p8test bundle): the
        fingerprints must differ
      probe: |
        a=$(openssl s_client -starttls smtp -connect 127.0.0.1:587 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
        b=$(openssl x509 -in /etc/ssl/certs/ca-certificates.crt -noout -fingerprint -sha256)
        test -n "$a" && test "$a" = "$b" && echo served-cert-is-bundle
    expect: {rc: 0, stdout: "\\Aserved-cert-is-bundle\\n\\Z"}

  - id: sasl-user-authenticates-through-dovecot
    what: dovecot's passdb holds the smtp_users entry, so p8testuser authenticates with its password (postfix uses dovecot SASL)
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_base.pp, lines: "117-121", text: "content   => template('puppet_infrastructure/postfix_smtp_base/sasl_users.erb'),"}
      - {path: templates/postfix_smtp_base/sasl_users.erb, lines: "3", text: "<%=smtp_user['name']%>:<%=smtp_user['password_hash']%>"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "92", text: "smtpd_sasl_type = dovecot"}
    probe: |
      doveadm auth test p8testuser p8test-not-a-secret 2>&1 | grep -E '^passdb: '
    mismatch:
      varies: >-
        only the password (p8test-wrong-password): dovecot must refuse it, so the "auth succeeded" expectation must fail
      probe: |
        doveadm auth test p8testuser p8test-wrong-password 2>&1 | grep -E '^passdb: '
    expect: {rc: 0, stdout: "\\Apassdb: p8testuser auth succeeded\\n\\Z"}

  - id: client-access-map-allows-the-listed-ip
    what: the hashed client_access map (postmap) answers OK for each allowed_client_ips entry
    control: negative
    derived_from:
      - {path: manifests/postfix_smtp_base.pp, lines: "131", text: "puppet_infrastructure::postfix_smtp_base_config_file {'/etc/postfix/client_access':"}
      - {path: manifests/postfix_smtp_base_config_file.pp, lines: "26", text: "command     => \"/usr/sbin/postmap ${name}\","}
      - {path: templates/postfix_smtp_base/client_access.erb, lines: "2-3", text: "<%=allowed_client_ip%> OK"}
    probe: |
      postmap -q 127.0.0.1 hash:/etc/postfix/client_access
    mismatch:
      varies: >-
        only the queried address (127.0.0.2, not in allowed_client_ips): the map has no entry, so OK must not come back
      probe: |
        postmap -q 127.0.0.2 hash:/etc/postfix/client_access
    expect: {rc: 0, stdout: "\\AOK\\n\\Z"}

  - id: smtp-restrictions-exercised
    what: >-
      seven SMTP sessions over STARTTLS, each up to RCPT TO root@localhost and then reset (no mail is queued): the two
      owners from their own addresses are accepted; an unlisted address (554 Access denied), another user's address
      (553 not owned), no login (553 not logged in), a wrong password (535, then 553) and the unlisted client ::1 (554
      Client host rejected) are refused
    control: negative
    timeout: 300
    derived_from:
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "101-103", text: "check_client_access hash:/etc/postfix/client_access"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "107-109", text: "check_sender_access hash:/etc/postfix/sender_access"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "112", text: "smtpd_sender_login_maps = hash:/etc/postfix/controlled_envelope_senders"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "115-118", text: "reject_sender_login_mismatch"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "30", text: "smtpd_tls_security_level = encrypt"}
    mutates: >-
      opens seven SMTP sessions to the node's own postfix (127.0.0.1 and ::1, port 587), logging in as p8testuser or
      p8testuser2 or not at all; each stops at RCPT and resets, so nothing is queued; postfix and dovecot log them; the
      replies go to /run/p8test-smtp/attempts.txt
    probe: |
      install -d -m 0700 /run/p8test-smtp
      python3 - > /run/p8test-smtp/attempts.txt <<'PY'
      import smtplib, ssl
      def attempt(label, host, user, password, sender):
          try:
              s = smtplib.SMTP(host, 587, timeout=30)
              s.ehlo('p8test.invalid'); s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
              auth = 'none'
              if user:
                  try:
                      s.login(user, password); auth = '235'
                  except smtplib.SMTPAuthenticationError as e:
                      auth = str(e.smtp_code)
              mail = s.mail(sender)[0]
              code, msg = s.rcpt('root@localhost')
              s.rset(); s.quit()
              print(f"{label}: auth {auth} mail {mail} rcpt {code} {msg.decode()}")
          except Exception as e:
              print(f"{label}: error {type(e).__name__} {e}")
      attempt('own-address', '127.0.0.1', 'p8testuser', 'p8test-not-a-secret', 'p8test@p8test.example.com')
      attempt('owner-of-the-other', '127.0.0.1', 'p8testuser2', 'p8test-user2-not-a-secret', 'p8test-other@p8test.example.com')
      attempt('not-in-general-list', '127.0.0.1', 'p8testuser', 'p8test-not-a-secret', 'p8test-unlisted@p8test.example.com')
      attempt('owned-by-another', '127.0.0.1', 'p8testuser', 'p8test-not-a-secret', 'p8test-other@p8test.example.com')
      attempt('unauthenticated', '127.0.0.1', None, None, 'p8test@p8test.example.com')
      attempt('wrong-password', '127.0.0.1', 'p8testuser', 'p8test-wrong-password', 'p8test@p8test.example.com')
      attempt('unlisted-client', '::1', 'p8testuser', 'p8test-not-a-secret', 'p8test@p8test.example.com')
      PY
    effect: |
      cat /run/p8test-smtp/attempts.txt
    expect:
      rc: 0
      stdout: "\\Aown-address: auth 235 mail 250 rcpt 250 2\\.1\\.5 Ok\\nowner-of-the-other: auth 235 mail 250 rcpt 250 2\\.1\\.5 Ok\\nnot-in-general-list: auth 235 mail 250 rcpt 554 5\\.7\\.1 <p8test-unlisted@p8test\\.example\\.com>: Sender address rejected: Access denied\\nowned-by-another: auth 235 mail 250 rcpt 553 5\\.7\\.1 <p8test-other@p8test\\.example\\.com>: Sender address rejected: not owned by user p8testuser\\nunauthenticated: auth none mail 250 rcpt 553 5\\.7\\.1 <p8test@p8test\\.example\\.com>: Sender address rejected: not logged in\\nwrong-password: auth 535 mail 250 rcpt 553 5\\.7\\.1 <p8test@p8test\\.example\\.com>: Sender address rejected: not logged in\\nunlisted-client: auth 235 mail 250 rcpt 554 5\\.7\\.1 <ip6-localhost\\[::1\\]>: Client host rejected: Access denied\\n\\Z"

  - id: tls-and-own-users-only
    what: >-
      before STARTTLS the server offers no AUTH and answers MAIL FROM and AUTH with 530 Must issue a STARTTLS command
      first; an OS account (p8testsys) whose password the OS accepts (PAM login) is refused by dovecot's passdb and gets
      535 from SMTP AUTH over TLS
    control: negative
    timeout: 300
    derived_from:
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "30", text: "smtpd_tls_security_level = encrypt"}
      - {path: files/postfix_smtp_base/10-auth.conf, lines: "122", text: "#!include auth-system.conf.ext"}
      - {path: files/postfix_smtp_base/10-auth.conf, lines: "125", text: "!include auth-passwdfile.conf.ext"}
    mutates: >-
      installs pamtester if absent; creates the system account p8testsys (no home, nologin shell, password
      p8test-sys-not-a-secret); opens two SMTP sessions to 127.0.0.1:587 (one plaintext, one over TLS) and runs one PAM
      and one dovecot authentication for p8testsys (logged); the replies go to /run/p8test-smtp/tls-own.txt
    probe: |
      command -v pamtester >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get -qq -y install pamtester >/dev/null 2>&1
      id p8testsys >/dev/null 2>&1 || useradd -M -s /usr/sbin/nologin p8testsys
      echo 'p8testsys:p8test-sys-not-a-secret' | chpasswd
      install -d -m 0700 /run/p8test-smtp
      { printf '%s\n' 'p8test-sys-not-a-secret' | pamtester login p8testsys authenticate >/dev/null 2>&1; echo "os accepts p8testsys rc=$?"
        doveadm auth test p8testsys p8test-sys-not-a-secret 2>&1 | grep -E '^passdb: '
        python3 - <<'PY'
      import smtplib, ssl
      s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
      print('plaintext: auth offered' if s.has_extn('auth') else 'plaintext: auth not offered')
      code, msg = s.mail('p8test@p8test.example.com'); print('plaintext: mail', code, msg.decode())
      code, msg = s.docmd('AUTH', 'PLAIN AHA4dGVzdHVzZXIAcDh0ZXN0LW5vdC1hLXNlY3JldA=='); print('plaintext: auth', code, msg.decode())
      s.quit()
      s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
      s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
      try:
          s.login('p8testsys', 'p8test-sys-not-a-secret'); print('system-account: auth 235')
      except smtplib.SMTPAuthenticationError as e:
          print('system-account: auth', e.smtp_code)
      s.quit()
      PY
      } > /run/p8test-smtp/tls-own.txt
    effect: |
      cat /run/p8test-smtp/tls-own.txt
    expect: {rc: 0, stdout: "\\Aos accepts p8testsys rc=0\\npassdb: p8testsys auth failed\\nplaintext: auth not offered\\nplaintext: mail 530 5\\.7\\.0 Must issue a STARTTLS command first\\nplaintext: auth 530 5\\.7\\.0 Must issue a STARTTLS command first\\nsystem-account: auth 535\\n\\Z"}

  - id: a-submission-is-queued-and-delivered-locally
    what: >-
      p8testuser, logged in over TLS, submits a message from its own address to root@localhost: postfix answers 250
      Ok queued, the local agent delivers it to /var/mail/root (the subject appears there once) and the queue is empty
    control: negative
    timeout: 180
    derived_from:
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "79", text: "mydestination = $myhostname, localhost.localdomain, , localhost"}
      - {path: templates/postfix_smtp_base/master.cf.erb, lines: "60", text: "local     unix  -       n       n       -       -       local"}
      - {path: templates/postfix_smtp_base/main.cf.erb, lines: "115-118", text: "permit_sasl_authenticated"}
    mutates: >-
      submits one message (subject p8test-submission-check) as p8testuser to root@localhost: postfix queues it and
      delivers it to /var/mail/root (created root:mail 0600 if absent), and logs both; the replies go to
      /run/p8test-smtp/submission.txt
    probe: |
      install -d -m 0700 /run/p8test-smtp
      python3 - > /run/p8test-smtp/submission.txt <<'PY'
      import smtplib, ssl
      s = smtplib.SMTP('127.0.0.1', 587, timeout=30); s.ehlo('p8test.invalid')
      s.starttls(context=ssl._create_unverified_context()); s.ehlo('p8test.invalid')
      s.login('p8testuser', 'p8test-not-a-secret')
      s.mail('p8test@p8test.example.com'); s.rcpt('root@localhost')
      code, msg = s.data(b"From: p8test@p8test.example.com\r\nTo: root@localhost\r\nSubject: p8test-submission-check\r\n\r\np8test body\r\n")
      print('data', code, msg.decode()); s.quit()
      PY
      for i in $(seq 1 60); do grep -q '^Subject: p8test-submission-check$' /var/mail/root 2>/dev/null && break; sleep 1; done
    effect: |
      cat /run/p8test-smtp/submission.txt
      p8_count '^Subject: p8test-submission-check$' /var/mail/root
      mailq | tail -1
    expect: {rc: 0, stdout: "\\Adata 250 2\\.0\\.0 Ok: queued as [0-9A-F]+\\n1\\nMail queue is empty\\n\\Z"}

