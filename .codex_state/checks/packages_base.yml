# Phase 3 checks for puppet_infrastructure::packages_base (class; node ubuntu; required_external none of its own: it
# declares class apt itself). Fixture: defaults (unattended_upgrades false). On Ubuntu the class declares
# `class { 'apt': update => { frequency => 'always' } }`, installs the Debian package list, removes supervisor and
# cloud-init and keeps unattended-upgrades off. The clean node has cloud-init, unattended-upgrades, vim and wget, and
# lacks aptitude, acl, monitoring-plugins-standard, ecryptfs-utils and iptables-persistent (node inventory
# P8NODE_BASELINE_GREEN_v4). Probes read the node's own packages, tools and Puppet's last run report.
class: packages_base
baseline: release-0.9.10 (cf477c6)
fixture: defaults
authoring:
  minutes: 3
  notes: "About 10:24Z to 10:27Z 2026-11-18 (scratch file time), outside the worktree while firewall_secure's review ran (baseline manifest and the clean-node inventory read)."
purpose: >-
  The minimum package set of a generic node: the tools every node needs (monitoring plugins, ACLs, ecryptfs, the
  firewall's persistence, vim, wget, aptitude) installed and usable, package lists refreshed on every agent run, and
  supervisor, cloud-init and, by default, unattended upgrades removed.
# Outcomes table added 2026-11-19 (backfill batch 3, HQ batch-10 ruling 2); the set-level uncovered list moved into it.
outcomes:
  - outcome: the base tools are installed and usable (monitoring plugins, ACLs, ecryptfs, the firewall's persistence, vim, wget, aptitude)
    from: manifests/packages_base.pp:22-27, 42-46
    checks: [the-package-list-is-installed, the-tools-work]
  - outcome: supervisor and cloud-init are removed, and unattended upgrades are off by default
    from: manifests/packages_base.pp:4, 51, 59-61
    checks: [supervisor-cloud-init-and-unattended-upgrades-are-removed]
  - outcome: the package lists are refreshed on every agent run
    from: manifests/packages_base.pp:11-19
    checks: [package-lists-refresh-on-every-agent-run]
  - outcome: the exec update-package-lists refreshes the lists before the packages are installed
    from: manifests/packages_base.pp:35-49
    checks: [the-update-package-lists-exec-never-runs]
  - outcome: unattended upgrades installed when asked (unattended_upgrades true)
    from: manifests/packages_base.pp:4, 53-58
    uncovered: {why: "a fixture variant (one set holds one fixture), untested: this fixture leaves unattended_upgrades at its default false", lifted_by: ubuntu}
  - outcome: the RedHat branch (dnf makecache every run, extra_packages_el, the RedHat package list and dnf-automatic)
    from: manifests/packages_base.pp:12-17, 28-33, 56-57, 62-63
    uncovered: {why: "the RedHat branch; this set runs on the plan's Ubuntu node (the class's Phase 1 verdict on rhel9 covers its apply, not its behaviour)", lifted_by: rhel9}
checks:
  - id: the-package-list-is-installed
    what: every package of the Debian list is installed
    control: negative
    derived_from:
      - {path: manifests/packages_base.pp, lines: "27", text: "$package_list = ['iptables-persistent', $nagios_package_name, 'ecryptfs-utils', 'vim', 'wget', 'aptitude', 'acl']"}
      - {path: manifests/packages_base.pp, lines: "26", text: "$nagios_package_name = 'monitoring-plugins-standard'"}
    probe: |
      dpkg-query -W -f '${Package} ${Status}\n' iptables-persistent monitoring-plugins-standard ecryptfs-utils vim wget aptitude acl | sort
    expect: {rc: 0, stdout: "\\Aacl install ok installed\\naptitude install ok installed\\necryptfs-utils install ok installed\\niptables-persistent install ok installed\\nmonitoring-plugins-standard install ok installed\\nvim install ok installed\\nwget install ok installed\\n\\Z"}

  - id: the-tools-work
    what: >-
      the installed tools run: a monitoring plugin checks the root filesystem, the ACL tools read ACLs, the ecryptfs
      setup helper and aptitude are on the path
    control: negative
    derived_from:
      - {path: manifests/packages_base.pp, lines: "26-27", text: "$nagios_package_name = 'monitoring-plugins-standard'"}
      - {path: manifests/packages_base.pp, lines: "43-46", text: "package { $package_list:"}
    probe: |
      /usr/lib/nagios/plugins/check_disk -w 1% -c 1% -p / | cut -d' ' -f1-2
      getfacl -p /etc/hostname 2>/dev/null | head -1
      command -v ecryptfs-setup-private aptitude
    expect: {rc: 0, stdout: "\\ADISK OK\\n# file: /etc/hostname\\n/usr/bin/ecryptfs-setup-private\\n/usr/bin/aptitude\\n\\Z"}

  - id: supervisor-cloud-init-and-unattended-upgrades-are-removed
    what: supervisor, cloud-init and (unattended_upgrades false) unattended-upgrades are not installed
    control: negative
    derived_from:
      - {path: manifests/packages_base.pp, lines: "51", text: "package { [ 'supervisor' , 'cloud-init' ]: ensure => absent, }"}
      - {path: manifests/packages_base.pp, lines: "59-61", text: "package { 'unattended-upgrades': ensure => absent, }"}
    probe: |
      for p in supervisor cloud-init unattended-upgrades; do
        s=$(dpkg-query -W -f '${Status}' "$p" 2>/dev/null)
        case "$s" in *" installed") echo "$p installed";; *) echo "$p absent";; esac
      done
    expect: {rc: 0, stdout: "\\Asupervisor absent\\ncloud-init absent\\nunattended-upgrades absent\\n\\Z"}

  - id: package-lists-refresh-on-every-agent-run
    what: >-
      the last agent run (the harness's run 2, with nothing else to change) refreshed the package lists:
      Exec[apt_update] ran, as `update => { frequency => 'always' }` makes it do on every run
    control: negative
    derived_from:
      - {path: manifests/packages_base.pp, lines: "11-19", text: "class { 'apt': update => { frequency => 'always' } }"}
    probe: |
      awk '/^  Exec\[apt_update\]:$/ {f=1; next} f && /^  [^ ]/ {f=0} f && /^    changed: true$/ {c++} END {print c+0}' /opt/puppetlabs/puppet/cache/state/last_run_report.yaml
    expect: {rc: 0, stdout: "\\A1\\n\\Z"}

  # 2026-11-19 authoring correction (run 20261119T011742Z): Puppet 8 leaves unchanged resources out of the run report
  # (exclude_unchanged_resources true, read on the node), so the exec is looked for in the catalog's resource list and
  # its absence from the report means it made no change.
  - id: the-update-package-lists-exec-never-runs
    what: >-
      the exec update-package-lists is in the catalog but did not run in the last agent run: it is refreshonly and
      nothing notifies it (`Exec['update-package-lists'] ~> Package[...]` makes the exec notify the packages, not the
      reverse), so the refresh it was written for comes from class apt instead (package-lists-refresh-on-every-agent-run).
      An unreachable resource whose protection holds elsewhere (HQ batch-12 ruling 1: recorded, approval report and
      Phase 5 backlog)
    control: negative
    derived_from:
      - {path: manifests/packages_base.pp, lines: "36-40", text: "refreshonly => true"}
      - {path: manifests/packages_base.pp, lines: "49", text: "Exec['update-package-lists'] ~> Package[$package_list]"}
    probe: |
      p8_count '^exec\[update-package-lists\]$' /opt/puppetlabs/puppet/cache/state/resources.txt
      p8_count '^  Exec\[update-package-lists\]:$' /opt/puppetlabs/puppet/cache/state/last_run_report.yaml
    expect: {rc: 0, stdout: "\\A1\\n0\\n\\Z"}
