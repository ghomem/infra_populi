# Lab node inventory (HQ 2026-11-16 item 2) — the single source for which VM an engine tool acts on.
# Harness, revert, reviewer, pregate, compile-only and the Phase 3 runner take their node from here: the node a plan
# row names (`node` column: a kind below), else `default`. Read through .codex_state/tools/nodes.py, never parsed
# elsewhere. Advisor-maintained.
#
# Per kind:
#   status             active (brought up: baseline snapshot taken and verified) | planned (bring-up pending)
#   vm                 VirtualBox VM name. New lab VMs are named p8lab-* (lab_vm.sh guards them); `ubuntu` keeps
#                      the original ubuntu24-puppet8-Node and its revert_node.sh rules (HQ 2026-11-16 item 3)
#   alias              ssh alias on the laptop (host-only address, HostKeyAlias = alias)
#   certname           Puppet certname; the master's node file is manifests/nodes/<certname>.pp
#   hostname           what `hostname` prints on the node after a restore
#   hostonly_ip        static address on vboxnet0 (laptop 192.168.56.1, master 192.168.56.10)
#   baseline_snapshot  the offline snapshot every revert restores (required when active)
#   os_family          Facter os.family: Debian | RedHat
#   os                 human label
#   capabilities       what the node can exercise (server, desktop, kde, gnome, rhel-subscription, second-node,
#                      ad-dc, puppet-server)
default: ubuntu
nodes:
  ubuntu:
    status: active
    vm: ubuntu24-puppet8-Node
    alias: puppet8node
    certname: puppet8node
    hostname: puppet8node
    hostonly_ip: 192.168.56.20
    baseline_snapshot: P8NODE_BASELINE_GREEN_v4
    os_family: Debian
    os: Ubuntu 24.04 server
    capabilities: [server]
  rhel9:
    status: active
    vm: p8lab-rhel9
    alias: p8lab-rhel9
    certname: p8lab-rhel9
    hostname: p8lab-rhel9
    hostonly_ip: 192.168.56.21
    baseline_snapshot: P8LAB_RHEL9_BASELINE_v1
    os_family: RedHat
    os: RHEL 9.5 (registered; BaseOS + AppStream)
    capabilities: [server, rhel-subscription]
  kubuntu:
    status: active
    vm: p8lab-kubuntu
    alias: p8lab-kubuntu
    certname: p8lab-kubuntu
    hostname: p8lab-kubuntu
    hostonly_ip: 192.168.56.22
    baseline_snapshot: P8LAB_KUBUNTU_BASELINE_v1
    os_family: Debian
    os: Ubuntu 24.04.4 desktop (Kubuntu, KDE)
    capabilities: [desktop, kde]
  gnome:
    status: active
    vm: p8lab-gnome
    alias: p8lab-gnome
    certname: p8lab-gnome
    hostname: p8lab-gnome
    hostonly_ip: 192.168.56.23
    baseline_snapshot: P8LAB_GNOME_BASELINE_v1
    os_family: Debian
    os: Ubuntu 24.04.4 desktop (GNOME)
    capabilities: [desktop, gnome]
  ubuntu2:
    status: active
    vm: p8lab-ubuntu2
    alias: p8lab-ubuntu2
    certname: p8lab-ubuntu2
    hostname: p8lab-ubuntu2
    hostonly_ip: 192.168.56.24
    baseline_snapshot: P8LAB_UBUNTU2_BASELINE_v1
    os_family: Debian
    os: Ubuntu 24.04 server (second node)
    capabilities: [server, second-node]
  dc:
    # HQ batch-7 ruling 6: a Samba AD domain controller for openvpn_domain; brought up after kubuntu, gnome and ubuntu2
    status: active
    vm: p8lab-dc
    alias: p8lab-dc
    certname: p8lab-dc
    hostname: p8lab-dc
    hostonly_ip: 192.168.56.25
    baseline_snapshot: P8LAB_DC_BASELINE_v1
    os_family: Debian
    os: Ubuntu 24.04 server + Samba 4.19 AD DC (realm P8TEST.EXAMPLE, domain P8TEST)
    capabilities: [server, second-node, ad-dc]
  puppetserver:
    # A master-role node (HQ batch-5 ruling 6; named for hashman_base's `uncovered` note, HQ 2026-11-17 ruling 2;
    # built 2026-11-18, HQ ruling C2): a Puppet server whose code tree holds hashman's user database. It is also an
    # agent of puppet8master (the harness applies to it); the server role has its own ssldir and CA.
    status: active
    vm: p8lab-puppetserver
    alias: p8lab-puppetserver
    certname: p8lab-puppetserver
    hostname: p8lab-puppetserver
    hostonly_ip: 192.168.56.26
    baseline_snapshot: P8LAB_PUPPETSERVER_BASELINE_v1
    os_family: Debian
    os: Ubuntu 24.04 server + openvox-server 8.11.0 (a second Puppet server)
    capabilities: [server, puppet-server]
